<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#0E4C6B">
<meta name="description" content="Manu Tere: sail the islands of French Polynesia with a voyaging bird, steer by the stars and learn Reo Māʻohi.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Manu Tere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a one-screen phone app. The island scene fills the stage and the manu walks its beach; activity pins sit on the drawing; the dock sits below; activities and the voyage open full screen, information opens in bottom sheets. */
:root{
  --bg:#E8F3F2;          /* lagoon-tinted white */
  --surface:#FFFFFF;
  --surface-2:#DAECEB;
  --fg:#0D2C3D;          /* deep ocean ink */
  --muted:#4F6F7D;
  --line:#C3DCDB;
  --ocean:#0E4C6B;       /* brand: open sea */
  --lagoon:#1AA3B1;
  --sunset:#D9562E;      /* accent: the voyage */
  --reo:#B8431F;         /* Reo words in text (5:1 on white) */
  --gold:#E9B93A;        /* stars, stamps */
  --fern:#2F7D4C;
  --btn:#0E6A80; --btn-ink:#FFFFFF;
  --scrim:rgba(6,24,34,.5);
  --shadow:0 10px 28px rgba(13,44,61,.16);
  --display:"Fredoka","Nunito","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Nunito","Segoe UI",Helvetica,Arial,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1A26; --surface:#122E3E; --surface-2:#0F2533; --fg:#E6F2F2; --muted:#9DBAC3; --line:#24465A;
    --ocean:#8FD3EA; --lagoon:#38C8D3; --sunset:#FF8A5C; --reo:#FFA27E; --gold:#F5D46A; --fern:#62C486;
    --btn:#38C8D3; --btn-ink:#0A1A26; --scrim:rgba(0,0,0,.6); --shadow:0 10px 28px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1A26; --surface:#122E3E; --surface-2:#0F2533; --fg:#E6F2F2; --muted:#9DBAC3; --line:#24465A;
  --ocean:#8FD3EA; --lagoon:#38C8D3; --sunset:#FF8A5C; --reo:#FFA27E; --gold:#F5D46A; --fern:#62C486;
  --btn:#38C8D3; --btn-ink:#0A1A26; --scrim:rgba(0,0,0,.6); --shadow:0 10px 28px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.45;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.reo{font-family:var(--display);font-weight:600;color:var(--reo)}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{border:0;border-radius:14px;padding:12px 16px;min-height:46px;background:var(--surface-2);font-family:var(--display);font-weight:600;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--fg)}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.sun{background:var(--sunset);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.9rem;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default}
.ibtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex:none}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.spk{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);display:inline-grid;place-items:center;padding:0;flex:none;color:var(--fg)}
.spk svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* app frame */
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.top{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--bg);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:40px;height:40px;border-radius:13px;background:var(--ocean);display:grid;place-items:center;flex:none;overflow:hidden}
.logo svg{width:40px;height:40px}
.brand .t{min-width:0}
.brand h1{font-size:1.2rem;color:var(--fg)}
.brand .isl{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .isl b{font-family:var(--display);font-weight:600;color:var(--reo)}
.stage{flex:1;position:relative;overflow:hidden;min-height:0;background:#BFE5F2}
.stage>svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.pins{position:absolute;inset:0;pointer-events:none;z-index:3}
.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px 5px 5px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 16px rgba(6,24,34,.28);font-family:var(--display);font-weight:600;font-size:.86rem;line-height:1.05;text-align:left;transform:translate(-50%,-50%);width:max-content;max-width:200px}
.pin .ic{width:34px;height:34px;border-radius:50%;background:var(--sunset);display:grid;place-items:center;flex:none;position:relative}
.pin .ic svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pin .ic::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--sunset);opacity:0;animation:ping 2.4s ease-out infinite}
.pin.done .ic{background:var(--fern)}
.pin.done .ic::after{display:none}
.pin small{display:block;font-family:var(--body);font-weight:400;font-size:.72rem;color:var(--muted)}
@keyframes ping{0%{transform:scale(.8);opacity:.8}80%,100%{transform:scale(1.5);opacity:0}}
.dock{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1.5px solid var(--line);position:relative;z-index:5}
.dock button{border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-weight:600;font-size:.76rem;min-width:0;color:var(--fg);min-height:58px}
.dock button small{font-family:var(--body);font-weight:400;font-size:.68rem;color:var(--muted)}
.dock svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* bird (from Manu Ora) */
.birdlayer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.bird{position:absolute;left:0;top:0;width:84px;height:77px;pointer-events:auto;cursor:pointer;will-change:transform;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.bird .flip,.bird .bob{width:100%;height:100%;transform-origin:50% 50%}
.bird svg,.birdbox svg{width:100%;height:100%;overflow:visible;display:block;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.bird .wing,.birdbox .wing{transform-origin:48px 60px;transform-box:view-box}
.bird .leg{transform-origin:50px 88px;transform-box:view-box}
.bird .eye,.birdbox .eye{transform-origin:89px 42px;transform-box:view-box;animation:blink 5.5s infinite}
.bird .head,.birdbox .head{transform-origin:70px 60px;transform-box:view-box}
.bird.flying .wing,.birdbox.flying .wing{animation:flap .22s ease-in-out infinite alternate}
.bird.walking .leg.l1{animation:step .36s ease-in-out infinite alternate}
.bird.walking .leg.l2{animation:step .36s ease-in-out infinite alternate-reverse}
.bird.walking .bob{animation:bob .36s ease-in-out infinite alternate}
.bird.pecking .head{animation:peck .5s ease-in-out 2}
.bird.petted .eye{animation:none;transform:scaleY(.12)}
.bird.petted .bob{animation:purr .55s ease-in-out infinite alternate}
.birdbox.dancing .bob,.bird.dancing .bob{animation:ori .26s ease-in-out infinite alternate}
.birdbox.dancing .wing{animation:flap .26s ease-in-out infinite alternate}
.birdbox .bob{width:100%;height:100%}
@keyframes flap{from{transform:rotate(-38deg)}to{transform:rotate(22deg)}}
@keyframes step{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes peck{0%,100%{transform:rotate(0)}50%{transform:rotate(22deg)}}
@keyframes purr{from{transform:rotate(-3deg) scale(1.03)}to{transform:rotate(3deg) scale(1.07)}}
@keyframes ori{from{transform:translateX(-5px) rotate(-8deg)}to{transform:translateX(5px) rotate(8deg)}}
.bubble{position:absolute;left:0;top:0;z-index:6;background:var(--surface);color:var(--fg);border-radius:16px;padding:8px 12px;box-shadow:var(--shadow);max-width:230px;font-size:.92rem;line-height:1.3;opacity:0;transition:opacity .25s;pointer-events:none}
.bubble.show{opacity:1}
.bubble b{font-family:var(--display);font-weight:600;color:var(--reo);font-size:1.05rem;display:block}
.heart{position:absolute;left:0;top:0;width:20px;height:20px;pointer-events:none;animation:floatUp 1.3s ease-out forwards;z-index:6}
@keyframes floatUp{from{opacity:.95;margin-top:0}to{opacity:0;margin-top:-70px}}

/* scene ambience */
.sc-cloud{animation:drift 60s linear infinite}
.sc-sway{animation:sway 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.sc-wave{animation:waveY 3.2s ease-in-out infinite}
.sc-bob{animation:bobY 3s ease-in-out infinite;transform-box:fill-box}
.sc-ferry{animation:ferry 46s linear infinite}
.sc-glide{animation:glide 22s linear infinite}
.sc-vaa{animation:vaa 18s linear infinite}
.sc-flame{animation:flame .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.sc-twinkle{animation:twinkle 2.4s ease-in-out infinite alternate}
.sc-flow{stroke-dasharray:6 10;animation:flow 1.4s linear infinite}
.sc-foam{animation:foam 4s ease-in-out infinite}
.sc-curl{animation:curl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
.sc-pop{animation:pop 9s ease-in-out infinite;transform-box:fill-box}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(480px)}}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes waveY{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes bobY{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
@keyframes ferry{from{transform:translateX(120px)}to{transform:translateX(-480px)}}
@keyframes glide{0%{transform:translate(-80px,0)}50%{transform:translate(220px,14px)}100%{transform:translate(520px,0)}}
@keyframes vaa{from{transform:translateX(-120px)}to{transform:translateX(480px)}}
@keyframes flame{from{transform:scale(1,1)}to{transform:scale(.85,1.15)}}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes foam{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@keyframes curl{0%,100%{transform:scale(1)}50%{transform:scale(1.05,1.1)}}
@keyframes pop{0%,70%,100%{transform:translateY(14px);opacity:0}76%,92%{transform:translateY(0);opacity:1}}

/* full-screen layers (activities, map, voyage, welcome) */
.full{position:fixed;inset:0;z-index:40;display:flex;justify-content:center;background:var(--scrim)}
.full .in{width:100%;max-width:520px;height:100%;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
.fhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 16px 8px}
.fhead h2{font-size:1.45rem}
.fbody{flex:1;overflow:auto;padding:0 16px 20px;display:flex;flex-direction:column;gap:12px;min-height:0;position:relative}
.fbody>*,.result>*,.sheet>*{flex-shrink:0}
.x{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:1.5rem;line-height:1;flex:none;color:var(--fg)}
.card{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.card.flat{box-shadow:none;border:1.5px solid var(--line)}
.art{width:100%;border-radius:var(--r);overflow:hidden;position:relative;background:#0E4C6B;flex:none}
.art>svg{display:block;width:100%;height:auto}
.prog{display:flex;gap:6px;align-items:center}
.prog i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.prog i.on{background:var(--sunset)}
.fb{min-height:1.5em;font-weight:700}
.fb.good{color:var(--fern)} .fb.bad{color:var(--reo)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* market */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:118px;justify-content:center}
.opt svg{width:84px;height:84px}
.opt span{font-size:.82rem;color:var(--muted);min-height:1.2em}
.opt.ok{border-color:var(--fern);box-shadow:inset 0 0 0 2px var(--fern)}
.basket{display:flex;gap:6px;flex-wrap:wrap;min-height:40px;align-items:center}
.basket svg{width:36px;height:36px}

/* games: big hold/tap buttons */
.pad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad .btn{min-height:64px;font-size:1.1rem;touch-action:none;user-select:none;-webkit-user-select:none}
.pad .btn.held{filter:brightness(1.15);transform:scale(.98)}
.meter{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.meter .f{position:absolute;left:0;top:0;bottom:0;background:var(--lagoon);border-radius:99px;width:0}
.meter .z{position:absolute;top:0;bottom:0;background:var(--fern);opacity:.35}
.meter .m{position:absolute;top:-3px;bottom:-3px;width:4px;border-radius:2px;background:var(--fg)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plant{border:0;border-radius:16px;background:#8C4A2F;aspect-ratio:1;max-width:100%;padding:4px;display:grid;place-items:center}
.plant svg{width:100%;height:100%}
.tapable{cursor:pointer}

/* result */
.result{position:absolute;inset:0;background:var(--bg);padding:8px 16px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px;z-index:3}
.stamp{width:132px;height:132px;margin:6px auto 0;animation:stampIn .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{from{transform:scale(2.2) rotate(-18deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px;background:var(--surface)}
.wchip b{font-family:var(--display);font-weight:600;color:var(--reo)}
.wchip span{font-size:.82rem;color:var(--muted)}

/* sheets */
.sheetwrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wlist{display:flex;flex-direction:column;gap:0}
.wrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wrow b{font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--reo)}
.wrow .en{font-size:.92rem}
.wrow .ph{font-size:.8rem;color:var(--muted);font-style:italic}
.wrow .spk{grid-row:1/span 3;grid-column:2}
.wrow.lock b{color:var(--muted)}
.facts{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 3px var(--btn)}
.toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tg{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:58px}
.tg b{font-family:var(--display);font-weight:600}
.tg span{font-size:.76rem;color:var(--muted)}
.tg.on{border-color:var(--btn);box-shadow:inset 0 0 0 2px var(--btn)}
.tg:disabled{opacity:.6}
textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font:inherit;font-size:.8rem;color:var(--fg);resize:vertical;word-break:break-all}
input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font-size:1rem;min-height:46px}
.pstamps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pst{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pst svg{width:100%;max-width:112px;height:auto}
.pst .acts{display:flex;gap:4px}
.pst .acts i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:block}
.pst .acts i.on{background:var(--fern);border-color:var(--fern)}
.soon{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.soon .card{padding:12px}
.soon b{font-family:var(--display);font-weight:600}

/* map */
.mapwrap{position:relative;border-radius:var(--r);overflow:hidden;flex:none}
.mapwrap svg{display:block;width:100%;height:auto}
.isle{cursor:pointer}
.isle:focus-visible{outline:none}
.isle:focus-visible .hit{stroke:#fff;stroke-width:3}

/* voyage */
.vy{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
.vy>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:12px;right:12px;top:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hud .card{padding:10px 12px;background:rgba(9,28,44,.72);color:#F1F7FA;box-shadow:none;backdrop-filter:blur(4px)}
.hud .reo{color:#FFD08A}
.hud .muted{color:#BFD3DC}
.vbar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.vbar i{display:block;height:100%;width:0;background:#FFD08A;border-radius:99px}
.vctl{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:10px 16px 12px;align-items:center;background:var(--bg)}
.vctl .btn{min-height:60px;font-size:1.05rem;touch-action:none;user-select:none;-webkit-user-select:none}
.vstat{font-family:var(--display);font-weight:600;text-align:center;min-width:92px;font-size:.92rem}

/* welcome */
.welcome .in{background:linear-gradient(#1C4F78,#F08A5D 62%,#F6C177)}
.welcome .fbody{justify-content:flex-end;gap:14px;padding-bottom:24px}
.welcome .card{background:var(--surface)}
.birdbox{width:150px;height:138px;margin:0 auto}
.welcome .in{position:relative}
.welcome .fbody{position:relative;z-index:1}
.wplane{position:absolute;left:0;top:8%;width:340px;pointer-events:none;animation:planeCross 18s linear infinite;animation-delay:-7s}
.wplane svg,.fplane svg{width:100%;height:auto;display:block}
@keyframes planeCross{from{transform:translate(-340px,14px) rotate(-1.5deg)}to{transform:translate(560px,-22px) rotate(-1.5deg)}}
.wplane .beacon{animation:blinkB 1s steps(1) infinite}@keyframes blinkB{0%{opacity:1}12%{opacity:.15}}
.fiskip{position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top,0px));background:rgba(255,255,255,.85)}

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ---------- saved progress (this phone only) ---------- */

/* ---------- words (Reo Tahiti) ---------- */

const WGROUPS=[['greet','Greetings'],['tahiti','Tahiti'],['moorea','Moʻorea'],['bora','Porapora · Bora Bora'],['sky','Sky and sea']];
function learn(ids, quiet){ const fresh=[]; (Array.isArray(ids)?ids:[ids]).forEach(id=>{ if(W[id] && !S.words.includes(id)){ S.words.push(id); fresh.push(id); } }); if(fresh.length){ save(); if(!quiet) toast(`New word: <b>${esc(W[fresh[0]].r)}</b> · ${esc(W[fresh[0]].en)}`); } return fresh; }

/* ---------- sound effects, synthesised ---------- */
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(AC.state==='suspended') AC.resume(); return AC; }
function pluck(f,t,v,len){ const a=AC, o=a.createOscillator(), o2=a.createOscillator(), g=a.createGain(); o.type='triangle'; o2.type='sine'; o.frequency.value=f; o2.frequency.value=f*2; g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(v,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+(len||.8)); o.connect(g); o2.connect(g); g.connect(a.destination); o.start(t); o2.start(t); o.stop(t+(len||.8)+.05); o2.stop(t+(len||.8)+.05); }

function drum(t){ const a=AC, o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(52,t+.16); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.32,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.32); }

  if(k==='good'){ pluck(659.25,t,.16,.5); pluck(987.77,t+.1,.14,.7); }
  else if(k==='bad'){ pluck(220,t,.12,.35); }
  else if(k==='tap'){ pluck(783.99,t,.08,.25); }

/* ---------- toast ---------- */

/* ---------- timers owned by whatever full-screen layer is open ---------- */
const RUN={timers:[],rafs:[],stops:[]};
function later(fn,ms){ const id=setTimeout(fn,ms); RUN.timers.push(id); return id; }
function every(fn,ms){ const id=setInterval(fn,ms); RUN.timers.push(id); return id; }
function frames(fn){ let last=performance.now(), alive=true; const step=now=>{ if(!alive) return; const dt=Math.min(.05,(now-last)/1000); last=now; if(fn(dt,now)===false){ alive=false; return; } RUN.rafs.push(requestAnimationFrame(step)); }; RUN.rafs.push(requestAnimationFrame(step)); const stop=()=>{ alive=false; }; RUN.stops.push(stop); return stop; }

const XBTN='<button class="x" data-close aria-label="Close">×</button>';

/* ---------- the manu, drawn as in Manu Ora ---------- */
function shade(hex,f){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255; r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f); return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join(''); }

const LOOK={g:4,s:1,hs:1,er:4.2,wl:20,tl:1.2,crest:2,dx:0,dy:0};
function wingSVG(body){ const wl=LOOK.wl, F=wl*1.5; const px=44+wl*.8, py=66-wl*.5; const dark=shade(body,.78), mid=shade(body,.9), edge=shade(body,.58);
  const fe=(len,w,ang,pt,base)=>{ const tx=-len*(1.03-pt*.22), ty=w*(1.08-pt*.55);
    const d=`M0 ${(-w*.45).toFixed(1)} C${(-len*.3).toFixed(1)} ${(-w).toFixed(1)} ${tx.toFixed(1)} ${(-ty).toFixed(1)} ${(-len).toFixed(1)} 0 C${tx.toFixed(1)} ${ty.toFixed(1)} ${(-len*.3).toFixed(1)} ${w.toFixed(1)} 0 ${(w*.45).toFixed(1)}Z`;
    return `<g transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${(180-ang).toFixed(1)})"><path d="${d}" fill="${base}" stroke="${edge}" stroke-width=".55" stroke-linejoin="round"/><path d="M${(-len*.18).toFixed(1)} 0 H${(-len*.86).toFixed(1)}" stroke="#fff" stroke-width=".6" stroke-linecap="round" opacity=".38"/></g>`; };
  let h=''; for(let j=6;j>=0;j--) h+=fe(F*(.8+j*.07), wl*.27, 176+j*6, j/6, j%2?dark:mid);
  for(let j=6;j>=0;j--) h+=fe(F*(.46+j*.025), wl*.26, 173+j*6.5, 0, j%2?mid:dark);
  h+=`<ellipse cx="${(px-wl*.12).toFixed(1)}" cy="${(py+wl*.1).toFixed(1)}" rx="${(wl*.46).toFixed(1)}" ry="${(wl*.36).toFixed(1)}" transform="rotate(28 ${px.toFixed(1)} ${py.toFixed(1)})" fill="${mid}" stroke="${edge}" stroke-width=".5"/>`;

const birdEl=$('#bird'), flipEl=$('#birdFlip'), bubbleEl=$('#bubble'), stageEl=$('#stage');
const BW=84, BH=77;

function geom(){ const W=stageEl.clientWidth, H=stageEl.clientHeight, s=Math.max(W/360,H/640); return {W,H,s,vx:x=>(x-180)*s+W/2, vy:y=>H-(640-y)*s}; }

function startWalk(){ const [a,b]=walkRange(); B.to={x:rnd(a,b),y:groundY()}; B.dir=B.to.x>B.x?1:-1; setState('walk'); }
function startFly(target,cb){ B.from={x:B.x,y:B.y}; B.to=target; B.dir=target.x>B.x?1:-1; B.p=0; B.dur=Math.max(.9,Math.hypot(target.x-B.x,target.y-B.y)/260); B.onArrive=cb||null; setState('fly'); }

  const I=ISL[id], done=I.acts.filter(a=>S.done[a]).length;
  if(id===S.island){ el.innerHTML=`<div class="card"><div class="eyebrow">You are here</div><h3><span class="reo">${I.r}</span>${I.r!==I.en?` · ${I.en}`:''}</h3><p class="small muted">${I.tag} · ${done} of ${I.acts.length} activities done</p><button class="btn primary" id="mcGo">Explore ${I.en}</button></div>`; $('#mcGo').onclick=()=>closeFull(); return; }
  const leg=LEG[S.island+'>'+id], G=GUIDE[leg.guide];

  $('#mcSail').onclick=()=>{ ac(); startVoyage(S.island,id); }; }

/* ---------- the voyage: keep the guide star above the mast ---------- */
function seeded(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
function voyIsland(id){ if(id==='tahaa') return '<path d="M-64 0 Q-40 -14 -20 -22 Q-6 -30 6 -24 Q18 -30 30 -20 Q48 -10 64 0Z"/>';
  if(id==='moorea') return '<path d="M-60 0 L-44 -14 L-34 -10 L-26 -30 L-20 -22 L-12 -40 L-6 -26 L4 -34 L14 -18 L26 -24 L40 -10 L60 0Z"/>';
  if(id==='tahiti') return '<path d="M-70 0 Q-50 -26 -24 -38 Q-4 -46 10 -30 Q20 -18 34 -20 Q50 -18 70 0Z"/>';
  return '<path d="M-60 0 Q-40 -8 -16 -12 L-12 -36 L-6 -50 L4 -50 L8 -30 L12 -14 Q40 -10 60 0Z"/>'; }
function startVoyageV1(from,to){
  const leg=LEG[from+'>'+to], G=GUIDE[leg.guide], night=G.night, rand=seeded(from.length*97+to.length*13+7);
  const PX=6, HZ=300;
  let stars=''; if(night){ for(let i=0;i<240;i++){ const x=-620+rand()*1600, y=10+rand()*280, r=.5+rand()*1.3; stars+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="#FFF6E3" opacity="${(.35+rand()*.6).toFixed(2)}"/>`; }
    [[-260,170,2.4],[420,150,2.6],[-470,220,2.2],[640,230,2.3],[90,120,2],[300,90,2.2]].forEach(s=>{ stars+=`<circle cx="${s[0]}" cy="${s[1]}" r="${s[2]}" fill="#FFF6E3"/>`; }); }
  const guideG = leg.guide==='matarii' ? `<g transform="translate(180 262)"><circle r="22" fill="#9CC3FF" opacity=".12"/>${[[-6,-4,2.2],[0,-7,2.6],[6,-2,2.2],[-3,2,2.4],[4,4,2.8],[10,5,2],[0,9,2]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]}" fill="#EAF2FF"/>`).join('')}</g>`
    : leg.guide==='anamua' ? `<g transform="translate(180 266)"><circle r="20" fill="#FF7A5C" opacity=".16"/><circle r="4.6" fill="#FF8A6A"/><circle r="2" fill="#FFE2D6"/></g>`
    : `<g transform="translate(180 ${HZ})"><circle r="60" fill="#FFE3A8" opacity=".35"/><circle r="30" fill="${leg.guide==='sunset'?'#FFB25C':'#FFD27A'}"/></g>`;
  const label=`<text id="vLabel" x="180" y="${night?236:226}" text-anchor="middle" font-family="Fredoka,Nunito,sans-serif" font-weight="600" font-size="14" fill="#FFE7B8">${G.r}</text>`;
  const skyCols = night ? ['#081430','#22406A'] : leg.guide==='sunset' ? ['#4C78B5','#F7A86A'] : ['#6C8FC6','#FBC48F'];
  const seaCols = night ? ['#123A5E','#06182A'] : ['#2A7FA0','#0E4C6B'];
  const isle=`<g id="vIsle" transform="translate(180 ${HZ}) scale(0)" fill="${night?'#0B1A2C':'#3F6E62'}">${voyIsland(to)}</g>`;
  const svg=`<svg viewBox="0 0 360 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${vgrad('vSkyG',skyCols[0],skyCols[1],0,HZ)}${vgrad('vSeaG',seaCols[0],seaCols[1],HZ,560)}</defs>
    <rect x="-400" y="-200" width="1160" height="${HZ+200}" fill="url(#vSkyG)"/>
    <g id="vSky">${stars}${night?'':cloudsV()}${guideG}${label}${isle}</g>
    <rect x="-400" y="${HZ}" width="1160" height="400" fill="url(#vSeaG)"/>
    <g id="vSwell" stroke="#ffffff" fill="none" stroke-linecap="round"></g>
    <g id="vBoat">${boatSVG()}</g>
    <g id="vSight" transform="translate(180 316)"><path d="M-9 8 L0 -4 L9 8" fill="none" stroke="#FFD08A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  </svg>`;
  openFull(`<div class="fhead"><div><div class="eyebrow">Voyage · ${ISL[from].en} to ${ISL[to].en}</div><h2>Sail by <span class="reo">${G.r}</span></h2></div>${XBTN}</div>
    <div class="vy" id="vy">${svg}<div class="hud"><div class="card"><p class="small">${G.how}</p><div class="vbar"><i id="vProg"></i></div><p class="small muted" id="vKm">${leg.km} km to go</p></div></div><div class="result" id="vRes" hidden></div></div>
    <div class="vctl"><button class="btn primary" id="vL" aria-label="Steer left">◀ Left</button><div class="vstat" id="vStat" aria-live="polite">Ready</div><button class="btn primary" id="vR" aria-label="Steer right">Right ▶</button></div>
    <div class="row" style="padding:0 16px 12px;justify-content:center"><button class="btn sm ghost" id="vAuto">Let the manu steer</button></div>`);
  learn([G.word,'moana'],true);
  const sky=$('#vSky'), boat=$('#vBoat'), sight=$('#vSight'), prog=$('#vProg'), km=$('#vKm'), stat=$('#vStat'), swell=$('#vSwell'), isleEl=$('#vIsle'), lab=$('#vLabel');
  const V={h:rnd(-24,24)||12, p:0, t:0, hold:0, auto:false, imp:0, nextSwell:rnd(4,7), phase:0, done:false, drag:null};
  const hold=(btn,dir)=>{ const on=e=>{ e.preventDefault(); ac(); V.hold=dir; btn.classList.add('held'); }; const off=()=>{ if(V.hold===dir) V.hold=0; btn.classList.remove('held'); }; btn.addEventListener('pointerdown',on); btn.addEventListener('pointerup',off); btn.addEventListener('pointerleave',off); btn.addEventListener('pointercancel',off); };
  hold($('#vL'),-1); hold($('#vR'),1);
  const vy=$('#vy');
  vy.addEventListener('pointerdown',e=>{ V.drag=e.clientX; });
  vy.addEventListener('pointermove',e=>{ if(V.drag==null) return; const dx=e.clientX-V.drag; V.drag=e.clientX; V.h+=dx*.12; });
  const endDrag=()=>{ V.drag=null; }; vy.addEventListener('pointerup',endDrag); vy.addEventListener('pointercancel',endDrag);
  const key=e=>{ if(e.key==='ArrowLeft'){ V.hold=-1; e.preventDefault(); } else if(e.key==='ArrowRight'){ V.hold=1; e.preventDefault(); } };
  const keyUp=e=>{ if(e.key==='ArrowLeft'||e.key==='ArrowRight') V.hold=0; };
  document.addEventListener('keydown',key); document.addEventListener('keyup',keyUp); RUN.stops.push(()=>{ document.removeEventListener('keydown',key); document.removeEventListener('keyup',keyUp); });
  $('#vAuto').onclick=()=>{ V.auto=!V.auto; $('#vAuto').textContent=V.auto?'I’ll steer myself':'Let the manu steer'; };
  later(()=>{ if(lab) lab.setAttribute('opacity','.45'); },6000);
  frames(dt=>{ if(V.done) return false; V.t+=dt;
    const drift=(6*Math.sin(V.t*.55)+4*Math.sin(V.t*1.31+1.2));
    V.nextSwell-=dt; if(V.nextSwell<=0){ V.imp=(Math.random()<.5?-1:1)*rnd(16,24); V.nextSwell=rnd(4,7); }
    V.imp*=Math.pow(.25,dt);
    let steer=V.hold*34; if(V.auto) steer=clamp(-V.h*3,-34,34);
    V.h=clamp(V.h+(drift+V.imp+steer)*dt,-70,70);
    const on=Math.abs(V.h)<7;
    if(on) V.p=Math.min(1,V.p+dt/(V.auto?10:15));
    sky.setAttribute('transform',`translate(${(-V.h*PX).toFixed(1)} 0)`);
    const roll=(V.imp*.25+Math.sin(V.t*1.7)*2.2).toFixed(2);
    boat.setAttribute('transform',`rotate(${roll} 180 520) translate(0 ${(Math.sin(V.t*1.7)*3).toFixed(1)})`);
    sight.querySelector('path').setAttribute('stroke',on?'#FFD08A':'#FFFFFF');
    sight.querySelector('path').setAttribute('opacity',on?'1':'.6');
    V.phase=(V.phase+dt*.28)%1; let sw=''; for(let i=0;i<9;i++){ const f=(i+V.phase)/9, y=HZ+4+256*f*f, w=40+700*f*f, x0=180-w/2-V.h*PX*f*.6; sw+=`<path d="M${x0.toFixed(1)} ${y.toFixed(1)} q${(w/4).toFixed(1)} ${(-3-6*f).toFixed(1)} ${(w/2).toFixed(1)} 0 t${(w/2).toFixed(1)} 0" stroke-width="${(.6+2.4*f).toFixed(2)}" opacity="${(.08+.22*f).toFixed(2)}"/>`; } swell.innerHTML=sw;
    const sc = night ? (V.p<.7?0:(V.p-.7)/.3*1.1) : .35+V.p*.9; isleEl.setAttribute('transform',`translate(180 ${HZ}) scale(${sc.toFixed(3)})`);
    prog.style.width=(V.p*100).toFixed(1)+'%'; km.textContent=V.p>=1?'Land ho!':`${Math.max(1,Math.round(leg.km*(1-V.p)))} km to go`;
    stat.textContent = on ? 'On course' : (V.h>0 ? '◀ Steer left' : 'Steer right ▶');
    if(V.p>=1){ V.done=true; arrive(from,to,leg,G); return false; }
  }); }
function cloudsV(){ return [[-200,120,1.2],[60,90,.9],[300,140,1.1],[560,110,1]].map(c=>`<g transform="translate(${c[0]} ${c[1]}) scale(${c[2]})" fill="#FFE9D6" opacity=".55"><ellipse rx="40" ry="10"/><ellipse cx="-14" cy="-6" rx="18" ry="9"/><ellipse cx="12" cy="-8" rx="22" ry="11"/></g>`).join(''); }
function boatSVG(){ return `<path d="M180 330 L180 498" stroke="#5A3A1E" stroke-width="5" stroke-linecap="round"/>
  <path d="M182 336 Q240 380 262 470 Q222 446 182 470Z" fill="#EADBB8" stroke="#B89D6A" stroke-width="2"/><path d="M182 336 Q206 400 206 458" stroke="#B89D6A" stroke-width="1.4" fill="none"/>
  <path d="M86 520 Q96 482 116 470 L134 470 Q146 488 146 560 L90 560Z" fill="#6B4426"/><path d="M214 470 L232 470 Q252 482 262 520 L258 560 L214 560 Q214 488 214 470Z" fill="#6B4426" transform="translate(12 0)"/>
  <rect x="100" y="488" width="172" height="12" rx="3" fill="#8A5A2B"/><path d="M104 494 H270" stroke="#5A3A1E" stroke-width="1.2"/>
  <g transform="translate(112 432) scale(.62)">${birdSVG(S,'vb').replace('<svg ','<svg width="120" height="110" ')}</g>`; }
function arrive(from,to,leg,G){
  const first=!S.visited.includes(to); S.visited.includes(from)||S.visited.push(from); if(first) S.visited.push(to); S.voyages=(S.voyages||0)+1; save();
  const I=ISL[to];
  const extra = to==='tahiti' && G.night ? '<p class="small">Look up: Taʻurua-faupapa (Sirius) passes right over Tahiti. It is the island’s ʻaveiʻa, the star that marks it for navigators.</p>' : '';
  later(()=>{ sfx('stamp'); $$('#fullIn .vctl, #fullIn .vctl + .row').forEach(e=>e.hidden=true); const r=$('#vRes'); r.hidden=false; r.innerHTML=`<div class="eyebrow" style="text-align:center;margin-top:10px">Land ho!</div><h2 style="text-align:center"><span class="reo">ʻIa ora na, ${I.r}!</span></h2><div class="stamp">${stampSVG(to,true)}</div>
    <div class="card flat"><p class="small"><b>${G.r}</b> brought us here. Polynesian navigators crossed thousands of kilometres of ocean this way, reading the stars, the swells, the wind and the birds, with no instruments at all.</p>${extra}<p class="small muted">This game is a simplified version of their art.</p></div>
    <div class="chips"><span class="wchip"><b>${W[G.word].r}</b><span>${W[G.word].en}</span>${spkBtn(G.word)}</span></div>
    <button class="btn sun" id="vAshore">Go ashore</button>`;
    $('#vAshore').onclick=()=>{ S.island=to; save(); closeFull(); landBird(); toast(first?`Stamp: <b>${I.r}</b>${I.r!==I.en?' · '+I.en:''}`:`Back on <b>${I.r}</b>`); }; },900); }
function landBird(){ const g=geom(); B.x=g.W/2-BW/2; B.y=-BH; B.dir=1; const [a,b]=walkRange(); startFly({x:rnd(a,b),y:groundY()},()=>{ bubble(W.iaorana.r+', '+ISL[S.island].r+'!',ISL[S.island].tag); speak(W.iaorana.r+' '+ISL[S.island].r); }); }

    <div class="pad"><button class="btn primary" id="vaL">Left · Hoe!</button><button class="btn primary" id="vaR">Right · Hoe!</button></div>`;
  const me=$('#vaMe'), riv=$('#vaRival'), fb=$('#vaFb'), tEl=$('#vaT'), pEl=$('#vaP');

  const ST=Math.PI/2; let th=0, rth=0, v=0, last=0, started=false, t=0, finished=false, rivalDone=false, wob=0, count=3;
  me.setAttribute('transform',pos(ST,14)); riv.setAttribute('transform',pos(ST,-14));

  const stroke=side=>{ if(!started||finished) return; ac(); if(side!==last){ v+=.085; } else { v+=.02; wob=8; fb.className='fb bad'; fb.textContent='Switch sides!'; } last=side; sfx('splash'); };
  const bind=(id,side)=>{ const b=$(id); b.addEventListener('pointerdown',e=>{ e.preventDefault(); b.classList.add('held'); stroke(side); }); const off=()=>b.classList.remove('held'); b.addEventListener('pointerup',off); b.addEventListener('pointerleave',off); };

  frames(dt=>{ if(!started) return; if(finished) return false; t+=dt; v*=Math.exp(-.8*dt); th+=v*dt; wob*=Math.pow(.05,dt);

function actManta(el,done){
  injectCSS('manta',`@keyframes mwL{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}@keyframes mwR{from{transform:rotate(6deg)}to{transform:rotate(-8deg)}}.mwl{transform-box:view-box;transform-origin:0 0;animation:mwL 1.6s ease-in-out infinite alternate}.mwr{transform-box:view-box;transform-origin:0 0;animation:mwR 1.6s ease-in-out infinite alternate}`);

    <div class="card"><p class="small">Hold <b>Swim gently</b> to move closer. Too fast and the <span class="reo">fāfā piti</span> will leave. Stop at the dotted ring and stay still.</p><div class="meter" aria-hidden="true"><div class="z" style="left:0;width:72%"></div><div class="f" id="mnS" style="opacity:.8"></div></div><span class="fb" id="mnFb" aria-live="polite">Calm and slow.</span></div>
    <button class="btn primary" id="mnGo" style="min-height:72px;font-size:1.15rem;touch-action:none;user-select:none;-webkit-user-select:none">Swim gently</button>`;
  const M=$('#mnM'), sEl=$('#mnS'), fb=$('#mnFb'), go=$('#mnGo'); let d=1, spd=0, hold=false, still=0, phase='swim', t=0, out=0;
  const on=e=>{ e.preventDefault(); hold=true; go.classList.add('held'); }, off=()=>{ hold=false; go.classList.remove('held'); };
  go.addEventListener('pointerdown',on); go.addEventListener('pointerup',off); go.addEventListener('pointerleave',off); go.addEventListener('pointercancel',off);
  const kd=e=>{ if(e.key===' '){ e.preventDefault(); hold=true; } }, ku=e=>{ if(e.key===' ') hold=false; }; document.addEventListener('keydown',kd); document.addEventListener('keyup',ku); RUN.stops.push(()=>{ document.removeEventListener('keydown',kd); document.removeEventListener('keyup',ku); });
  const bubbles=()=>{ const b=$('#mnBub'); b.innerHTML=Array.from({length:10},()=>`<circle cx="${rnd(120,240)}" cy="${rnd(240,330)}" r="${rnd(2,6)}" fill="none" stroke="#fff" opacity=".6"/>`).join(''); later(()=>{ b.innerHTML=''; },700); };
  frames(dt=>{ t+=dt;
    if(phase==='swim'){ spd=clamp(spd+(hold?.5:-.9)*dt,0,1); d=Math.max(.3,d-spd*.17*dt);

      else if(hold){ fb.className='fb'; fb.textContent='Gently…'; }

    const sc= phase==='pass' ? 1.2+out*.9 : .32+(1-d)*.85, y= phase==='pass' ? 186-out*90 : 200-(1-d)*18+Math.sin(t*1.2)*6, x=180+Math.sin(t*.5)*(phase==='pass'?0:30*d);

  haari:{min:6, give:{haari:2}, food:1, taste:'Ask for a fresh green coconut: the water inside is cool and sweet. Look for its three “eyes”.'},
  uru:{min:6, give:{uru:1,bark:1}, food:1, taste:'ʻUru is roasted whole over the fire until the skin is black, or cooked in an earth oven.'}
};
const BAGN={tiare:'tiare',aute:'ʻaute',rea:'rēʻa',vavai:'vavai',mati:'mati',fara:'fara',tiairi:'tiʻaʻiri',painapo:'painapo',vi:'vī',haari:'haʻari',uru:'ʻuru',bark:'ʻuru bark',pupu:'pūpū'};
const BAGEN={tiare:'flower',aute:'hibiscus',rea:'turmeric',vavai:'cotton',mati:'red dye fig',fara:'pandanus',tiairi:'candlenut',painapo:'pineapple',vi:'mango',haari:'coconut',uru:'breadfruit',bark:'for tapa',pupu:'shell'};
const SEEDPOOL=['tiare','tiare','aute','rea','rea','vavai','vavai','mati','fara','fara','tiairi','painapo','vi','haari','uru'];
const PEARLS=[['#2B3036','black'],['#3E5B57','peacock green'],['#4A3B4F','aubergine'],['#7D868C','silver grey'],['#2F4A5E','deep blue']];
const GDEF={plots:[null,null,null,null,null,null], seeds:{tiare:2,vavai:1,rea:1,fara:1,uru:1}, bag:{vavai:2,rea:1,fara:3,pupu:2}, pearls:[], oysters:null, starter:true};
function G(){ if(!S.garden||!Array.isArray(S.garden.plots)) S.garden=JSON.parse(JSON.stringify(GDEF)); return S.garden; }
function addSeeds(n,kind){ const g=G(), got=[]; for(let i=0;i<n;i++){ const k=kind||pick(SEEDPOOL); g.seeds[k]=(g.seeds[k]||0)+1; got.push(k); } save(); return got; }
function bagAdd(o){ const g=G(); Object.keys(o).forEach(k=>{ g.bag[k]=(g.bag[k]||0)+o[k]; }); save(); }
function has(o){ const g=G(); return Object.keys(o).every(k=>(g.bag[k]||0)>=o[k]); }
function take(o){ const g=G(); Object.keys(o).forEach(k=>{ g.bag[k]=Math.max(0,(g.bag[k]||0)-o[k]); }); save(); }

/* moon and season: real dates, so the garden follows the visitor’s own stay */
function moonAge(t){ const syn=29.530588853, ep=Date.UTC(2000,0,6,18,14); return (((t-ep)/864e5)%syn+syn)%syn; }
function waxing(t){ const a=moonAge(t||Date.now()); return a>=1 && a<14.77; }
function season(d){ d=d||new Date(); const m=d.getMonth(), day=d.getDate(); const ab=(m===10&&day>=20)||m===11||m<=3||(m===4&&day<20);
  const now={10:'uru',11:'vi',0:'painapo',1:'tiare'}[m]||null;
  let until=0; if(!ab){ const y=d.getFullYear(); const nx=new Date(y,10,20); until=Math.ceil((nx-d)/864e5); }
  return {ab, now, until}; }
function moonSVG(age){ const p=age/29.530588853, rx=Math.abs(Math.cos(p*2*Math.PI))*10, gib=Math.abs(p-.5)<.25, wax=p<.5;
  const d = wax ? `M0 -10 A10 10 0 0 0 0 10 A${rx.toFixed(2)} 10 0 0 ${gib?0:1} 0 -10Z` : `M0 -10 A10 10 0 0 1 0 10 A${rx.toFixed(2)} 10 0 0 ${gib?1:0} 0 -10Z`;
  return `<svg viewBox="-12 -12 24 24" width="30" height="30" aria-hidden="true" style="flex:none"><circle r="10" fill="#1E3555"/><path d="${d}" fill="#FFF3C4"/></svg>`; }

/* plots */
function plotStage(pl){ const f=(Date.now()-pl.t)/pl.d; return f>=1?3:f>=.55?2:f>=.15?1:0; }
function leftTxt(pl){ const ms=pl.t+pl.d-Date.now(); if(ms<=0) return 'Ready!'; const s=Math.ceil(ms/1000); return s>=60?`${Math.ceil(s/60)} min`:`${s} s`; }
function plant(i,k){ const g=G(); if(!(g.seeds[k]>0)) return; const sn=season(); let d=PL[k].min*60000; const wx=waxing(); if(wx) d*=.75; if(sn.now===k) d*=.5; g.plots[i]={p:k,t:Date.now(),d,wx,ins:sn.now===k}; g.seeds[k]--; save(); sfx('tap'); learn(k==='rea'?'rea':k,true); }
function harvest(i){ const g=G(), pl=g.plots[i]; if(!pl||plotStage(pl)<3) return; const give=Object.assign({},PL[pl.p].give); const sn=season();
  if(PL[pl.p].food && sn.ab) Object.keys(give).forEach(k=>{ if(k!=='bark') give[k]++; }); if(pl.ins) Object.keys(give).forEach(k=>{ if(k!=='bark') give[k]++; });
  bagAdd(give); g.plots[i]=null; let seed=''; if(Math.random()<.6){ addSeeds(1,pl.p); seed=' and a seed'; } save(); sfx('good');
  const txt=Object.keys(give).map(k=>`${give[k]} ${BAGN[k]}`).join(', ');
  toast(`Harvest: <b>${esc(txt)}</b>${seed}`); }

/* shells on the beach: tap to collect */
function shellState(){ if(!S.shell) S.shell={at:0,n:0}; if(Date.now()>=S.shell.at && S.shell.n===0){ S.shell.n=2; S.shell.seed=Math.floor(Math.random()*1e6); } return S.shell; }
function renderShells(){ const box=$('#pins'); $$('.shell',box).forEach(e=>e.remove()); const sh=shellState(); if(!sh.n) return; const g=geom(); const r=seeded(sh.seed+S.island.length*31);
  for(let i=0;i<sh.n;i++){ const vx=(i?200:40)+r()*120, vy=574+r()*40; const b=document.createElement('button'); b.className='shell'; b.setAttribute('aria-label','A shell on the sand'); b.innerHTML='<svg viewBox="0 0 30 30" aria-hidden="true"><path d="M15 4 C24 6 27 16 22 24 Q15 28 8 24 C3 16 6 6 15 4Z" fill="#F7E3D0" stroke="#C99A7A" stroke-width="1.2"/><path d="M15 6 V25 M11 7 Q10 16 11 24 M19 7 Q20 16 19 24" stroke="#D9A88A" stroke-width="1" fill="none"/></svg>';
    b.style.left=clamp(g.vx(vx),20,g.W-20)+'px'; b.style.top=clamp(g.vy(vy),20,g.H-20)+'px';
    b.onclick=()=>{ ac(); const s=shellState(); s.n=Math.max(0,s.n-1); if(!s.n) s.at=Date.now()+180000; bagAdd({pupu:1}); learn('pupu',true); sfx('good'); b.remove(); toast(`<b>Pūpū!</b> A shell for a hei (${G().bag.pupu}).`); save(); };
    box.appendChild(b); } }

/* pearl line in the lagoon */
const PEARL_MS=5*60000;
function oysters(){ const g=G(); if(!g.oysters && (S.visited.includes('bora')||(S.legends&&S.legends.oro))){ const n=Date.now(); g.oysters=[n,n+60000,n+120000]; save(); } return g.oysters; }
function openOyster(i){ const g=G(), o=oysters(); if(!o) return; if(Date.now()-o[i]<PEARL_MS) return; const p=pick(PEARLS); g.pearls.push(p[0]); o[i]=Date.now(); save(); learn('poe',true); sfx('stamp'); toast(`A <b>${p[1]}</b> pearl! <span class="reo">Poe</span> (${g.pearls.length}).`); }

/* the garden screen */
let GPICK=null;
function openGarden(){ const g=G(); learn('faapu',true);
  openFull(`<div class="fhead"><div><div class="eyebrow">Faʻaʻapu · Your garden</div><h2>Plant, harvest, make</h2></div>${XBTN}</div><div class="fbody" id="gb"></div>`);
  if(g.starter){ g.starter=false; save(); later(()=>toast('A starter basket: cotton, turmeric, pandanus and two shells. Enough for a first pāreu and hat!',4200),300); }
  GPICK=null; renderGarden(); every(tickGarden,1000); }
function plotHTML(i){ const pl=G().plots[i]; if(!pl) return `<button class="plot empty${GPICK===i?' on':''}" data-p="${i}" aria-label="Empty plot. Plant a seed"><span class="pl-plus">+</span><span class="small">Plant</span></button>`;
  const st=plotStage(pl); return `<button class="plot${st===3?' ripe':''}" data-p="${i}" data-st="${st}" aria-label="${BAGN[pl.p]}${st===3?', ready to harvest':''}">${plantSVG(pl.p,st)}<b>${BAGN[pl.p]}</b><span class="small t">${leftTxt(pl)}</span></button>`; }
function renderGarden(){ const g=G(), el=$('#gb'); if(!el) return; const sn=season(), age=moonAge(Date.now()), wx=waxing();
  const seedKeys=Object.keys(PL).filter(k=>g.seeds[k]>0);
  const o=oysters();
  const foods=Object.keys(g.bag).filter(k=>g.bag[k]>0 && PL[k] && PL[k].food);
  const mats=Object.keys(g.bag).filter(k=>g.bag[k]>0 && !(PL[k]&&PL[k].food));
  el.innerHTML=`<div class="card flat gsky"><div class="row" style="flex-wrap:nowrap">${moonSVG(age)}<p class="small"><b>${wx?'Waxing moon':'Waning moon'}.</b> ${wx?'Seeds planted now grow faster: growers here replant while the moon is waxing.':'Plants grow at a normal pace until the next new moon.'}</p></div>
      <div class="row" style="flex-wrap:nowrap"><span class="seasonic" aria-hidden="true">${sn.ab?'✦':'○'}</span><p class="small">${sn.ab?`<b>Matariʻi i niʻa</b>, the season of abundance. Fruit gives more.`:`<b>Matariʻi i raro</b>, the cooler, drier season. The season of abundance returns on 20 November, in ${sn.until} days.`}${sn.now?` <b>In season now: ${BAGN[sn.now]}</b> grows twice as fast.`:''}</p></div></div>
    <div class="plots" id="gPlots">${g.plots.map((_,i)=>plotHTML(i)).join('')}</div>
    ${GPICK!==null?`<div class="card" id="gPick"><div class="row" style="justify-content:space-between"><b>Plant in this plot</b><button class="btn sm ghost" id="gPickX">Cancel</button></div>${seedKeys.length?`<div class="seeds">${seedKeys.map(k=>`<button class="seed" data-k="${k}"><span class="sthumb">${plantSVG(k,3)}</span><b>${BAGN[k]}</b><span class="small muted">×${g.seeds[k]} · ${PL[k].min} min${sn.now===k?' · in season':''}</span></button>`).join('')}</div>`:'<p class="small muted">No seeds left. Finish activities and hear legends to win more.</p>'}</div>`:''}
    <div class="card"><div class="row" style="justify-content:space-between"><h3>Pearl line</h3><span class="small muted">${g.pearls.length} pearl${g.pearls.length===1?'':'s'}</span></div>
      ${o?`<div class="oysters">${o.map((t,i)=>{ const f=clamp((Date.now()-t)/PEARL_MS,0,1); return `<button class="oyster${f>=1?' ripe':''}" data-o="${i}" aria-label="${f>=1?'Open the oyster':'Oyster growing a pearl'}"><svg viewBox="0 0 60 40" aria-hidden="true"><ellipse cx="30" cy="22" rx="22" ry="14" fill="#5A5048"/><path d="M8 22 Q30 2 52 22" fill="#6E645A"/><path d="M12 22 Q30 10 48 22" fill="none" stroke="#8A7E70" stroke-width="1.4"/>${f>=1?'<circle cx="30" cy="22" r="6" fill="#3E5B57" stroke="#C9D6D2" stroke-width="1.2"/>':''}</svg><span class="small">${f>=1?'Open':Math.ceil((PEARL_MS-(Date.now()-t))/60000)+' min'}</span></button>`; }).join('')}</div><p class="small muted">Black-lipped oysters on a line in the lagoon. A real Tahitian pearl takes about 18 months to 3 years; here time runs faster.</p>`
        :'<p class="small muted">Sail to Porapora, or hear the legend of ʻOro there, to start your own pearl line.</p>'}
      ${g.pearls.length?`<div class="row">${g.pearls.map(c=>`<span class="pearl" style="background:${c}"></span>`).join('')}</div>`:''}</div>
    <div class="card"><h3>Basket</h3>${mats.length||foods.length?'':'<p class="small muted">Empty for now. Harvest your plants and pick up shells on the beaches.</p>'}
      ${mats.length?`<div class="chips">${mats.map(k=>`<span class="wchip"><b>${BAGN[k]}</b><span>${BAGEN[k]} ×${g.bag[k]}</span></span>`).join('')}</div>`:''}
      ${foods.length?`<div class="stack" style="gap:6px">${foods.map(k=>`<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span><b class="reo">${BAGN[k]}</b> <span class="small muted">${BAGEN[k]} ×${g.bag[k]}</span></span><button class="btn sm" data-taste="${k}">Taste</button></div>`).join('')}</div>`:''}</div>
    <div class="stack"><h3>Make by hand</h3><div class="crafts">${Object.keys(CRAFTS).map(id=>craftTile(id)).join('')}</div></div>
    <div class="stack"><h3>Legends of the garden</h3><div class="crafts">${['ruataata','hinamoon'].map(id=>`<button class="ctile" data-leg="${id}"><b>${LEGENDS[id].t}</b><span class="small muted">${LEGENDS[id].sub}${S.legends&&S.legends[id]?' · heard':''}</span></button>`).join('')}</div></div>
    <p class="small muted">Seeds come from activities, legends and harvests. Progress is saved on this phone only.</p>`;
  $$('#gPlots .plot').forEach(b=>b.onclick=()=>{ const i=+b.dataset.p, pl=G().plots[i]; ac();
    if(!pl){ GPICK=GPICK===i?null:i; renderGarden(); const pk=$('#gPick'); if(pk) pk.scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'}); return; }
    if(plotStage(pl)===3){ harvest(i); renderGarden(); } else toast(`<b>${BAGN[pl.p]}</b>: ${leftTxt(pl)} left${pl.wx?' (planted on a waxing moon)':''}. ${PL[pl.p].use||''}`); });
  if($('#gPickX')) $('#gPickX').onclick=()=>{ GPICK=null; renderGarden(); };
  $$('#gPick .seed').forEach(b=>b.onclick=()=>{ plant(GPICK,b.dataset.k); GPICK=null; renderGarden(); });
  $$('#gb .oyster').forEach(b=>b.onclick=()=>{ openOyster(+b.dataset.o); renderGarden(); });
  $$('#gb [data-taste]').forEach(b=>b.onclick=()=>{ const k=b.dataset.taste; take({[k]:1}); sfx('uke'); sayWord(k); renderGarden(); openSheet(`<div class="shead"><div><div class="eyebrow">Taste it for real</div><h2><span class="reo">${BAGN[k]}</span> · ${BAGEN[k]}</h2></div>${XBTN}</div><div class="birdbox">${birdSVG(S,'ts')}</div><p>${PL[k].taste}</p><p class="small muted">Your manu loved it. Māuruuru!</p>`); });
  $$('#gb [data-craft]').forEach(b=>b.onclick=()=>{ if(!b.disabled) openCraft(b.dataset.craft); });
  $$('#gb [data-leg]').forEach(b=>b.onclick=()=>openLegend(b.dataset.leg,true)); }
let GTICK=0;
function tickGarden(){ const g=G(); let changed=(++GTICK%20===0) && GPICK===null; $$('#gPlots .plot').forEach(b=>{ const pl=g.plots[+b.dataset.p]; if(!pl) return; const st=plotStage(pl); if(String(st)!==b.dataset.st) changed=true; else { const t=b.querySelector('.t'); if(t) t.textContent=leftTxt(pl); } });
  const o=g.oysters; if(o && o.some(t=>Date.now()-t>=PEARL_MS && !$(`#gb .oyster.ripe[data-o="${o.indexOf(t)}"]`))) changed=true;
  if(changed) { const y=$('#gb').scrollTop; renderGarden(); $('#gb').scrollTop=y; } }

/* ---------- crafts: pāreu, tāupoʻo, hei poe, tapa ---------- */
const DYES={rea:{c:'#E2A12A',en:'yellow'},aute:{c:'#8E4FB0',en:'violet'},mati:{c:'#A8432C',en:'red-brown'},tiairi:{c:'#2A2A2E',en:'black'}};
const CRAFTS={
  pareu:{r:'Pāreu', en:'Sun-printed pāreu', need:{vavai:2}, any:['rea','aute','mati'], txt:'2 vavai and 1 dye (rēʻa, ʻaute or mati)',
    fact:'A pāreu is one length of cloth, tied in dozens of ways. Some painters make sun prints: leaves laid on wet, freshly painted cloth leave a pale shape once the sun has dried it.',
    real:'Look for hand-painted pāreu at Papeete market and in craft shops on every island.'},
  hat:{r:'Tāupoʻo', en:'Woven hat', need:{fara:3}, txt:'3 fara (pandanus)',
    fact:'Hats are woven from pandanus leaves (fara, paeʻore), coconut leaflets (nīʻau) and other fibres, strip over strip. The Austral Islands are famous for their weaving, and each island has its own patterns.',
    real:'Woven hats are sold at Papeete market and at craft fairs. Buying from the weaver supports the craft.'},
  hei:{r:'Hei poe', en:'Pearl and shell necklace', txt:'1 pearl and 3 pūpū', ok:()=>G().pearls.length>=1 && (G().bag.pupu||0)>=3,
    fact:'A hei is a garland for the head or neck, made of flowers or shells. A shell necklace is often given to visitors when they leave, as a sign of protection. Tahitian pearls grow in the black-lipped oyster; their dark greens, blues and greys are natural.',
    real:'Pearl farms in the lagoons of the Tuamotu and Gambier islands welcome visitors.'},
  shirt:{r:'Chemise', en:'Island shirt', need:{vavai:3}, any:['rea','aute','mati','tiairi'], txt:'3 vavai and 1 dye',
    fact:'Island shirts have a flat camp collar, short sleeves, a pocket cut so the print runs on, and often coconut buttons. Their all-over prints of flowers and leaves grew out of Polynesian bark-cloth stamping and Japanese printed cotton. In Tahiti people wear them for work, church and every celebration.',
    real:'Look for shirts in Tahitian prints at Papeete market and in local fashion shops, and for the fabric by the metre to have one made.'},
  tapa:{r:'Tapa', en:'Beaten bark cloth', need:{bark:2}, any:['tiairi','mati','rea'], txt:'2 ʻuru bark and 1 dye (tiʻaʻiri, mati or rēʻa)',
    fact:'Tapa is cloth made of beaten bark: ʻuru, banyan (ʻōrā) or paper mulberry. Women beat it with a grooved beater, the ʻiʻe, on a wooden anvil until it is four or five times wider. Plants give the colours: rēʻa for yellow, mati and tou for red-brown, tiʻaʻiri for black.',
    real:'On Fatu Hiva, in the Marquesas, tapa is still made by hand.'}
};
function craftOK(id){ const C=CRAFTS[id]; if(C.ok) return C.ok(); return has(C.need) && (!C.any || C.any.some(k=>(G().bag[k]||0)>0)); }
function craftTile(id){ const C=CRAFTS[id], ok=craftOK(id), made=S.crafts&&S.crafts[id]; return `<button class="ctile" data-craft="${id}" ${ok?'':'disabled'}><span class="cth">${craftThumb(id,!made)}</span><b class="reo">${C.r}</b><span>${C.en}</span><span class="small muted">${ok?'Ready to make':'Needs '+C.txt}${made?' · made':''}</span></button>`; }
function openCraft(id){ const C=CRAFTS[id]; ac();
  openFull(`<div class="fhead"><div><div class="eyebrow">Make by hand · ${C.en}</div><h2 class="reo">${C.r}</h2></div>${XBTN}</div><div class="fbody" id="cb"></div>`,'',()=>openGarden());
  ({pareu:craftPareu,hat:craftHat,hei:craftHei,tapa:craftTapa,shirt:craftShirt})[id]($('#cb')); }
function finishCraft(id,extra){ const C=CRAFTS[id]; clearRun(); sfx('stamp'); learn(({pareu:['pareu'],hat:['taupoo','fara'],hei:['hei','poe','pupu'],tapa:['tapa','ie','ora'],shirt:['vavai']})[id]||[],true); save();
  const cb=$('#cb'); cb.scrollTop=0; const r=document.createElement('div'); r.className='result';
  r.innerHTML=`<div class="eyebrow" style="text-align:center;margin-top:8px">Made by hand</div><h2 style="text-align:center"><span class="reo">${C.r}</span> · ${C.en}</h2>
    <div class="cbig">${craftThumb(id)}</div>${extra?`<p style="text-align:center">${extra}</p>`:''}
    ${id!=='tapa'?`<div class="card" style="align-items:center;text-align:center"><div class="birdbox">${birdSVG(S,'cr')}</div><p class="small">Your manu is wearing it. Change what it wears in <b>My manu</b>.</p></div>`:'<p class="small muted" style="text-align:center">Your tapa hangs in your Passport.</p>'}
    <div class="card flat"><div class="eyebrow">Did you know?</div><p class="small">${C.fact}</p></div>
    <div class="card flat"><div class="eyebrow">See it for real</div><p class="small">${C.real}</p></div>
    <div class="row"><button class="btn primary" id="crBack" style="flex:1">Back to the garden</button><button class="btn ghost" id="crShow">Show my manu</button></div>`;
  cb.appendChild(r); renderBird(); $('#crBack').onclick=()=>closeFull(); $('#crShow').onclick=()=>{ FULL_ON_CLOSE=null; closeFull(); later(()=>bubble(W.mauruuru.r,'Do you like it?'),400); }; }

/* shapes */
const URU_LEAF='M0 24 C-4 16 -16 14 -18 6 C-12 6 -10 2 -14 -4 C-8 -4 -6 -8 -10 -14 C-4 -12 -2 -16 0 -24 C2 -16 4 -12 10 -14 C6 -8 8 -4 14 -4 C10 2 12 6 18 6 C16 14 4 16 0 24Z';
function leafG(k,fill){ if(k==='uru') return `<path d="${URU_LEAF}" fill="${fill}"/>`;
  if(k==='fern'){ let s=`<rect x="-1" y="-24" width="2" height="48" fill="${fill}"/>`; for(let i=0;i<9;i++){ const y=-20+i*5, w=9-Math.abs(i-4)*1.1; s+=`<ellipse cx="${(-w/2-1).toFixed(1)}" cy="${y}" rx="${(w/2+1).toFixed(1)}" ry="2.2" transform="rotate(-18 ${(-w/2-1).toFixed(1)} ${y})" fill="${fill}"/><ellipse cx="${(w/2+1).toFixed(1)}" cy="${y}" rx="${(w/2+1).toFixed(1)}" ry="2.2" transform="rotate(18 ${(w/2+1).toFixed(1)} ${y})" fill="${fill}"/>`; } return s; }
  if(k==='niho') return `<path d="M-20 8 L-15 -8 L-10 8Z M-10 8 L-5 -8 L0 8Z M0 8 L5 -8 L10 8Z M10 8 L15 -8 L20 8Z" fill="${fill}"/>`;
  if(k==='honu') return `<ellipse cx="0" cy="0" rx="10" ry="13" fill="${fill}"/><circle cx="0" cy="-16" r="4" fill="${fill}"/><ellipse cx="-11" cy="-7" rx="6" ry="3" transform="rotate(-30 -11 -7)" fill="${fill}"/><ellipse cx="11" cy="-7" rx="6" ry="3" transform="rotate(30 11 -7)" fill="${fill}"/><ellipse cx="-9" cy="10" rx="5" ry="2.5" transform="rotate(30 -9 10)" fill="${fill}"/><ellipse cx="9" cy="10" rx="5" ry="2.5" transform="rotate(-30 9 10)" fill="${fill}"/>`;
  if(k==='aute') return [0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-9" rx="7" ry="9.5" transform="rotate(${a})" fill="${fill}"/>`).join('')+`<path d="M0 0 L9 -15" stroke="${fill==='#FFFDF5'||fill==='rgba(255,255,255,.55)'?'#E9B93A':'#FFF3C4'}" stroke-width="2.4" stroke-linecap="round"/><circle cx="9" cy="-15" r="2.6" fill="#F2C94C"/>`;
  if(k==='ti') return `<path d="M0 22 C-8 8 -8 -10 0 -24 C8 -10 8 8 0 22Z" fill="${fill}"/><path d="M0 20 V-20" stroke="rgba(0,0,0,.18)" stroke-width="1"/>`;
  if(k==='wave') return `<path d="M-20 -8 q5 -5 10 0 t10 0 t10 0 t10 0 M-20 0 q5 -5 10 0 t10 0 t10 0 t10 0 M-20 8 q5 -5 10 0 t10 0 t10 0 t10 0" fill="none" stroke="${fill}" stroke-width="2.4" stroke-linecap="round"/>`;
  return [0,60,120,180,240,300].map(a=>`<ellipse cx="0" cy="-9" rx="5" ry="10" transform="rotate(${a+15})" fill="${fill}"/>`).join('')+`<circle r="4" fill="${fill}"/>`; }
const LEAFN={uru:'ʻuru leaf',fern:'fern',tiare:'tiare'};
const MOTIFN={fern:'fern print',niho:'niho (teeth)',honu:'honu (turtle)',wave:'waves'};
function svgPoint(svg,e,w,h){ const r=svg.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*w,(e.clientY-r.top)/r.height*h]; }
function hatSVG(c,band){ const bc=band==='aute'?'#E0303A':band==='tiare'?'#FFFDF5':'#C8402F'; const fl=band==='tiare'?`<g transform="translate(73 27.5)">${[0,72,144,216,288].map(a=>`<circle cx="${(3*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(3*Math.sin(a*Math.PI/180)).toFixed(1)}" r="2.4" fill="#FFFDF5" stroke="#E2D6B8" stroke-width=".4"/>`).join('')}<circle r="1.4" fill="#F2C94C"/></g>`:band==='aute'?`<g transform="translate(73 27.5)">${[0,72,144,216,288].map(a=>`<circle cx="${(3*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(3*Math.sin(a*Math.PI/180)).toFixed(1)}" r="2.6" fill="#E0303A"/>`).join('')}<circle r="1.3" fill="#8E1420"/></g>`:'';
  return `<g><ellipse cx="82" cy="31" rx="24" ry="5.5" fill="#E2C27A" stroke="#B8934A" stroke-width="1"/><path d="M68 31 Q70 13 82 13 Q94 13 96 31 Z" fill="#EBD08E" stroke="#B8934A" stroke-width="1"/><path d="M69 27 Q82 31.5 95 27" fill="none" stroke="${bc}" stroke-width="3"/><path d="M73 17 L91 17 M71 22 L93 22 M76 14 L78 30 M82 13 L82 30 M88 14 L86 30" stroke="#B8934A" stroke-width=".6" fill="none"/>${fl}</g>`; }
function neckSVG(beads){ const n=beads.length; return beads.map((b,i)=>{ const t=i/(n-1||1), x=60+t*32, y=60+Math.sin(t*Math.PI)*6.5+t*2; return b.t==='p'?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="${b.c}" stroke="#C9D6D2" stroke-width=".5"/><circle cx="${(x-.7).toFixed(1)}" cy="${(y-.8).toFixed(1)}" r=".8" fill="#fff" opacity=".75"/>`:`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="2" ry="2.6" fill="#F7E3D0" stroke="#C99A7A" stroke-width=".6"/>`; }).join(''); }
function craftThumb(id,ghost){ const cr=(S.crafts||{})[id];
  if(id==='pareu'){ const c=cr?cr.c:'#9DB4BC'; return `<svg viewBox="0 0 120 80" aria-hidden="true"><rect x="6" y="6" width="108" height="68" rx="3" fill="${ghost?'none':c}" stroke="${ghost?'#9DB4BC':shade(c,.7)}" stroke-width="2" ${ghost?'stroke-dasharray="4 4"':''}/>${cr&&!ghost?cr.m.map(m=>`<g transform="translate(${(m.x*.36+6).toFixed(1)} ${(m.y*.34+6).toFixed(1)}) rotate(${m.r}) scale(.45)">${leafG(m.k,'rgba(255,255,255,.55)')}</g>`).join(''):''}</svg>`; }
  if(id==='shirt'){ return shirtSVG(cr&&!ghost?cr:null,'th'+(ghost?'g':''),ghost); }
  if(id==='hat'){ return `<svg viewBox="62 6 40 30" aria-hidden="true" ${ghost?'opacity=".35"':''}>${hatSVG(null,cr?cr.band:'plain')}</svg>`; }
  if(id==='hei'){ const beads=cr&&!ghost?cr.beads:[{t:'s'},{t:'p',c:'#2B3036'},{t:'s'},{t:'p',c:'#3E5B57'},{t:'s'}]; return `<svg viewBox="55 54 42 20" aria-hidden="true" ${ghost?'opacity=".35"':''}><path d="M58 59 Q76 74 94 61" fill="none" stroke="#8A6A4A" stroke-width=".6"/>${neckSVG(beads)}</svg>`; }
  const c=cr?cr.c:'#8A6A4A'; return `<svg viewBox="0 0 120 80" aria-hidden="true"><rect x="8" y="6" width="104" height="68" rx="2" fill="${ghost?'none':'#E8D6B0'}" stroke="${ghost?'#9DB4BC':'#C9B48A'}" stroke-width="2" ${ghost?'stroke-dasharray="4 4"':''}/>${cr&&!ghost?cr.st.map(m=>`<g transform="translate(${(m.x*.4+8).toFixed(1)} ${(m.y*.4+6).toFixed(1)}) scale(.45)">${leafG(m.k,m.c||c)}</g>`).join(''):''}</svg>`; }

/* --- pāreu: sun print --- */
function craftPareu(el){ const g=G(); const dyes=CRAFTS.pareu.any.filter(k=>(g.bag[k]||0)>0); let dye=dyes[0], leaf='uru'; const marks=[]; let printed=false;
  el.innerHTML=`<div class="card"><b class="small">1. Choose a dye</b><div class="row" id="pDyes">${dyes.map(k=>`<button class="btn sm ${k===dye?'primary':'ghost'}" data-d="${k}"><span class="dot" style="background:${DYES[k].c}"></span>${BAGN[k]} · ${DYES[k].en}</button>`).join('')}</div></div>
    <div class="art" style="background:#F4E7CF"><svg viewBox="0 0 300 200" id="pSvg" role="img" aria-label="A length of cotton cloth, freshly dyed"><rect x="0" y="0" width="300" height="200" fill="#F4E7CF"/><rect id="pCloth" x="14" y="14" width="272" height="172" rx="3" fill="${DYES[dye].c}" style="transition:fill 1.2s"/>${Array.from({length:12},(_,i)=>`<path d="M${14+i*24} 186 v8 M${22+i*24} 14 v-8" stroke="${shade(DYES[dye].c,.8)}" stroke-width="2" class="fringe"/>`).join('')}<g id="pMarks" style="opacity:0;transition:opacity 1s"></g><g id="pLeaves" style="transition:opacity 1s"></g><rect id="pSun" width="300" height="200" fill="#FFF3C4" style="opacity:0;transition:opacity .9s"/></svg></div>
    <div class="card"><b class="small">2. Lay leaves on the wet cloth</b><div class="row" id="pLeafs">${Object.keys(LEAFN).map(k=>`<button class="btn sm ${k===leaf?'primary':'ghost'}" data-l="${k}">${LEAFN[k]}</button>`).join('')}</div><p class="small muted" id="pN">Tap the cloth to lay a leaf (0 of 8).</p></div>
    <button class="btn sun" id="pGo" disabled>3. Let the sun print it</button>`;
  const svg=$('#pSvg');
  const setDye=k=>{ dye=k; $('#pCloth').setAttribute('fill',DYES[k].c); $$('#pSvg .fringe').forEach(f=>f.setAttribute('stroke',shade(DYES[k].c,.8))); $$('#pDyes .btn').forEach(b=>b.className='btn sm '+(b.dataset.d===k?'primary':'ghost')); };
  $$('#pDyes .btn').forEach(b=>b.onclick=()=>{ if(!printed) setDye(b.dataset.d); });
  $$('#pLeafs .btn').forEach(b=>b.onclick=()=>{ leaf=b.dataset.l; $$('#pLeafs .btn').forEach(x=>x.className='btn sm '+(x===b?'primary':'ghost')); });
  svg.addEventListener('pointerdown',e=>{ if(printed||marks.length>=8) return; const [x,y]=svgPoint(svg,e,300,200); if(x<28||x>272||y<28||y>172) return; const m={k:leaf,x:Math.round(x),y:Math.round(y),r:Math.round(rnd(-40,40))}; marks.push(m); sfx('tap');
    const tr=`translate(${m.x} ${m.y}) rotate(${m.r}) scale(1.3)`; $('#pMarks').insertAdjacentHTML('beforeend',`<g transform="${tr}">${leafG(m.k,'rgba(255,255,255,.58)')}</g>`); $('#pLeaves').insertAdjacentHTML('beforeend',`<g transform="${tr}">${leafG(m.k,m.k==='tiare'?'#FFFDF5':m.k==='fern'?'#2F7D4C':'#3B8C58')}</g>`);
    $('#pN').textContent=`Tap the cloth to lay a leaf (${marks.length} of 8).`; $('#pGo').disabled=marks.length<2; });
  $('#pGo').onclick=()=>{ if(printed) return; printed=true; $('#pGo').disabled=true; $('#pGo').textContent='The sun is printing…'; sfx('uke'); $('#pSun').style.opacity='.55';
    later(()=>{ $('#pSun').style.opacity='0'; $('#pCloth').setAttribute('fill',shade(DYES[dye].c,.88)); },1000);
    later(()=>{ $('#pLeaves').style.opacity='0'; $('#pMarks').style.opacity='1'; },1900);
    later(()=>{ take(Object.assign({vavai:2},{[dye]:1})); S.crafts=S.crafts||{}; S.crafts.pareu={c:shade(DYES[dye].c,.88),m:marks}; S.acc.pareu=true; save(); finishCraft('pareu',`Dyed with <span class="reo">${BAGN[dye]}</span>, printed by the sun.`); },3300); }; }

/* --- tāupoʻo: weave over and under --- */
const WEAVE={plain:{n:'Plain',rows:['OUOUOU','UOUOUO','OUOUOU','UOUOUO']}, twill:{n:'Twill',rows:['OOUUOO','UOOUUO','UUOOUU','OUUOOU']}, diamond:{n:'Diamond',rows:['UUOOUU','UOUUOU','OUUUUO','UOUUOU']}};
function craftHat(el){ let pat=null, i=0;
  el.innerHTML=`<div class="card"><b class="small">1. Choose a weave</b><div class="row" id="hPats">${Object.keys(WEAVE).map(k=>`<button class="btn sm ghost" data-w="${k}">${WEAVE[k].n}</button>`).join('')}</div><p class="small muted">Each fara strip goes over (O) or under (U) the strip it crosses.</p></div>
    <div class="art" style="background:#F2E6CC"><svg viewBox="0 0 240 160" id="hSvg" role="img" aria-label="A pandanus mat being woven"><rect width="240" height="160" fill="#F2E6CC"/><g id="hCells"></g><rect id="hCur" x="12" y="12" width="36" height="34" fill="none" stroke="#D9562E" stroke-width="3" rx="3" opacity="0"/></svg></div>
    <div class="card"><div class="row" style="justify-content:space-between"><span class="fb" id="hFb" aria-live="polite">Choose a weave to start.</span><b id="hN">0 / 24</b></div><div class="row" id="hRow" style="gap:4px;font-family:var(--display);font-weight:600"></div></div>
    <div class="pad"><button class="btn primary" id="hO" disabled>Over</button><button class="btn primary" id="hU" disabled>Under</button></div><div id="hBand"></div>`;
  const cell=(r,c,v)=>{ const x=12+c*36, y=12+r*34; return v==='O'?`<rect x="${x}" y="${y}" width="36" height="34" fill="#EBD08E" stroke="#B8934A" stroke-width=".8"/><path d="M${x} ${y+11} h36 M${x} ${y+23} h36" stroke="#C9A35E" stroke-width=".8"/>`:`<rect x="${x}" y="${y}" width="36" height="34" fill="#C9A35E" stroke="#9A7A44" stroke-width=".8"/><path d="M${x+12} ${y} v34 M${x+24} ${y} v34" stroke="#A8864A" stroke-width=".8"/>`; };
  const showRow=()=>{ if(!pat) return; const r=Math.floor(i/6); $('#hRow').innerHTML=r<4?`<span class="small muted" style="font-family:var(--body);font-weight:400">Row ${r+1}:</span>`+WEAVE[pat].rows[r].split('').map((v,c)=>`<span class="wv ${r*6+c<i?'done':''} ${r*6+c===i?'cur':''}">${v}</span>`).join(''):''; const cur=$('#hCur'); if(i<24){ cur.setAttribute('x',12+(i%6)*36); cur.setAttribute('y',12+r*34); cur.setAttribute('opacity','1'); } else cur.setAttribute('opacity','0'); };
  $$('#hPats .btn').forEach(b=>b.onclick=()=>{ if(i>0) return; pat=b.dataset.w; $$('#hPats .btn').forEach(x=>x.className='btn sm '+(x===b?'primary':'ghost')); $('#hO').disabled=false; $('#hU').disabled=false; $('#hFb').textContent='Follow the row: over or under?'; showRow(); });
  const press=v=>{ if(!pat||i>=24) return; const r=Math.floor(i/6), c=i%6, want=WEAVE[pat].rows[r][c];
    if(v===want){ $('#hCells').insertAdjacentHTML('beforeend',cell(r,c,v)); i++; sfx('tap'); $('#hN').textContent=`${i} / 24`; $('#hFb').className='fb good'; $('#hFb').textContent=i%6?'Good':'Row done!'; showRow(); if(i>=24) bandStep(); }

    $('#hBand').innerHTML=`<div class="card"><b class="small">Last step: a band for your tāupoʻo</b><div class="row">${opts.map(o=>`<button class="btn sm ghost" data-b="${o[0]}" ${o[2]?'':'disabled'}>${o[1]}${o[0]!=='plain'?` (${o[2]?'uses 1':'none in basket'})`:''}</button>`).join('')}</div></div>`;
    $('#hBand').scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'});
    $$('#hBand .btn').forEach(b=>b.onclick=()=>{ const band=b.dataset.b; const use={fara:3}; if(band!=='plain') use[band]=1; take(use); S.crafts=S.crafts||{}; S.crafts.hat={band,pat}; S.acc.hat=true; S.acc.hei=false; save(); finishCraft('hat',`A ${WEAVE[pat].n.toLowerCase()} weave of fara, with a ${band==='plain'?'red':BAGN[band]} band.`); }); }; }

/* --- hei poe: string pearls and shells --- */
function craftHei(el){ const g=G(); const beads=[]; const used=new Set(); const N=7;
  const slots=Array.from({length:N},(_,i)=>{ const t=(i+1)/(N+1); const x=(1-t)*(1-t)*20+2*(1-t)*t*150+t*t*280, y=(1-t)*(1-t)*24+2*(1-t)*t*134+t*t*24; return [x,y]; });

    <div class="card"><b class="small">Tap a pearl or a shell to thread it (7 in all, at least one pearl)</b><div class="row" id="kPal"></div><div class="row"><button class="btn sm ghost" id="kUndo">Undo</button><span class="small muted" id="kN">0 / 7</span></div></div>

    const shellsLeft=(g.bag.pupu||0)-beads.filter(b=>b.t==='s').length;
    $('#kPal').innerHTML=g.pearls.map((c,i)=>`<button class="bead" data-p="${i}" ${used.has(i)||beads.length>=N?'disabled':''} aria-label="Pearl"><span class="pearl" style="background:${c}"></span></button>`).join('')+`<button class="bead" data-s="1" ${shellsLeft<=0||beads.length>=N?'disabled':''} aria-label="Shell"><svg viewBox="-12 -12 24 24" width="26" height="26"><path d="M0 -11 C8 -9 10 -1 7 6 Q0 10 -7 6 C-10 -1 -8 -9 0 -11Z" fill="#F7E3D0" stroke="#C99A7A"/></svg><span class="small">×${shellsLeft}</span></button>`;
    $$('#kPal .bead').forEach(b=>b.onclick=()=>{ if(b.dataset.p!==undefined){ const i=+b.dataset.p; used.add(i); beads.push({t:'p',c:g.pearls[i],i}); } else beads.push({t:'s'}); sfx('tap'); draw(); });

  draw(); }

/* --- tapa: beat, dry, decorate --- */
function craftTapa(el){ const g=G(); const dyes=CRAFTS.tapa.any.filter(k=>(g.bag[k]||0)>0); let dye=dyes[0], motif='fern', beats=0; const st=[]; let phase='beat';
  el.innerHTML=`<div class="art" style="background:#5A3A1E"><svg viewBox="0 0 300 180" id="tSvg" role="img" aria-label="Bark on a wooden anvil"><rect width="300" height="180" fill="#3E5A3A"/><rect x="20" y="118" width="260" height="30" rx="8" fill="#6B4426"/><rect x="20" y="118" width="260" height="6" rx="3" fill="#8A5A2B"/><rect id="tBark" x="130" y="40" width="40" height="80" rx="3" fill="#E8D6B0" stroke="#C9B48A" stroke-width="1.5"/><g id="tSt"></g><g id="tStones"></g><g id="tIe" style="transform-box:fill-box;transform-origin:100% 50%;transition:transform .09s"><rect x="186" y="12" width="70" height="16" rx="4" fill="#5A3A1E"/>${Array.from({length:7},(_,i)=>`<path d="M${190+i*7} 14 v12" stroke="#3A2412" stroke-width="1.2"/>`).join('')}<rect x="250" y="16" width="34" height="8" rx="4" fill="#7A5230"/></g></svg></div>
    <div class="card" id="tCard"><p class="small">Soak the <span class="reo">ʻuru</span> bark, then beat it with the <span class="reo">ʻiʻe</span> to make it wider and thinner.</p><div class="meter"><div class="f" id="tM"></div></div><span class="fb" id="tFb" aria-live="polite">0 / 24 beats</span></div>
    <button class="btn sun" id="tGo" style="min-height:66px;font-size:1.1rem">Beat with the ʻiʻe</button><div id="tDeco"></div>`;
  const svg=$('#tSvg');
  $('#tGo').onclick=()=>{ if(phase!=='beat') return; beats++; const w=40+beats*(220/24); const b=$('#tBark'); b.setAttribute('width',w.toFixed(1)); b.setAttribute('x',(150-w/2).toFixed(1)); $('#tM').style.width=(beats/24*100)+'%'; $('#tFb').textContent=`${beats} / 24 beats`;
    const ie=$('#tIe'); ie.style.transform='rotate(-14deg) translate(-'+(beats%2?20:40)+'px,34px)'; setTimeout(()=>{ ie.style.transform=''; },110); if(S.sound){ const a=ac(); if(a) drum(a.currentTime+.01); }
    if(beats>=24){ phase='dry'; $('#tGo').disabled=true; $('#tGo').textContent='Drying in the shade…'; $('#tFb').className='fb good'; $('#tFb').textContent='Four or five times wider!'; $('#tStones').innerHTML=[[42,44],[258,44],[42,114],[258,114]].map(p=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="8" ry="6" fill="#8A9BA6"/>`).join(''); later(decorate,1500); } };

    $$('#tDyes .btn').forEach(b=>b.onclick=()=>{ dye=b.dataset.d; $$('#tDyes .btn').forEach(x=>x.className='btn sm '+(x===b?'primary':'ghost')); });

  svg.addEventListener('pointerdown',e=>{ if(phase!=='deco'||st.length>=10) return; const [x,y]=svgPoint(svg,e,300,180); if(x<30||x>270||y<44||y>116) return; st.push({k:motif,x:Math.round(x),y:Math.round(y),d:dye}); sfx('tap');
    $('#tSt').insertAdjacentHTML('beforeend',`<g transform="translate(${Math.round(x)} ${Math.round(y)}) scale(.8)">${leafG(motif,DYES[dye].c)}</g>`); $('#tN').textContent=`${st.length} of 10 prints`; $('#tDone').disabled=st.length<3; }); }

/* --- Chemise: design an island shirt --- */
const SHIRT_MOTIFS={tiare:{n:'tiare',need:'tiare'},aute:{n:'ʻaute',need:'aute'},uru:{n:'ʻuru leaf'},ti:{n:'ʻautī leaf'},fern:{n:'fern'},honu:{n:'honu'},niho:{n:'niho'},wave:{n:'waves'}};
const INKS={cream:{c:'#FFF6E3',n:'cream'},white:{c:'#FFFFFF',n:'white'},rea:{c:'#E2A12A',n:'rēʻa yellow',dye:'rea'},aute:{c:'#8E4FB0',n:'ʻaute violet',dye:'aute'},mati:{c:'#A8432C',n:'mati red',dye:'mati'},tiairi:{c:'#2A2A2E',n:'tiʻaʻiri black',dye:'tiairi'},green:{c:'#2F7D4C',n:'leaf green'}};
function shirtPattern(d,id,scale){ const sc=(scale||1)*(d.big?1.5:1), w=60*sc;
  const m1=d.m[0], m2=d.m[1]||d.m[0]; const g=(k,x,y,r,s,c)=>`<g transform="translate(${x*sc} ${y*sc}) rotate(${r}) scale(${(s*sc).toFixed(2)})">${leafG(k,c)}</g>`;
  return `<pattern id="${id}" width="${w}" height="${w}" patternUnits="userSpaceOnUse"><rect width="${w}" height="${w}" fill="${d.c}"/>${g(m1,15,15,-20,.62,d.ink)}${g(m2,45,44,25,.58,d.ink2||d.ink)}${g(m2,46,12,60,.32,d.ink2||d.ink)}${g(m1,14,47,-50,.34,d.ink)}</pattern>`; }
function shirtSVG(d,id,ghost){ d=d||{c:'#3E8FB0',ink:'#FFF6E3',m:['tiare','uru']}; const pid=id+'-pt', fill=ghost?'none':`url(#${pid})`, line=ghost?'#9DB4BC':shade(d.c.startsWith('#')?d.c:'#3E8FB0',.62);
  const body='M70 30 L96 22 Q120 34 144 22 L170 30 L214 58 L198 98 L176 88 L176 214 Q120 222 64 214 L64 88 L42 98 L26 58Z';
  const btn=y=>`<circle cx="122" cy="${y}" r="4.2" fill="#7A5230" stroke="#4E3219" stroke-width="1"/><circle cx="120.6" cy="${y-.8}" r=".9" fill="#3A2412"/><circle cx="123.4" cy="${y+.8}" r=".9" fill="#3A2412"/>`;
  return `<svg viewBox="0 0 240 240" aria-hidden="true"><defs>${ghost?'':shirtPattern(d,pid,1)}</defs>
    <path d="${body}" fill="${fill}" stroke="${line}" stroke-width="2.4" stroke-linejoin="round" ${ghost?'stroke-dasharray="6 5"':''}/>
    ${ghost?'':`<path d="M64 88 L42 98 M176 88 L198 98" stroke="${line}" stroke-width="1.6"/><path d="M118 34 V214" stroke="${line}" stroke-width="1.6"/><rect x="138" y="76" width="28" height="30" rx="2" fill="url(#${pid})" stroke="${line}" stroke-width="1.6"/>
    <path d="M96 22 L118 62 L104 66 L84 34Z M144 22 L122 62 L136 66 L156 34Z" fill="url(#${pid})" stroke="${line}" stroke-width="1.8" stroke-linejoin="round"/><path d="M96 22 Q120 34 144 22" fill="none" stroke="${line}" stroke-width="1.8"/>
    ${btn(84)}${btn(120)}${btn(156)}${btn(192)}`}</svg>`; }
function craftShirt(el){ const g=G(); const dyes=['rea','aute','mati','tiairi'].filter(k=>(g.bag[k]||0)>0);
  const D={c:DYES[dyes[0]].c, dye:dyes[0], m:['tiare','uru'], ink:'#FFF6E3', inkKey:'cream', big:false};
  const motifOK=k=>!SHIRT_MOTIFS[k].need || (g.bag[SHIRT_MOTIFS[k].need]||0)>0;
  if(!motifOK('tiare')) D.m[0]='fern';
  const inkOK=k=>!INKS[k].dye || ((g.bag[INKS[k].dye]||0)>(INKS[k].dye===D.dye?1:0));
  el.innerHTML=`<div class="shirtwrap" id="shPrev">${shirtSVG(D,'sh')}</div>
    <div class="card"><b class="small">1. Dye the cotton</b><div class="row" id="shDye">${dyes.map(k=>`<button class="btn sm ${k===D.dye?'primary':'ghost'}" data-d="${k}"><span class="dot" style="background:${DYES[k].c}"></span>${BAGN[k]}</button>`).join('')}</div></div>
    <div class="card"><b class="small">2. Choose two motifs</b><p class="small muted">Flower motifs use a fresh flower from your basket as the model.</p><div class="chips" id="shMot">${Object.keys(SHIRT_MOTIFS).map(k=>`<button class="btn sm ${D.m.includes(k)?'primary':'ghost'}" data-m="${k}" ${motifOK(k)?'':'disabled'}>${SHIRT_MOTIFS[k].n}${motifOK(k)?'':' (none in basket)'}</button>`).join('')}</div></div>
    <div class="card"><b class="small">3. Print colour and size</b><div class="chips" id="shInk">${Object.keys(INKS).map(k=>`<button class="btn sm ${k===D.inkKey?'primary':'ghost'}" data-i="${k}" ${inkOK(k)?'':'disabled'}><span class="dot" style="background:${INKS[k].c}"></span>${INKS[k].n}</button>`).join('')}</div><div class="row"><button class="btn sm primary" data-s="0">Small print</button><button class="btn sm ghost" data-s="1">Large print</button></div></div>
    <button class="btn sun" id="shGo">Sew the shirt</button>`;
  const redraw=()=>{ $('#shPrev').innerHTML=shirtSVG(D,'sh'); };
  $$('#shDye .btn').forEach(b=>b.onclick=()=>{ D.dye=b.dataset.d; D.c=DYES[D.dye].c; if(D.ink===D.c){ D.ink='#FFF6E3'; D.inkKey='cream'; $$('#shInk .btn').forEach(x=>x.className='btn sm '+(x.dataset.i==='cream'?'primary':'ghost')); } $$('#shDye .btn').forEach(x=>x.className='btn sm '+(x===b?'primary':'ghost')); sfx('tap'); redraw(); });
  $$('#shMot .btn').forEach(b=>b.onclick=()=>{ const k=b.dataset.m; if(D.m.includes(k)){ if(D.m.length>1) D.m=D.m.filter(x=>x!==k); } else { D.m.push(k); if(D.m.length>2) D.m.shift(); } $$('#shMot .btn').forEach(x=>x.className='btn sm '+(D.m.includes(x.dataset.m)?'primary':'ghost')); sfx('tap'); redraw(); });
  $$('#shInk .btn').forEach(b=>b.onclick=()=>{ D.inkKey=b.dataset.i; D.ink=INKS[D.inkKey].c; $$('#shInk .btn').forEach(x=>x.className='btn sm '+(x===b?'primary':'ghost')); sfx('tap'); redraw(); });
  $$('#cb [data-s]').forEach(b=>b.onclick=()=>{ D.big=b.dataset.s==='1'; $$('#cb [data-s]').forEach(x=>x.className='btn sm '+(x===b?'primary':'ghost')); redraw(); });
  $('#shGo').onclick=()=>{ const use={vavai:3,[D.dye]:1}; D.m.forEach(k=>{ const n=SHIRT_MOTIFS[k].need; if(n) use[n]=(use[n]||0)+1; }); const ik=INKS[D.inkKey].dye; if(ik) use[ik]=(use[ik]||0)+1;
    if(!has(use)){ toast('Not enough in your basket for this design. Try another print colour or motif.'); return; }
    take(use); S.crafts=S.crafts||{}; S.crafts.shirt={c:D.c,ink:D.ink,m:D.m.slice(),big:D.big}; S.acc.shirt=true; save();
    finishCraft('shirt',`Dyed with <span class="reo">${BAGN[D.dye]}</span>, printed with ${D.m.map(k=>SHIRT_MOTIFS[k].n).join(' and ')}.`); }; }
