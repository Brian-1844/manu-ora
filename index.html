function openLegend(id,fromGarden){ const L=LEGENDS[id]; let p=0; ac();
  openFull(`<div class="fhead"><div><div class="eyebrow">ʻĀʻai · Legend${L.isl?' of '+ISL[L.isl].r:''}</div><h2>${L.t}</h2></div>${XBTN}</div><div class="fbody" id="lb"></div>`,'',fromGarden?()=>openGarden():null);
  const draw=()=>{ const last=p===L.pages.length-1; const first=!(S.legends&&S.legends[id]);
    $('#lb').innerHTML=`<div class="art">${L.art(p)}</div><div class="card"><p>${L.pages[p]}</p><div class="row" style="justify-content:space-between"><span class="prog">${prog(p+1,L.pages.length)}</span><span class="small muted">${p+1} of ${L.pages.length}</span></div></div>
      ${last?`<div class="card flat"><p class="small muted">${L.src}</p></div>`:''}
      <div class="row">${p>0?'<button class="btn ghost" id="lBack">Back</button>':''}<button class="btn ${last?'sun':'primary'}" id="lNext" style="flex:1">${last?(first?'Receive a gift':'Close'):'Next'}</button></div>`;
    if($('#lBack')) $('#lBack').onclick=()=>{ p--; draw(); };
    $('#lNext').onclick=()=>{ if(!last){ p++; sfx('tap'); draw(); $('#lb').scrollTop=0; return; }
      if(!first){ closeFull(); return; }
      S.legends=S.legends||{}; S.legends[id]=true; const gift=L.reward(); learn(L.words,true); save(); sfx('stamp');
      $('#lb').innerHTML=`<div class="art">${L.art(p)}</div><div class="card" style="align-items:center;text-align:center"><div class="eyebrow">A gift from the legend</div><h3>${gift}</h3><div class="birdbox">${birdSVG(S,'lg')}</div><p class="small">${Object.keys(LEGENDS).filter(k=>S.legends[k]).length} of ${Object.keys(LEGENDS).length} legends heard.</p></div><button class="btn primary" id="lDone">${fromGarden?'Back to the garden':L.isl?'Back to '+ISL[L.isl].en:'Close'}</button>`;
      $('#lDone').onclick=()=>closeFull(); }; };
  draw(); }

function moonNight(){ let a=moonAge(Date.now())-1; if(a<0) a+=29.530588853; return Math.min(30,Math.floor(a)+1); }
function moonName(){ const p=moonAge(Date.now())/29.530588853; return (p<.03||p>.97)?'new moon':p<.22?'waxing crescent':p<.28?'first quarter':p<.47?'waxing gibbous':p<.53?'full moon':p<.72?'waning gibbous':p<.78?'last quarter':'waning crescent'; }
function bigMoon(cx,cy,r){ const p=moonAge(Date.now())/29.530588853, rx=Math.max(.01,r*Math.abs(Math.cos(2*Math.PI*p))), wax=p<.5; const outer=wax?0:1, term=wax?(p<.25?1:0):(p<.75?1:0);
  return `<circle cx="${cx}" cy="${cy}" r="${r+7}" fill="#FFF1C4" opacity=".1"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#243A52"/><path d="M${cx} ${cy-r} A${r} ${r} 0 0 ${outer} ${cx} ${cy+r} A${rx.toFixed(2)} ${r} 0 0 ${term} ${cx} ${cy-r}Z" fill="#FFF1C4"/>`; }
const SKYST={sel:null, quiz:null, flash:null, done:undefined};
function skyKnown(){ if(!Array.isArray(S.sky)) S.sky=[]; return S.sky; }
function skyMapSVG(){ const quiz=!!SKYST.quiz; let h=`<defs>${vgrad('trS','#071426','#12304A',0,520)}</defs><rect width="360" height="520" fill="url(#trS)"/>`;
  const r=seeded(7); for(let i=0;i<80;i++) h+=`<circle cx="${(r()*360).toFixed(0)}" cy="${(r()*520).toFixed(0)}" r="${(.5+r()*.9).toFixed(1)}" fill="#fff" opacity="${(.25+r()*.4).toFixed(2)}"/>`;
  h+='<path d="M-20 520 Q160 330 380 120" stroke="#A9C1F0" stroke-opacity=".13" stroke-width="86" fill="none" stroke-linecap="round"/><path d="M-20 520 Q160 330 380 120" stroke="#DCE8FF" stroke-opacity=".12" stroke-width="34" fill="none" stroke-linecap="round"/>';
  h+='<g data-sky="vaiora" class="tapable"><path d="M-20 520 Q160 330 380 120" stroke="#fff" stroke-opacity="0" stroke-width="64" fill="none" pointer-events="stroke"/></g>';
  SKY.forEach(o=>{ if(o.id==='vaiora') return; const sel=SKYST.sel===o.id&&!quiz, fl=SKYST.flash&&SKYST.flash.id===o.id;
    let g=`<g data-sky="${o.id}" class="tapable"><circle cx="${o.hit[0]}" cy="${o.hit[1]}" r="${o.hit[2]}" fill="#fff" fill-opacity="${fl?.16:sel?.08:0}" stroke="${fl?(SKYST.flash.ok?'#62C486':'#FF7A62'):'#FFE9A8'}" stroke-opacity="${fl?1:sel?.9:0}" stroke-width="2"/>`;
    o.lines.forEach(l=>{ const a=o.pts[l[0]], b=o.pts[l[1]]; g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#CFE0FF" stroke-opacity=".45" stroke-width="1.2"/>`; });
    o.pts.forEach(pt=>{ const c=pt[3]||'#FFFFFF'; g+=`<circle cx="${pt[0]}" cy="${pt[1]}" r="${pt[2]*2.4}" fill="${c}" opacity=".16"/><circle cx="${pt[0]}" cy="${pt[1]}" r="${pt[2]}" fill="${c}"/>`; });
    if(o.id==='marama') g+=bigMoon(312,48,19);
    h+=g+'</g>'; });
  if(!quiz) SKY.forEach(o=>{ const k=skyKnown().includes(o.id); h+=`<text x="${o.lab[0]}" y="${o.lab[1]}" text-anchor="${o.lab[2]}" font-family="Fredoka,Nunito,sans-serif" font-weight="600" font-size="12.5" fill="${SKYST.sel===o.id?'#FFE9A8':'#DCE8FF'}" pointer-events="none">${o.ty}${k?' ✓':''}</text>`; });
  return `<svg viewBox="0 0 360 520" id="skySvg" role="img" aria-label="Map of the night sky" style="width:100%;height:auto;display:block;touch-action:manipulation">${h}</svg>`; }
function openSky(){ const keep=$('#skyBox')?$('#fullIn .fbody').scrollTop:0; const Q=SKYST.quiz, n=skyKnown().length; let panel;
  if(Q){ const w=SKY.find(x=>x.id===Q.q[Q.i]); panel=`<div class="card"><div class="eyebrow">Question ${Q.i+1} of ${Q.q.length} · ${Q.score} found first time</div><h3>Where is ${w.ty}?</h3><p class="small muted">${Q.msg||('Hint: '+w.en+', '+w.sens+'.')}</p><button class="btn sm ghost" data-skyb="stop">Stop the game</button></div>`; }
  else { const o=SKY.find(x=>x.id===SKYST.sel);
    const info=o?`<div class="card"><div class="eyebrow">${o.en} · ${o.sens}</div><h3 class="reo">${o.ty}</h3><p class="small">${o.txt}</p></div>`:'<div class="card flat"><p class="small">Tap a star or a group of stars to learn its name in Reo Tahiti and its story.</p></div>';
    const dn=typeof SKYST.done==='number'?`<div class="card flat"><p><b>${SKYST.done} of 5</b> found first time. ${SKYST.done>=4?'You read the sky like a navigator!':'Look at the map again, then play once more.'}</p></div>`:'';
    panel=`${dn}${info}<button class="btn primary" data-skyb="quiz">Play: find the star</button><p class="small muted" style="text-align:center">You know ${n} of ${SKY.length} stars.${n<SKY.length?' Learn them all to give your manu a cloak of stars.':' Your manu can wear its cloak of stars.'}</p>`; }
  const nn=moonNight();
  const html=`<div class="fhead"><div><div class="eyebrow">The sky of the fenua</div><h2>Te raʻi</h2></div>${XBTN}</div>
    <div class="fbody"><div id="skyBox" class="stack" style="gap:12px"><div class="art">${skyMapSVG()}</div>${panel}
    <div class="card flat"><div class="row" style="flex-wrap:nowrap;gap:12px"><svg viewBox="0 0 60 60" style="width:56px;height:56px;flex:none" aria-hidden="true"><rect width="60" height="60" rx="14" fill="#0B1C2E"/>${bigMoon(30,30,19)}</svg><div style="min-width:0"><div class="eyebrow">Marama · the moon tonight</div><b>${moonName()}</b><div class="small muted">Night ${nn} of the moon: <b class="reo">${PO[nn-1]}</b></div></div></div></div>
    <div class="card flat"><div class="eyebrow">Steering by the stars</div><p class="small">Navigators followed star paths. Each island has its <b>ʻaveiʻa</b>, a star that passes right over it: for Tahiti, Taʻurua-faupapa. Try it yourself on a voyage between the islands.</p></div>
    <p class="small muted">A simplified map: the shapes are right, the distances are not, and not all these stars are up on the same night. Names vary between islands and sources.</p></div></div>`;
  if($('#skyBox')) $('#fullIn').innerHTML=html; else openFull(html);
  $('#fullIn [data-close]').onclick=()=>{ SKYST.quiz=null; SKYST.flash=null; SKYST.done=undefined; closeFull(); };
  $('#fullIn .fbody').scrollTop=keep;
  $('#skyBox').addEventListener('click',e=>{ const b=e.target.closest('[data-skyb]'); if(b){ if(b.dataset.skyb==='quiz'){ SKYST.quiz={q:shuffle(SKY.map(o=>o.id)).slice(0,5),i:0,score:0,miss:false,msg:''}; SKYST.sel=null; SKYST.done=undefined; } else { SKYST.quiz=null; } openSky(); return; }
    const g=e.target.closest('[data-sky]'); if(!g) return; const id=g.getAttribute('data-sky'); ac();
    if(SKYST.quiz) skyAnswer(id); else { SKYST.sel=id; SKYST.done=undefined; sfx('tap'); openSky(); } }); }
function skyAnswer(id){ const Q=SKYST.quiz; if(!Q||SKYST.flash) return; const want=Q.q[Q.i], o=SKY.find(x=>x.id===id), w=SKY.find(x=>x.id===want);
  if(id===want){ if(!Q.miss){ Q.score++; const k=skyKnown(); if(!k.includes(want)){ k.push(want); learn(want==='marama'?'marama':want,true); save(); if(k.length===SKY.length){ S.acc.stars=true; save(); later(()=>toast('You know the whole sky: your manu’s <b>cloak of stars</b> is ready!',3800),1200); } } }
    Q.msg=`Yes! ${w.ty}, ${w.en}.`; SKYST.flash={id,ok:true}; sfx('good'); openSky();
    later(()=>{ SKYST.flash=null; Q.i++; Q.miss=false; Q.msg=''; if(Q.i>=Q.q.length){ const sc=Q.score; SKYST.quiz=null; SKYST.done=sc; if(!S.skyGift && sc>=3){ S.skyGift=true; addSeeds(2); save(); later(()=>toast('A gift from the sky: 2 seeds for your faʻaʻapu'),600); } } if($('#skyBox')) openSky(); },1100); }
  else { Q.miss=true; Q.msg=`Close. That one is ${o.ty} (${o.en}). Keep looking.`; SKYST.flash={id,ok:false}; sfx('bad'); openSky(); later(()=>{ SKYST.flash=null; if($('#skyBox')) openSky(); },900); } }

const KEEP={prompt:null, installed:false};
const IN_FRAME=(()=>{ try{ return window.top!==window; }catch(e){ return true; } })();
const STANDALONE=(()=>{ try{ return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; }catch(e){ return false; } })();
const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); KEEP.prompt=e; $$('[data-install]').forEach(b=>b.hidden=false); });
window.addEventListener('appinstalled',()=>{ KEEP.installed=true; KEEP.prompt=null; toast('Manu Tere is on your home screen. <b>Māuruuru!</b>'); });
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}

function saveCode(){ const json=JSON.stringify(Object.assign({},S,{savedAt:Date.now()})); return 'MANUTERE1:'+btoa(unescape(encodeURIComponent(json))); }
function readCode(txt){ txt=String(txt||'').trim().replace(/\s+/g,''); const m=/^MANUTERE1:(.+)$/.exec(txt); if(!m) return null;
  try{ const o=JSON.parse(decodeURIComponent(escape(atob(m[1])))); if(!o || typeof o!=='object' || !Array.isArray(o.words)) return null; return o; }catch(e){ return null; } }
function applySave(o){ const fresh=JSON.parse(JSON.stringify(DEF)); S=Object.assign(fresh,o,{acc:Object.assign({},DEF.acc,o.acc||{}), onboarded:true}); delete S.savedAt; save(); $('#scene').dataset.i=''; renderAll(); }
function installBlock(){
  if(STANDALONE) return '<p class="small"><b>Installed.</b> You are using Manu Tere from your home screen.</p>';
  if(IN_FRAME) return '<p class="small">To install Manu Tere on your phone, open its own web address (the GitHub version) in your browser. Meanwhile, keep a backup code below.</p>';
  if(IOS) return '<p class="small"><b>iPhone and iPad:</b> in Safari, tap the Share button, then <b>Add to Home Screen</b>. Your voyage is kept with the app.</p>';
  return `<button class="btn primary" data-install ${KEEP.prompt?'':'hidden'}>Install on my phone</button><p class="small muted">${KEEP.prompt?'Installed apps keep their progress longer, and work without a connection.':'If no install button shows, use your browser menu: <b>Install app</b> or <b>Add to Home screen</b>.'}</p>`; }
function bindInstall(root){ $$('[data-install]',root).forEach(b=>b.onclick=async()=>{ const p=KEEP.prompt; if(!p) return; p.prompt(); try{ const r=await p.userChoice; if(r && r.outcome==='accepted') KEEP.prompt=null; }catch(e){} $$('[data-install]').forEach(x=>x.hidden=!KEEP.prompt); }); }
function openKeep(fromWelcome){
  const code=saveCode(); const canFile=!IN_FRAME;
  openSheet(`<div class="shead"><div><div class="eyebrow">Keep your voyage</div><h2>Save and restore</h2></div>${XBTN}</div>
    <div class="card"><div class="eyebrow">1 · Install the app</div>${installBlock()}</div>
    ${fromWelcome?'':`<div class="card"><div class="eyebrow">2 · Your backup code</div><p class="small">Your stamps, words, garden and crafts live on this phone. Copy this code somewhere safe (notes, an email to yourself). With it you can get everything back, even on a new phone.</p>
      <textarea id="kCode" readonly rows="3" aria-label="Backup code">${esc(code)}</textarea>
      <div class="row"><button class="btn primary sm" id="kCopy">Copy the code</button>${canFile?'<button class="btn ghost sm" id="kFile">Save as a file</button>':''}</div><span class="small muted" id="kMsg" aria-live="polite"></span></div>`}
    <div class="card flat"><div class="eyebrow">${fromWelcome?'Already travelling?':'3 · Restore a voyage'}</div><p class="small">Paste a backup code${canFile?' or choose a save file':''}. ${fromWelcome?'':'This replaces the voyage on this phone.'}</p>
      <textarea id="kIn" rows="3" placeholder="MANUTERE1:…" aria-label="Paste a backup code"></textarea>
      <div class="row"><button class="btn sun sm" id="kLoad">Restore</button>${canFile?'<label class="btn ghost sm" for="kPick">Choose a file</label><input type="file" id="kPick" accept=".txt,text/plain" hidden>':''}</div><span class="small" id="kErr" aria-live="polite"></span></div>`);
  bindInstall($('#sheet'));
  const msg=t=>{ const m=$('#kMsg'); if(m) m.textContent=t; };
  if($('#kCopy')) $('#kCopy').onclick=()=>{ const ta=$('#kCode'); const done=()=>{ msg('Copied. Keep it somewhere safe.'); S.lastBackup=Date.now(); save(); };
    try{ navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ ta.focus(); ta.select(); msg('Select the code and copy it.'); }); }catch(e){ ta.focus(); ta.select(); msg('Select the code and copy it.'); } };
  if($('#kFile')) $('#kFile').onclick=()=>{ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([saveCode()],{type:'text/plain'})); const d=new Date(); a.download=`manu-tere-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.txt`; document.body.appendChild(a); a.click(); a.remove(); S.lastBackup=Date.now(); save(); msg('Saved to your downloads.'); }catch(e){ msg('Your browser could not save a file. Copy the code instead.'); } };
  const restore=txt=>{ const o=readCode(txt), e=$('#kErr'); if(!o){ e.className='small fb bad'; e.textContent='That is not a Manu Tere backup code. It starts with MANUTERE1:'; return; }
    applySave(o); closeSheet(); if(!$('#full').hidden) closeFull(); sfx('stamp'); toast(`Welcome back, <b>${esc(S.name)}</b>! ${S.visited.length} island${S.visited.length===1?'':'s'}, ${S.words.length} words.`); };
  $('#kLoad').onclick=()=>restore($('#kIn').value);
  if($('#kPick')) $('#kPick').onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>restore(r.result); r.readAsText(f); }; }
/* a gentle reminder to back up, at most once a day, after real progress */
function backupNudge(){ const n=Object.keys(S.done).length+Object.keys(S.crafts||{}).length; if(n<2) return; const last=S.lastBackup||0, nudged=S.nudgedAt||0;
  if(Date.now()-last>3*864e5 && Date.now()-nudged>864e5){ S.nudgedAt=Date.now(); save(); setTimeout(()=>toast('Keep your voyage safe: <b>My manu › Save and restore</b>',4200),1500); } }

/* a Queen pineapple plant: a rosette of long, stiff, spiny leaves; the fruit sits on a short stalk in the middle, with its own crown */
function pinePlant(st){ let s='';
  const leaf=(a,len,c)=>`<path d="M0 0 Q${(len*.18).toFixed(1)} ${(-len*.55).toFixed(1)} ${(len*.08).toFixed(1)} ${(-len).toFixed(1)} Q${(-len*.02).toFixed(1)} ${(-len*.55).toFixed(1)} -3 0Z" fill="${c}" transform="rotate(${a})"/>`;
  const back=[-78,-58,-38,-18,0,18,38,58,78], front=[-66,-44,-24,26,46,68];
  back.forEach((a,i)=>{ s+=leaf(a,34+(i%3)*5,i%2?'#4F7F5A':'#5F8F64'); });
  if(st>=1){ const fy=st===1?-24:-30, ry=st===1?7:13, rx=st===1?6:10;
    s+=`<path d="M-1.6 -4 L-1.6 ${fy+ry-2} M1.6 -4 L1.6 ${fy+ry-2}" stroke="#6E8F3A" stroke-width="2.6"/>`;
    const fill=st===1?'#C8526A':st===2?'url(#pfG)':st===3?'url(#pfT)':st===4?'url(#pfR)':'url(#pfO)';
    s+=`<ellipse cx="0" cy="${fy}" rx="${rx}" ry="${ry}" fill="${fill}" stroke="${st===5?'#5A2E14':'#5E7A2E'}" stroke-width=".8"/>`;
    if(st===1){ [[-3,-26],[3,-24],[0,-20],[-2,-29],[2.6,-29.5]].forEach(q=>{ s+=`<circle cx="${q[0]}" cy="${q[1]}" r="1.5" fill="#B48ADB"/>`; }); }
    else { for(let r=-2;r<=2;r++) for(let c=-1;c<=1;c++){ const x=c*5+(r%2?2.5:0), y=fy+r*4.6; if(Math.abs(x)<rx-2) s+=`<path d="M${(x-2.2).toFixed(1)} ${y.toFixed(1)} L${x.toFixed(1)} ${(y-2).toFixed(1)} L${(x+2.2).toFixed(1)} ${y.toFixed(1)} L${x.toFixed(1)} ${(y+2).toFixed(1)}Z" fill="none" stroke="${st===2?'#4E7A2E':'#9A6A22'}" stroke-width=".7" opacity=".85"/>`; }
      if(st===5) s+=`<circle cx="-4" cy="${fy+4}" r="2.6" fill="#4A2412" opacity=".7"/><circle cx="3" cy="${fy-3}" r="2" fill="#4A2412" opacity=".7"/>`;
      const cy=fy-ry; [-40,-20,0,20,40].forEach((a,i)=>{ s+=`<path d="M0 0 Q2 -6 0.6 -12 Q-1 -6 -2 0Z" fill="${st===5?'#7A6A3A':'#5E8F4A'}" transform="translate(0 ${cy+1}) rotate(${a}) scale(${i===2?1.1:.85})"/>`; }); } }
  front.forEach((a,i)=>{ s+=leaf(a,24+(i%2)*6,i%2?'#6E9E72':'#5A8A60'); });
  s+=[-70,70,-48,48].map(a=>`<path d="M0 0 L0 -26" stroke="#A33A3A" stroke-width=".6" opacity=".35" transform="rotate(${a})"/>`).join('');
  return s; }

/* ===== Te toʻa: the coral nursery ===== */
function acropora(c,tip){ let s=''; const br=(x,y,a,l,w,d)=>{ const x2=x+Math.sin(a)*l, y2=y-Math.cos(a)*l; s+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`; if(d>0){ br(x2,y2,a-.45,l*.72,w*.78,d-1); br(x2,y2,a+.5,l*.68,w*.78,d-1); } else s+=`<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="${(w*.55).toFixed(1)}" fill="${tip}"/>`; }; br(0,0,-.15,11,4.2,2); br(0,0,.5,9,3.6,1); return s; }
function pocillopora(c,dot){ let s=''; [[-8,-6,6],[0,-10,7],[8,-5,6],[-4,-15,5.5],[5,-16,5.5],[-11,-12,4.6],[11,-12,4.6],[0,-21,5]].forEach(q=>{ s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${q[2]}" fill="${c}"/>`; }); [[-8,-7],[1,-11],[7,-6],[-4,-16],[5,-17],[0,-22],[-10,-13],[10,-13]].forEach(q=>{ s+=`<circle cx="${q[0]}" cy="${q[1]}" r="1" fill="${dot}"/>`; }); return s; }
function coralKind(k,sc){ return `<g transform="scale(${sc})">${k===0?acropora('#C58AC2','#F4E1F2'):k===1?pocillopora('#E98C9C','#B4566A'):acropora('#E0A66A','#FFF1D8')}</g>`; }

    if(step===1) tapBind('#cnAlg .tapg',g=>{ const i=+g.dataset.a; if(!alg[i]) return; alg[i]=false; sfx('tap'); fx(ALG[i][0],ALG[i][1]-14,'Clean!'); drawAlg(); const n=alg.filter(Boolean).length; $('#cnN').textContent=`${ALG.length-n} of ${ALG.length} cleaned`; if(!n) later(()=>startStep(2),600); }); };

    if(step===3) tapBind('#cnOut .tapg',g=>{ const i=+g.dataset.r; if(sel===null){ $('#cnCard .small').innerHTML='<b>3. Plant on the reef.</b> First tap a big coral on the top ropes, then a bare rock.'; sfx('bad'); return; } const gr=grown[sel]; gr.gone=true; reefSpots[i].k=gr.k; sel=null; out++; sfx('good'); fx(reefSpots[i][0],reefSpots[i][1]-36,'Planted!'); addFish(); drawGrown(); drawOut();
      card(`<p class="small"><b>3. Plant on the reef.</b> Tap a big coral on the top ropes, then a bare rock on the reef.</p><span class="small muted">${out} of 4 planted</span>`);

  const fx=(x,y,t)=>{ const id='c'+Math.random().toString(36).slice(2); $('#cnFx').insertAdjacentHTML('beforeend',`<text id="${id}" x="${x}" y="${y}" text-anchor="middle" font-family="Fredoka,Nunito,sans-serif" font-weight="600" font-size="11" fill="#FFFFFF">${t}</text>`); later(()=>{ const e=document.getElementById(id); if(e) e.remove(); },800); };

  const queue=shuffle([].concat(...KINDS.map(K=>Array(K.w).fill(K.k)))); let qi=0, ok=0, phase='sort', bottles=0, fill=0, holding=false, x=-30, cur=null;

      <rect width="360" height="240" fill="#E9EEF0"/><rect y="0" width="360" height="26" fill="#C9D4D9"/>${[40,130,220,310].map(x=>`<rect x="${x}" y="40" width="44" height="34" rx="4" fill="#BFE3F0" stroke="#9FB2BB"/><path d="M${x+22} 40 v34 M${x} 57 h44" stroke="#9FB2BB"/>`).join('')}
      <path d="M126 46 L126 24" stroke="#9FB2BB" stroke-width="3"/>

  const bird=$('#faBird'), fb=$('#faFb');

/* Hina and the eel, told by the guides of Lake Vaihiria, Tahiti's only natural lake */
function eelSVG(x,y,len,phase,id){ const N=36, pts=[]; for(let i=0;i<=N;i++){ const t=i/N, px=x+t*len, py=y+Math.sin(t*Math.PI*2.2+phase)*len*.06*(.4+t), w=(1-t)*len*.055+1.2; pts.push([px,py,w]); }
  const up=[], dn=[]; for(let i=0;i<=N;i++){ const p=pts[i], q=pts[Math.min(N,i+1)], r=pts[Math.max(0,i-1)]; const dx=q[0]-r[0], dy=q[1]-r[1], L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L; up.push([p[0]+nx*p[2],p[1]+ny*p[2]]); dn.push([p[0]-nx*p[2],p[1]-ny*p[2]]); }
  const body='M'+up.map(p=>p.map(v=>v.toFixed(1)).join(' ')).join(' L')+' L'+dn.reverse().map(p=>p.map(v=>v.toFixed(1)).join(' ')).join(' L')+'Z';
  const fin=k=>{ const s=k>0?up:dn.slice().reverse(); let d=''; for(let i=Math.round(N*.35);i<=N;i++){ const p=s[i], m=pts[i]; const ex=p[0]+(p[0]-m[0])*.55, ey=p[1]+(p[1]-m[1])*.55; d+=(d?' L':'M')+ex.toFixed(1)+' '+ey.toFixed(1); } return d; };
  const h=pts[0], h2=pts[3];
  return `<g><defs><linearGradient id="${id}-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4524"/><stop offset=".6" stop-color="#6E6A36"/><stop offset="1" stop-color="#C9C08A"/></linearGradient><clipPath id="${id}-c"><path d="${body}"/></clipPath></defs>
    <path d="${fin(1)}" fill="none" stroke="#8C8550" stroke-width="2.4" stroke-linejoin="round" opacity=".7"/><path d="${fin(-1)}" fill="none" stroke="#A9A26A" stroke-width="2" stroke-linejoin="round" opacity=".6"/>
    <path d="${body}" fill="url(#${id}-g)" stroke="#2E2A14" stroke-width=".8"/>
    <g clip-path="url(#${id}-c)" fill="#2E2A14" opacity=".45">${pts.filter((_,i)=>i%2===1&&i<N-2).map((p,i)=>`<ellipse cx="${(p[0]+(i%3-1)*2).toFixed(1)}" cy="${(p[1]-p[2]*.35).toFixed(1)}" rx="${(p[2]*.7).toFixed(1)}" ry="${(p[2]*.4).toFixed(1)}"/>`).join('')}</g>
    <ellipse cx="${(h2[0]+2).toFixed(1)}" cy="${(h2[1]+h2[2]*.5).toFixed(1)}" rx="${(h2[2]*.9).toFixed(1)}" ry="${(h2[2]*.45).toFixed(1)}" fill="#8C8550" transform="rotate(25 ${h2[0].toFixed(1)} ${h2[1].toFixed(1)})"/>
    <circle cx="${(h[0]+h[2]*.9).toFixed(1)}" cy="${(h[1]-h[2]*.35).toFixed(1)}" r="${(h[2]*.32).toFixed(1)}" fill="#F2E6B0"/><circle cx="${(h[0]+h[2]*.95).toFixed(1)}" cy="${(h[1]-h[2]*.35).toFixed(1)}" r="${(h[2]*.17).toFixed(1)}" fill="#10303B"/>
    <path d="M${(h[0]-h[2]*.2).toFixed(1)} ${(h[1]+h[2]*.25).toFixed(1)} q${(h[2]*.6).toFixed(1)} ${(h[2]*.25).toFixed(1)} ${(h[2]*1.1).toFixed(1)} 0" stroke="#2E2A14" stroke-width=".8" fill="none"/></g>`; }

  const hina=`<g transform="translate(306 150) scale(1.35)"><path d="M-9 40 L-7 12 Q0 8 7 12 L9 40Z" fill="#D7263D"/>${[[-3,20],[3,28],[-2,34],[4,16]].map(q=>`<g transform="translate(${q[0]} ${q[1]})">${[0,72,144,216,288].map(a=>`<circle cx="${(1.4*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(1.4*Math.sin(a*Math.PI/180)).toFixed(1)}" r="1.1" fill="#FFF6E3"/>`).join('')}</g>`).join('')}<path d="M-7 12 Q-7 2 0 1 Q7 2 7 12Z" fill="#9A6440"/><path d="M-7 4 Q-11 14 -9 24" stroke="#9A6440" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M7 4 Q11 14 9 24" stroke="#9A6440" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="0" cy="-5" r="5.4" fill="#9A6440"/><path d="M-5.6 -7 Q0 -13 5.6 -7 L5 10 Q0 13 -5 10Z" fill="#1E1A16"/><g transform="translate(4 -9)">${[0,60,120,180,240,300].map(a=>`<ellipse cx="0" cy="-2.2" rx="1.2" ry="2.4" transform="rotate(${a})" fill="#FFFDF5"/>`).join('')}<circle r=".9" fill="#F2C94C"/></g></g>`;

  const scene = p===0 ? eelSVG(120,156,150,.4,'vhE')+`<path d="M110 166 h70 M150 172 h80" stroke="#BFE8EA" stroke-width="1" opacity=".6"/>` : p===1 ? eelSVG(210,168,90,1.6,'vhE2').replace('<g>','<g opacity=".35">')+basket : palm;
  return `<svg viewBox="0 0 360 200" role="img" aria-label="Lake Vaihiria, in the mountains of Tahiti"><defs>${vgrad('vhS','#A9D6EA','#E6F2EC',0,120)}${vgrad('vhL','#3E8A88','#1E5A66',120,200)}</defs><rect width="360" height="200" fill="url(#vhS)"/>${ridges}${lake}${scene}${shore}${p===0?hina:''}<text x="352" y="14" text-anchor="end" font-family="Nunito,sans-serif" font-weight="700" font-size="8" fill="#2E5A45" letter-spacing="1">LAKE VAIHIRIA · TAHITI</text></svg>`; }

LEGENDS.hina.pages=['High in the mountains of Tahiti lies Lake Vaihiria, the island’s only natural lake. Guides there tell this story. Long ago, Hina was promised to the Prince of Eels, ruler of the fresh waters. She did not want him, and ran to Hiro for help.',
  'Hiro caught the great eel and cut off its head. He wrapped it in leaves in a woven basket and told Hina: “Do not put the basket on the ground until you are home.” But the day was hot. Hina set the basket down by the water and went to bathe.',
  'When she came back, the head had become a tall tree with long leaves like hair: the first coconut palm. Look at a coconut: its three dark spots are the eel’s two eyes and mouth. Years later, in a dry season, Hina drank from a coconut, and so she kissed the eel after all.'];
LEGENDS.hina.src='A Tahitian telling recorded in Arue (USC Digital Folklore Archives); guides at Lake Vaihiria tell the legend of Hina and the coconut. Many versions are told across Polynesia.';

    {id:'vaihiria', at:[214,256], t:'Lake Vaihiria', html:`<p>Tahiti’s only natural lake lies deep in the mountains of the south coast (Teva i Uta). Long ago part of the island collapsed, and blocks of volcanic rock dammed the valley over about 800 m.</p><ul class="facts small"><li>Sharp green ridges and little waterfalls surround it; it is one of the wettest places on the island.</li><li>The track is best done with a guided 4×4 or quad tour. Clouds often gather in the afternoon, so go early.</li><li>Guides here tell the legend of Hina and the coconut.</li></ul>`}]
};

    <path d="M236 540 L272 600" stroke="#5A3A1E" stroke-width="4" stroke-linecap="round"/><ellipse cx="268" cy="594" rx="5" ry="12" transform="rotate(-30 268 594)" fill="#7A5230"/>
    <g transform="translate(206 482) scale(.36)">${birdSVG(S,'pv2').replace(/^<svg[^>]*>/,'').replace(/<\/svg>\s*$/,'')}</g>`; }

function startVoyage(from,to){
  const leg=LEG[from+'>'+to], G=GUIDE[leg.guide], night=G.night, rand=seeded(from.length*97+to.length*13+7), far=leg.km>=100;
  const PATH=night?STARPATH[leg.guide]:null; let si=0;
  const PX=6, HZ=300;
  let stars=''; if(night){ for(let i=0;i<260;i++){ const x=-620+rand()*1600, y=10+rand()*280, r=.5+rand()*1.3; stars+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="#FFF6E3" opacity="${(.3+rand()*.6).toFixed(2)}"/>`; }
    stars+='<path d="M-500 40 Q100 200 900 60" stroke="#A9C1F0" stroke-opacity=".08" stroke-width="70" fill="none"/>'; }
  const sun=`<g transform="translate(180 ${HZ})"><circle r="60" fill="#FFE3A8" opacity=".35"/><circle r="30" fill="${leg.guide.includes('set')?'#FFB25C':'#FFD27A'}"/></g>`;
  const skyCols = night ? ['#081430','#22406A'] : leg.guide.includes('set') ? ['#4C78B5','#F7A86A'] : ['#6C8FC6','#FBC48F'];
  const seaCols = night ? ['#123A5E','#06182A'] : ['#2A7FA0','#0E4C6B'];
  const isle=`<g id="vIsle" transform="translate(180 ${HZ}) scale(0)" fill="${night?'#0B1A2C':'#3F6E62'}">${voyIsland(to)}</g>`;
  const svg=`<svg viewBox="0 0 360 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${vgrad('vSkyG',skyCols[0],skyCols[1],0,HZ)}${vgrad('vSeaG',seaCols[0],seaCols[1],HZ,560)}${vgrad('vDawn','#6E8FC6','#F6B47A',0,HZ)}</defs>
    <rect x="-400" y="-200" width="1160" height="${HZ+200}" fill="url(#vSkyG)"/><rect id="vDawnR" x="-400" y="-200" width="1160" height="${HZ+200}" fill="url(#vDawn)" opacity="0"/>
    <g id="vSky"><g id="vStars">${stars}</g>${night?'':cloudsV()}<g id="vGuide">${night?'':sun}</g><g id="vCand"></g><text id="vLabel" x="180" y="${night?226:226}" text-anchor="middle" font-family="Fredoka,Nunito,sans-serif" font-weight="600" font-size="14" fill="#FFE7B8"></text><g id="vCloud" opacity="0"></g><ellipse id="vLoom" cx="180" cy="${HZ-6}" rx="60" ry="14" fill="#BFF4EE" opacity="0"/>${isle}</g>
    <rect x="-400" y="${HZ}" width="1160" height="400" fill="url(#vSeaG)"/>
    <g id="vSwell" stroke="#ffffff" fill="none" stroke-linecap="round"></g><g id="vBirds"></g>
    <g id="vBoat">${pahiSVG()}</g>
    <g id="vSight" transform="translate(180 ${night?308:316})"><path d="M-9 8 L0 -4 L9 8" fill="none" stroke="#FFD08A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  </svg>`;
  const first=PATH?PATH.stars[0]:null;
  openFull(`<div class="fhead"><div><div class="eyebrow">Voyage · ${ISL[from].en} to ${ISL[to].en}</div><h2>Sail by <span class="reo" id="vTitle">${first?first.r:G.r}</span></h2></div>${XBTN}</div>
    <div class="vy" id="vy">${svg}<div class="hud"><div class="card"><p class="small" id="vHow">${G.how}${night?' A star is only useful near the horizon: watch it.':''}</p><div class="vbar"><i id="vProg"></i></div><p class="small muted" id="vKm">${leg.km} km to go</p></div><div class="card" id="vTip" hidden><p class="small"></p></div></div><div class="result" id="vRes" hidden></div></div>
    <div class="vctl"><button class="btn primary" id="vL" aria-label="Steer left">◀ Left</button><div class="vstat" id="vStat" aria-live="polite">Ready</div><button class="btn primary" id="vR" aria-label="Steer right">Right ▶</button></div>
    <div class="row" style="padding:0 16px 12px;justify-content:center"><button class="btn sm ghost" id="vAuto">Let the manu steer</button></div>`);
  learn([G.word,'moana','pahi'],true);
  const sky=$('#vSky'), boat=$('#vBoat'), sight=$('#vSight'), prog=$('#vProg'), km=$('#vKm'), stat=$('#vStat'), swell=$('#vSwell'), isleEl=$('#vIsle'), lab=$('#vLabel'), guideEl=$('#vGuide'), cand=$('#vCand'), tip=$('#vTip'), sail=$('#pSail');
  const V={h:rnd(-24,24)||12, p:0, t:0, hold:0, auto:false, imp:0, nextSwell:rnd(4,7), phase:0, done:false, drag:null, mode:'sail', shown:{}};
  const showTip=(html,ms)=>{ tip.hidden=false; tip.querySelector('p').innerHTML=html; clearTimeout(showTip.t); if(ms) showTip.t=setTimeout(()=>{ tip.hidden=true; },ms); };
  if(PATH){ lab.textContent=first.r; learn(first.word,true); later(()=>lab.setAttribute('opacity','.5'),6000); } else { lab.textContent=G.r; later(()=>lab.setAttribute('opacity','.45'),6000); }
  const hold=(btn,dir)=>{ const on=e=>{ e.preventDefault(); ac(); V.hold=dir; btn.classList.add('held'); }; const off=()=>{ if(V.hold===dir) V.hold=0; btn.classList.remove('held'); }; btn.addEventListener('pointerdown',on); btn.addEventListener('pointerup',off); btn.addEventListener('pointerleave',off); btn.addEventListener('pointercancel',off); };
  hold($('#vL'),-1); hold($('#vR'),1);
  const vy=$('#vy');
  vy.addEventListener('pointerdown',e=>{ if(e.target.closest('[data-c]')) return; V.drag=e.clientX; });
  vy.addEventListener('pointermove',e=>{ if(V.drag==null) return; const dx=e.clientX-V.drag; V.drag=e.clientX; V.h+=dx*.12; });
  const endDrag=()=>{ V.drag=null; }; vy.addEventListener('pointerup',endDrag); vy.addEventListener('pointercancel',endDrag);
  const key=e=>{ if(e.key==='ArrowLeft'){ V.hold=-1; e.preventDefault(); } else if(e.key==='ArrowRight'){ V.hold=1; e.preventDefault(); } };
  const keyUp=e=>{ if(e.key==='ArrowLeft'||e.key==='ArrowRight') V.hold=0; };
  document.addEventListener('keydown',key); document.addEventListener('keyup',keyUp); RUN.stops.push(()=>{ document.removeEventListener('keydown',key); document.removeEventListener('keyup',keyUp); });
  $('#vAuto').onclick=()=>{ V.auto=!V.auto; $('#vAuto').textContent=V.auto?'I’ll steer myself':'Let the manu steer'; };
  /* the star path: choose the next star */
  const SWITCH=.42;
  const offerNext=()=>{ V.mode='choose'; const S2=PATH.stars[1], setting=PATH.dir==='set';
    const y=setting?232:282, slots=shuffle([-96,0,104]);
    cand.innerHTML=slots.map((dx,i)=>{ const ok=dx===0, x=180+dx, yy=y+(i%2?10:-8)*(ok?0:1); return `<g data-c="${ok?1:0}" style="cursor:pointer"><circle cx="${x}" cy="${yy}" r="30" fill="#FFFFFF" fill-opacity=".05" stroke="#FFD08A" stroke-opacity=".6" stroke-dasharray="4 4"/>${ok?S2.draw(x,yy):DECOY[i%2](x,yy)}</g>`; }).join('');
    showTip(setting?`<b>${PATH.stars[0].r}</b> has set. A navigator now takes the next star that sets <b>at the same point</b> on the horizon. Tap it.`:`<b>${PATH.stars[0].r}</b> has climbed too high to steer by. Take the next star that rises <b>at the same point</b> on the horizon. Tap it.`);
    stat.textContent='Choose a star';
    $$('#vCand [data-c]').forEach(g=>g.addEventListener('pointerdown',e=>{ e.stopPropagation(); e.preventDefault(); ac();
      if(g.dataset.c==='1'){ sfx('good'); si=1; cand.innerHTML=''; V.mode='sail'; lab.textContent=S2.r; lab.setAttribute('opacity','1'); $('#vTitle').textContent=S2.r; learn(S2.word,true); showTip(`<b>${S2.r}</b>, ${S2.en}, ${setting?'sets':'rises'} where ${PATH.stars[0].r} did. Follow it now. Navigators learned the rising and setting points of more than 200 stars.`,6500); later(()=>lab.setAttribute('opacity','.5'),5000); }
      else { sfx('bad'); showTip(`That star ${setting?'sets':'rises'} far ${Math.random()<.5?'north':'south'} of our course: we would miss the island. Look for the one at the same point as ${PATH.stars[0].r}.`); } })); };
  frames(dt=>{ if(V.done) return false; V.t+=dt;
    const drift=(6*Math.sin(V.t*.55)+4*Math.sin(V.t*1.31+1.2));
    V.nextSwell-=dt; if(V.nextSwell<=0){ V.imp=(Math.random()<.5?-1:1)*rnd(16,24); V.nextSwell=rnd(4,7); }
    V.imp*=Math.pow(.25,dt);
    let steer=V.hold*34; if(V.auto) steer=clamp(-V.h*3,-34,34);
    V.h=clamp(V.h+(drift+V.imp+steer)*dt,-70,70);
    const on=Math.abs(V.h)<7;
    if(on && V.mode==='sail') V.p=Math.min(1,V.p+dt/(V.auto?(night?13:10):(night?18:15)));
    if(PATH && si===0 && V.p>=SWITCH && V.mode==='sail') offerNext();
    sky.setAttribute('transform',`translate(${(-V.h*PX).toFixed(1)} 0)`);
    /* guide star motion */
    if(PATH){ const setting=PATH.dir==='set'; let y; if(si===0){ const k=Math.min(1,V.p/SWITCH); y=setting?250+k*56:294-k*100; } else { const k=(V.p-SWITCH)/(1-SWITCH); y=setting?232+k*40:282-k*60; }
      const S0=PATH.stars[si]; guideEl.innerHTML= V.mode==='choose'?'' : S0.draw(180,y); lab.setAttribute('y',(y-26).toFixed(1));
      if(V.mode==='choose') lab.textContent=''; else lab.textContent=S0.r; }
    /* dawn, stars fade */
    if(night){ const d=clamp((V.p-.72)/.22,0,1); $('#vDawnR').setAttribute('opacity',d.toFixed(2)); $('#vStars').setAttribute('opacity',(1-d*.9).toFixed(2)); guideEl.setAttribute('opacity',(1-d*.8).toFixed(2)); }
    /* signs of land on long crossings */
    if(far){ if(V.p>=.6 && !V.shown.cloud){ V.shown.cloud=1; $('#vCloud').innerHTML=`<g transform="translate(180 ${HZ-18})" fill="${night?'#C9D3E6':'#FFFFFF'}"><ellipse rx="44" ry="12"/><ellipse cx="-18" cy="-12" rx="22" ry="14"/><ellipse cx="10" cy="-20" rx="26" ry="18"/><ellipse cx="22" cy="-8" rx="20" ry="12"/></g>`; showTip('A cloud stays piled up at one point on the horizon while others drift past: clouds gather over high islands. Land is under it.',6500); }
      if(V.shown.cloud) $('#vCloud').setAttribute('opacity',Math.min(.85,(V.p-.6)*6).toFixed(2));
      if(V.p>=.76 && !V.shown.birds){ V.shown.birds=1; showTip('Birds! At dawn, noddy terns fly out from land to fish, and at dusk they fly home. They rarely go more than about 40 miles (65 km) from land: sail toward where they come from.',7000); }
      if(V.shown.birds){ let b=''; for(let i=0;i<6;i++){ const ph=(V.t*.25+i/6)%1, x=180+(i-2.5)*14+(1-ph)*0-V.h*PX*.5*(ph), y=HZ-30+ph*190, s=.4+ph*1.4, w=Math.sin(V.t*10+i)*4*s; b+=`<path d="M${(x-8*s).toFixed(1)} ${(y+w).toFixed(1)} Q${(x-3*s).toFixed(1)} ${(y-4*s).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)} Q${(x+3*s).toFixed(1)} ${(y-4*s).toFixed(1)} ${(x+8*s).toFixed(1)} ${(y+w).toFixed(1)}" stroke="#1E1A16" stroke-width="${(1.4*s).toFixed(2)}" fill="none" stroke-linecap="round" opacity="${(.4+ph*.6).toFixed(2)}"/>`; } $('#vBirds').innerHTML=b; }
      if(V.p>=.88 && !V.shown.loom){ V.shown.loom=1; showTip('A pale green glow above the horizon: sunlight reflected by a lagoon. Land ho is near!',5000); }
      if(V.shown.loom) $('#vLoom').setAttribute('opacity',Math.min(.5,(V.p-.88)*5).toFixed(2)); }
    const roll=(V.imp*.25+Math.sin(V.t*1.7)*2.2).toFixed(2);
    boat.setAttribute('transform',`rotate(${roll} 180 520) translate(0 ${(Math.sin(V.t*1.7)*3).toFixed(1)})`);
    if(sail) sail.style.transform=`scale(${(1+Math.sin(V.t*1.3)*.025+(on?.03:0)).toFixed(3)},1)`;
    sight.querySelector('path').setAttribute('stroke',on?'#FFD08A':'#FFFFFF'); sight.querySelector('path').setAttribute('opacity',on?'1':'.6');
    V.phase=(V.phase+dt*.28)%1; let sw=''; for(let i=0;i<9;i++){ const f=(i+V.phase)/9, y=HZ+4+256*f*f, w=40+700*f*f, x0=180-w/2-V.h*PX*f*.6; sw+=`<path d="M${x0.toFixed(1)} ${y.toFixed(1)} q${(w/4).toFixed(1)} ${(-3-6*f).toFixed(1)} ${(w/2).toFixed(1)} 0 t${(w/2).toFixed(1)} 0" stroke-width="${(.6+2.4*f).toFixed(2)}" opacity="${(.08+.22*f).toFixed(2)}"/>`; } swell.innerHTML=sw;
    const sc = far ? (V.p<.86?0:(V.p-.86)/.14*1.1) : .35+V.p*.9; isleEl.setAttribute('transform',`translate(180 ${HZ}) scale(${sc.toFixed(3)})`);
    prog.style.width=(V.p*100).toFixed(1)+'%'; km.textContent=V.p>=1?'Land ho!':`${Math.max(1,Math.round(leg.km*(1-V.p)))} km to go`;
    if(V.mode==='sail') stat.textContent = on ? 'On course' : (V.h>0 ? '◀ Steer left' : 'Steer right ▶');
    if(V.p>=1){ V.done=true; arrive(from,to,leg,PATH?{r:PATH.stars.slice(0,si+1).map(x=>x.r).join(' then '),word:PATH.stars[si].word,night:true}:G); return false; }
  }); }

function honk(){ if(!S.sound) return; const a=ac(); if(!a) return; const t=a.currentTime+.01;
  [0,.32].forEach(d=>{ const o=a.createOscillator(), o2=a.createOscillator(), g=a.createGain(); o.type='square'; o2.type='square'; o.frequency.value=392; o2.frequency.value=494; g.gain.setValueAtTime(0,t+d); g.gain.linearRampToValueAtTime(.06,t+d+.02); g.gain.setValueAtTime(.06,t+d+.2); g.gain.linearRampToValueAtTime(0,t+d+.26); o.connect(g); o2.connect(g); g.connect(a.destination); o.start(t+d); o2.start(t+d); o.stop(t+d+.3); o2.stop(t+d+.3); }); }
function bell(){ if(!S.sound) return; const a=ac(); if(!a) return; const t=a.currentTime+.01;
  [0,.28].forEach(d=>{ const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.value=1318; g.gain.setValueAtTime(.12,t+d); g.gain.exponentialRampToValueAtTime(.001,t+d+.6); o.connect(g); g.connect(a.destination); o.start(t+d); o.stop(t+d+.62); }); }

const TRUCK_INFO=`<p>For most of the 20th century, <b>le truck</b> was how Tahiti got around. Its Reo name is <b>pereʻoʻo mataʻeinaʻa</b>, “the district car”. It was a bare lorry chassis with a long wooden cabin built on the back, painted in bright colours, and often given a name.</p>
<ul class="facts small">
  <li><b>How it began:</b> soon after the First World War, the Jamet brothers of Taravao started a service to Papeete with a Dodge truck.</li>
  <li><b>Inside:</b> padded benches ran down each side, sometimes with one more in the middle, so passengers sat facing each other. Plexiglass windows slid shut on rainy days, and trucks had 15, 22 or up to 47 seats.</li>
  <li><b>No fixed stops:</b> outside Papeete, you raised your arm at the roadside, and some families left big leaves outside their house to ask for a ride. To get off, you rang a bell to the driver.</li>
  <li><b>To market:</b> the roof was piled with fruit, taro, fish and chickens for the Papeete market, and even canoes for the July festivals. Music played and people sang on the way.</li>
  <li><b>Today:</b> about 300 trucks ran in 1976. Since the late 2010s they have been replaced on Tahiti by buses, which are safer; the Tere Tahiti network includes some electric buses. Trucks still carry children to school on some outer islands.</li>
  <li><b>Ride one:</b> each January, the festive <b>Tere Faʻaʻati</b> tour goes round Tahiti in decorated trucks, with ukuleles and songs. Ask the Papeete tourist office for dates and booking.</li>
</ul>
<div class="row" style="gap:8px;margin-top:10px"><button class="btn" id="tkBell">Ring the bell 🔔</button></div>
<p class="small" id="tkFb" aria-live="polite" style="min-height:1.2em"></p>`;

@keyframes wfRip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.8);opacity:0}}

@keyframes wfMist{0%{transform:translateY(0) scale(.5);opacity:0}25%{opacity:.7}100%{transform:translateY(-18px) scale(1.7);opacity:0}}
.truck{position:absolute;left:0;padding:0;border:0;background:none;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;animation:tkDrive 32s linear infinite;will-change:transform}

.tk-note{opacity:0;animation:tkNote 2.6s ease-out infinite}
@keyframes tkNote{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(4px,-14px);opacity:0}}
@keyframes tkDrive{0%{transform:translateX(var(--a))}78%{transform:translateX(var(--b))}100%{transform:translateX(var(--b))}}

/* the truck lives in the pins layer so it can be tapped */
const _renderPins18=renderPins;
renderPins=function(){ _renderPins18(); if(S.island!=='tahiti') return; const g=geom(), box=$('#pins');
  const w=Math.round(76*g.s), h=Math.round(w*60/130); const t=document.createElement('button'); t.className='truck'; t.id='truckBtn'; t.setAttribute('aria-label','Le truck, tap for its story');
  t.innerHTML=truckSVG(); t.style.width=w+'px'; t.style.height=h+'px'; t.style.top=(g.vy(433)-h)+'px';
  t.style.setProperty('--a',(-w-20)+'px'); t.style.setProperty('--b',(g.W+20)+'px'); t.style.setProperty('--mid',Math.round(g.W*.5-w/2)+'px');
  t.style.animationDelay=(-rnd(0,24)).toFixed(1)+'s'; box.prepend(t);
  t.onclick=()=>{ ac(); t.classList.add('stop'); honk(); learn(['pereoo','mataeinaa']);
    openSheet(`<div class="shead"><div><div class="eyebrow">Tahiti · Pereʻoʻo mataʻeinaʻa</div><h2>Le truck</h2></div>${XBTN}</div>${TRUCK_INFO}`);
    const bb=$('#tkBell'); if(bb) bb.onclick=()=>{ bell(); const f=$('#tkFb'); if(f) f.textContent='Ding ding! The driver pulls over. Māuruuru, thank you, driver!'; };
    const iv=setInterval(()=>{ const sw=$('#sheetwrap'); if(!sw || sw.hidden){ clearInterval(iv); t.classList.remove('stop'); } },400); };
};

const I18N_DATA={"fr":{"<b>E aha te huru?</b>How are you?":"<b>E aha te huru?</b>Comment allez-vous ?","<b>Fēʻī</b> · Oven plantain<br><span>{#1} fēʻī · not enough in your basket</span>":"<b>Fēʻī</b> · Plantain au four<br><span>{#1} fēʻī · pas assez dans votre panier</span>","<b>Fēʻī</b> · Oven plantain<br><span>{#1} fēʻī</span>":"<b>Fēʻī</b> · Plantain au four<br><span>{#1} fēʻī</span>","<b>Haere mai</b>Come here!":"<b>Haere mai</b>Venez ici !","<b>How it began:</b> soon after the First World War, the Jamet brothers of Taravao started a service to Papeete with a Dodge truck.":"<b>Les débuts :</b> peu après la Première Guerre mondiale, les frères Jamet, de Taravao, lancèrent une liaison vers Papeete avec un camion Dodge.","<b>How to say it.</b> Vowels are pure: <i>a</i> as in father, <i>e</i> as in bed, <i>i</i> as in machine, <i>o</i> as in more, <i>u</i> as in moon. The <span>ʻ</span> (ʻeta) is a short catch in the voice, as in “uh-oh”. A line over a vowel (ā) makes it longer.":"<b>Comment le prononcer.</b> Les voyelles sont pures : <i>a</i> comme dans « papa », <i>e</i> comme dans « été », <i>i</i> comme dans « ici », <i>o</i> comme dans « mot », <i>u</i> comme « ou » dans « loup ». Le <span>ʻ</span> (ʻeta) est un petit coup de glotte, comme dans « oh-oh ». Un trait sur une voyelle (ā) l’allonge.","<b>Inside:</b> padded benches ran down each side, sometimes with one more in the middle, so passengers sat facing each other. Plexiglass windows slid shut on rainy days, and trucks had {#1}, {#2} or up to {#3} seats.":"<b>À l’intérieur :</b> des banquettes rembourrées couraient de chaque côté, parfois avec une de plus au milieu, si bien que les passagers étaient assis face à face. Des vitres en plexiglas coulissaient les jours de pluie, et les trucks comptaient {#1}, {#2} ou jusqu’à {#3} places.","<b>Maeva</b>Welcome!":"<b>Maeva</b>Bienvenue !","<b>Matariʻi i raro</b>, the cooler, drier season. The season of abundance returns on {#1} November, in {#2} days.":"<b>Matariʻi i raro</b>, la saison plus fraîche et plus sèche. La saison d’abondance revient le {#1} novembre, dans {#2} jours.","<b>Matariʻi then Pīpiri mā</b> brought us here. Polynesian navigators crossed thousands of kilometres of ocean this way, reading the stars, the swells, the wind and the birds, with no instruments at all.":"<b>Matariʻi puis Pīpiri mā</b> nous ont menés ici. Les navigateurs polynésiens traversaient ainsi des milliers de kilomètres d’océan, en lisant les étoiles, la houle, le vent et les oiseaux, sans aucun instrument.","<b>Matariʻi</b> has set. A navigator now takes the next star that sets <b>at the same point</b> on the horizon. Tap it.":"<b>Matariʻi</b> s’est couchée. Un navigateur prend alors l’étoile suivante qui se couche <b>au même point</b> de l’horizon. Touchez-la.","<b>Moʻorea</b> · {#1}/{#2}":"<b>Moʻorea</b> · {#1}/{#2}","<b>Māuruuru</b>Look at me!":"<b>Māuruuru</b>Regardez-moi !","<b>Māuruuru</b>Thank you!":"<b>Māuruuru</b>Merci !","<b>Nana</b>Bye for now!":"<b>Nana</b>À bientôt !","<b>Nine to ten months later…</b> each pollinated flower has become a long green pod. They are picked when they turn from yellow to brown, then dried for weeks.":"<b>Neuf à dix mois plus tard…</b> chaque fleur pollinisée est devenue une longue gousse verte. On les cueille quand elles passent du jaune au brun, puis on les fait sécher pendant des semaines.","<b>No fixed stops:</b> outside Papeete, you raised your arm at the roadside, and some families left big leaves outside their house to ask for a ride. To get off, you rang a bell to the driver.":"<b>Pas d’arrêts fixes :</b> en dehors de Papeete, on levait le bras au bord de la route, et certaines familles posaient de grandes feuilles devant leur maison pour demander à monter. Pour descendre, on sonnait une cloche pour prévenir le chauffeur.","<b>Painapo</b>Pineapples grow up in the valley.":"<b>Painapo</b>Les ananas poussent dans la vallée.","<b>Porapora</b> · Bora Bora · {#1}/{#2}":"<b>Porapora</b> · Bora Bora · {#1}/{#2}","<b>Poʻe vānira</b> · Plantain poʻe with Tahaʻa vanilla<br><span>{#1} fēʻī + {#2} haʻari + {#3} vānira · not enough in your basket</span>":"<b>Poʻe vānira</b> · Poʻe de plantain à la vanille de Tahaʻa<br><span>{#1} fēʻī + {#2} haʻari + {#3} vānira · pas assez dans votre panier</span>","<b>Poʻe vānira</b> · Plantain poʻe with Tahaʻa vanilla<br><span>{#1} fēʻī + {#2} haʻari + {#3} vānira</span>":"<b>Poʻe vānira</b> · Poʻe de plantain à la vanille de Tahaʻa<br><span>{#1} fēʻī + {#2} haʻari + {#3} vānira</span>","<b>Pīpiri mā</b>, Castor and Pollux, sets where Matariʻi did. Follow it now. Navigators learned the rising and setting points of more than {#1} stars.":"<b>Pīpiri mā</b>, Castor et Pollux, se couche là où Matariʻi s’est couchée. Suivez-la maintenant. Les navigateurs connaissaient les points de lever et de coucher de plus de {#1} étoiles.","<b>Pūpū!</b> A shell for a hei ({#1}).":"<b>Pūpū !</b> Un coquillage pour un hei ({#1}).","<b>Ride one:</b> each January, the festive <b>Tere Faʻaʻati</b> tour goes round Tahiti in decorated trucks, with ukuleles and songs. Ask the Papeete tourist office for dates and booking.":"<b>Montez dans l’un d’eux :</b> chaque janvier, la tournée festive <b>Tere Faʻaʻati</b> fait le tour de Tahiti en trucks décorés, avec ukulélés et chansons. Demandez les dates et les réservations à l’office du tourisme de Papeete.","<b>Sort and massage.</b> When sorting, each pod is massaged between the fingers to spread its seeds and oils evenly. Rub each pod.":"<b>Triez et massez.</b> Pendant le tri, chaque gousse est massée entre les doigts pour bien répartir ses graines et ses huiles. Frottez chaque gousse.","<b>Tahaʻa</b> · {#1}/{#2}":"<b>Tahaʻa</b> · {#1}/{#2}","<b>Tahiti</b> · {#1}/{#2}":"<b>Tahiti</b> · {#1}/{#2}","<b>Taro</b> · Taro with coconut milk<br><span>{#1} taro + {#2} haʻari · not enough in your basket</span>":"<b>Taro</b> · Taro au lait de coco<br><span>{#1} taro + {#2} haʻari · pas assez dans votre panier</span>","<b>Taro</b> · Taro with coconut milk<br><span>{#1} taro + {#2} haʻari</span>":"<b>Taro</b> · Taro au lait de coco<br><span>{#1} taro + {#2} haʻari</span>","<b>Taste it for real:</b> look for poʻe at Papeete market and at family feasts. Tahaʻa vanilla is sold at the plantations on the island.":"<b>Goûtez-y pour de vrai :</b> cherchez du poʻe au marché de Papeete et lors des repas de fête en famille. La vanille de Tahaʻa est vendue dans les plantations de l’île.","<b>Te mahana</b> brought us here. Polynesian navigators crossed thousands of kilometres of ocean this way, reading the stars, the swells, the wind and the birds, with no instruments at all.":"<b>Te mahana</b> nous a menés ici. Les navigateurs polynésiens traversaient ainsi des milliers de kilomètres d’océan, en lisant les étoiles, la houle, le vent et les oiseaux, sans aucun instrument.","<b>To market:</b> the roof was piled with fruit, taro, fish and chickens for the Papeete market, and even canoes for the July festivals. Music played and people sang on the way.":"<b>Au marché :</b> sur le toit s’entassaient fruits, taro, poissons et poulets pour le marché de Papeete, et même des pirogues pour les fêtes de juillet. On jouait de la musique et on chantait en chemin.","<b>Today:</b> about {#1} trucks ran in {#2}. Since the late {#3}s they have been replaced on Tahiti by buses, which are safer; the Tere Tahiti network includes some electric buses. Trucks still carry children to school on some outer islands.":"<b>Aujourd’hui :</b> environ {#1} trucks circulaient en {#2}. Depuis la fin des années {#3}, ils ont été remplacés à Tahiti par des bus, plus sûrs ; le réseau Tere Tahiti compte quelques bus électriques. Sur certaines îles éloignées, des trucks emmènent encore les enfants à l’école.","<b>Waning moon.</b> Plants grow at a normal pace until the next new moon.":"<b>Lune décroissante.</b> Les plantes poussent à un rythme normal jusqu’à la prochaine nouvelle lune.","<b>{#1}. Build the fire.</b> Burning… In real life the stones heat for most of the night, until they glow red.":"<b>{#1}. Faites le feu.</b> Ça brûle… En vrai, les pierres chauffent presque toute la nuit, jusqu’à devenir rouges.","<b>{#1}. Build the fire.</b> The pit is ready. Fill it with wood and dry coconut husks, then light it. The volcanic stones on top store the heat.":"<b>{#1}. Faites le feu.</b> La fosse est prête. Remplissez-la de bois et de bourres de coco sèches, puis allumez. Les pierres volcaniques posées dessus gardent la chaleur.","<b>{#1}. Catch it.</b> A swell is coming. Paddle when it lifts the back of your board: when the hump is just behind your manu.":"<b>{#1}. Attrapez-la.</b> Une houle arrive. Ramez quand elle soulève l’arrière de votre planche : quand la bosse est juste derrière votre manu.","<b>{#1}. Clean the nursery.</b> Algae grow on the ropes and smother young corals. Tap each green clump to brush it off.":"<b>{#1}. Nettoyez la pépinière.</b> Les algues poussent sur les cordes et étouffent les jeunes coraux. Touchez chaque touffe verte pour l’enlever.","<b>{#1}. Close the oven</b> in the right order: banana leaves first, then wet copra sacks, then sand on top to keep the heat in.":"<b>{#1}. Fermez le four</b> dans le bon ordre : d’abord les feuilles de bananier, puis des sacs de coprah mouillés, puis du sable par-dessus pour garder la chaleur.","<b>{#1}. Fill the bottles.</b> Hold the tap and let go when the juice reaches the red line. Not too little, not over!":"<b>{#1}. Remplissez les bouteilles.</b> Maintenez le robinet et relâchez quand le jus atteint la ligne rouge. Ni trop peu, ni trop !","<b>{#1}. Hang new fragments.</b> Pieces broken by storms are saved and tied to the bottom rope. Pick a kind, then tap an empty tie.":"<b>{#1}. Accrochez de nouveaux fragments.</b> Les morceaux cassés par les tempêtes sont récupérés et attachés à la corde du bas. Choisissez une espèce, puis touchez une attache vide.","<b>{#1}. Lay banana leaves</b> on the red-hot stones. They protect the food and make steam.":"<b>{#1}. Posez des feuilles de bananier</b> sur les pierres brûlantes. Elles protègent les aliments et font de la vapeur.","<b>{#1}. Open the oven.</b> Everyone gathers: this is the big moment.":"<b>{#1}. Ouvrez le four.</b> Tout le monde se rassemble : c’est le grand moment.","<b>{#1}. Plant on the reef.</b> Now tap a bare rock on the reef to fix this coral there.":"<b>{#1}. Plantez sur le récif.</b> Touchez maintenant un rocher nu du récif pour y fixer ce corail.","<b>{#1}. Plant on the reef.</b> Tap a big coral on the top ropes, then a bare rock on the reef.":"<b>{#1}. Plantez sur le récif.</b> Touchez un grand corail sur les cordes du haut, puis un rocher nu sur le récif.","<b>{#1}. Plant on the reef.</b> These corals have grown for two to three years. Tap a big coral on the top ropes, then a bare rock on the reef.":"<b>{#1}. Plantez sur le récif.</b> Ces coraux ont poussé pendant deux à trois ans. Touchez un grand corail sur les cordes du haut, puis un rocher nu sur le récif.","<b>{#1}. Put in the food,</b> each parcel wrapped in banana leaves.":"<b>{#1}. Mettez les aliments,</b> chaque paquet enveloppé dans des feuilles de bananier.","<b>{#1}. Ride the pocket.</b> The wave breaks behind you. Hold <b>Pump</b> to speed up, let go to slow down. Stay in the green, close to the curl but not under it.":"<b>{#1}. Surfez dans la poche.</b> La vague déferle derrière vous. Maintenez <b>Pomper</b> pour accélérer, relâchez pour ralentir. Restez dans le vert, près du rouleau mais pas dessous.","<b>{#1}. Sort the fruit.</b> Only golden, firm pineapples go to the press. Green ones go back to the grower, bruised ones to the compost.":"<b>{#1}. Triez les fruits.</b> Seuls les ananas dorés et fermes vont au pressoir. Les verts retournent au producteur, les abîmés au compost.","<b>{#1}. Wait.</b> The food steams slowly for about four hours. Time to swim, talk and play the ukulele.":"<b>{#1}. Attendez.</b> Les aliments cuisent doucement à la vapeur pendant environ quatre heures. Le temps de nager, de discuter et de jouer du ukulélé.","<b>ʻIa ora na, Moʻorea!</b>The sister island":"<b>ʻIa ora na, Moʻorea !</b>L’île sœur","<b>ʻIa ora na, Tahaʻa!</b>The vanilla island":"<b>ʻIa ora na, Tahaʻa !</b>L’île vanille","<b>ʻIa ora na, Tahiti!</b>The big island":"<b>ʻIa ora na, Tahiti !</b>La grande île","<b>ʻUru</b> · Breadfruit from the oven<br><span>{#1} ʻuru · not enough in your basket</span>":"<b>ʻUru</b> · Fruit de l’arbre à pain au four<br><span>{#1} ʻuru · pas assez dans votre panier</span>","<b>ʻUru</b> · Breadfruit from the oven<br><span>{#1} ʻuru</span>":"<b>ʻUru</b> · Fruit de l’arbre à pain au four<br><span>{#1} ʻuru</span>","<b>ʻĀʻai · Legends heard:</b> {#1} of {#2}. · Hina and the eel · Pai and the pierced mountain · ʻOro and the rainbow · Ruataʻata and the ʻuru · Hina in the moon · Faʻuai and Ivi":"<b>ʻĀʻai · Légendes entendues :</b> {#1} sur {#2}. · Hina et l’anguille · Pai et la montagne percée · ʻOro et l’arc-en-ciel · Ruataʻata et le ʻuru · Hina dans la lune · Faʻuai et Ivi","<b>ʻĀʻai · Legends heard:</b> {#1} of {#2}. ✓ Hina and the eel ✓ Pai and the pierced mountain ✓ ʻOro and the rainbow ✓ Ruataʻata and the ʻuru ✓ Hina in the moon · Faʻuai and Ivi":"<b>ʻĀʻai · Légendes entendues :</b> {#1} sur {#2}. ✓ Hina et l’anguille ✓ Pai et la montagne percée ✓ ʻOro et l’arc-en-ciel ✓ Ruataʻata et le ʻuru ✓ Hina dans la lune · Faʻuai et Ivi","<span></span>cream":"<span></span>crème","<span></span>leaf green":"<span></span>vert feuille","<span></span>mati":"<span></span>mati","<span></span>mati red":"<span></span>rouge mati","<span></span>mati · red-brown":"<span></span>mati · brun-rouge","<span></span>rēʻa yellow":"<span></span>jaune rēʻa","<span></span>rēʻa · yellow":"<span></span>rēʻa · jaune","<span></span>tiʻaʻiri":"<span></span>tiʻaʻiri","<span></span>tiʻaʻiri black":"<span></span>noir tiʻaʻiri","<span></span>white":"<span></span>blanc","<span></span>ʻaute violet":"<span></span>violet ʻaute","<span></span>ʻaute · violet":"<span></span>ʻaute · violet","<span>Hei poe</span> · Pearl and shell necklace":"<span>Hei poe</span> · Collier de perles et de coquillages","<span>Maeva i Tahiti!</span> Welcome to Tahiti":"<span>Maeva i Tahiti !</span> Bienvenue à Tahiti","<span>Māuruuru!</span> Well done.":"<span>Māuruuru !</span> Bravo.","<span>Porapora</span> · Bora Bora":"<span>Porapora</span> · Bora Bora","<span>Poʻe vānira</span> · Plantain poʻe with Tahaʻa vanilla":"<span>Poʻe vānira</span> · Poʻe de plantain à la vanille de Tahaʻa","<span>Pāreu</span> · Sun-printed pāreu":"<span>Pāreu</span> · Pāreu imprimé au soleil","<span>Tapa</span> · Beaten bark cloth":"<span>Tapa</span> · Étoffe d’écorce battue","<span>Tāupoʻo</span> · Woven hat":"<span>Tāupoʻo</span> · Chapeau tressé","A Tahitian telling recorded in Arue (USC Digital Folklore Archives); guides at Lake Vaihiria tell the legend of Hina and the coconut. Many versions are told across Polynesia.":"Un récit tahitien recueilli à Arue (USC Digital Folklore Archives) ; les guides du lac Vaihiria racontent la légende de Hina et de la noix de coco. De nombreuses versions circulent dans toute la Polynésie.","A cloud stays piled up at one point on the horizon while others drift past: clouds gather over high islands. Land is under it.":"Un nuage reste amoncelé en un point de l’horizon pendant que les autres passent : les nuages s’accumulent au-dessus des îles hautes. Il y a une terre dessous.","A diamond weave of fara, with a tiare band.":"Un tressage de fara en losanges, avec une bande de tiare.","A fork in the trail. Which way to the other two falls?":"Une bifurcation sur le sentier. Par où aller vers les deux autres cascades ?","A gift from the legend":"Un cadeau de la légende","A great famine struck Raiatea. Ruataʻata, his wife Rumauariʻi and their children had nothing left to eat but mountain ferns.":"Une grande famine frappa Raiatea. Ruataʻata, sa femme Rumauariʻi et leurs enfants n’avaient plus rien à manger que des fougères de montagne.","A hei is a garland for the head or neck, made of flowers or shells. A shell necklace is often given to visitors when they leave, as a sign of protection. Tahitian pearls grow in the black-lipped oyster; their dark greens, blues and greys are natural.":"Un hei est une couronne ou un collier de fleurs ou de coquillages. On offre souvent un collier de coquillages aux visiteurs à leur départ, en signe de protection. Les perles de Tahiti naissent dans l’huître à lèvres noires ; leurs verts, bleus et gris sombres sont naturels.","A legend of Raiatea, as retold by Welcome Tahiti.":"Une légende de Raiatea, racontée par Welcome Tahiti.","A motu picnic with a traditional oven":"Un pique-nique sur un motu avec un four traditionnel","A pale green glow above the horizon: sunlight reflected by a lagoon. Land ho is near!":"Une lueur vert pâle au-dessus de l’horizon : la lumière du soleil reflétée par un lagon. La terre est proche !","A pearl farm, to see grafting and harvest":"Une ferme perlière, pour voir la greffe et la récolte","A pineapple field in the Opunohu valley":"Un champ d’ananas dans la vallée d’Opunohu","A pāreu is one length of cloth, tied in dozens of ways. Some painters make sun prints: leaves laid on wet, freshly painted cloth leave a pale shape once the sun has dried it.":"Un pāreu est une seule pièce de tissu, que l’on noue de dizaines de façons. Certains peintres font des impressions au soleil : des feuilles posées sur le tissu fraîchement peint et encore humide laissent une forme claire une fois que le soleil l’a séché.","A shell on the sand":"Un coquillage sur le sable","A simplified map: the shapes are right, the distances are not, and not all these stars are up on the same night. Names vary between islands and sources.":"Une carte simplifiée : les formes sont justes, les distances non, et toutes ces étoiles ne sont pas visibles la même nuit. Les noms varient selon les îles et les sources.","A starter basket: cotton, turmeric, pandanus and two shells. Enough for a first pāreu and hat!":"Un panier de départ : coton, curcuma, pandanus et deux coquillages. De quoi faire un premier pāreu et un chapeau !","A vanilla plantation tour, with tasting":"Visite d’une plantation de vanille, avec dégustation","About this island":"À propos de cette île","About {#1} hours to go…":"Encore environ {#1} heures…","Across the channel from Tahiti, about {#1} km away.":"De l’autre côté du chenal, à environ {#1} km de Tahiti.","Add coconut husks":"Ajouter des bourres de coco","Add wood":"Ajouter du bois","After Teuira Henry, Ancient Tahiti (Hōkūleʻa archive).":"D’après Teuira Henry, Tahiti aux temps anciens (archives Hōkūleʻa).","After Teuira Henry, Ancient Tahiti. The pearl is a later addition to the story.":"D’après Teuira Henry, Tahiti aux temps anciens. La perle est un ajout plus tardif à l’histoire.","After the Service du Tourisme de Polynésie française (Les {#1} Cascades site). Other versions exist.":"D’après le Service du Tourisme de Polynésie française (site des {#1} Cascades). D’autres versions existent.","Ahimāʻa · the earth oven":"Ahimāʻa · le four enterré","Ahimāʻa<small>The earth oven</small>":"Ahimāʻa<small>Le four enterré</small>","Algae on the nursery":"Algues sur la pépinière","Antares":"Antarès","Arahoho, on the coast road between Papenoo and Tiarei, was once called Anahoho, “the cave that howls”. When the swell is strong, the sea rushes into a cave under the basalt and bursts out of the hole with a roar. The old people heard a song in it: “the sea sings in harmony”. The site has been closed at times for cliff safety work, so check before you go, and always stay behind the barrier.":"Arahoho, sur la route de ceinture entre Papenoo et Tiarei, s’appelait autrefois Anahoho, « la grotte qui hurle ». Quand la houle est forte, la mer s’engouffre dans une grotte sous le basalte et jaillit du trou dans un rugissement. Les anciens y entendaient un chant : « la mer chante en harmonie ». Le site a parfois été fermé pour des travaux de sécurisation de la falaise : renseignez-vous avant d’y aller, et restez toujours derrière la barrière.","Arahoho<small>The blowhole</small>":"Arahoho<small>Le trou du souffleur</small>","As told by Tahiti Tourisme. The mountain’s older name is said to be Mouʻa Tapu, the sacred mountain.":"Selon Tahiti Tourisme. L’ancien nom de la montagne serait Mouʻa Tapu, la montagne sacrée.","At the foot of Mount Rotui, near Cook’s Bay, Moʻorea’s fruit-juice factory makes Rotui juices from local fruit, including the Queen pineapple. It works with more than {#1} local growers. Visit in the morning, when production is at its height, then walk through the pineapple fields.":"Au pied du mont Rotui, près de la baie de Cook, l’usine de jus de fruits de Moʻorea fabrique les jus Rotui à partir de fruits locaux, dont l’ananas Queen. Elle travaille avec plus de {#1} producteurs locaux. Venez le matin, quand la production bat son plein, puis promenez-vous dans les champs d’ananas.","Atolls of white sand and pink coral. Diving at Fakarava, black pearl farms.":"Des atolls de sable blanc et de corail rose. Plongée à Fakarava, fermes de perles noires.","Australs":"Australes","Back":"Retour","Back down the trail":"Redescendre le sentier","Back to Bora Bora":"Retour à Bora Bora","Back to Moʻorea":"Retour à Moʻorea","Back to Tahaʻa":"Retour à Tahaʻa","Back to Tahiti":"Retour à Tahiti","Back to grower":"Retour au producteur","Back to the garden":"Retour au jardin","Banana leaves":"Feuilles de bananier","Bare rock on the reef":"Rocher nu sur le récif","Basket":"Panier","Beat with the ʻiʻe":"Battre avec le ʻiʻe","Beaten bark cloth":"Étoffe d’écorce battue","Beaten from ʻuru bark and printed with tiʻaʻiri.":"Battu à partir d’écorce de ʻuru et imprimé au tiʻaʻiri.","Birds! At dawn, noddy terns fly out from land to fish, and at dusk they fly home. They rarely go more than about {#1} miles ({#2} km) from land: sail toward where they come from.":"Des oiseaux ! À l’aube, les noddis quittent la terre pour pêcher, et au crépuscule ils rentrent. Ils s’éloignent rarement à plus d’environ {#1} milles ({#2} km) de la terre : naviguez vers l’endroit d’où ils viennent.","Black-lipped oysters on a line in the lagoon. A real Tahitian pearl takes about {#1} months to {#2} years; here time runs faster.":"Des huîtres à lèvres noires sur une ligne dans le lagon. Une vraie perle de Tahiti met environ {#1} mois à {#2} ans à se former ; ici, le temps passe plus vite.","Black-sand beaches and waterfalls inland":"Plages de sable noir et cascades à l’intérieur des terres","Blacktip reef sharks are shy. Stay calm and keep your distance.":"Les requins à pointes noires sont timides. Restez calme et gardez vos distances.","Blue":"Bleu","Bora Bora":"Bora Bora","Bora Bora stamp":"Tampon Bora Bora","Bora Bora stamp (not yet)":"Tampon Bora Bora (pas encore)","Bud":"Bouton","Called “the vanilla island”, it grows some of the most highly prized vanilla in the world, Vanilla tahitensis.":"Surnommée « l’île vanille », elle produit l’une des vanilles les plus prisées au monde, la Vanilla tahitensis.","Calm and slow.":"Calme et lent.","Cancel":"Annuler","Car park":"Parking","Castor and Pollux":"Castor et Pollux","Cauliflower (Pocillopora)":"Chou-fleur (Pocillopora)","Chemise":"Chemise","Choose a file":"Choisir un fichier","Choose a star":"Choisissez une étoile","Choose a weave to start.":"Choisissez un tressage pour commencer.","Choose this one":"Choisir celui-ci","Choose what to cook. Your harvest goes in wrapped in banana leaves.":"Choisissez quoi cuisiner. Votre récolte est enfournée enveloppée dans des feuilles de bananier.","Choose your language":"Choisissez votre langue","Clean!":"Propre !","Cloak of stars":"Manteau d’étoiles","Close":"Fermer","Coming next":"À suivre","Coming soon":"Bientôt disponible","Compost":"Compost","Copy the code":"Copier le code","Coral garden":"Jardin de corail","Coral garden, done":"Jardin de corail, terminé","Cut at the stalk. The crown is replanted: a new plant fruits in {#1} to {#2} months.":"Coupez à la tige. La couronne est replantée : un nouveau plant donne des fruits en {#1} à {#2} mois.","Dance to the drums":"Danser au son des tambours","Dance to the drums, done":"Danser au son des tambours, terminé","Day {#1} · in the sun…":"Jour {#1} · au soleil…","Day {#1} · morning":"Jour {#1} · matin","Day {#1}: just right. The pods are turning brown.":"Jour {#1} : juste ce qu’il faut. Les gousses brunissent.","Day {#1}: too short, the pods are still damp.":"Jour {#1} : trop court, les gousses sont encore humides.","Diamond":"Losange","Did you know?":"Le saviez-vous ?","Ding ding! The driver pulls over. Māuruuru, thank you, driver!":"Ding ding ! Le chauffeur se range sur le côté. Māuruuru, merci, chauffeur !","Done. In nine to ten months, a green pod.":"C’est fait. Dans neuf à dix mois, une gousse verte.","Don’t miss":"À ne pas manquer","Dry and soft. Now decorate it: choose a colour and a motif, then tap the tapa to print.":"Sec et souple. Décorez-le maintenant : choisissez une couleur et un motif, puis touchez le tapa pour imprimer.","Dry the vanilla":"Sécher la vanille","Dry the vanilla, done":"Sécher la vanille, terminé","Drying in the shade…":"Séchage à l’ombre…","Dyed with <span>rēʻa</span>, printed by the sun.":"Teint au <span>rēʻa</span>, imprimé par le soleil.","E aha te huru?":"E aha te huru?","Each fara strip goes over (O) or under (U) the strip it crosses.":"Chaque lanière de fara passe dessus (O) ou dessous (U) la lanière qu’elle croise.","Each vanilla flower opens only once, for a few hours. No insect here can pollinate it, so growers do it by hand with a small stick, flower by flower. Tap an open flower.":"Chaque fleur de vanille ne s’ouvre qu’une fois, pendant quelques heures. Aucun insecte ici ne peut la polliniser : les producteurs le font donc à la main avec un petit bâton, fleur par fleur. Touchez une fleur ouverte.","Empty plot. Plant a seed":"Parcelle vide. Plantez une graine","Empty spot on the rope":"Emplacement vide sur la corde","Exhausted, Ruataʻata wished to become a tree that could feed his children: his hands would be its leaves, his body the trunk and branches, his head the fruit, and his tongue its heart.":"Épuisé, Ruataʻata souhaita devenir un arbre capable de nourrir ses enfants : ses mains en seraient les feuilles, son corps le tronc et les branches, sa tête le fruit, et sa langue le cœur.","Explore Tahaʻa":"Explorer Tahaʻa","FAʻAʻĀ · TAHITI":"FAʻAʻĀ · TAHITI","Faarumai<small>Three waterfalls</small>":"Faarumai<small>Trois cascades</small>","Faʻaheʻe! {#1} % of the ride in the pocket.":"Faʻaheʻe ! {#1} % de la vague dans la poche.","Faʻaheʻe<small>Surf Teahupoʻo</small>":"Faʻaheʻe<small>Surfer à Teahupoʻo</small>","Faʻaʻapu":"Faʻaʻapu","Faʻaʻapu · Kitchen":"Faʻaʻapu · Cuisine","Faʻaʻapu · Your garden":"Faʻaʻapu · Votre jardin","Faʻuai and Ivi":"Faʻuai et Ivi","Feather colour":"Couleur des plumes","Feathers":"Plumes","Fenua":"Fenua","Find <b>Matariʻi</b>, “the little eyes”: a tight little cluster of stars.":"Trouvez <b>Matariʻi</b>, « les petits yeux » : un petit amas serré d’étoiles.","Find <b>Tautoru</b>, “the three”: three stars in a neat row.":"Trouvez <b>Tautoru</b>, « les trois » : trois étoiles bien alignées.","Find <b>Taʻurua-faupapa</b>: the brightest star of the night.":"Trouvez <b>Taʻurua-faupapa</b> : l’étoile la plus brillante de la nuit.","Find <b>ʻAna-mua</b>: the red heart of Te Matau a Māui, the fishhook of Māui.":"Trouvez <b>ʻAna-mua</b> : le cœur rouge de Te Matau a Māui, l’hameçon de Māui.","Finish the tapa":"Terminer le tapa","Five lagoon friends are swimming around. Tap each one to learn its name.":"Cinq amis du lagon nagent autour de vous. Touchez chacun d’eux pour apprendre son nom.","Flap lifted. Press the pollen onto the stigma with your thumb.":"Languette soulevée. Pressez le pollen sur le stigmate avec le pouce.","Flower motifs use a fresh flower from your basket as the model.":"Les motifs floraux prennent pour modèle une fleur fraîche de votre panier.","Fly to Tahiti":"S’envoler vers Tahiti","Follow the row: over or under?":"Suivez la rangée : dessus ou dessous ?","For an ahimāʻa, a pit is dug and filled with coconut husks and wood, with volcanic stones on top. The fire burns most of the night until the stones glow. Food wrapped in banana leaves goes on the stones, the oven is closed with leaves, wet sacks and sand, and everything steams for about four hours. Today it is cooked for birthdays, weddings and big celebrations.":"Pour un ahimāʻa, on creuse une fosse que l’on remplit de bourres de coco et de bois, avec des pierres volcaniques par-dessus. Le feu brûle presque toute la nuit, jusqu’à ce que les pierres rougeoient. Les aliments enveloppés dans des feuilles de bananier sont posés sur les pierres, on ferme le four avec des feuilles, des sacs mouillés et du sable, et tout cuit à la vapeur pendant environ quatre heures. Aujourd’hui, on le prépare pour les anniversaires, les mariages et les grandes fêtes.","For most of the {#1}th century, <b>le truck</b> was how Tahiti got around. Its Reo name is <b>pereʻoʻo mataʻeinaʻa</b>, “the district car”. It was a bare lorry chassis with a long wooden cabin built on the back, painted in bright colours, and often given a name.":"Pendant la majeure partie du {#1}e siècle, c’est avec <b>le truck</b> que l’on se déplaçait à Tahiti. Son nom en reo est <b>pereʻoʻo mataʻeinaʻa</b>, « la voiture du district ». C’était un simple châssis de camion avec une longue cabine en bois construite à l’arrière, peinte de couleurs vives et souvent baptisée d’un nom.","For your faʻaʻapu":"Pour votre faʻaʻapu","Found":"Trouvé","Four or five times wider!":"Quatre ou cinq fois plus large !","From about July to November, humpback whales (tohorā) come to Polynesian waters to give birth. Boats must keep their distance, and so must swimmers.":"De juillet à novembre environ, les baleines à bosse (tohorā) viennent mettre bas dans les eaux polynésiennes. Les bateaux doivent garder leurs distances, et les nageurs aussi.","Fāfā piti! It glides right over you.":"Fāfā piti ! Elle glisse juste au-dessus de vous.","Fāfā piti<small>Swim with a manta</small>":"Fāfā piti<small>Nager avec une raie manta</small>","Gambier":"Gambier","Garden":"Jardin","Garden and crafts":"Jardin et artisanat","Gently…":"Doucement…","Get ready…":"Préparez-vous…","Getting around":"Se déplacer","Give me a name":"Donnez-moi un nom","Give turtles space. Never touch or ride them.":"Laissez de l’espace aux tortues. Ne les touchez jamais et ne montez jamais dessus.","Go ashore":"Débarquer","Go!":"Partez !","Gold":"Or","Good":"Bien","Green":"Vert","Greet people with ʻIa ora na and a smile. Ask before you photograph someone. Leave the beach as you found it.":"Saluez les gens d’un ʻIa ora na et d’un sourire. Demandez avant de photographier quelqu’un. Laissez la plage comme vous l’avez trouvée.","Greetings":"Salutations","Grown coral":"Corail adulte","Guides here tell the legend of Hina and the coconut.":"Les guides racontent ici la légende de Hina et de la noix de coco.","Haamaremare":"Haamaremare","Haamaremare Iti":"Haamaremare Iti","Haamaremare Iti, {#1} m: “the little one”. Iti means small.":"Haamaremare Iti, {#1} m : « la petite ». Iti signifie petit.","Haamaremare Iti: {#1} m.":"Haamaremare Iti : {#1} m.","Haamaremare Rahi":"Haamaremare Rahi","Haamaremare Rahi, {#1} m: the biggest. Rahi means big.":"Haamaremare Rahi, {#1} m : la plus grande. Rahi signifie grand.","Haamaremare Rahi: {#1} m.":"Haamaremare Rahi : {#1} m.","Haamaremare ▶":"Haamaremare ▶","Haere mai":"Haere mai","Hand-pollinate vanilla":"Polliniser la vanille à la main","Hand-pollinate vanilla, done":"Polliniser la vanille à la main, terminé","Harvest: <b>{#1} rēʻa</b>":"Récolte : <b>{#1} rēʻa</b>","Harvest: <b>{#1} tiare</b>":"Récolte : <b>{#1} tiare</b>","Harvest: <b>{#1} tiare</b> and a seed":"Récolte : <b>{#1} tiare</b> et une graine","Harvest: <b>{#1} vavai</b> and a seed":"Récolte : <b>{#1} vavai</b> et une graine","Hats are woven from pandanus leaves (fara, paeʻore), coconut leaflets (nīʻau) and other fibres, strip over strip. The Austral Islands are famous for their weaving, and each island has its own patterns.":"Les chapeaux sont tressés en feuilles de pandanus (fara, paeʻore), en folioles de cocotier (nīʻau) et en d’autres fibres, lanière sur lanière. Les îles Australes sont réputées pour leur vannerie, et chaque île a ses propres motifs.","Hear it roar!":"Écoutez-le rugir !","Hear the legend of the falls":"Écouter la légende des cascades","Hei":"Hei","Hei poe":"Hei poe","Heiva":"Heiva","Here comes the first one…":"Voici la première…","High in the mountains of Tahiti lies Lake Vaihiria, the island’s only natural lake. Guides there tell this story. Long ago, Hina was promised to the Prince of Eels, ruler of the fresh waters. She did not want him, and ran to Hiro for help.":"Haut dans les montagnes de Tahiti se trouve le lac Vaihiria, le seul lac naturel de l’île. Les guides y racontent cette histoire. Il y a très longtemps, Hina fut promise au Prince des anguilles, maître des eaux douces. Elle ne voulait pas de lui et courut demander l’aide de Hiro.","Hina and the eel":"Hina et l’anguille","Hina in the moon":"Hina dans la lune","Hina loved to discover. She sailed with her brother Ru to find the islands, keeping watch from the bow for land.":"Hina aimait découvrir. Elle partit en mer avec son frère Ru pour trouver les îles, guettant la terre depuis la proue.","Hint: Alpha and Beta Centauri, “the two eyes”.":"Indice : Alpha et Bêta du Centaure, « les deux yeux ».","Hint: Castor and Pollux, Pīpiri and his sister Rehua.":"Indice : Castor et Pollux, Pīpiri et sa sœur Rehua.","Hint: the Milky Way, “the water of life”.":"Indice : la Voie lactée, « l’eau de la vie ».","Hiro caught the great eel and cut off its head. He wrapped it in leaves in a woven basket and told Hina: “Do not put the basket on the ground until you are home.” But the day was hot. Hina set the basket down by the water and went to bathe.":"Hiro attrapa la grande anguille et lui coupa la tête. Il l’enveloppa de feuilles dans un panier tressé et dit à Hina : « Ne pose pas le panier par terre avant d’être rentrée chez toi. » Mais la journée était chaude. Hina posa le panier au bord de l’eau et alla se baigner.","His sisters saw Vairaumati bathing in a pool at Vaitape. Every morning ʻOro came down the rainbow to meet her, and every evening he went back up to Pahia. His brothers brought red feathers as wedding gifts.":"Ses sœurs virent Vairaumati se baigner dans un bassin à Vaitape. Chaque matin, ʻOro descendait l’arc-en-ciel pour la retrouver, et chaque soir il remontait au Pahia. Ses frères apportèrent des plumes rouges en cadeaux de mariage.","Hoe vaʻa<small>Outrigger race</small>":"Hoe vaʻa<small>Course de pirogues</small>","Hoe! Dance!":"Hoe ! Dansez !","Hoe! Hoe!":"Hoe ! Hoe !","Hold <b>Swim gently</b> to move closer. Too fast and the <span>fāfā piti</span> will leave. Stop at the dotted ring and stay still.":"Maintenez <b>Nager doucement</b> pour vous approcher. Trop vite, et la <span>fāfā piti</span> s'en ira. Arrêtez-vous au cercle pointillé et restez immobile.","Hold to fill":"Maintenez pour remplir","Hold to pump":"Maintenez pour pomper","Hold to walk":"Maintenez pour marcher","Huahine":"Huahine","Huahine, coming soon":"Huahine, bientôt disponible","Humpback whales off Rurutu, and fine pandanus weaving.":"Des baleines à bosse au large de Rurutu, et un fin tressage de pandanus.","If no install button shows, use your browser menu: <b>Install app</b> or <b>Add to Home screen</b>.":"Si aucun bouton d'installation n'apparaît, utilisez le menu de votre navigateur : <b>Installer l'application</b> ou <b>Ajouter à l'écran d'accueil</b>.","In the Faarumai valley lived Faʻuai, daughter of the chief Maruraʻi. She lived apart from the world, under a tapu: she was forbidden to speak to any man.":"Dans la vallée de Faarumai vivait Faʻuai, fille du chef Maruraʻi. Elle vivait
