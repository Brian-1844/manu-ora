n moon. The <span>ʻ</span> (ʻeta) is a short catch in the voice, as in “uh-oh”. A line over a vowel (ā) makes it longer.":"<b>怎么发音。</b>元音都很纯正：<i>a</i> 像 father 里的 a，<i>e</i> 像 bed 里的 e，<i>i</i> 像 machine 里的 i，<i>o</i> 像 more 里的 o，<i>u</i> 像 moon 里的 u。<span>ʻ</span>（ʻeta）是声音里短暂的一顿，就像“uh-oh”。元音上的横线（ā）表示要读得长一些。","<b>Inside:</b> padded benches ran down each side, sometimes with one more in the middle, so passengers sat facing each other. Plexiglass windows slid shut on rainy days, and trucks had {#1}, {#2} or up to {#3} seats.":"<b>车内：</b>两侧各有一条软垫长椅，有时中间还有一条，乘客面对面坐着。下雨天可以拉上有机玻璃窗。卡车有 {#1} 个、{#2} 个座位，最多可达 {#3} 个。","<b>Maeva</b>Welcome!":"<b>Maeva</b>欢迎！","<b>Matariʻi i raro</b>, the cooler, drier season. The season of abundance returns on {#1} November, in {#2} days.":"<b>Matariʻi i raro</b>，凉爽干燥的季节。丰饶的季节将在 11 月 {#1} 日回归，还有 {#2} 天。","<b>Matariʻi then Pīpiri mā</b> brought us here. Polynesian navigators crossed thousands of kilometres of ocean this way, reading the stars, the swells, the wind and the birds, with no instruments at all.":"<b>先是 Matariʻi，然后是 Pīpiri mā</b>，把我们带到了这里。波利尼西亚航海者就是这样横渡数千公里的大洋：观察星星、涌浪、风和鸟，完全不用任何仪器。","<b>Matariʻi</b> has set. A navigator now takes the next star that sets <b>at the same point</b> on the horizon. Tap it.":"<b>Matariʻi</b> 已经落下了。航海者现在会选择下一颗在地平线上<b>同一位置</b>落下的星星。点击它。","<b>Moʻorea</b> · {#1}/{#2}":"<b>Moʻorea</b> · {#1}/{#2}","<b>Māuruuru</b>Look at me!":"<b>Māuruuru</b>看看我！","<b>Māuruuru</b>Thank you!":"<b>Māuruuru</b>谢谢！","<b>Nana</b>Bye for now!":"<b>Nana</b>回头见！","<b>Nine to ten months later…</b> each pollinated flower has become a long green pod. They are picked when they turn from yellow to brown, then dried for weeks.":"<b>九到十个月后……</b>每朵授过粉的花都变成了一根长长的绿色豆荚。豆荚由黄转褐时采摘，然后晾干数周。","<b>No fixed stops:</b> outside Papeete, you raised your arm at the roadside, and some families left big leaves outside their house to ask for a ride. To get off, you rang a bell to the driver.":"<b>没有固定站点：</b>在 Papeete 以外，你只要在路边举起手臂就行；有些人家会在门外放几片大叶子，请车停下来载人。要下车时，就按铃告诉司机。","<b>Painapo</b>Pineapples grow up in the valley.":"<b>Painapo</b>菠萝长在山谷里。","<b>Porapora</b> · Bora Bora · {#1}/{#2}":"<b>Porapora</b> · 波拉波拉 · {#1}/{#2}","<b>Poʻe vānira</b> · Plantain poʻe with Tahaʻa vanilla<br><span>{#1} fēʻī + {#2} haʻari + {#3} vānira · not enough in your basket</span>":"<b>Poʻe vānira</b> · 加 Tahaʻa 香草的大蕉 poʻe<br><span>{#1} fēʻī + {#2} haʻari + {#3} vānira · 你的篮子里不够</span>","<b>Poʻe vānira</b> · Plantain poʻe with Tahaʻa vanilla<br><span>{#1} fēʻī + {#2} haʻari + {#3} vānira</span>":"<b>Poʻe vānira</b> · 加 Tahaʻa 香草的大蕉 poʻe<br><span>{#1} fēʻī + {#2} haʻari + {#3} vānira</span>","<b>Pīpiri mā</b>, Castor and Pollux, sets where Matariʻi did. Follow it now. Navigators learned the rising and setting points of more than {#1} stars.":"<b>Pīpiri mā</b>，即北河二和北河三，在 Matariʻi 落下的地方落下。现在跟着它走。航海者熟知超过 {#1} 颗星星的升起和落下位置。","<b>Pūpū!</b> A shell for a hei ({#1}).":"<b>Pūpū!</b> 一枚可以做 hei 的贝壳（{#1}）。","<b>Ride one:</b> each January, the festive <b>Tere Faʻaʻati</b> tour goes round Tahiti in decorated trucks, with ukuleles and songs. Ask the Papeete tourist office for dates and booking.":"<b>亲自乘坐：</b>每年一月，热闹的 <b>Tere Faʻaʻati</b> 环岛游会乘坐装饰一新的卡车绕 Tahiti 一圈，一路弹着尤克里里、唱着歌。日期和预订请咨询 Papeete 旅游服务处。","<b>Sort and massage.</b> When sorting, each pod is massaged between the fingers to spread its seeds and oils evenly. Rub each pod.":"<b>分拣和按摩。</b>分拣时，每根豆荚都要在指间揉搓，让种子和油脂分布均匀。揉一揉每根豆荚。","<b>Tahaʻa</b> · {#1}/{#2}":"<b>Tahaʻa</b> · {#1}/{#2}","<b>Tahiti</b> · {#1}/{#2}":"<b>Tahiti</b> · {#1}/{#2}","<b>Taro</b> · Taro with coconut milk<br><span>{#1} taro + {#2} haʻari · not enough in your basket</span>":"<b>Taro</b> · 椰奶芋头<br><span>{#1} taro + {#2} haʻari · 你的篮子里不够</span>","<b>Taro</b> · Taro with coconut milk<br><span>{#1} taro + {#2} haʻari</span>":"<b>Taro</b> · 椰奶芋头<br><span>{#1} taro + {#2} haʻari</span>","<b>Taste it for real:</b> look for poʻe at Papeete market and at family feasts. Tahaʻa vanilla is sold at the plantations on the island.":"<b>亲口尝一尝：</b>在 Papeete 市场和家庭宴席上可以找到 poʻe。Tahaʻa 香草在岛上的种植园有售。","<b>Te mahana</b> brought us here. Polynesian navigators crossed thousands of kilometres of ocean this way, reading the stars, the swells, the wind and the birds, with no instruments at all.":"<b>Te mahana</b> 把我们带到了这里。波利尼西亚航海者就是这样横渡数千公里的大洋：观察星星、涌浪、风和鸟，完全不用任何仪器。","<b>To market:</b> the roof was piled with fruit, taro, fish and chickens for the Papeete market, and even canoes for the July festivals. Music played and people sang on the way.":"<b>去市场：</b>车顶上堆满了要运往 Papeete 市场的水果、芋头、鱼和鸡，甚至还有为七月节庆准备的独木舟。一路上放着音乐，人们唱着歌。","<b>Today:</b> about {#1} trucks ran in {#2}. Since the late {#3}s they have been replaced on Tahiti by buses, which are safer; the Tere Tahiti network includes some electric buses. Trucks still carry children to school on some outer islands.":"<b>如今：</b>{#2} 年大约有 {#1} 辆卡车在运营。从 {#3} 年代末起，Tahiti 上的卡车逐渐被更安全的公交车取代；Tere Tahiti 公交网络还有一些电动公交车。在一些外岛上，卡车仍然接送孩子上学。","<b>Waning moon.</b> Plants grow at a normal pace until the next new moon.":"<b>月亏。</b>植物会正常生长，直到下一次新月。","<b>{#1}. Build the fire.</b> Burning… In real life the stones heat for most of the night, until they glow red.":"<b>{#1}. 生火。</b>燃烧中……现实中，石头要加热大半夜，直到烧得通红。","<b>{#1}. Build the fire.</b> The pit is ready. Fill it with wood and dry coconut husks, then light it. The volcanic stones on top store the heat.":"<b>{#1}. 生火。</b>坑已经挖好了。往里面填满木柴和干椰子壳，然后点火。上面的火山石会储存热量。","<b>{#1}. Catch it.</b> A swell is coming. Paddle when it lifts the back of your board: when the hump is just behind your manu.":"<b>{#1}. 抓住它。</b>涌浪来了。当它抬起你冲浪板的后端时就划水：也就是浪峰刚好在你的 manu 身后的时候。","<b>{#1}. Clean the nursery.</b> Algae grow on the ropes and smother young corals. Tap each green clump to brush it off.":"<b>{#1}. 清理苗圃。</b>藻类长在绳子上，会闷死幼小的珊瑚。点击每一团绿藻，把它刷掉。","<b>{#1}. Close the oven</b> in the right order: banana leaves first, then wet copra sacks, then sand on top to keep the heat in.":"<b>{#1}. 按正确顺序封住地炉</b>：先盖香蕉叶，再盖湿椰干麻袋，最后在上面铺沙子保温。","<b>{#1}. Fill the bottles.</b> Hold the tap and let go when the juice reaches the red line. Not too little, not over!":"<b>{#1}. 装瓶。</b>按住龙头，果汁到达红线时松手。不能太少，也不能溢出！","<b>{#1}. Hang new fragments.</b> Pieces broken by storms are saved and tied to the bottom rope. Pick a kind, then tap an empty tie.":"<b>{#1}. 挂上新碎片。</b>被风暴打断的珊瑚碎片会被保存下来，绑在底部的绳子上。选一个品种，然后点击一个空的绑扣。","<b>{#1}. Lay banana leaves</b> on the red-hot stones. They protect the food and make steam.":"<b>{#1}. 铺上香蕉叶</b>，盖在烧红的石头上。它们能保护食物，还能产生蒸汽。","<b>{#1}. Open the oven.</b> Everyone gathers: this is the big moment.":"<b>{#1}. 打开地炉。</b>大家都围过来：这是最激动人心的时刻。","<b>{#1}. Plant on the reef.</b> Now tap a bare rock on the reef to fix this coral there.":"<b>{#1}. 种到礁石上。</b>现在点击礁石上一块光秃秃的岩石，把这株珊瑚固定在那里。","<b>{#1}. Plant on the reef.</b> Tap a big coral on the top ropes, then a bare rock on the reef.":"<b>{#1}. 种到礁石上。</b>点击上层绳子上的一株大珊瑚，然后点击礁石上一块光秃秃的岩石。","<b>{#1}. Plant on the reef.</b> These corals have grown for two to three years. Tap a big coral on the top ropes, then a bare rock on the reef.":"<b>{#1}. 种到礁石上。</b>这些珊瑚已经长了两到三年。点击上层绳子上的一株大珊瑚，然后点击礁石上一块光秃秃的岩石。","<b>{#1}. Put in the food,</b> each parcel wrapped in banana leaves.":"<b>{#1}. 放入食物，</b>每份都用香蕉叶包好。","<b>{#1}. Ride the pocket.</b> The wave breaks behind you. Hold <b>Pump</b> to speed up, let go to slow down. Stay in the green, close to the curl but not under it.":"<b>{#1}. 在浪管里滑行。</b>浪在你身后破碎。按住<b>加速</b>提速，松开就减速。保持在绿色区域，靠近卷浪，但不要钻到它下面。","<b>{#1}. Sort the fruit.</b> Only golden, firm pineapples go to the press. Green ones go back to the grower, bruised ones to the compost.":"<b>{#1}. 挑选水果。</b>只有金黄、结实的菠萝才能送去压榨。青的退回给种植户，碰伤的送去堆肥。","<b>{#1}. Wait.</b> The food steams slowly for about four hours. Time to swim, talk and play the ukulele.":"<b>{#1}. 等待。</b>食物要慢慢蒸大约四个小时。这段时间可以游泳、聊天、弹尤克里里。","<b>ʻIa ora na, Moʻorea!</b>The sister island":"<b>ʻIa ora na, Moʻorea!</b>姐妹岛","<b>ʻIa ora na, Tahaʻa!</b>The vanilla island":"<b>ʻIa ora na, Tahaʻa!</b>香草岛","<b>ʻIa ora na, Tahiti!</b>The big island":"<b>ʻIa ora na, Tahiti!</b>大岛","<b>ʻUru</b> · Breadfruit from the oven<br><span>{#1} ʻuru · not enough in your basket</span>":"<b>ʻUru</b> · 地炉烤面包果<br><span>{#1} ʻuru · 你的篮子里不够</span>","<b>ʻUru</b> · Breadfruit from the oven<br><span>{#1} ʻuru</span>":"<b>ʻUru</b> · 地炉烤面包果<br><span>{#1} ʻuru</span>","<b>ʻĀʻai · Legends heard:</b> {#1} of {#2}. · Hina and the eel · Pai and the pierced mountain · ʻOro and the rainbow · Ruataʻata and the ʻuru · Hina in the moon · Faʻuai and Ivi":"<b>ʻĀʻai · 已听过的传说：</b>{#1}/{#2}。 · Hina 与鳗鱼 · Pai 与被穿透的山 · ʻOro 与彩虹 · Ruataʻata 与 ʻuru · 月亮里的 Hina · Faʻuai 与 Ivi","<b>ʻĀʻai · Legends heard:</b> {#1} of {#2}. ✓ Hina and the eel ✓ Pai and the pierced mountain ✓ ʻOro and the rainbow ✓ Ruataʻata and the ʻuru ✓ Hina in the moon · Faʻuai and Ivi":"<b>ʻĀʻai · 已听过的传说：</b>{#1}/{#2}。 ✓ Hina 与鳗鱼 ✓ Pai 与被穿透的山 ✓ ʻOro 与彩虹 ✓ Ruataʻata 与 ʻuru ✓ 月亮里的 Hina · Faʻuai 与 Ivi","<span></span>cream":"<span></span>奶油色","<span></span>leaf green":"<span></span>叶绿色","<span></span>mati":"<span></span>mati","<span></span>mati red":"<span></span>mati 红","<span></span>mati · red-brown":"<span></span>mati · 红褐色","<span></span>rēʻa yellow":"<span></span>rēʻa 黄","<span></span>rēʻa · yellow":"<span></span>rēʻa · 黄色","<span></span>tiʻaʻiri":"<span></span>tiʻaʻiri","<span></span>tiʻaʻiri black":"<span></span>tiʻaʻiri 黑","<span></span>white":"<span></span>白色","<span></span>ʻaute violet":"<span></span>ʻaute 紫","<span></span>ʻaute · violet":"<span></span>ʻaute · 紫色","<span>Hei poe</span> · Pearl and shell necklace":"<span>Hei poe</span> · 珍珠贝壳项链","<span>Maeva i Tahiti!</span> Welcome to Tahiti":"<span>Maeva i Tahiti!</span> 欢迎来到 Tahiti","<span>Māuruuru!</span> Well done.":"<span>Māuruuru!</span> 做得好。","<span>Porapora</span> · Bora Bora":"<span>Porapora</span> · 波拉波拉","<span>Poʻe vānira</span> · Plantain poʻe with Tahaʻa vanilla":"<span>Poʻe vānira</span> · 加 Tahaʻa 香草的大蕉 poʻe","<span>Pāreu</span> · Sun-printed pāreu":"<span>Pāreu</span> · 日晒印花 pāreu","<span>Tapa</span> · Beaten bark cloth":"<span>Tapa</span> · 捶制树皮布","<span>Tāupoʻo</span> · Woven hat":"<span>Tāupoʻo</span> · 编织帽","A Tahitian telling recorded in Arue (USC Digital Folklore Archives); guides at Lake Vaihiria tell the legend of Hina and the coconut. Many versions are told across Polynesia.":"这是在 Arue 记录的一个 Tahiti 版本（南加州大学数字民俗档案馆）；Vaihiria 湖的导游会讲述 Hina 与椰子的传说。这个故事在波利尼西亚各地有许多版本。","A cloud stays piled up at one point on the horizon while others drift past: clouds gather over high islands. Land is under it.":"一朵云一直堆积在地平线的同一个位置，而其他云朵都飘了过去：云会聚集在高岛上空。云下面就有陆地。","A diamond weave of fara, with a tiare band.":"用 fara 编成的菱形纹样，配一条 tiare 花带。","A fork in the trail. Which way to the other two falls?":"小路出现了岔口。去另外两座瀑布该走哪条路？","A gift from the legend":"来自传说的礼物","A great famine struck Raiatea. Ruataʻata, his wife Rumauariʻi and their children had nothing left to eat but mountain ferns.":"Raiatea 遭遇了一场大饥荒。Ruataʻata、他的妻子 Rumauariʻi 和孩子们除了山上的蕨类，已经没有别的东西可吃了。","A hei is a garland for the head or neck, made of flowers or shells. A shell necklace is often given to visitors when they leave, as a sign of protection. Tahitian pearls grow in the black-lipped oyster; their dark greens, blues and greys are natural.":"hei 是戴在头上或脖子上的花环，用鲜花或贝壳制成。客人离开时，人们常会送上一串贝壳项链，象征保佑。Tahiti 珍珠生长在黑唇珍珠贝里；它们的深绿、深蓝和灰色都是天然的。","A legend of Raiatea, as retold by Welcome Tahiti.":"Raiatea 的一个传说，由 Welcome Tahiti 重述。","A motu picnic with a traditional oven":"在 motu 小岛上野餐，体验传统地炉","A pale green glow above the horizon: sunlight reflected by a lagoon. Land ho is near!":"地平线上方有一片淡绿色的光：那是泻湖反射的阳光。陆地就在附近了！","A pearl farm, to see grafting and harvest":"参观珍珠养殖场，看插核和采收","A pineapple field in the Opunohu valley":"Opunohu 山谷里的一片菠萝田","A pāreu is one length of cloth, tied in dozens of ways. Some painters make sun prints: leaves laid on wet, freshly painted cloth leave a pale shape once the sun has dried it.":"pāreu 是一整块布，有几十种系法。有些画师会做日晒印花：把叶子放在刚上色的湿布上，太阳晒干后就会留下浅色的图案。","A shell on the sand":"沙滩上的一枚贝壳","A simplified map: the shapes are right, the distances are not, and not all these stars are up on the same night. Names vary between islands and sources.":"这是一张简化地图：形状是对的，距离不准，这些星星也不会在同一个夜晚全部出现。不同岛屿、不同资料中的名称会有所不同。","A starter basket: cotton, turmeric, pandanus and two shells. Enough for a first pāreu and hat!":"新手篮子：棉花、姜黄、露兜树叶和两枚贝壳。足够做你的第一件 pāreu 和第一顶帽子了！","A vanilla plantation tour, with tasting":"参观香草种植园，还能品尝","About this island":"关于这座岛","About {#1} hours to go…":"还剩大约 {#1} 小时……","Across the channel from Tahiti, about {#1} km away.":"与 Tahiti 隔着海峡相望，相距约 {#1} km。","Add coconut husks":"加椰子壳","Add wood":"加木柴","After Teuira Henry, Ancient Tahiti (Hōkūleʻa archive).":"根据 Teuira Henry《古代 Tahiti》（Hōkūleʻa 档案）。","After Teuira Henry, Ancient Tahiti. The pearl is a later addition to the story.":"根据 Teuira Henry《古代 Tahiti》。珍珠是后来才加入故事的。","After the Service du Tourisme de Polynésie française (Les {#1} Cascades site). Other versions exist.":"根据法属波利尼西亚旅游局（Les {#1} Cascades 景点）。还有其他版本。","Ahimāʻa · the earth oven":"Ahimāʻa · 地炉","Ahimāʻa<small>The earth oven</small>":"Ahimāʻa<small>地炉</small>","Algae on the nursery":"苗圃上的藻类","Antares":"心宿二","Arahoho, on the coast road between Papenoo and Tiarei, was once called Anahoho, “the cave that howls”. When the swell is strong, the sea rushes into a cave under the basalt and bursts out of the hole with a roar. The old people heard a song in it: “the sea sings in harmony”. The site has been closed at times for cliff safety work, so check before you go, and always stay behind the barrier.":"Arahoho 位于 Papenoo 和 Tiarei 之间的海岸公路上，过去叫 Anahoho，意思是“会吼叫的洞穴”。涌浪大的时候，海水冲进玄武岩下的洞穴，再从洞口轰鸣着喷出来。老人们从中听到了歌声：“大海在和声歌唱”。这里有时会因悬崖安全施工而关闭，出发前请先确认，并且一定要待在护栏后面。","Arahoho<small>The blowhole</small>":"Arahoho<small>喷水洞</small>","As told by Tahiti Tourisme. The mountain’s older name is said to be Mouʻa Tapu, the sacred mountain.":"据 Tahiti Tourisme 讲述。据说这座山更古老的名字是 Mouʻa Tapu，意为圣山。","At the foot of Mount Rotui, near Cook’s Bay, Moʻorea’s fruit-juice factory makes Rotui juices from local fruit, including the Queen pineapple. It works with more than {#1} local growers. Visit in the morning, when production is at its height, then walk through the pineapple fields.":"在 Rotui 山脚下、库克湾附近，Moʻorea 的果汁厂用当地水果制作 Rotui 果汁，其中包括皇后菠萝。工厂与超过 {#1} 位当地种植户合作。最好上午去参观，那时生产最繁忙，之后可以去菠萝田里走走。","Atolls of white sand and pink coral. Diving at Fakarava, black pearl farms.":"白沙和粉色珊瑚构成的环礁。可以在 Fakarava 潜水，还有黑珍珠养殖场。","Australs":"南方群岛","Back":"返回","Back down the trail":"沿小路返回","Back to Bora Bora":"返回波拉波拉","Back to Moʻorea":"返回 Moʻorea","Back to Tahaʻa":"返回 Tahaʻa","Back to Tahiti":"返回 Tahiti","Back to grower":"退回种植户","Back to the garden":"返回菜园","Banana leaves":"香蕉叶","Bare rock on the reef":"礁石上光秃秃的岩石","Basket":"篮子","Beat with the ʻiʻe":"用 ʻiʻe 捶打","Beaten bark cloth":"捶制树皮布","Beaten from ʻuru bark and printed with tiʻaʻiri.":"用 ʻuru 树皮捶制而成，并用 tiʻaʻiri 印染。","Birds! At dawn, noddy terns fly out from land to fish, and at dusk they fly home. They rarely go more than about {#1} miles ({#2} km) from land: sail toward where they come from.":"鸟！黎明时，玄燕鸥从陆地飞出去捕鱼，黄昏时再飞回家。它们很少飞离陆地超过约 {#1} 英里（{#2} km）：朝它们飞来的方向航行吧。","Black-lipped oysters on a line in the lagoon. A real Tahitian pearl takes about {#1} months to {#2} years; here time runs faster.":"泻湖里挂在绳上的黑唇珍珠贝。一颗真正的 Tahiti 珍珠需要大约 {#1} 个月到 {#2} 年才能长成；在这里时间过得更快。","Black-sand beaches and waterfalls inland":"黑沙滩，内陆还有瀑布","Blacktip reef sharks are shy. Stay calm and keep your distance.":"黑鳍礁鲨很胆小。保持冷静，保持距离。","Blue":"蓝色","Bora Bora":"波拉波拉","Bora Bora stamp":"波拉波拉印章","Bora Bora stamp (not yet)":"波拉波拉印章（尚未获得）","Bud":"花苞","Called “the vanilla island”, it grows some of the most highly prized vanilla in the world, Vanilla tahitensis.":"它被称为“香草岛”，出产世界上最珍贵的香草之一：Vanilla tahitensis。","Calm and slow.":"平静而缓慢。","Cancel":"取消","Car park":"停车场","Castor and Pollux":"北河二和北河三","Cauliflower (Pocillopora)":"花椰菜珊瑚（Pocillopora）","Chemise":"Chemise","Choose a file":"选择文件","Choose a star":"选择一颗星星","Choose a weave to start.":"选择一种编法开始。","Choose this one":"就选这个","Choose what to cook. Your harvest goes in wrapped in banana leaves.":"选择要烹饪的食物。你的收成会用香蕉叶包好放进去。","Choose your language":"选择语言","Clean!":"干净了！","Cloak of stars":"星辰斗篷","Close":"关闭","Coming next":"接下来","Coming soon":"即将推出","Compost":"堆肥","Copy the code":"复制代码","Coral garden":"珊瑚花园","Coral garden, done":"珊瑚花园，已完成","Cut at the stalk. The crown is replanted: a new plant fruits in {#1} to {#2} months.":"从茎部切下。菠萝冠会被重新种下：新植株在 {#1} 到 {#2} 个月后结果。","Dance to the drums":"随鼓声起舞","Dance to the drums, done":"随鼓声起舞，已完成","Day {#1} · in the sun…":"第 {#1} 天 · 在阳光下……","Day {#1} · morning":"第 {#1} 天 · 早晨","Day {#1}: just right. The pods are turning brown.":"第 {#1} 天：刚刚好。豆荚正在变成褐色。","Day {#1}: too short, the pods are still damp.":"第 {#1} 天：太短了，豆荚还是湿的。","Diamond":"菱形","Did you know?":"你知道吗？","Ding ding! The driver pulls over. Māuruuru, thank you, driver!":"叮叮！司机靠边停车了。Māuruuru，谢谢你，司机！","Done. In nine to ten months, a green pod.":"完成了。九到十个月后，会长出一根绿色豆荚。","Don’t miss":"不容错过","Dry and soft. Now decorate it: choose a colour and a motif, then tap the tapa to print.":"又干又软。现在来装饰它：选择一种颜色和图案，然后点击 tapa 来印花。","Dry the vanilla":"晾干香草","Dry the vanilla, done":"晾干香草，已完成","Drying in the shade…":"在阴凉处晾干……","Dyed with <span>rēʻa</span>, printed by the sun.":"用 <span>rēʻa</span> 染色，由阳光印花。","E aha te huru?":"E aha te huru?","Each fara strip goes over (O) or under (U) the strip it crosses.":"每根 fara 条都从与它交叉的那根条的上面（O）或下面（U）穿过。","Each vanilla flower opens only once, for a few hours. No insect here can pollinate it, so growers do it by hand with a small stick, flower by flower. Tap an open flower.":"每朵香草花只开一次，只开几个小时。这里没有昆虫能为它授粉，所以种植者用一根小棍子一朵一朵地人工授粉。点击一朵盛开的花。","Empty plot. Plant a seed":"空地块。种下一颗种子","Empty spot on the rope":"绳子上的空位","Exhausted, Ruataʻata wished to become a tree that could feed his children: his hands would be its leaves, his body the trunk and branches, his head the fruit, and his tongue its heart.":"精疲力竭的 Ruataʻata 希望变成一棵能养活孩子们的树：他的双手化作树叶，身体化作树干和树枝，头化作果实，舌头化作果心。","Explore Tahaʻa":"探索 Tahaʻa","FAʻAʻĀ · TAHITI":"FAʻAʻĀ · TAHITI","Faarumai<small>Three waterfalls</small>":"Faarumai<small>三座瀑布</small>","Faʻaheʻe! {#1} % of the ride in the pocket.":"Faʻaheʻe！{#1} % 的时间都在浪管里。","Faʻaheʻe<small>Surf Teahupoʻo</small>":"Faʻaheʻe<small>在 Teahupoʻo 冲浪</small>","Faʻaʻapu":"Faʻaʻapu","Faʻaʻapu · Kitchen":"Faʻaʻapu · 厨房","Faʻaʻapu · Your garden":"Faʻaʻapu · 你的菜园","Faʻuai and Ivi":"Faʻuai 与 Ivi","Feather colour":"羽毛颜色","Feathers":"羽毛","Fenua":"Fenua","Find <b>Matariʻi</b>, “the little eyes”: a tight little cluster of stars.":"找到 <b>Matariʻi</b>，“小眼睛”：一小簇紧挨在一起的星星。","Find <b>Tautoru</b>, “the three”: three stars in a neat row.":"找到 <b>Tautoru</b>，“三颗”：整齐排成一行的三颗星。","Find <b>Taʻurua-faupapa</b>: the brightest star of the night.":"找到 <b>Taʻurua-faupapa</b>：夜空中最亮的星。","Find <b>ʻAna-mua</b>: the red heart of Te Matau a Māui, the fishhook of Māui.":"找到 <b>ʻAna-mua</b>：Te Matau a Māui（Māui 的鱼钩）红色的心脏。","Finish the tapa":"完成 tapa","Five lagoon friends are swimming around. Tap each one to learn its name.":"五位泻湖朋友在四处游动。点击每一位，了解它们的名字。","Flap lifted. Press the pollen onto the stigma with your thumb.":"小舌片掀开了。用拇指把花粉按到柱头上。","Flower motifs use a fresh flower from your basket as the model.":"花卉图案以你篮子里的一朵鲜花为模板。","Fly to Tahiti":"飞往 Tahiti","Follow the row: over or under?":"沿着这一行：从上面还是下面？","For an ahimāʻa, a pit is dug and filled with coconut husks and wood, with volcanic stones on top. The fire burns most of the night until the stones glow. Food wrapped in banana leaves goes on the stones, the oven is closed with leaves, wet sacks and sand, and everything steams for about four hours. Today it is cooked for birthdays, weddings and big celebrations.":"做 ahimāʻa 时，要先挖一个坑，填入椰子壳和木柴，上面放火山石。火要烧大半夜，直到石头烧得通红。用香蕉叶包好的食物放在石头上，再用叶子、湿麻袋和沙子把地炉封好，一切都要蒸大约四个小时。如今，人们会在生日、婚礼和盛大庆典时做这道菜。","For most of the {#1}th century, <b>le truck</b> was how Tahiti got around. Its Reo name is <b>pereʻoʻo mataʻeinaʻa</b>, “the district car”. It was a bare lorry chassis with a long wooden cabin built on the back, painted in bright colours, and often given a name.":"在 {#1} 世纪的大部分时间里，<b>le truck</b> 是 Tahiti 人出行的方式。它的 Reo 名字是 <b>pereʻoʻo mataʻeinaʻa</b>，意思是“地区的车”。它是一个光秃秃的卡车底盘，后面搭着长长的木制车厢，漆成鲜艳的颜色，常常还有自己的名字。","For your faʻaʻapu":"给你的 faʻaʻapu","Found":"已找到","Four or five times wider!":"宽了四五倍！","From about July to November, humpback whales (tohorā) come to Polynesian waters to give birth. Boats must keep their distance, and so must swimmers.":"大约从七月到十一月，座头鲸（tohorā）会来到波利尼西亚海域生育。船只必须保持距离，游泳的人也一样。","Fāfā piti! It glides right over you.":"Fāfā piti！它从你正上方滑过。","Fāfā piti<small>Swim with a manta</small>":"Fāfā piti<small>与蝠鲼共游</small>","Gambier":"甘比尔群岛","Garden":"菜园","Garden and crafts":"菜园与手工","Gently…":"轻轻地……","Get ready…":"准备……","Getting around":"出行交通","Give me a name":"给我起个名字","Give turtles space. Never touch or ride them.":"给海龟留出空间。千万不要触摸或骑乘它们。","Go ashore":"上岸","Go!":"出发！","Gold":"金色","Good":"好","Green":"绿色","Greet people with ʻIa ora na and a smile. Ask before you photograph someone. Leave the beach as you found it.":"用 ʻIa ora na 和微笑向人们问好。给别人拍照前先征得同意。离开海滩时让它保持原样。","Greetings":"问候语","Grown coral":"长大的珊瑚","Guides here tell the legend of Hina and the coconut.":"这里的导游会讲述 Hina 与椰子的传说。","Haamaremare":"Haamaremare","Haamaremare Iti":"Haamaremare Iti","Haamaremare Iti, {#1} m: “the little one”. Iti means small.":"Haamaremare Iti，{#1} m：“小的那座”。Iti 意思是小。","Haamaremare Iti: {#1} m.":"Haamaremare Iti：{#1} m。","Haamaremare Rahi":"Haamaremare Rahi","Haamaremare Rahi, {#1} m: the biggest. Rahi means big.":"Haamaremare Rahi，{#1} m：最大的一座。Rahi 意思是大。","Haamaremare Rahi: {#1} m.":"Haamaremare Rahi：{#1} m。","Haamaremare ▶":"Haamaremare ▶","Haere mai":"Haere mai","Hand-pollinate vanilla":"为香草人工授粉","Hand-pollinate vanilla, done":"为香草人工授粉，已完成","Harvest: <b>{#1} rēʻa</b>":"收获：<b>{#1} rēʻa</b>","Harvest: <b>{#1} tiare</b>":"收获：<b>{#1} tiare</b>","Harvest: <b>{#1} tiare</b> and a seed":"收获：<b>{#1} tiare</b> 和一颗种子","Harvest: <b>{#1} vavai</b> and a seed":"收获：<b>{#1} vavai</b> 和一颗种子","Hats are woven from pandanus leaves (fara, paeʻore), coconut leaflets (nīʻau) and other fibres, strip over strip. The Austral Islands are famous for their weaving, and each island has its own patterns.":"帽子用露兜树叶（fara、paeʻore）、椰子小叶（nīʻau）和其他纤维一条压一条地编织而成。南方群岛以编织闻名，每座岛都有自己的花样。","Hear it roar!":"听它的吼声！","Hear the legend of the falls":"聆听瀑布的传说","Hei":"Hei","Hei poe":"Hei poe","Heiva":"Heiva","Here comes the first one…":"第一个来了……","High in the mountains of Tahiti lies Lake Vaihiria, the island’s only natural lake. Guides there tell this story. Long ago, Hina was promised to the Prince of Eels, ruler of the fresh waters. She did not want him, and ran to Hiro for help.":"在 Tahiti 的高山之中，坐落着 Vaihiria 湖，这是岛上唯一的天然湖泊。那里的导游会讲这个故事。很久以前，Hina 被许配给了统治淡水的鳗鱼王子。她不想嫁给他，便跑去向 Hiro 求助。","Hina and the eel":"Hina 与鳗鱼","Hina in the moon":"月亮里的 Hina","Hina loved to discover. She sailed with her brother Ru to find the islands, keeping watch from the bow for land.":"Hina 热爱探索。她和哥哥 Ru 一起航行寻找岛屿，在船头守望着陆地。","Hint: Alpha and Beta Centauri, “the two eyes”.":"提示：南门二和马腹一（Alpha 和 Beta Centauri），“两只眼睛”。","Hint: Castor and Pollux, Pīpiri and his sister Rehua.":"提示：北河二和北河三，Pīpiri 和他的妹妹 Rehua。","Hint: the Milky Way, “the water of life”.":"提示：银河，“生命之水”。","Hiro caught the great eel and cut off its head. He wrapped it in leaves in a woven basket and told Hina: “Do not put the basket on the ground until you are home.” But the day was hot. Hina set the basket down by the water and went to bathe.":"Hiro 抓住了那条大鳗鱼，砍下了它的头。他用叶子把鳗鱼头包好，放进一个编织篮里，对 Hina 说：“回到家之前，不要把篮子放在地上。”可是那天很热。Hina 把篮子放在水边，就去洗澡了。","His sisters saw Vairaumati bathing in a pool at Vaitape. Every morning ʻOro came down the rainbow to meet her, and every evening he went back up to Pahia. His brothers brought red feathers as wedding gifts.":"他的姐妹们看见 Vairaumati 在 Vaitape 的一个水池里沐浴。每天早上，ʻOro 都会沿着彩虹下来与她相会，每天傍晚再回到 Pahia。他的兄弟们带来了红色羽毛作为结婚礼物。","Hoe vaʻa<small>Outrigger race</small>":"Hoe vaʻa<small>舷外支架独木舟比赛</small>","Hoe! Dance!":"Hoe！跳起来！","Hoe! Hoe!":"Hoe! Hoe!","Hold <b>Swim gently</b> to move closer. Too fast and the <span>fāfā piti</span> will leave. Stop at the dotted ring and stay still.":"按住<b>轻轻游</b>慢慢靠近。太快的话，<span>fāfā piti</span> 会游走。到虚线圈处停下，保持不动。","Hold to fill":"按住装满","Hold to pump":"按住抽水","Hold to walk":"按住行走","Huahine":"Huahine","Huahine, coming soon":"Huahine，即将开放","Humpback whales off Rurutu, and fine pandanus weaving.":"在 Rurutu 岛外可以看到座头鲸，还有精美的露兜树叶编织。","If no install button shows, use your browser menu: <b>Install app</b> or <b>Add to Home screen</b>.":"如果没有出现安装按钮，请使用浏览器菜单：<b>安装应用</b>或<b>添加到主屏幕</b>。","In the Faarumai valley lived Faʻuai, daughter of the chief Maruraʻi. She lived apart from the world, under a tapu: she was forbidden to speak to any man.":"在 Faarumai 山谷里，住着酋长 Maruraʻi 的女儿 Faʻuai。她远离尘世，受一条 tapu 约束：禁止与任何男子说话。","In the morning, his wife found a breadfruit tree full of ripe fruit beside the house. The family was saved. That is why the ʻuru is called a tree of life.":"第二天早上，他的妻子发现屋旁长出了一棵结满熟果的面包果树。一家人得救了。这就是 ʻuru 被称为生命之树的原因。","In the pocket!":"在浪腔里！","Inside Papeete market: fish, fruit and flowers downstairs, crafts upstairs":"Papeete 市场内部：楼下是鱼、水果和鲜花，楼上是手工艺品","Inside the fruit-juice factory":"果汁工厂内部","Inside, Polynesia and Europe meet: a carved wooden Madonna and Child from the Marquesas, and Stations of the Cross showing Polynesian people.":"在教堂里，波利尼西亚与欧洲相遇：有一尊来自马克萨斯群岛的木雕圣母子像，还有描绘波利尼西亚人的苦路十四处。","Install on my phone":"安装到我的手机","Install or restore a voyage":"安装或恢复航行","International flights land at Faʻaʻā, next to Papeete.":"国际航班降落在 Papeete 旁边的 Faʻaʻā。","Into the crate!":"放进箱子！","Island shirt":"海岛衬衫","Islands":"岛屿","It is a place of worship: visit quietly, dress modestly, and avoid service times.":"这里是礼拜场所：请安静参观、着装得体，并避开礼拜时间。","Its highest peak, Mont Orohena, rises to {#1} m.":"岛上最高峰 Orohena 山海拔 {#1} m。","I’ll steer myself":"我自己掌舵","I’m your <span>manu tere</span>, your voyaging bird.":"我是你的 <span>manu tere</span>，你的航行小鸟。","Juice factory":"果汁工厂","Juice factory, done":"果汁工厂，已完成","Kaoha! Tiki, tattoo and high cliffs. A UNESCO World Heritage site since {#1}.":"Kaoha！提基神像、纹身和高耸的悬崖。自 {#1} 年起列入联合国教科文组织世界遗产。","Keep walking":"继续走","Keep your voyage":"保存你的航行 ome":"Maeva · 欢迎","Main":"主页","Make by hand":"动手制作","Make by hand · Beaten bark cloth":"动手制作 · 捶打树皮布","Make by hand · Island shirt":"动手制作 · 海岛衬衫","Make by hand · Pearl and shell necklace":"动手制作 · 珍珠贝壳项链","Make by hand · Sun-printed pāreu":"动手制作 · 日晒印花 pāreu","Make by hand · Woven hat":"动手制作 · 编织帽","Manta rays visit cleaning stations in the lagoon, where small fish tidy their skin. Swim slowly, stay a few metres away, and never touch or chase them.":"蝠鲼会到泻湖里的清洁站，让小鱼帮它们清理皮肤。请慢慢游，保持几米距离，绝不要触摸或追逐它们。","Mantas and coral are fragile. Swim slowly, stay a few metres from wildlife, never touch or chase, and never stand on coral.":"蝠鲼和珊瑚都很脆弱。请慢慢游，与野生动物保持几米距离，绝不要触摸或追逐，也绝不要站在珊瑚上。","Manu":"Manu","Manu Tere":"Manu Tere","Manu Tere is a prototype. Travel times are approximate, and the Reo Māʻohi words and their pronunciation still need checking by native speakers.":"Manu Tere 还是一个原型。旅行时间仅供参考，Reo Māʻohi 词语及其发音仍需母语者核对。","Map of the Society Islands":"社会群岛地图","Map of the night sky":"夜空地图","Marama":"Marama","Marama · the moon tonight":"Marama · 今晚的月亮","Marquesas":"马克萨斯群岛","Massage with a tap instead":"改用点击来按摩","Matariʻi":"Matariʻi","Matariʻi · the Pleiades":"Matariʻi · 昴星团","Matira beach at sunset":"日落时分的 Matira 海滩","Matira is a public white-sand beach. The Hawaiki Nui Vaʻa canoe race ends here.":"Matira 是一片公共白沙滩。Hawaiki Nui Vaʻa 独木舟比赛在这里结束。","Matira · finish":"Matira · 终点","Maupiti":"Maupiti","Maupiti, coming soon":"Maupiti，即将开放","Maʻa Tahiti is served: <b>ʻUru</b>, <b>Taro</b>, <b>Fēʻī</b>, <b>Poʻe vānira</b>. The family shares a poʻe with you, and gives you seeds of fēʻī and taro. You can now cook in your own faʻaʻapu.":"Maʻa Tahiti 上桌了：<b>ʻUru</b>、<b>Taro</b>、<b>Fēʻī</b>、<b>Poʻe vānira</b>。这家人与你分享 poʻe，还送你 fēʻī 和 taro 的种子。现在你可以在自己的 faʻaʻapu 里烹饪了。","Maʻa Tahiti · Served":"Maʻa Tahiti · 已上桌","More islands will open in later versions, each greeting you in its own language.":"更多岛屿将在之后的版本中开放，每座岛都会用自己的语言问候你。","Mount Otemanu ({#1} m) rises from the middle of a wide lagoon ringed by motu.":"Otemanu 山（{#1} m）耸立在一片宽阔泻湖的中央，四周环绕着 motu。","Mount Rotui":"Rotui 山","Moʻorea":"Moʻorea","Moʻorea complete":"Moʻorea 已完成","Moʻorea grows the Queen Tahiti pineapple, small and very sweet, in the Opunohu valley below the Belvédère lookout. A plant takes {#1} to {#2} months to give one fruit. Growers pick it at the “turning” stage, when the bottom quarter turns yellow, cut the stalk with secateurs, and replant the shoots and crowns.":"Moʻorea 出产 Queen Tahiti 菠萝，个头小、非常甜，种在 Belvédère 观景台下方的 Opunohu 山谷里。一株菠萝要 {#1} 到 {#2} 个月才结一个果。果农在“转色”阶段采摘，也就是底部四分之一变黄的时候，用剪枝剪剪断果柄，再把侧芽和冠芽重新种下。","Moʻorea lies west of Tahiti. Keep the setting sun just above the mast.":"Moʻorea 位于 Tahiti 以西。让落日保持在桅杆正上方。","Moʻorea stamp":"Moʻorea 印章","Moʻorea stamp (not yet)":"Moʻorea 印章（尚未获得）","Moʻorea · Coral garden":"Moʻorea · 珊瑚花园","Moʻorea · Juice factory":"Moʻorea · 果汁工厂","Moʻorea · Lagoon friends":"Moʻorea · 泻湖朋友","Moʻorea · Pineapple harvest":"Moʻorea · 菠萝采收","Moʻorea, you are here":"Moʻorea，你在这里","My manu":"你的 manu","MĀTETE · MAPURU A PARAITA":"MĀTETE · MAPURU A PARAITA","MĀTETE · MARCHÉ DE PAPEETE":"MĀTETE · PAPEETE 市场","Māuruuru":"Māuruuru","NOT YET":"尚未获得","Name":"名字","Nana":"Nana","Navigators followed star paths. Each island has its <b>ʻaveiʻa</b>, a star that passes right over it: for Tahiti, Taʻurua-faupapa. Try it yourself on a voyage between the islands.":"航海者沿着星路航行。每座岛都有自己的 <b>ʻaveiʻa</b>，也就是正好从它上空经过的星星：Tahiti 的是 Taʻurua-faupapa。在岛屿之间航行时亲自试一试吧。","Navigators knew where many stars rise and set on the horizon, and used them as a compass. Taʻurua-faupapa (Sirius) passes right over Tahiti: it is the island’s ʻaveiʻa, its marker star.":"航海者知道许多星星在地平线上升起和落下的位置，并把它们当作指南针。Taʻurua-faupapa（天狼星）正好从 Tahiti 上空经过：它是这座岛的 ʻaveiʻa，即标记星。","Navigators of old would steer by <b>Matariʻi</b>, the Pleiades, setting. A night voyage.":"古代航海者会依靠正在落下的 <b>Matariʻi</b>（昴星团）掌舵。这是一次夜间航行。","Navigators of old would steer by <b>Te mahana</b>, the setting sun. A short day crossing: you can see the island from the shore.":"古代航海者会依靠落日 <b>Te mahana</b> 掌舵。这是一段很短的白天航程：从岸边就能看到那座岛。","Needs {#1} pearl and {#2} pūpū":"需要 {#1} 颗珍珠和 {#2} 个 pūpū","Needs {#1} pearl and {#2} pūpū · made":"需要 {#1} 颗珍珠和 {#2} 个 pūpū · 已制作","Needs {#1} vavai and {#2} dye":"需要 {#1} 份 vavai 和 {#2} 份染料","Needs {#1} ʻuru bark and {#2} dye (tiʻaʻiri, mati or rēʻa)":"需要 {#1} 份 ʻuru 树皮和 {#2} 份染料（tiʻaʻiri、mati 或 rēʻa）","New word: <b>E aha te huru?</b> · how are you?":"新词：<b>E aha te huru?</b> · 你好吗？","New word: <b>Haere mai</b> · come here":"新词：<b>Haere mai</b> · 过来","New word: <b>Māuruuru</b> · thank you":"新词：<b>Māuruuru</b> · 谢谢","New word: <b>Nana</b> · bye":"新词：<b>Nana</b> · 再见","New word: <b>pereʻoʻo</b> · car, vehicle":"新词：<b>pereʻoʻo</b> · 汽车，车辆","Next":"下一步","Next set coming…":"下一组即将到来…","Night":"夜晚","Night {#1} of the moon: <b>Roʻo nui</b>":"月亮的第 {#1} 夜：<b>Roʻo nui</b>","No wave at the rocks yet. Wait for it.":"浪还没打到岩石上。再等等。","Not yet! Opening lets the steam escape, and the cooking slows down.":"还不行！现在打开会让蒸汽跑掉，烹煮就会变慢。","Notre-Dame Cathedral":"圣母大教堂","Now lift the little flap that covers the stigma.":"现在掀起盖住柱头的小瓣。","Now!":"就是现在！","Nāmatarua":"Nāmatarua","On Fatu Hiva, in the Marquesas, tapa is still made by hand.":"在马克萨斯群岛的 Fatu Hiva，人们至今仍手工制作树皮布。","On a motu of Tahaʻa, a family is preparing an ahimāʻa for a celebration, and invites you to help.":"在 Tahaʻa 的一座 motu 上，一户人家正在为庆祝活动准备 ahimāʻa，邀请你来帮忙。","On approach to <b>Faʻaʻā, Tahiti</b>":"即将抵达 <b>Faʻaʻā, Tahiti</b>","On course":"航向正确","On towards Haamaremare…":"继续前往 Haamaremare…","One day a young stranger, Tua, came to pick flowers in the valley. Faʻuai called out to stop him, and in doing so she broke the tapu. The chief’s guards seized Tua. Then Faʻuai met Ivi, a mysterious being, the spirit of the valley. They fell in love and fled together, with the guards close behind.":"有一天，一个名叫 Tua 的年轻陌生人来山谷里采花。Faʻuai 出声阻止他，却因此打破了 tapu。酋长的卫兵抓住了 Tua。后来，Faʻuai 遇见了神秘的 Ivi，他是山谷的精灵。两人相爱并一起出逃，卫兵紧追在后。","One full-moon evening she set off in her canoe to visit the moon. She stepped onto it, and her canoe drifted away, never to be seen again. She stayed: the woman in the moon, who watches over travellers and beats tapa.":"一个满月的夜晚，她划着独木舟出发去拜访月亮。她踏上月亮，独木舟却漂走了，再也没有出现。她留了下来：成为月亮里的女人，守护着旅人，捶打着树皮布。","One night, Hiro and his companions sailed from Raiatea to steal Mount Rotui, the sacred mountain of Moʻorea. They tied long vines around its peak and began to pull.":"一天夜里，Hiro 和同伴们从 Raiatea 出航，想偷走 Moʻorea 的圣山 Rotui 山。他们用长藤缠住山顶，开始拉。","Open flower":"开放的花","Open the ahimāʻa":"打开 ahimāʻa","Orion’s Belt":"猎户座腰带","Otemanu":"Otemanu","Outrigger race":"舷外支架独木舟比赛","Outrigger race, done":"舷外支架独木舟比赛，已完成","Over":"上","Oyster growing a pearl":"正在孕育珍珠的珍珠贝","PAINAPO":"PAINAPO","PAPEETE":"PAPEETE","PORAPORA":"PORAPORA","PRESS":"压榨机","Paddle! · Hoe!":"划！· Hoe!","Paddling a vaʻa in the lagoon":"在泻湖里划 vaʻa","Pai and the pierced mountain":"Pai 与被刺穿的山","Painapo! That one will travel well.":"Painapo！这个运输途中不会坏。","Painapo<small>Pineapple harvest</small>":"Painapo<small>菠萝采收</small>","Papeete Market":"Papeete 市场","Papeete Market, done":"Papeete 市场，已完成","Papeete market, early in the morning":"清晨的 Papeete 市场","Papeete’s market, Mapuru a Paraita, is a two-storey hall in the heart of town. Downstairs: fruit, vegetables, fish and flowers, with tiare garlands. Upstairs: baskets, hats, carvings, pāreu and pearls, and snack bars serving poisson cru and fresh juice. It opens from {#1}:{#2} on weekdays and is busiest on Sunday from {#3}:{#4}, when families shop for the maʻa Tahiti, the traditional Sunday meal.":"Papeete 市场（Mapuru a Paraita）是位于市中心的一座两层大厅。楼下：水果、蔬菜、鱼和鲜花，还有 tiare 花环。楼上：篮子、帽子、雕刻、pāreu 和珍珠，以及供应生鱼沙拉（poisson cru）和鲜榨果汁的小吃摊。工作日 {#1}:{#2} 开门，周日 {#3}:{#4} 起最热闹，家家户户都来采购 maʻa Tahiti，也就是传统的周日大餐。","Parau":"Parau","Parau · Words":"Parau · 词语","Parrotfish crunch dead coral, and what comes out is fine white sand.":"鹦嘴鱼啃食死去的珊瑚，排出来的就是细细的白沙。","Part of the mountain broke away: the legend says this is how Moʻorea’s two bays were made. Across the water on Tahiti, the warrior Pai woke up, climbed a hill and threw his spear of hibiscus wood.":"山的一部分断裂了：传说 Moʻorea 的两个海湾就是这样形成的。在海对面的 Tahiti，勇士 Pai 醒来，爬上一座小山，掷出了他的木槿木长矛。","Passport":"护照","Paste a backup code or choose a save file. This replaces the voyage on this phone.":"粘贴备份码或选择存档文件。这会替换这部手机上的航行。","Pearl":"珍珠","Pearl and shell necklace":"珍珠贝壳项链","Pearl farms in the lagoons of the Tuamotu and Gambier islands welcome visitors.":"Tuamotu 群岛和 Gambier 群岛泻湖中的珍珠养殖场欢迎游客参观。","Pearl farms, a famous coral garden for drift snorkelling, and motu ringed with white sand surround it.":"周围有珍珠养殖场、一处适合随流浮潜的著名珊瑚花园，以及环绕着白沙的 motu。","Pearl line":"珍珠系列","Peek inside":"看看里面","Perfect distance. Let go and stay still…":"距离刚好。松开，保持不动…","Perfect fill!":"装得刚刚好！","Perfect!":"完美！","Perfect, on to the next flower.":"完美，去下一朵花吧。","Perfect: turning, sweet and firm.":"完美：正在转色，香甜又结实。","Pick a pineapple at the <b>turning</b> stage: the bottom quarter has turned yellow. Too green and it is sour; fully yellow or brown and it will spoil before it reaches the market.":"在<b>转色</b>阶段采摘菠萝：底部四分之一已经变黄。太青会酸；全黄或变褐的话，还没运到市场就会坏掉。","Pineapple fields of Opunohu":"Opunohu 的菠萝田","Pineapple harvest":"菠萝采收","Pineapple harvest, done":"菠萝采收，已完成","Pineapple plant, flowering":"菠萝植株，开花中","Pineapple plant, fully yellow":"菠萝植株，已全黄","Pineapple plant, green fruit":"菠萝植株，青果","Pineapple plant, overripe":"菠萝植株，过熟","Pineapple plant, turning: ready":"菠萝植株，正在转色：可以采了","Pineapple plant, young plant":"菠萝植株，幼苗","Plain":"素色","Plant":"种植","Plant in this plot":"种在这块地里","Plant, harvest, make":"种植、收获、制作","Plantain poʻe with Tahaʻa vanilla":"加了 Tahaʻa 香草的大蕉 poʻe","Plantations are family land: visit with a guide or by invitation, and buy vanilla directly from the growers.":"种植园是家族土地：请跟随向导或受邀参观，并直接向种植者购买香草。","Planted!":"种好了！","Play again":"再玩一次","Play: find the star":"玩一玩：找星星","Pocket":"浪腔","Pollinated flower":"已授粉的花","Pollinated! A pod will grow here.":"授粉成功！这里会长出一根豆荚。","Porapora":"Porapora","Porapora complete":"Porapora 已完成","Porapora is the island’s name in Reo Tahiti; Bora Bora is how visitors came to say it.":"Porapora 是这座岛在 Reo Tahiti 中的名字；波拉波拉是游客后来的叫法。","Porapora lies west of Tahaʻa: you can see it on the horizon. Keep the setting sun just above the mast.":"Porapora 位于 Tahaʻa 以西：你能在地平线上看到它。让落日保持在桅杆正上方。","Porapora lies west-northwest, close to where Matariʻi sets. Keep it just above the mast. A star is only useful near the horizon: watch it.":"Porapora 位于西北偏西，靠近 Matariʻi 落下的地方。让它保持在桅杆正上方。星星只有在靠近地平线时才有用：盯紧它。","Porapora · Bora Bora":"Porapora · 波拉波拉","Porapora · Outrigger race":"Porapora · 舷外支架独木舟比赛","Porapora · Stars over Matira":"Porapora · Matira 上空的星星","Porapora · Swim with a manta":"Porapora · 与蝠鲼同游","Poʻe is a sweet pudding of fruit mixed with starch, cooked in the oven and served with coconut milk. A split vanilla pod from Tahaʻa scents the fruit as it cooks.":"Poʻe 是一种用水果和淀粉混合、放进炉里烤熟、配椰奶食用的甜布丁。一根剖开的 Tahaʻa 香草荚会在烹煮时为水果增添香气。","Poʻe vānira":"Poʻe vānira","Press":"压榨机","Pāreu":"Pāreu","Pīpiri mā":"Pīpiri mā","Question {#1} of {#2} · {#3} found first time":"第 {#1} 题，共 {#2} 题 · 一次答对 {#3} 题","Raiatea":"Raiatea","Raiatea, coming soon":"Raiatea，即将开放","Rays glide over the sand. Watch them, don’t feed them.":"鳐鱼在沙地上滑过。看看就好，不要喂食。","Ready":"准备好了","Ready to eat":"可以吃了","Ready to make":"可以制作","Ready to make · made":"可以制作 · 已制作","Ready!":"好了！","Ready… {#1}":"准备… {#1}","Receive a gift":"收下礼物","Red band":"红色帽带","Restore":"恢复","Right · Hoe!":"右 · Hoe!","Right ▶":"右 ▶","Right: bruised fruit feeds the soil.":"没错：碰伤的果子可以滋养土壤。","Right: still green, it needs more time.":"没错：还是青的，需要再等等。","Ring the bell 🔔":"摇铃 🔔","Rotui<small>Juice factory</small>":"Rotui<small>果汁工厂</small>","Row done!":"这一排完成了！","Row {#1}:":"第 {#1} 排：","Ruataʻata and the ʻuru":"Ruataʻata 与 ʻuru","SOCIETY ISLANDS":"社会群岛","Sacks on: wet, so they hold the steam.":"盖上麻袋：要湿的，才能锁住蒸汽。","Sail by":"航行依靠：","Sail to <span>Moʻorea</span>":"驶向 <span>Moʻorea</span>","Sail to <span>Porapora</span> (Bora Bora)":"驶向 <span>Porapora</span>（波拉波拉）","Sail to <span>Tahaʻa</span>":"驶向 <span>Tahaʻa</span>","Sail to Porapora, or hear the legend of ʻOro there, to start your own pearl line.":"驶向 Porapora，或在那里聆听 ʻOro 的传说，开始你自己的珍珠系列。","Sand":"沙子","Sand last, or it falls into the food.":"最后盖沙子，不然沙子会掉进食物里。","Sand on. Now we wait.":"沙子盖好了。现在等着吧。","Save and restore":"保存与恢复","Save as a file":"保存为文件","See it for real":"看看真实的样子","Seeds come from activities, legends and harvests. Progress is saved on this phone only.":"种子来自活动、传说和收获。进度只保存在这部手机上。","Serve":"上菜","Set sail":"扬帆起航","Sew the shirt":"缝制衬衫","Sharp green ridges and little waterfalls surround it; it is one of the wettest places on the island.":"四周是陡峭的绿色山脊和小瀑布；这里是岛上最多雨的地方之一。","Shell":"贝壳","Shoulder":"浪肩","Show my manu":"展示我的 manu","Sirius":"天狼星","Skip":"跳过","Sky and sea":"天空与大海","Small print":"小图案","Snip!":"咔嚓！","Snorkelling in the lagoon":"在泻湖中浮潜","Snorkelling with a local guide":"跟随当地向导浮潜","Soak the <span>ʻuru</span> bark, then beat it with the <span>ʻiʻe</span> to make it wider and thinner.":"把 <span>ʻuru</span> 树皮泡软，再用 <span>ʻiʻe</span> 捶打，让它变得更宽更薄。","Some say ʻOro also gave her a black pearl as a token of his love. Pearls are farmed in Polynesia’s lagoons to this day.":"也有人说，ʻOro 还送给她一颗黑珍珠作为爱的信物。直到今天，波利尼西亚的泻湖里仍在养殖珍珠。","Sound off. Tap to turn on":"声音已关闭。点击开启","Sound on":"声音已开启","Sound on. Tap to mute":"声音已开启。点击静音","Spinner dolphins play outside the reef. Boats slow down and keep away.":"飞旋海豚在礁石外嬉戏。船只会减速并保持距离。","Staghorn (Acropora)":"鹿角珊瑚（Acropora）","Stamp: <b>Moʻorea</b>":"印章：<b>Moʻorea</b>","Stamp: <b>Porapora</b> · Bora Bora":"印章：<b>Porapora</b> · 波拉波拉","Stamp: <b>Tahaʻa</b>":"印章：<b>Tahaʻa</b>","Stamp: <b>Tahiti</b>. Tap the pins to explore, or tap your manu.":"印章：<b>Tahiti</b>。点击图钉去探索，或点击你的 manu。","Stamps":"印章","Stars over Matira":"Matira 上空的星星","Stars over Matira, done":"Matira 上空的星星，已完成","Start over":"重新开始","Stay behind the barrier":"待在屏障后面","Stay still… let it come to you.":"别动……让它自己游过来。","Steer left":"向左转舵","Steer right":"向右转舵","Steer right ▶":"向右转舵 ▶","Steering by the stars":"看星星掌舵","Still to visit":"尚待探访","Stop the game":"结束游戏","Sun-printed pāreu":"阳光印染的 pāreu","Sunglasses":"太阳镜","Surf Teahupoʻo":"在 Teahupoʻo 冲浪","Surf Teahupoʻo, done":"在 Teahupoʻo 冲浪，已完成","Swim gently":"轻轻地游","Swim with a manta":"与蝠鲼同游","Swim with a manta, done":"与蝠鲼同游，已完成","TAHAʻA":"TAHAʻA","TAHITI":"TAHITI","Table branch (Acropora)":"桌状珊瑚（Acropora）","Tahaʻa":"Tahaʻa","Tahaʻa complete":"Tahaʻa 已完成","Tahaʻa lies east of Porapora. Keep the rising sun just above the mast.":"Tahaʻa 位于 Porapora 以东。让初升的太阳保持在桅杆上方一点。","Tahaʻa shares one lagoon with its big sister Raiatea. It has no airport: boats cross from Raiatea in {#1} to {#2} minutes.":"Tahaʻa 与它的大姐姐 Raiatea 共享同一个泻湖。岛上没有机场：从 Raiatea 乘船过去需要 {#1} 到 {#2} 分钟。","Tahaʻa stamp":"Tahaʻa 印章","Tahaʻa stamp (not yet)":"Tahaʻa 印章（尚未获得）","Tahaʻa · Dry the vanilla":"Tahaʻa · 晾晒香草","Tahaʻa · Hand-pollinate vanilla":"Tahaʻa · 为香草人工授粉","Tahaʻa · The earth oven":"Tahaʻa · 地炉","Tahaʻa, you are here":"Tahaʻa，你在这里","Tahiti":"Tahiti","Tahiti and Moʻorea lie east-southeast, close to where ʻAna-mua rises. Keep it just above the mast. A star is only useful near the horizon: watch it.":"Tahiti 和 Moʻorea 位于东南偏东方向，靠近 ʻAna-mua 升起的地方。让它保持在桅杆上方一点。星星只有在靠近地平线时才有用：要盯着它。","Tahiti complete":"Tahiti 已完成","Tahiti lies east of Moʻorea. Keep the rising sun just above the mast.":"Tahiti 位于 Moʻorea 以东。让初升的太阳保持在桅杆上方一点。","Tahiti stamp":"Tahiti 印章","Tahiti · Dance to the drums":"Tahiti · 随鼓声起舞","Tahiti · Landmark":"Tahiti · 地标","Tahiti · Papeete Market":"Tahiti · Papeete 市场","Tahiti · Pereʻoʻo mataʻeinaʻa":"Tahiti · Pereʻoʻo mataʻeinaʻa","Tahiti · Surf Teahupoʻo":"Tahiti · 在 Teahupoʻo 冲浪","Tahiti · The blowhole":"Tahiti · 喷水洞","Tahiti · Three waterfalls":"Tahiti · 三瀑布","Tahiti, you are here":"Tahiti，你在这里","Tahitian vanilla pods are rinsed, wrapped in cotton cloths and set in the sun for a few hours a day, about thirty times, roughly a month of good weather. Then they are sorted, massaged one by one, and left to age for three to four months. From flower to finished pod takes more than a year.":"Tahiti 的香草荚先清洗，再用棉布包好，每天放在阳光下晒几个小时，大约晒三十次，也就是差不多一个月的好天气。然后进行分拣，一根一根地按摩，再放置陈化三到四个月。从花朵到成品香草荚，要花一年多的时间。","Tahiti’s only natural lake lies deep in the mountains of the south coast (Teva i Uta). Long ago part of the island collapsed, and blocks of volcanic rock dammed the valley over about {#1} m.":"Tahiti 唯一的天然湖泊深藏在南海岸（Teva i Uta）的群山之中。很久以前，岛的一部分发生崩塌，火山岩块在约 {#1} m 的范围内堵住了山谷。","Tap a pearl or a shell to thread it ({#1} in all, at least one pearl)":"点击珍珠或贝壳把它穿上（共 {#1} 颗，至少要有一颗珍珠）","Tap a plant to look closely.":"点击植物仔细看看。","Tap a star or a group of stars to learn its name in Reo Tahiti and its story.":"点击一颗星星或一组星星，了解它的 Reo Tahiti 名字和故事。","Tap the big button each time a beat reaches the circle. The pahu drum keeps time, you play the <span>tōʻere</span>.":"每当节拍到达圆圈时，点击大按钮。pahu 鼓负责打节奏，你来演奏 <span>tōʻere</span>。","Tap the cloth to lay a leaf ({#1} of {#2}).":"点击布料放上一片叶子（{#1}/{#2}）。","Tap the right one.":"点击正确的那个。","Tap the tōʻere":"点击 tōʻere","Tap to wear":"点击穿戴","Tapa":"Tapa","Tapa is cloth made of beaten bark: ʻuru, banyan (ʻōrā) or paper mulberry. Women beat it with a grooved beater, the ʻiʻe, on a wooden anvil until it is four or five times wider. Plants give the colours: rēʻa for yellow, mati and tou for red-brown, tiʻaʻiri for black.":"Tapa 是用捶打过的树皮制成的布料，原料有 ʻuru、榕树（ʻōrā）或构树。妇女们在木砧上用带凹槽的捶棒 ʻiʻe 捶打树皮，直到它变宽四五倍。颜色来自植物：rēʻa 染黄色，mati 和 tou 染红褐色，tiʻaʻiri 染黑色。","Taro":"芋头","Taste":"品尝","Tauhā":"Tauhā","Tautoru":"Tautoru","Tautoru · Orion’s Belt":"Tautoru · 猎户座腰带","Taʻurua-faupapa":"Taʻurua-faupapa","Taʻurua-faupapa · Sirius":"Taʻurua-faupapa · 天狼星","Te Fenua Māʻohi":"Te Fenua Māʻohi","Te Matau a Māui":"Te Matau a Māui","Te Vaiora":"Te Vaiora","Te fenua · The islands":"Te fenua · 群岛","Te mahana":"Te mahana","Te mau fetiʻa<small>Stars over Matira</small>":"Te mau fetiʻa<small>Matira 上空的星星</small>","Te mātete<small>Papeete Market</small>":"Te mātete<small>Papeete 市场</small>","Te raʻi":"Te raʻi","Te raʻi, the night sky":"Te raʻi，夜空","Te tairoto<small>Lagoon friends</small>":"Te tairoto<small>泻湖朋友</small>","Te toʻa<small>Coral garden</small>":"Te toʻa<small>珊瑚花园</small>","Te vānira<small>Dry the vanilla</small>":"Te vānira<small>晾晒香草</small>","Teahupoʻo, at the end of the road on Tahiti Iti, hosted the surfing events of the Paris {#1} Olympic Games. The wave breaks over a shallow reef and is for experts only: watch it from a boat. Beginners learn on gentler spots with a local surf school.":"Teahupoʻo 位于 Tahiti Iti 公路的尽头，曾举办 {#1} 年巴黎奥运会的冲浪比赛。这里的海浪在浅礁上破碎，只适合高手：请从船上观看。初学者可以跟着当地冲浪学校在更平缓的地方学习。","Tere":"Tere","Tere, your manu. Tap to hear a word.":"Tere，你的 manu。点击听一个单词。","That one is haʻari (coconut). Look again.":"那是 haʻari（椰子）。再看看。","That one is meiʻa (banana). Look again.":"那是 meiʻa（香蕉）。再看看。","That one is tiare (flower; the tiare Tahiti gardenia). Look again.":"那是 tiare（花；即 tiare Tahiti 栀子花）。再看看。","That one is vī (mango). Look again.":"那是 vī（芒果）。再看看。","That one is ʻiʻa (fish). Look again.":"那是 ʻiʻa（鱼）。再看看。","That one is ʻuru (breadfruit). Look again.":"那是 ʻuru（面包果）。再看看。","That one was bruised: it should go to the compost.":"这个碰伤了：应该拿去堆肥。","That star sets far north of our course: we would miss the island. Look for the one at the same point as Matariʻi.":"那颗星星落在我们航线的远北方：我们会错过岛屿。找一颗和 Matariʻi 在同一位置的星星。","The Arahoho blowhole on Tahiti's east coast":"Tahiti 东海岸的 Arahoho 喷水洞","The Belvédère lookout":"Belvédère 观景台","The Belvédère lookout looks down on both bays and the pineapple fields of the Opunohu valley.":"从 Belvédère 观景台可以俯瞰两个海湾和 Opunohu 山谷的菠萝田。","The Cathedral of Notre-Dame de l’Immaculée Conception stands near the waterfront in the middle of Papeete, on rue du Général de Gaulle. Finished in {#1}, it is one of the last examples of the town’s early colonial architecture.":"无染原罪圣母主教座堂位于 Papeete 市中心的海滨附近，在戴高乐将军街上。它于 {#1} 年建成，是这座城市早期殖民建筑最后的代表之一。","The Faarumai valley in Tiarei, on Tahiti’s east coast, hides three waterfalls: Vaimahuta ({#1} m), a few minutes from the car park, then Haamaremare Iti ({#2} m) and Haamaremare Rahi ({#3} m), {#4} to {#5} minutes further on. The site is open every day. After heavy rain the streams rise fast, so check the weather before you walk.":"Faarumai 山谷位于 Tahiti 东海岸的 Tiarei，藏着三道瀑布：Vaimahuta（{#1} m）离停车场只有几分钟路程，再往前走 {#4} 到 {#5} 分钟，就是 Haamaremare Iti（{#2} m）和 Haamaremare Rahi（{#3} m）。景区每天开放。大雨过后溪水会迅速上涨，出发前请先查看天气。","The Heiva i Tahiti in July":"七月的 Heiva i Tahiti 节","The Reo Māʻohi words stay in Reo Māʻohi.":"Reo Māʻohi 单词保留 Reo Māʻohi 原文。","The anthias are back!":"金花鲈回来了！","The blowhole":"喷水洞","The blowhole, done":"喷水洞，已完成","The blue-green chromis are back!":"蓝绿光鳃鱼回来了！","The butterflyfish are back!":"蝴蝶鱼回来了！","The coral garden drift snorkel":"珊瑚花园漂流浮潜","The earth oven":"地炉","The earth oven, done":"地炉，已完成","The lagoon of Mangareva and its pearls.":"Mangareva 的泻湖和它的珍珠。","The lagoon of Porapora seen from above":"从空中俯瞰 Porapora 的泻湖","The largest island of French Polynesia: two volcanoes, Tahiti Nui and Tahiti Iti, joined at the isthmus of Taravao.":"法属波利尼西亚最大的岛屿：Tahiti Nui 和 Tahiti Iti 两座火山在 Taravao 地峡相连。","The lookout over Teahupoʻo, at the end of the road":"公路尽头的 Teahupoʻo 观景点","The night sky over Matira beach":"Matira 海滩上空的夜空","The parrotfish is back!":"鹦嘴鱼回来了！","The picked pods are rinsed, wrapped in cotton cloths and put out in the sun, a few hours each day, for weeks. Too little sun and they stay damp and can go mouldy; too much and they dry out and crack.":"采下的香草荚先清洗，再用棉布包好放到阳光下，每天晒几个小时，持续好几周。晒得太少，它们会一直潮湿，可能发霉；晒得太多，又会干裂。","The shadows on the moon are a banyan tree, the ʻōrā. One of its branches fell to ʻŌpoa, on Raiatea, and became the first banyan on earth. Its bark, like the ʻuru’s, can be beaten into tapa.":"月亮上的阴影是一棵榕树，叫 ʻōrā。它的一根树枝落到了 Raiatea 岛的 ʻŌpoa，成为世界上第一棵榕树。它的树皮和 ʻuru 的一样，可以捶打成 tapa。","The sky of the fenua":"fenua 的天空","The spear went straight through a mountain and left a hole: Mouaputa, the pierced mountain. The blow woke the roosters, and they crowed. Thinking dawn had come, the thieves ran away. You can still see the hole in Mouaputa today.":"长矛笔直地穿过一座山，留下一个洞：这就是 Mouaputa，被刺穿的山。这一击惊醒了公鸡，它们啼叫起来。小偷们以为天亮了，就逃走了。今天你仍能看到 Mouaputa 上的那个洞。","The stall-keeper asks for":"摊主想要","The stall-keeper says <span>Māuruuru!</span> Your basket is full.":"摊主说 <span>Māuruuru!</span> 你的篮子装满了。","The sun is printing…":"阳光正在印染……","The swell rolls into a cave under the rocks and shoots out of the hole with a howl. Only <b>big</b> waves make it blow. Tap <b>Now!</b> when a big wave reaches the rocks.":"海浪涌进岩石下的洞穴，再呼啸着从洞口喷出。只有<b>大</b>浪才能让它喷水。当大浪到达岩石时，点击<b>就是现在！</b>","The track is best done with a guided {#1}×{#2} or quad tour. Clouds often gather in the afternoon, so go early.":"这条路线最好参加有向导的 {#1}×{#2} 越野车或四轮摩托之旅。下午常常起云，所以要早点出发。","The trail climbs through ferns and ʻape leaves… about {#1} to {#2} minutes to the next falls.":"小路穿过蕨类和 ʻape 叶向上攀升……到下一道瀑布大约需要 {#1} 到 {#2} 分钟。","The trail through the Faarumai valley":"穿过 Faarumai 山谷的小路","The tree that saved a family":"拯救了一家人的树","The vanilla island · {#1} of {#2} activities done":"香草之岛 · 已完成 {#1}/{#2} 项活动","The view of Otemanu from the motu":"从 motu 眺望 Otemanu","The woman who beats tapa":"捶打 tapa 的女人","These stars are not all up on the same night of the year. They are gathered here so you can learn them.":"这些星星并不会在一年中的同一个夜晚全部出现。把它们放在一起，是为了方便你认识它们。","This game is a simplified version of their art.":"这个游戏是他们技艺的简化版。","This strip goes under.":"这一条从下面穿过。","Three waterfalls":"三瀑布","Three waterfalls, done":"三瀑布，已完成","Three waves ridden in the pocket at Teahupoʻo.":"在 Teahupoʻo 的浪管里驾驭了三道浪。","Tiare":"Tiare","Tiare band (uses {#1})":"Tiare 花环（使用 {#1}）","Tie the hei":"系上 hei","Tied on!":"系好了！","To Bora Bora: about {#1} minutes by plane from Faʻaʻā.":"前往波拉波拉：从 Faʻaʻā 乘飞机约 {#1} 分钟。","To Bora Bora: by boat or a short flight from Raiatea.":"前往波拉波拉：从 Raiatea 乘船或乘短途航班。","To Bora Bora: by plane, usually through Tahiti.":"前往波拉波拉：乘飞机，通常经由 Tahiti。","To Moʻorea: about {#1}–{#2} minutes by ferry from Papeete.":"前往 Moʻorea：从 Papeete 乘渡轮约 {#1}–{#2} 分钟。","To Moʻorea: boat to Raiatea, then a plane via Tahiti.":"前往 Moʻorea：乘船到 Raiatea，再经 Tahiti 转机。","To Moʻorea: by plane, usually through Tahiti.":"前往 Moʻorea：乘飞机，通常经由 Tahiti。","To Tahaʻa: about {#1} minutes by plane to Raiatea, then a boat across the lagoon.":"前往 Tahaʻa：乘飞机约 {#1} 分钟到 Raiatea，再乘船穿过泻湖。","To Tahaʻa: by boat or a short flight via Raiatea.":"前往 Tahaʻa：乘船或乘短途航班经由 Raiatea。","To Tahaʻa: by plane via Tahiti to Raiatea, then a boat.":"前往 Tahaʻa：乘飞机经 Tahiti 到 Raiatea，再乘船。","To Tahiti: about {#1} minutes by plane to Faʻaʻā.":"前往 Tahiti：乘飞机约 {#1} 分钟到 Faʻaʻā。","To Tahiti: about {#1}–{#2} minutes by ferry to Papeete.":"前往 Tahiti：乘渡轮约 {#1}–{#2} 分钟到 Papeete。","To Tahiti: boat to Raiatea, then about {#1} minutes by plane.":"前往 Tahiti：乘船到 Raiatea，再乘飞机约 {#1} 分钟。","To escape, Ivi and Faʻuai turned into waterfalls and became part of the valley forever. A third fall burst out of the cliff and swept their pursuers away. Today you can see the three falls: Vaimahuta, Haamaremare Iti and Haamaremare Rahi.":"为了逃跑，Ivi 和 Faʻuai 变成了瀑布，永远成为山谷的一部分。第三道瀑布从悬崖中喷涌而出，冲走了追赶他们的人。今天你可以看到这三道瀑布：Vaimahuta、Haamaremare Iti 和 Haamaremare Rahi。","To the press!":"去压榨！","Today: about {#1} minutes by plane to Raiatea, then a boat across the lagoon.":"如今：乘飞机约 {#1} 分钟到 Raiatea，再乘船穿过泻湖。","Today: about {#1}–{#2} minutes by ferry from Papeete.":"如今：从 Papeete 乘渡轮约 {#1}–{#2} 分钟。","Today: by plane, usually through Tahiti.":"如今：乘飞机，通常经由 Tahiti。","Together we’ll sail the islands of French Polynesia the way the navigators of old did, by the sun and the stars, and pick up some Reo Māʻohi on the way.":"我们将一起像古代航海家那样，靠太阳和星星航行在法属波利尼西亚的岛屿之间，还会顺便学一些 Reo Māʻohi。","Too early: the swell has not reached you.":"太早了：海浪还没到你这里。","Too far out on the shoulder. Ease off.":"在浪肩上太靠外了。放松一点。","Touchdown!":"着陆！","Trail start · car park":"步道起点 · 停车场","Tuamotu":"Tuamotu","Turn sound off":"关闭声音","Turn sound on":"开启声音","Twill":"斜纹","Two deep bays, Cook’s Bay and Opunohu Bay, frame Mount Rotui.":"Cook 湾和 Opunohu 湾两个深湾环抱着 Rotui 山。","Tāupoʻo":"Tāupoʻo","Under":"下","Undo":"撤销","Unwrap in the sun":"在阳光下打开","Vaimahuta":"Vaimahuta","Vaimahuta, {#1} m, is only a few minutes from the car park. Feel the cool spray.":"Vaimahuta 高 {#1} m，离停车场只有几分钟路程。感受一下清凉的水雾吧。","Vaimahuta: {#1} m.":"Vaimahuta：{#1} m。","Vanilla flower":"香草花","Vanilla is an orchid: a climbing vine grown on supports. A new plant flowers after two to three years. In Polynesia the flowers are pollinated by hand, usually from July to October, with a small stick that lifts the flap between pollen and stigma. The pod ripens nine to ten months later. Vanilla came to Tahiti around {#1}.":"香草是一种兰花：一种攀附在支架上生长的藤本植物。新株种下两到三年后开花。在波利尼西亚，香草花靠人工授粉，通常在七月到十月，用一根小木棍挑起花粉和柱头之间的薄片。香草荚在九到十个月后成熟。香草大约在 {#1} 年传入 Tahiti。","Vaʻa racing is the national sport. Every year the Hawaiki Nui Vaʻa race crosses the open sea from Huahine to Raiatea, Tahaʻa and Porapora, and ends on Matira beach.":"vaʻa 划船比赛是这里的国民运动。每年 Hawaiki Nui Vaʻa 比赛都会横渡大海，从 Huahine 出发，经过 Raiatea、Tahaʻa 和 Porapora，最后在 Matira 海滩结束。","Violet":"紫罗兰色","Visit for real · The big island":"实地游览 · 大岛","Visit for real · The lagoon island":"实地游览 · 泻湖之岛","Visit for real · The sister island":"实地游览 · 姐妹岛","Visit for real · The vanilla island":"实地游览 · 香草之岛","Voyage · Bora Bora to Tahaʻa":"航行 · 波拉波拉到 Tahaʻa","Voyage · Bora Bora to Tahiti":"航行 · 波拉波拉到 Tahiti","Voyage · Moʻorea to Bora Bora":"航行 · Moʻorea 到波拉波拉","Voyage · Moʻorea to Tahiti":"航行 · Moʻorea 到 Tahiti","Voyage · Tahaʻa to Bora Bora":"航行 · Tahaʻa 到波拉波拉","Voyage · Tahiti to Bora Bora":"航行 · Tahiti 到波拉波拉","Voyage · Tahiti to Moʻorea":"航行 · Tahiti 到 Moʻorea","Voyage · Tahiti to Tahaʻa":"航行 · Tahiti 到 Tahaʻa","Voyage · about {#1} km":"航行 · 约 {#1} km","Vānira<small>Hand-pollinate vanilla</small>":"Vānira<small>为香草人工授粉</small>","Wait for it…":"等一下……","Wait until it reaches you on the belt.":"等它沿着传送带来到你面前。","Walk up the Faarumai valley, in Tiarei on Tahiti’s east coast, to find its three waterfalls. Hold <b>Walk</b>.":"沿着 Tahiti 东海岸 Tiarei 的 Faarumai 山谷向上走，去寻找那三道瀑布。按住<b>行走</b>。","Warm water can bleach coral. On Moʻorea, teams such as Coral Gardeners grow fragments at least {#1} cm long on ropes in underwater nurseries, clean them every month (every week in the hot season), and after about two to three years plant them back on the reef. Reef-safe sunscreen and never touching coral both help.":"海水变暖会让珊瑚白化。在 Moʻorea，像 Coral Gardeners 这样的团队会把至少 {#1} cm 长的珊瑚碎片挂在水下苗圃的绳子上培育，每月清洁一次（炎热季节每周一次），大约两到三年后再把它们种回礁石上。使用对珊瑚礁无害的防晒霜、永远不触碰珊瑚，都能帮上忙。","Watch the sea…":"看着大海……","Wave {#1} of {#2}":"第 {#1}/{#2} 道浪","Wear":"穿戴","Wearing":"穿戴中","Wet sacks":"湿麻袋","Whale watching, roughly July to November":"观鲸，大约在七月到十一月","When she came back, the head had become a tall tree with long leaves like hair: the first coconut palm. Look at a coconut: its three dark spots are the eel’s two eyes and mouth. Years later, in a dry season, Hina drank from a coconut, and so she kissed the eel after all.":"她回来时，那颗头已经长成一棵高高的树，长长的叶子像头发一样：这就是第一棵椰子树。看看椰子：它上面的三个黑点就是鳗鱼的两只眼睛和嘴巴。多年以后，在一个旱季，Hina 喝了一个椰子里的水，终究还是吻了那条鳗鱼。","Where does this one go?":"这个应该放在哪里？","Where is Nāmatarua?":"Nāmatarua 在哪里？","Where is Pīpiri mā?":"Pīpiri mā 在哪里？","Where is Te Vaiora?":"Te Vaiora 在哪里？","Where shall we sail?":"我们要航行去哪里？","Whoosh! The cave howls.":"呼！洞穴在呼啸。","With respect":"心怀尊重","Words":"单词","Words from this activity":"这项活动中的单词","Woven hat":"编织帽","Woven hats are sold at Papeete market and at craft fairs. Buying from the weaver supports the craft.":"Papeete 市场和手工艺集市上都有编织帽出售。直接向编织者购买可以支持这门手艺。","Wrap and bring in":"包好收回","Yellow façade, red steeple facing Mont Aorai, and maroon arched windows.":"黄色的外墙，朝向 Aorai 山的红色尖塔，还有栗色的拱形窗户。","Yes! haʻari means coconut.":"对！haʻari 的意思是椰子。","Yes! meiʻa means banana.":"对！meiʻa 的意思是香蕉。","Yes! tiare means flower; the tiare Tahiti gardenia.":"对！tiare 的意思是花；即 tiare Tahiti 栀子花。","Yes! vī means mango.":"对！vī 的意思是芒果。","Yes! ʻiʻa means fish.":"对！ʻiʻa 的意思是鱼。","You are here":"你在这里","You can read four guide stars of the Polynesian sky.":"你能读懂波利尼西亚天空中的四颗引路星了。","You cleaned the nursery, hung six new fragments and planted four corals back on the reef.":"你清洁了苗圃，挂上了六块新的珊瑚碎片，还把四株珊瑚种回了礁石上。","You crossed the line at Matira in {#1} s, ahead of the other canoe!":"你用 {#1} 秒冲过了 Matira 的终点线，领先另一条独木舟！","You hand-pollinated {#1} vanilla flowers.":"你为 {#1} 朵香草花进行了人工授粉。","You know {#1} of {#2} stars. Learn them all to give your manu a cloak of stars.":"你已认识 {#1}/{#2} 颗星星。全部学会，就能给你的 manu 一件星星斗篷。","You met all five lagoon friends, without touching any of them.":"你认识了全部五位泻湖朋友，而且没有碰到任何一位。","You played {#1} of {#2} beats.":"你打中了 {#1}/{#2} 个节拍。","You sorted {#1} of {#2} pineapples correctly and filled five bottles of painapo juice.":"你正确分拣了 {#1}/{#2} 个菠萝，装满了五瓶 painapo 果汁。","You walked to the three falls of Faarumai: Haamaremare Rahi ({#1} m), Vaimahuta ({#2} m) and Haamaremare Iti ({#3} m).":"你走到了 Faarumai 的三道瀑布：Haamaremare Rahi（{#1} m）、Vaimahuta（{#2} m）和 Haamaremare Iti（{#3} m）。","You watched a manta from a respectful distance.":"你在保持尊重的距离外观看了一只蝠鲼。","Your basket":"你的篮子","Your first black pearl, and a pearl line in your faʻaʻapu":"你的第一颗黑珍珠，还有你的 faʻaʻapu 里的一排珍珠","Your manu":"你的 manu","Your manu is wearing it. Change what it wears in <b>My manu</b>.":"你的 manu 正穿戴着它。可以在<b>我的 manu</b>中更换它的穿戴。","Your manu loved it. Māuruuru!":"你的 manu 很喜欢。Māuruuru!","Your manu now wears a hei, a crown of flowers. You can change it in <b>My manu</b>.":"你的 manu 现在戴上了 hei，一顶花冠。你可以在<b>我的 manu</b>中更换。","Your manu now wears a pāreu. You can change it in <b>My manu</b>.":"你的 manu 现在穿上了 pāreu。你可以在<b>我的 manu</b>中更换。","Your manu now wears a vanilla flower behind the ear. You can change it in <b>My manu</b>.":"你的 manu 现在耳后别着一朵香草花。你可以在<b>我的 manu</b>中更换。","Your manu now wears sunglasses for the lagoon light. You can change it in <b>My manu</b>.":"你的 manu 现在戴上了太阳镜，抵挡泻湖的强光。你可以在<b>我的 manu</b>中更换。","Your stamps, words, garden and crafts live on this phone. Copy this code somewhere safe (notes, an email to yourself). With it you can get everything back, even on a new phone.":"你的印章、单词、菜园和手工作品都保存在这部手机上。请把这个代码复制到安全的地方（备忘录，或发给自己的邮件）。有了它，即使换了新手机，也能找回所有内容。","Your tapa hangs in your Passport.":"你的 tapa 挂在你的护照里。","activities":"活动","a   for(const l of Object.keys(D)){ const x={}, p=[];
    for(const [k,v] of Object.entries(D[l])){ if(!v) continue;
      if(/\{[A-Z]\}/.test(k)){ const names=[]; const re=new RegExp('^'+k.replace(/[.*+?^$()|[\]\\]/g,'\\$&').replace(/\\?\{([A-Z])\\?\}/g,(m,c)=>{ names.push(c); return '(.+?)'; }).replace(/[{}]/g,'\\$&')+'$'); p.push([re,v,names,k.length]); }
      else x[k]=v; }
    p.sort((a,b)=>b[3]-a[3]); I18N[l]={x,p}; } })();
const COLLECT=!!window.__I18N_COLLECT; const MISS=new Set(); let NOREC=0; if(COLLECT){ window.__I18N_MISS=MISS; I18N.xx={x:{},p:[]}; }
if(!S.lang){ const nl=(navigator.language||'en').slice(0,2).toLowerCase(); S.lang=I18N[nl]?nl:'en'; }
let LANG=COLLECT?(window.__I18N_LANG||'xx'):(S.lang&&I18N[S.lang]?S.lang:'en');
const CACHE=new Map();
const ENT={'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&#39;':"'",'&nbsp;':' '};
const normHTML=h=>h.replace(/<(\/?)([a-zA-Z][a-zA-Z0-9]*)[^>]*?>/g,(m,s,t)=>`<${s}${t.toLowerCase()}>`).replace(/&(amp|lt|gt|quot|#39|nbsp);/g,m=>ENT[m]).replace(/\s+/g,' ').trim();
function numNorm(s){ const nums=[]; const k=s.replace(/<[^>]*>|\{[^}]*\}|\d+(?:[.,]\d+)*/g,m=>{ if(m[0]==='<'||m[0]==='{') return m; nums.push(m); return '{#'+nums.length+'}'; }); return {k,nums}; }
const hasWords=s=>/[A-Za-z]{2,}/.test(s.replace(/<[^>]*>/g,''));
function tr(s, inner){ if(LANG==='en'||!s) return null; const D=I18N[LANG]; if(!D) return null;
  const ck=LANG+'\u0001'+s; if(CACHE.has(ck)) return CACHE.get(ck);
  let out=null; const {k,nums}=numNorm(s);
  const v=D.x[k];
  if(v!=null) out=v.replace(/\{#(\d+)\}/g,(m,n)=>nums[n-1]!=null?nums[n-1]:m);
  else if(!inner){ for(const [re,val,names] of D.p){ const m=re.exec(s); if(m){ out=val.replace(/\{([A-Z])\}/g,(mm,c)=>{ const g=m[names.indexOf(c)+1]; if(g==null) return mm; const t=tr(g.trim(),true); return t!=null?t:g; }); break; } } }
  if(out==null && COLLECT && !inner && !NOREC && hasWords(s)) MISS.add(k);
  if(CACHE.size>4000) CACHE.clear(); if(out!=null||!COLLECT) CACHE.set(ck,out); return out; }
function restoreAttrs(src,out){ const tags={}; src.replace(/<([a-zA-Z][a-zA-Z0-9]*)(\s[^>]*)?>/g,(m,t)=>{ t=t.toLowerCase(); (tags[t]=tags[t]||[]).push(m); }); const idx={};
  return out.replace(/<([a-zA-Z][a-zA-Z0-9]*)>/g,(m,t)=>{ t=t.toLowerCase(); const a=tags[t]; if(!a) return m; const i=idx[t]||0; idx[t]=i+1; return a[Math.min(i,a.length-1)]; }); }

const INLINE=new Set(['B','I','EM','STRONG','U','BR','SMALL','SUP','SUB','SPAN','MARK','ABBR','Q','S','A']);
const SKIP=new Set(['SCRIPT','STYLE','TEXTAREA','INPUT','SELECT','OPTION','CODE','PRE']);
const MEMO=new WeakMap(), AMEMO=new WeakMap();
const skipEl=el=>SKIP.has(el.tagName)||el.isContentEditable||(el.hasAttribute&&el.hasAttribute('data-noi18n'))||(el.classList&&el.classList.contains('reo'));
function inlineOnly(el){ for(const c of el.children){ if(!INLINE.has(c.tagName)||c.id||c.hasAttribute('data-noi18n')||!inlineOnly(c)) return false; } return true; }
function isUnit(el){ if(el instanceof SVGElement) return false; let txt=false; for(const c of el.childNodes) if(c.nodeType===3&&c.data.trim()){ txt=true; break; } return txt&&el.children.length>0&&inlineOnly(el); }
function doText(tn){ const cur=tn.data; if(!cur.trim()) return; const m=MEMO.get(tn); if(m&&cur===m.out&&m.lang===LANG) return;
  const src=(m&&cur===m.out)?m.src:cur; let out=src;
  if(LANG!=='en'){ const key=src.replace(/\s+/g,' ').trim(); const t=tr(key); if(t!=null){ const lead=src.match(/^\s*/)[0], trail=src.match(/\s*$/)[0]; out=lead+t+trail; } }
  if(out!==cur) tn.data=out; MEMO.set(tn,{src,out,lang:LANG}); }
function doUnit(el){ const cur=el.innerHTML; const m=MEMO.get(el); if(m&&cur===m.out&&m.lang===LANG) return true;
  const src=(m&&cur===m.out)?m.src:cur;
  if(LANG==='en'){ if(cur!==src) el.innerHTML=src; MEMO.set(el,{src,out:el.innerHTML,lang:LANG}); return true; }
  const v=tr(normHTML(src));
  if(v==null){ if(cur!==src) el.innerHTML=src; NOREC++; try{ for(const c of [...el.childNodes]) visit(c); } finally{ NOREC--; } MEMO.set(el,{src,out:el.innerHTML,lang:LANG,miss:1}); return true; }
  el.innerHTML=restoreAttrs(src,v); MEMO.set(el,{src,out:el.innerHTML,lang:LANG}); return true; }
const ATTRS=['aria-label','title','alt','placeholder'];
function doAttrs(el){ for(const a of ATTRS){ if(!el.hasAttribute(a)) continue; const cur=el.getAttribute(a); let mm=AMEMO.get(el); if(!mm){ mm={}; AMEMO.set(el,mm); } const m=mm[a];
    if(m&&cur===m.out&&m.lang===LANG) continue; const src=(m&&cur===m.out)?m.src:cur; let out=src;
    if(LANG!=='en'){ const t=tr(src.replace(/\s+/g,' ').trim()); if(t!=null) out=t.replace(/<[^>]*>/g,''); }
    if(out!==cur) el.setAttribute(a,out); mm[a]={src,out,lang:LANG}; } }
function visit(n){ if(n.nodeType===3){ const p=n.parentNode; if(p&&p.nodeType===1&&skipEl(p)) return; doText(n); return; }
  if(n.nodeType!==1||skipEl(n)) return;
  if(n.tagName==='svg'||n.tagName==='SVG'){ if(!n.querySelector('text')) return; }
  doAttrs(n);
  if(isUnit(n)){ doUnit(n); return; }
  for(const c of [...n.childNodes]) visit(c); }
function sameText(el,en){ const t=(el.textContent||'').replace(/\s+/g,' ').trim(); return t===en||t===(tr(en)||en); }
function i18nAll(){ visit(document.body); }
function setLang(l){ if(!I18N[l]&&l!=='en') return; LANG=l; S.lang=l; save(); document.documentElement.lang=l==='zh'?'zh-Hans':l; CACHE.clear(); i18nAll(); }
if(LANG!=='en'&&LANG!=='xx') document.documentElement.lang=LANG==='zh'?'zh-Hans':LANG;
new MutationObserver(muts=>{ if(LANG==='en') return; const seen=new Set();
  for(const m of muts){ const t=m.type==='characterData'?m.target:m.target; if(seen.has(t)) continue; seen.add(t);
    if(t.nodeType===3){ const p=t.parentNode; if(p&&p.nodeType===1&&isUnit(p)) visit(p); else visit(t); }
    else visit(t); } }).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTRS});

injectCSS('i18n',`
:root[lang="ja"]{--display:"Fredoka","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;--body:"Nunito","Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif}
:root[lang="zh-Hans"]{--display:"Fredoka","PingFang SC","Noto Sans SC","Microsoft YaHei","Heiti SC",sans-serif;--body:"Nunito","PingFang SC","Noto Sans SC","Microsoft YaHei","Heiti SC",sans-serif}
:root[lang="ja"] body,:root[lang="zh-Hans"] body{line-break:strict;word-break:normal}
.langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.langs button{border:1.5px solid var(--line,#D5E7EA);background:var(--surface,#fff);border-radius:999px;padding:6px 12px;min-height:40px;font-family:var(--display);font-weight:600;font-size:.95rem;cursor:pointer}
.langs button.on{background:var(--ocean,#0E6A80);border-color:var(--ocean,#0E6A80);color:#fff}
.langlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.langlist button{justify-content:flex-start;width:100%;font-size:1.05rem}
.langlist button.on{outline:3px solid var(--ocean,#0E6A80)}
`);
const langChips=()=>`<div class="langs" role="group" aria-label="Language" data-noi18n>${LANGS.map(([c,n])=>`<button type="button" data-lang="${c}" class="${LANG===c?'on':''}" lang="${c}" data-noi18n>${n}</button>`).join('')}</div>`;
function bindLangChips(root){ $$('[data-lang]',root).forEach(b=>b.onclick=()=>{ setLang(b.dataset.lang); $$('[data-lang]',root).forEach(x=>x.classList.toggle('on',x===b)); }); }
function openLang(){ openSheet(`<div class="shead"><div><div class="eyebrow">Language</div><h2>Choose your language</h2></div>${XBTN}</div><p class="small">The Reo Māʻohi words stay in Reo Māʻohi.</p><div class="langlist" data-noi18n>${LANGS.map(([c,n])=>`<button class="btn ${LANG===c?'on':''}" data-lang="${c}" lang="${c}">${n}</button>`).join('')}</div>`);
  $$('#sheet [data-lang]').forEach(b=>b.onclick=()=>{ setLang(b.dataset.lang); closeSheet(); }); }

/* welcome screen: language chips at the top of the card */
const _openWelcome20=openWelcome;
openWelcome=function(){ _openWelcome20(); const card=$('#fullIn .card'); if(card){ card.insertAdjacentHTML('afterbegin',langChips()); bindLangChips(card); } };
/* header: a globe button */
(function(){ const sky=$('#skyBtn'); if(!sky||$('#langBtn')) return; const b=document.createElement('button'); b.className='ibtn'; b.id='langBtn'; b.setAttribute('aria-label','Language');
  b.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3Z"/></svg>';
  sky.parentNode.insertBefore(b,sky); b.onclick=()=>{ ac(); openLang(); }; })();

if(LANG!=='en') i18nAll();

/* ---------- start ---------- */
$('#dMap').onclick=()=>{ ac(); MAPSEL=null; openMap(); };

$('#dPass').onclick=()=>{ ac(); openPassport(); };

$('#skyBtn').onclick=()=>{ ac(); SKYST.sel=null; SKYST.quiz=null; SKYST.done=undefined; openSky(); };
$('#soundBtn').onclick=()=>{ S.sound=!S.sound; save(); renderHeader(); if(S.sound){ ac(); sfx('tap'); } };
renderAll();
B.y=groundY(); { const [a,b]=walkRange(); B.x=(a+b)/2; } place();
requestAnimationFrame(loop);
let rT=null; window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(()=>{ renderPins(); const [a,b]=walkRange(); B.x=clamp(B.x,a,b); if(B.state!=='fly') B.y=groundY(); },120); });
if(location.hash==='#dev') window.MT={state:()=>S, birdSVG, openAct, finishAct, startVoyage, openMap, openWords, openPassport, openManu, openInfo, closeFull, openGarden, openSky, openCraft, openLegend, G, addSeeds, bagAdd, island:i=>{ S.island=i; if(!S.visited.includes(i)) S.visited.push(i); save(); closeFull(); renderAll(); }};
if(!S.onboarded) openWelcome();
else later(()=>bubble(W.iaorana.r+'!','Welcome back to '+ISL[S.island].en+'.'),900);

})();
