à l'écart du monde, sous un tapu : il lui était interdit de parler à un homme.","In the morning, his wife found a breadfruit tree full of ripe fruit beside the house. The family was saved. That is why the ʻuru is called a tree of life.":"Au matin, sa femme trouva près de la maison un arbre à pain couvert de fruits mûrs. La famille était sauvée. C'est pourquoi on appelle le ʻuru l'arbre de vie.","In the pocket!":"Dans la poche !","Inside Papeete market: fish, fruit and flowers downstairs, crafts upstairs":"Dans le marché de Papeete : poissons, fruits et fleurs en bas, artisanat à l'étage","Inside the fruit-juice factory":"Dans l'usine de jus de fruits","Inside, Polynesia and Europe meet: a carved wooden Madonna and Child from the Marquesas, and Stations of the Cross showing Polynesian people.":"À l'intérieur, la Polynésie et l'Europe se rencontrent : une Vierge à l'Enfant en bois sculpté des Marquises, et un chemin de croix représentant des Polynésiens.","Install on my phone":"Installer sur mon téléphone","Install or restore a voyage":"Installer ou restaurer un voyage","International flights land at Faʻaʻā, next to Papeete.":"Les vols internationaux atterrissent à Faʻaʻā, à côté de Papeete.","Into the crate!":"Dans la caisse !","Island shirt":"Chemise des îles","Islands":"Îles","It is a place of worship: visit quietly, dress modestly, and avoid service times.":"C'est un lieu de culte : visitez-le en silence, dans une tenue correcte, et évitez les heures des offices.","Its highest peak, Mont Orohena, rises to {#1} m.":"Son plus haut sommet, le mont Orohena, culmine à {#1} m.","I’ll steer myself":"Je pilote moi-même","I’m your <span>manu tere</span>, your voyaging bird.":"Je suis votre <span>manu tere</span>, votre oiseau voyageur.","Juice factory":"Usine de jus","Juice factory, done":"Usine de jus, terminé","Kaoha! Tiki, tattoo and high cliffs. A UNESCO World Heritage site since {#1}.":"Kaoha ! Tiki, tatouage et hautes falaises. Patrimoine mondial de l'UNESCO depuis {#1}.","Keep walking":"Continuez à marcher","Keep your voyage":"Gardez votre voyage","Keep your voyage safe: <b>My manu › Save and restore</b>":"Protégez votre voyage : <b>Mon manu › Sauvegarder et restaurer</b>","LAKE VAIHIRIA · TAHITI":"LAC VAIHIRIA · TAHITI","Lagoon":"Lagon","Lagoon friends":"Amis du lagon","Lagoon friends, done":"Amis du lagon, terminé","Lake Vaihiria":"Lac Vaihiria","Lake Vaihiria, in the mountains of Tahiti":"Le lac Vaihiria, dans les montagnes de Tahiti","Land ho!":"Terre en vue !","Language":"Langue","Large print":"Grand motif","Last step: a band for your tāupoʻo":"Dernière étape : un bandeau pour votre tāupoʻo","Last step: tap the falls from the tallest to the smallest.":"Dernière étape : touchez les cascades, de la plus haute à la plus petite.","Lay banana leaves":"Posez les feuilles de bananier","Le truck":"Le truck","Le truck, tap for its story":"Le truck, touchez pour son histoire","Learn to build an ahimāʻa with a family on Tahaʻa, the vanilla island. Then you can cook your own harvest here.":"Apprenez à préparer un ahimāʻa avec une famille de Tahaʻa, l'île vanille. Vous pourrez ensuite cuire ici votre propre récolte.","Leaves on.":"Feuilles posées.","Left · Hoe!":"Gauche · Hoe !","Legend: Hina and the eel":"Légende : Hina et l'anguille","Legend: Hina and the eel, heard":"Légende : Hina et l'anguille, écoutée","Legend: Pai and the pierced mountain":"Légende : Pai et la montagne percée","Legend: ʻOro and the rainbow":"Légende : ʻOro et l'arc-en-ciel","Legends of the garden":"Légendes du jardin","Let the manu steer":"Laisser le manu piloter","Light the fire":"Allumez le feu","Light the oven":"Allumez le four","Lip":"Lèvre","Locked · Finish Moʻorea or print one":"Verrouillé · Terminez Moʻorea ou imprimez-en un","Locked · Finish Porapora":"Verrouillé · Terminez Porapora","Locked · Finish Tahaʻa":"Verrouillé · Terminez Tahaʻa","Locked · Finish Tahiti":"Verrouillé · Terminez Tahiti","Locked · Learn every star in Te raʻi":"Verrouillé · Apprenez toutes les étoiles de Te raʻi","Locked · Sew it in the garden":"Verrouillé · Cousez-la au jardin","Locked · String it in the garden":"Verrouillé · Enfilez-le au jardin","Locked · Weave it in the garden":"Verrouillé · Tressez-le au jardin","Look for hand-painted pāreu at Papeete market and in craft shops on every island.":"Cherchez des pāreu peints à la main au marché de Papeete et dans les boutiques d'artisanat de chaque île.","Look, don’t touch: keep your distance from rays, sharks, turtles and dolphins, and never feed them. Use reef-safe sunscreen and never stand on coral.":"Regardez sans toucher : gardez vos distances avec les raies, requins, tortues et dauphins, et ne les nourrissez jamais. Utilisez une crème solaire sans danger pour le récif et ne marchez jamais sur le corail.","MAEVA":"MAEVA","MANU TERE":"MANU TERE","MOʻOREA":"MOʻOREA","Made by hand":"Fait main","Maeva":"Maeva","Maeva · Welcome":"Maeva · Bienvenue","Main":"Principal","Make by hand":"Faire à la main","Make by hand · Beaten bark cloth":"Faire à la main · Tapa d'écorce battue","Make by hand · Island shirt":"Faire à la main · Chemise des îles","Make by hand · Pearl and shell necklace":"Faire à la main · Collier de perles et coquillages","Make by hand · Sun-printed pāreu":"Faire à la main · Pāreu imprimé au soleil","Make by hand · Woven hat":"Faire à la main · Chapeau tressé","Manta rays visit cleaning stations in the lagoon, where small fish tidy their skin. Swim slowly, stay a few metres away, and never touch or chase them.":"Les raies manta visitent des stations de nettoyage dans le lagon, où de petits poissons leur nettoient la peau. Nagez lentement, restez à quelques mètres, et ne les touchez ni ne les poursuivez jamais.","Mantas and coral are fragile. Swim slowly, stay a few metres from wildlife, never touch or chase, and never stand on coral.":"Les mantas et le corail sont fragiles. Nagez lentement, restez à quelques mètres des animaux, ne les touchez ni ne les poursuivez jamais, et ne marchez jamais sur le corail.","Manu":"Manu","Manu Tere":"Manu Tere","Manu Tere is a prototype. Travel times are approximate, and the Reo Māʻohi words and their pronunciation still need checking by native speakers.":"Manu Tere est un prototype. Les durées de trajet sont approximatives, et les mots en Reo Māʻohi ainsi que leur prononciation doivent encore être vérifiés par des locuteurs natifs.","Map of the Society Islands":"Carte des îles de la Société","Map of the night sky":"Carte du ciel nocturne","Marama":"Marama","Marama · the moon tonight":"Marama · la lune ce soir","Marquesas":"Marquises","Massage with a tap instead":"Massez plutôt en touchant","Matariʻi":"Matariʻi","Matariʻi · the Pleiades":"Matariʻi · les Pléiades","Matira beach at sunset":"La plage de Matira au coucher du soleil","Matira is a public white-sand beach. The Hawaiki Nui Vaʻa canoe race ends here.":"Matira est une plage publique de sable blanc. La course de pirogues Hawaiki Nui Vaʻa s'y termine.","Matira · finish":"Matira · arrivée","Maupiti":"Maupiti","Maupiti, coming soon":"Maupiti, bientôt disponible","Maʻa Tahiti is served: <b>ʻUru</b>, <b>Taro</b>, <b>Fēʻī</b>, <b>Poʻe vānira</b>. The family shares a poʻe with you, and gives you seeds of fēʻī and taro. You can now cook in your own faʻaʻapu.":"Le maʻa Tahiti est servi : <b>ʻUru</b>, <b>Taro</b>, <b>Fēʻī</b>, <b>Poʻe vānira</b>. La famille partage un poʻe avec vous et vous donne des graines de fēʻī et de taro. Vous pouvez maintenant cuisiner dans votre propre faʻaʻapu.","Maʻa Tahiti · Served":"Maʻa Tahiti · Servi","More islands will open in later versions, each greeting you in its own language.":"D'autres îles ouvriront dans les prochaines versions, chacune vous accueillant dans sa propre langue.","Mount Otemanu ({#1} m) rises from the middle of a wide lagoon ringed by motu.":"Le mont Otemanu ({#1} m) se dresse au milieu d'un vaste lagon entouré de motu.","Mount Rotui":"Mont Rotui","Moʻorea":"Moʻorea","Moʻorea complete":"Moʻorea terminée","Moʻorea grows the Queen Tahiti pineapple, small and very sweet, in the Opunohu valley below the Belvédère lookout. A plant takes {#1} to {#2} months to give one fruit. Growers pick it at the “turning” stage, when the bottom quarter turns yellow, cut the stalk with secateurs, and replant the shoots and crowns.":"Moʻorea cultive l'ananas Queen Tahiti, petit et très sucré, dans la vallée d'Opunohu, en contrebas du belvédère. Un plant met {#1} à {#2} mois pour donner un fruit. Les cultivateurs le cueillent au stade « tournant », quand le quart inférieur jaunit, coupent la tige au sécateur, puis replantent les rejets et les couronnes.","Moʻorea lies west of Tahiti. Keep the setting sun just above the mast.":"Moʻorea est à l'ouest de Tahiti. Gardez le soleil couchant juste au-dessus du mât.","Moʻorea stamp":"Tampon de Moʻorea","Moʻorea stamp (not yet)":"Tampon de Moʻorea (pas encore)","Moʻorea · Coral garden":"Moʻorea · Jardin de corail","Moʻorea · Juice factory":"Moʻorea · Usine de jus","Moʻorea · Lagoon friends":"Moʻorea · Amis du lagon","Moʻorea · Pineapple harvest":"Moʻorea · Récolte d'ananas","Moʻorea, you are here":"Moʻorea, vous êtes ici","My manu":"Mon manu","MĀTETE · MAPURU A PARAITA":"MĀTETE · MAPURU A PARAITA","MĀTETE · MARCHÉ DE PAPEETE":"MĀTETE · MARCHÉ DE PAPEETE","Māuruuru":"Māuruuru","NOT YET":"PAS ENCORE","Name":"Nom","Nana":"Nana","Navigators followed star paths. Each island has its <b>ʻaveiʻa</b>, a star that passes right over it: for Tahiti, Taʻurua-faupapa. Try it yourself on a voyage between the islands.":"Les navigateurs suivaient des chemins d'étoiles. Chaque île a son <b>ʻaveiʻa</b>, une étoile qui passe juste au-dessus d'elle : pour Tahiti, Taʻurua-faupapa. Essayez vous-même lors d'un voyage entre les îles.","Navigators knew where many stars rise and set on the horizon, and used them as a compass. Taʻurua-faupapa (Sirius) passes right over Tahiti: it is the island’s ʻaveiʻa, its marker star.":"Les navigateurs savaient où se lèvent et se couchent de nombreuses étoiles à l'horizon, et s'en servaient comme d'une boussole. Taʻurua-faupapa (Sirius) passe juste au-dessus de Tahiti : c'est l'ʻaveiʻa de l'île, son étoile repère.","Navigators of old would steer by <b>Matariʻi</b>, the Pleiades, setting. A night voyage.":"Les navigateurs d'autrefois se guidaient sur <b>Matariʻi</b>, les Pléiades, à son coucher. Un voyage de nuit.","Navigators of old would steer by <b>Te mahana</b>, the setting sun. A short day crossing: you can see the island from the shore.":"Les navigateurs d'autrefois se guidaient sur <b>Te mahana</b>, le soleil couchant. Une courte traversée de jour : on voit l'île depuis le rivage.","Needs {#1} pearl and {#2} pūpū":"Il faut {#1} perle et {#2} pūpū","Needs {#1} pearl and {#2} pūpū · made":"Il faut {#1} perle et {#2} pūpū · fait","Needs {#1} vavai and {#2} dye":"Il faut {#1} vavai et {#2} teinture","Needs {#1} ʻuru bark and {#2} dye (tiʻaʻiri, mati or rēʻa)":"Il faut {#1} écorce de ʻuru et {#2} teinture (tiʻaʻiri, mati ou rēʻa)","New word: <b>E aha te huru?</b> · how are you?":"Nouveau mot : <b>E aha te huru?</b> · comment allez-vous ?","New word: <b>Haere mai</b> · come here":"Nouveau mot : <b>Haere mai</b> · viens ici","New word: <b>Māuruuru</b> · thank you":"Nouveau mot : <b>Māuruuru</b> · merci","New word: <b>Nana</b> · bye":"Nouveau mot : <b>Nana</b> · au revoir","New word: <b>pereʻoʻo</b> · car, vehicle":"Nouveau mot : <b>pereʻoʻo</b> · voiture, véhicule","Next":"Suivant","Next set coming…":"Série suivante bientôt…","Night":"Nuit","Night {#1} of the moon: <b>Roʻo nui</b>":"Nuit {#1} de la lune : <b>Roʻo nui</b>","No wave at the rocks yet. Wait for it.":"Pas encore de vague sur les rochers. Attendez-la.","Not yet! Opening lets the steam escape, and the cooking slows down.":"Pas encore ! Ouvrir laisse s'échapper la vapeur, et la cuisson ralentit.","Notre-Dame Cathedral":"Cathédrale Notre-Dame","Now lift the little flap that covers the stigma.":"Soulevez maintenant le petit clapet qui recouvre le stigmate.","Now!":"Maintenant !","Nāmatarua":"Nāmatarua","On Fatu Hiva, in the Marquesas, tapa is still made by hand.":"À Fatu Hiva, aux Marquises, le tapa est encore fabriqué à la main.","On a motu of Tahaʻa, a family is preparing an ahimāʻa for a celebration, and invites you to help.":"Sur un motu de Tahaʻa, une famille prépare un ahimāʻa pour une fête, et vous invite à l'aider.","On approach to <b>Faʻaʻā, Tahiti</b>":"En approche de <b>Faʻaʻā, Tahiti</b>","On course":"Bon cap","On towards Haamaremare…":"En route vers Haamaremare…","One day a young stranger, Tua, came to pick flowers in the valley. Faʻuai called out to stop him, and in doing so she broke the tapu. The chief’s guards seized Tua. Then Faʻuai met Ivi, a mysterious being, the spirit of the valley. They fell in love and fled together, with the guards close behind.":"Un jour, un jeune étranger, Tua, vint cueillir des fleurs dans la vallée. Faʻuai l'interpella pour l'arrêter, et ce faisant elle rompit le tapu. Les gardes du chef saisirent Tua. Puis Faʻuai rencontra Ivi, un être mystérieux, l'esprit de la vallée. Ils tombèrent amoureux et s'enfuirent ensemble, les gardes à leurs trousses.","One full-moon evening she set off in her canoe to visit the moon. She stepped onto it, and her canoe drifted away, never to be seen again. She stayed: the woman in the moon, who watches over travellers and beats tapa.":"Un soir de pleine lune, elle partit dans sa pirogue rendre visite à la lune. Elle y posa le pied, et sa pirogue dériva au loin, pour ne jamais reparaître. Elle resta : la femme dans la lune, qui veille sur les voyageurs et bat le tapa.","One night, Hiro and his companions sailed from Raiatea to steal Mount Rotui, the sacred mountain of Moʻorea. They tied long vines around its peak and began to pull.":"Une nuit, Hiro et ses compagnons naviguèrent depuis Raiatea pour voler le mont Rotui, la montagne sacrée de Moʻorea. Ils attachèrent de longues lianes autour de son sommet et se mirent à tirer.","Open flower":"Fleur ouverte","Open the ahimāʻa":"Ouvrez l'ahimāʻa","Orion’s Belt":"Baudrier d'Orion","Otemanu":"Otemanu","Outrigger race":"Course de pirogues","Outrigger race, done":"Course de pirogues, terminé","Over":"Dessus","Oyster growing a pearl":"Huître formant une perle","PAINAPO":"PAINAPO","PAPEETE":"PAPEETE","PORAPORA":"PORAPORA","PRESS":"PRESSOIR","Paddle! · Hoe!":"Pagayez ! · Hoe !","Paddling a vaʻa in the lagoon":"Pagayer en vaʻa dans le lagon","Pai and the pierced mountain":"Pai et la montagne percée","Painapo! That one will travel well.":"Painapo ! Celui-là voyagera bien.","Painapo<small>Pineapple harvest</small>":"Painapo<small>Récolte d'ananas</small>","Papeete Market":"Marché de Papeete","Papeete Market, done":"Marché de Papeete, terminé","Papeete market, early in the morning":"Le marché de Papeete, tôt le matin","Papeete’s market, Mapuru a Paraita, is a two-storey hall in the heart of town. Downstairs: fruit, vegetables, fish and flowers, with tiare garlands. Upstairs: baskets, hats, carvings, pāreu and pearls, and snack bars serving poisson cru and fresh juice. It opens from {#1}:{#2} on weekdays and is busiest on Sunday from {#3}:{#4}, when families shop for the maʻa Tahiti, the traditional Sunday meal.":"Le marché de Papeete, Mapuru a Paraita, est une halle sur deux niveaux au cœur de la ville. En bas : fruits, légumes, poissons et fleurs, avec des couronnes de tiare. À l'étage : paniers, chapeaux, sculptures, pāreu et perles, et des snacks qui servent du poisson cru et des jus frais. Il ouvre dès {#1}h{#2} en semaine et connaît sa plus grande affluence le dimanche dès {#3}h{#4}, quand les familles font les courses pour le maʻa Tahiti, le repas traditionnel du dimanche.","Parau":"Parau","Parau · Words":"Parau · Mots","Parrotfish crunch dead coral, and what comes out is fine white sand.":"Les poissons-perroquets croquent le corail mort, et ce qui en ressort est du sable blanc et fin.","Part of the mountain broke away: the legend says this is how Moʻorea’s two bays were made. Across the water on Tahiti, the warrior Pai woke up, climbed a hill and threw his spear of hibiscus wood.":"Une partie de la montagne se détacha : la légende dit que c'est ainsi que sont nées les deux baies de Moʻorea. De l'autre côté de l'eau, à Tahiti, le guerrier Pai se réveilla, gravit une colline et lança sa lance en bois d'hibiscus.","Passport":"Passeport","Paste a backup code or choose a save file. This replaces the voyage on this phone.":"Collez un code de sauvegarde ou choisissez un fichier de sauvegarde. Cela remplace le voyage sur ce téléphone.","Pearl":"Perle","Pearl and shell necklace":"Collier de perles et coquillages","Pearl farms in the lagoons of the Tuamotu and Gambier islands welcome visitors.":"Les fermes perlières des lagons des Tuamotu et des Gambier accueillent les visiteurs.","Pearl farms, a famous coral garden for drift snorkelling, and motu ringed with white sand surround it.":"Des fermes perlières, un célèbre jardin de corail pour le snorkeling à la dérive et des motu bordés de sable blanc l'entourent.","Pearl line":"Collier de perles","Peek inside":"Jetez un œil dedans","Perfect distance. Let go and stay still…":"Distance parfaite. Lâchez et restez immobile…","Perfect fill!":"Remplissage parfait !","Perfect!":"Parfait !","Perfect, on to the next flower.":"Parfait, à la fleur suivante.","Perfect: turning, sweet and firm.":"Parfait : tournant, sucré et ferme.","Pick a pineapple at the <b>turning</b> stage: the bottom quarter has turned yellow. Too green and it is sour; fully yellow or brown and it will spoil before it reaches the market.":"Cueillez un ananas au stade <b>tournant</b> : le quart inférieur a jauni. Trop vert, il est acide ; tout jaune ou brun, il s'abîmera avant d'arriver au marché.","Pineapple fields of Opunohu":"Champs d'ananas d'Opunohu","Pineapple harvest":"Récolte d'ananas","Pineapple harvest, done":"Récolte d'ananas, terminé","Pineapple plant, flowering":"Plant d'ananas, en fleur","Pineapple plant, fully yellow":"Plant d'ananas, tout jaune","Pineapple plant, green fruit":"Plant d'ananas, fruit vert","Pineapple plant, overripe":"Plant d'ananas, trop mûr","Pineapple plant, turning: ready":"Plant d'ananas, tournant : prêt","Pineapple plant, young plant":"Plant d'ananas, jeune plant","Plain":"Uni","Plant":"Planter","Plant in this plot":"Planter dans cette parcelle","Plant, harvest, make":"Planter, récolter, fabriquer","Plantain poʻe with Tahaʻa vanilla":"Poʻe de banane plantain à la vanille de Tahaʻa","Plantations are family land: visit with a guide or by invitation, and buy vanilla directly from the growers.":"Les plantations sont des terres familiales : visitez-les avec un guide ou sur invitation, et achetez la vanille directement aux producteurs.","Planted!":"Planté !","Play again":"Rejouer","Play: find the star":"Jouer : trouvez l'étoile","Pocket":"Poche","Pollinated flower":"Fleur pollinisée","Pollinated! A pod will grow here.":"Pollinisée ! Une gousse va pousser ici.","Porapora":"Porapora","Porapora complete":"Porapora terminée","Porapora is the island’s name in Reo Tahiti; Bora Bora is how visitors came to say it.":"Porapora est le nom de l'île en Reo Tahiti ; Bora Bora est la façon dont les visiteurs l'ont prononcé.","Porapora lies west of Tahaʻa: you can see it on the horizon. Keep the setting sun just above the mast.":"Porapora est à l'ouest de Tahaʻa : on la voit à l'horizon. Gardez le soleil couchant juste au-dessus du mât.","Porapora lies west-northwest, close to where Matariʻi sets. Keep it just above the mast. A star is only useful near the horizon: watch it.":"Porapora est à l'ouest-nord-ouest, près de l'endroit où se couche Matariʻi. Gardez-la juste au-dessus du mât. Une étoile n'est utile que près de l'horizon : surveillez-la.","Porapora · Bora Bora":"Porapora · Bora Bora","Porapora · Outrigger race":"Porapora · Course de pirogues","Porapora · Stars over Matira":"Porapora · Étoiles sur Matira","Porapora · Swim with a manta":"Porapora · Nager avec une manta","Poʻe is a sweet pudding of fruit mixed with starch, cooked in the oven and served with coconut milk. A split vanilla pod from Tahaʻa scents the fruit as it cooks.":"Le poʻe est un dessert sucré de fruits mélangés à de l'amidon, cuit au four et servi avec du lait de coco. Une gousse de vanille de Tahaʻa fendue parfume les fruits pendant la cuisson.","Poʻe vānira":"Poʻe vānira","Press":"Pressoir","Pāreu":"Pāreu","Pīpiri mā":"Pīpiri mā","Question {#1} of {#2} · {#3} found first time":"Question {#1} sur {#2} · {#3} trouvées du premier coup","Raiatea":"Raiatea","Raiatea, coming soon":"Raiatea, bientôt disponible","Rays glide over the sand. Watch them, don’t feed them.":"Les raies glissent sur le sable. Observez-les, ne les nourrissez pas.","Ready":"Prêt","Ready to eat":"Prêt à manger","Ready to make":"Prêt à fabriquer","Ready to make · made":"Prêt à fabriquer · fait","Ready!":"Prêt !","Ready… {#1}":"Prêt… {#1}","Receive a gift":"Recevoir un cadeau","Red band":"Bandeau rouge","Restore":"Restaurer","Right · Hoe!":"Droite · Hoe !","Right ▶":"Droite ▶","Right: bruised fruit feeds the soil.":"Exact : les fruits abîmés nourrissent la terre.","Right: still green, it needs more time.":"Exact : encore vert, il lui faut plus de temps.","Ring the bell 🔔":"Sonnez la cloche 🔔","Rotui<small>Juice factory</small>":"Rotui<small>Usine de jus</small>","Row done!":"Rangée terminée !","Row {#1}:":"Rangée {#1} :","Ruataʻata and the ʻuru":"Ruataʻata et le ʻuru","SOCIETY ISLANDS":"ÎLES DE LA SOCIÉTÉ","Sacks on: wet, so they hold the steam.":"Les sacs posés : mouillés, pour retenir la vapeur.","Sail by":"Naviguer avec","Sail to <span>Moʻorea</span>":"Naviguer vers <span>Moʻorea</span>","Sail to <span>Porapora</span> (Bora Bora)":"Naviguer vers <span>Porapora</span> (Bora Bora)","Sail to <span>Tahaʻa</span>":"Naviguer vers <span>Tahaʻa</span>","Sail to Porapora, or hear the legend of ʻOro there, to start your own pearl line.":"Naviguez jusqu'à Porapora, ou écoutez-y la légende de ʻOro, pour commencer votre propre collier de perles.","Sand":"Sable","Sand last, or it falls into the food.":"Le sable en dernier, sinon il tombe dans la nourriture.","Sand on. Now we wait.":"Sable posé. Maintenant, on attend.","Save and restore":"Sauvegarder et restaurer","Save as a file":"Enregistrer dans un fichier","See it for real":"Voir en vrai","Seeds come from activities, legends and harvests. Progress is saved on this phone only.":"Les graines viennent des activités, des légendes et des récoltes. La progression est sauvegardée sur ce téléphone uniquement.","Serve":"Servir","Set sail":"Larguer les amarres","Sew the shirt":"Coudre la chemise","Sharp green ridges and little waterfalls surround it; it is one of the wettest places on the island.":"Des crêtes vertes et escarpées et de petites cascades l’entourent ; c’est l’un des endroits les plus humides de l’île.","Shell":"Coquillage","Shoulder":"Épaule","Show my manu":"Voir mon manu","Sirius":"Sirius","Skip":"Passer","Sky and sea":"Ciel et mer","Small print":"Petit motif","Snip!":"Clac !","Snorkelling in the lagoon":"Snorkeling dans le lagon","Snorkelling with a local guide":"Snorkeling avec un guide local","Soak the <span>ʻuru</span> bark, then beat it with the <span>ʻiʻe</span> to make it wider and thinner.":"Faites tremper l’écorce d’<span>ʻuru</span>, puis battez-la avec le <span>ʻiʻe</span> pour la rendre plus large et plus fine.","Some say ʻOro also gave her a black pearl as a token of his love. Pearls are farmed in Polynesia’s lagoons to this day.":"On dit aussi que ʻOro lui offrit une perle noire en gage de son amour. Aujourd’hui encore, on cultive des perles dans les lagons de Polynésie.","Sound off. Tap to turn on":"Son coupé. Touchez pour l’activer","Sound on":"Son activé","Sound on. Tap to mute":"Son activé. Touchez pour couper","Spinner dolphins play outside the reef. Boats slow down and keep away.":"Les dauphins à long bec jouent au-delà du récif. Les bateaux ralentissent et gardent leurs distances.","Staghorn (Acropora)":"Corne de cerf (Acropora)","Stamp: <b>Moʻorea</b>":"Tampon : <b>Moʻorea</b>","Stamp: <b>Porapora</b> · Bora Bora":"Tampon : <b>Porapora</b> · Bora Bora","Stamp: <b>Tahaʻa</b>":"Tampon : <b>Tahaʻa</b>","Stamp: <b>Tahiti</b>. Tap the pins to explore, or tap your manu.":"Tampon : <b>Tahiti</b>. Touchez les repères pour explorer, ou touchez votre manu.","Stamps":"Tampons","Stars over Matira":"Étoiles sur Matira","Stars over Matira, done":"Étoiles sur Matira, terminé","Start over":"Recommencer","Stay behind the barrier":"Restez derrière la barrière","Stay still… let it come to you.":"Ne bougez pas… laissez-la venir à vous.","Steer left":"Virer à gauche","Steer right":"Virer à droite","Steer right ▶":"Virer à droite ▶","Steering by the stars":"Naviguer aux étoiles","Still to visit":"Encore à visiter","Stop the game":"Arrêter le jeu","Sun-printed pāreu":"Pāreu imprimé au soleil","Sunglasses":"Lunettes de soleil","Surf Teahupoʻo":"Surfer à Teahupoʻo","Surf Teahupoʻo, done":"Surfer à Teahupoʻo, terminé","Swim gently":"Nagez doucement","Swim with a manta":"Nager avec une raie manta","Swim with a manta, done":"Nager avec une raie manta, terminé","TAHAʻA":"TAHAʻA","TAHITI":"TAHITI","Table branch (Acropora)":"Corail tabulaire (Acropora)","Tahaʻa":"Tahaʻa","Tahaʻa complete":"Tahaʻa terminé","Tahaʻa lies east of Porapora. Keep the rising sun just above the mast.":"Tahaʻa se trouve à l’est de Porapora. Gardez le soleil levant juste au-dessus du mât.","Tahaʻa shares one lagoon with its big sister Raiatea. It has no airport: boats cross from Raiatea in {#1} to {#2} minutes.":"Tahaʻa partage un même lagon avec sa grande sœur Raiatea. Elle n’a pas d’aéroport : les bateaux traversent depuis Raiatea en {#1} à {#2} minutes.","Tahaʻa stamp":"Tampon de Tahaʻa","Tahaʻa stamp (not yet)":"Tampon de Tahaʻa (pas encore)","Tahaʻa · Dry the vanilla":"Tahaʻa · Sécher la vanille","Tahaʻa · Hand-pollinate vanilla":"Tahaʻa · Polliniser la vanille à la main","Tahaʻa · The earth oven":"Tahaʻa · Le four enterré","Tahaʻa, you are here":"Tahaʻa, vous êtes ici","Tahiti":"Tahiti","Tahiti and Moʻorea lie east-southeast, close to where ʻAna-mua rises. Keep it just above the mast. A star is only useful near the horizon: watch it.":"Tahiti et Moʻorea se trouvent à l’est-sud-est, près de l’endroit où se lève ʻAna-mua. Gardez-la juste au-dessus du mât. Une étoile n’est utile que près de l’horizon : surveillez-la.","Tahiti complete":"Tahiti terminé","Tahiti lies east of Moʻorea. Keep the rising sun just above the mast.":"Tahiti se trouve à l’est de Moʻorea. Gardez le soleil levant juste au-dessus du mât.","Tahiti stamp":"Tampon de Tahiti","Tahiti · Dance to the drums":"Tahiti · Danser au son des tambours","Tahiti · Landmark":"Tahiti · Site remarquable","Tahiti · Papeete Market":"Tahiti · Marché de Papeete","Tahiti · Pereʻoʻo mataʻeinaʻa":"Tahiti · Pereʻoʻo mataʻeinaʻa","Tahiti · Surf Teahupoʻo":"Tahiti · Surfer à Teahupoʻo","Tahiti · The blowhole":"Tahiti · Le souffleur","Tahiti · Three waterfalls":"Tahiti · Trois cascades","Tahiti, you are here":"Tahiti, vous êtes ici","Tahitian vanilla pods are rinsed, wrapped in cotton cloths and set in the sun for a few hours a day, about thirty times, roughly a month of good weather. Then they are sorted, massaged one by one, and left to age for three to four months. From flower to finished pod takes more than a year.":"Les gousses de vanille de Tahiti sont rincées, enveloppées dans des tissus de coton et exposées au soleil quelques heures par jour, une trentaine de fois, soit environ un mois de beau temps. Elles sont ensuite triées, massées une à une, puis laissées à vieillir trois à quatre mois. De la fleur à la gousse finie, il faut plus d’un an.","Tahiti’s only natural lake lies deep in the mountains of the south coast (Teva i Uta). Long ago part of the island collapsed, and blocks of volcanic rock dammed the valley over about {#1} m.":"Le seul lac naturel de Tahiti se cache au cœur des montagnes de la côte sud (Teva i Uta). Il y a très longtemps, une partie de l’île s’est effondrée, et des blocs de roche volcanique ont barré la vallée sur environ {#1} m.","Tap a pearl or a shell to thread it ({#1} in all, at least one pearl)":"Touchez une perle ou un coquillage pour l’enfiler ({#1} en tout, dont au moins une perle)","Tap a plant to look closely.":"Touchez une plante pour l’observer de près.","Tap a star or a group of stars to learn its name in Reo Tahiti and its story.":"Touchez une étoile ou un groupe d’étoiles pour découvrir son nom en Reo Tahiti et son histoire.","Tap the big button each time a beat reaches the circle. The pahu drum keeps time, you play the <span>tōʻere</span>.":"Touchez le gros bouton chaque fois qu’un temps atteint le cercle. Le tambour pahu donne la mesure, vous jouez du <span>tōʻere</span>.","Tap the cloth to lay a leaf ({#1} of {#2}).":"Touchez le tissu pour poser une feuille ({#1} sur {#2}).","Tap the right one.":"Touchez la bonne.","Tap the tōʻere":"Touchez le tōʻere","Tap to wear":"Touchez pour porter","Tapa":"Tapa","Tapa is cloth made of beaten bark: ʻuru, banyan (ʻōrā) or paper mulberry. Women beat it with a grooved beater, the ʻiʻe, on a wooden anvil until it is four or five times wider. Plants give the colours: rēʻa for yellow, mati and tou for red-brown, tiʻaʻiri for black.":"Le tapa est un tissu d’écorce battue : ʻuru, banian (ʻōrā) ou mûrier à papier. Les femmes le battent avec un battoir rainuré, le ʻiʻe, sur une enclume en bois jusqu’à ce qu’il soit quatre ou cinq fois plus large. Les plantes donnent les couleurs : rēʻa pour le jaune, mati et tou pour le brun-rouge, tiʻaʻiri pour le noir.","Taro":"Taro","Taste":"Goûter","Tauhā":"Tauhā","Tautoru":"Tautoru","Tautoru · Orion’s Belt":"Tautoru · Baudrier d’Orion","Taʻurua-faupapa":"Taʻurua-faupapa","Taʻurua-faupapa · Sirius":"Taʻurua-faupapa · Sirius","Te Fenua Māʻohi":"Te Fenua Māʻohi","Te Matau a Māui":"Te Matau a Māui","Te Vaiora":"Te Vaiora","Te fenua · The islands":"Te fenua · Les îles","Te mahana":"Te mahana","Te mau fetiʻa<small>Stars over Matira</small>":"Te mau fetiʻa<small>Étoiles sur Matira</small>","Te mātete<small>Papeete Market</small>":"Te mātete<small>Marché de Papeete</small>","Te raʻi":"Te raʻi","Te raʻi, the night sky":"Te raʻi, le ciel nocturne","Te tairoto<small>Lagoon friends</small>":"Te tairoto<small>Amis du lagon</small>","Te toʻa<small>Coral garden</small>":"Te toʻa<small>Jardin de corail</small>","Te vānira<small>Dry the vanilla</small>":"Te vānira<small>Sécher la vanille</small>","Teahupoʻo, at the end of the road on Tahiti Iti, hosted the surfing events of the Paris {#1} Olympic Games. The wave breaks over a shallow reef and is for experts only: watch it from a boat. Beginners learn on gentler spots with a local surf school.":"Teahupoʻo, au bout de la route de Tahiti Iti, a accueilli les épreuves de surf des Jeux olympiques de Paris {#1}. La vague déferle sur un récif peu profond et est réservée aux experts : admirez-la depuis un bateau. Les débutants apprennent sur des spots plus doux avec une école de surf locale.","Tere":"Tere","Tere, your manu. Tap to hear a word.":"Tere, votre manu. Touchez pour entendre un mot.","That one is haʻari (coconut). Look again.":"Celui-ci, c’est haʻari (noix de coco). Regardez encore.","That one is meiʻa (banana). Look again.":"Celui-ci, c’est meiʻa (banane). Regardez encore.","That one is tiare (flower; the tiare Tahiti gardenia). Look again.":"Celui-ci, c’est tiare (fleur ; le gardénia tiare Tahiti). Regardez encore.","That one is vī (mango). Look again.":"Celui-ci, c’est vī (mangue). Regardez encore.","That one is ʻiʻa (fish). Look again.":"Celui-ci, c’est ʻiʻa (poisson). Regardez encore.","That one is ʻuru (breadfruit). Look again.":"Celui-ci, c’est ʻuru (fruit de l’arbre à pain). Regardez encore.","That one was bruised: it should go to the compost.":"Celui-là était abîmé : il va au compost.","That star sets far north of our course: we would miss the island. Look for the one at the same point as Matariʻi.":"Cette étoile se couche bien au nord de notre cap : nous manquerions l’île. Cherchez celle qui se trouve au même point que Matariʻi.","The Arahoho blowhole on Tahiti's east coast":"Le souffleur d’Arahoho, sur la côte est de Tahiti","The Belvédère lookout":"Le belvédère","The Belvédère lookout looks down on both bays and the pineapple fields of the Opunohu valley.":"Le belvédère domine les deux baies et les champs d’ananas de la vallée d’Opunohu.","The Cathedral of Notre-Dame de l’Immaculée Conception stands near the waterfront in the middle of Papeete, on rue du Général de Gaulle. Finished in {#1}, it is one of the last examples of the town’s early colonial architecture.":"La cathédrale Notre-Dame de l’Immaculée Conception se dresse près du front de mer, au centre de Papeete, rue du Général de Gaulle. Achevée en {#1}, c’est l’un des derniers exemples de l’architecture coloniale des débuts de la ville.","The Faarumai valley in Tiarei, on Tahiti’s east coast, hides three waterfalls: Vaimahuta ({#1} m), a few minutes from the car park, then Haamaremare Iti ({#2} m) and Haamaremare Rahi ({#3} m), {#4} to {#5} minutes further on. The site is open every day. After heavy rain the streams rise fast, so check the weather before you walk.":"La vallée de Faarumai, à Tiarei sur la côte est de Tahiti, cache trois cascades : Vaimahuta ({#1} m), à quelques minutes du parking, puis Haamaremare Iti ({#2} m) et Haamaremare Rahi ({#3} m), {#4} à {#5} minutes plus loin. Le site est ouvert tous les jours. Après de fortes pluies, les rivières montent vite : vérifiez la météo avant de partir.","The Heiva i Tahiti in July":"Le Heiva i Tahiti en juillet","The Reo Māʻohi words stay in Reo Māʻohi.":"Les mots en Reo Māʻohi restent en Reo Māʻohi.","The anthias are back!":"Les anthias sont de retour !","The blowhole":"Le souffleur","The blowhole, done":"Le souffleur, terminé","The blue-green chromis are back!":"Les chromis bleu-vert sont de retour !","The butterflyfish are back!":"Les poissons-papillons sont de retour !","The coral garden drift snorkel":"Snorkeling en dérive dans le jardin de corail","The earth oven":"Le four enterré","The earth oven, done":"Le four enterré, terminé","The lagoon of Mangareva and its pearls.":"Le lagon de Mangareva et ses perles.","The lagoon of Porapora seen from above":"Le lagon de Porapora vu d’en haut","The largest island of French Polynesia: two volcanoes, Tahiti Nui and Tahiti Iti, joined at the isthmus of Taravao.":"La plus grande île de Polynésie française : deux volcans, Tahiti Nui et Tahiti Iti, reliés par l’isthme de Taravao.","The lookout over Teahupoʻo, at the end of the road":"Le point de vue sur Teahupoʻo, au bout de la route","The night sky over Matira beach":"Le ciel nocturne au-dessus de la plage de Matira","The parrotfish is back!":"Le poisson-perroquet est de retour !","The picked pods are rinsed, wrapped in cotton cloths and put out in the sun, a few hours each day, for weeks. Too little sun and they stay damp and can go mouldy; too much and they dry out and crack.":"Les gousses cueillies sont rincées, enveloppées dans des tissus de coton et mises au soleil quelques heures par jour, pendant des semaines. Trop peu de soleil, et elles restent humides et peuvent moisir ; trop, et elles se dessèchent et se fendent.","The shadows on the moon are a banyan tree, the ʻōrā. One of its branches fell to ʻŌpoa, on Raiatea, and became the first banyan on earth. Its bark, like the ʻuru’s, can be beaten into tapa.":"Les ombres sur la lune sont un banian, le ʻōrā. L’une de ses branches est tombée à ʻŌpoa, sur Raiatea, et est devenue le premier banian sur terre. Son écorce, comme celle du ʻuru, peut être battue pour faire du tapa.","The sky of the fenua":"Le ciel du fenua","The spear went straight through a mountain and left a hole: Mouaputa, the pierced mountain. The blow woke the roosters, and they crowed. Thinking dawn had come, the thieves ran away. You can still see the hole in Mouaputa today.":"La lance a traversé une montagne de part en part et y a laissé un trou : Mouaputa, la montagne percée. Le coup a réveillé les coqs, qui se sont mis à chanter. Croyant que l’aube était venue, les voleurs se sont enfuis. On voit encore le trou de Mouaputa aujourd’hui.","The stall-keeper asks for":"Le marchand demande","The stall-keeper says <span>Māuruuru!</span> Your basket is full.":"Le marchand dit <span>Māuruuru !</span> Votre panier est plein.","The sun is printing…":"Le soleil imprime…","The swell rolls into a cave under the rocks and shoots out of the hole with a howl. Only <b>big</b> waves make it blow. Tap <b>Now!</b> when a big wave reaches the rocks.":"La houle s’engouffre dans une grotte sous les rochers et jaillit du trou en hurlant. Seules les <b>grosses</b> vagues le font souffler. Touchez <b>Maintenant !</b> quand une grosse vague atteint les rochers.","The track is best done with a guided {#1}×{#2} or quad tour. Clouds often gather in the afternoon, so go early.":"La piste se fait de préférence en {#1}×{#2} ou en quad avec un guide. Les nuages s’amoncellent souvent l’après-midi : partez tôt.","The trail climbs through ferns and ʻape leaves… about {#1} to {#2} minutes to the next falls.":"Le sentier grimpe parmi les fougères et les feuilles de ʻape… environ {#1} à {#2} minutes jusqu’à la cascade suivante.","The trail through the Faarumai valley":"Le sentier de la vallée de Faarumai","The tree that saved a family":"L’arbre qui sauva une famille","The vanilla island · {#1} of {#2} activities done":"L’île de la vanille · {#1} activités sur {#2} terminées","The view of Otemanu from the motu":"La vue sur l’Otemanu depuis le motu","The woman who beats tapa":"La femme qui bat le tapa","These stars are not all up on the same night of the year. They are gathered here so you can learn them.":"Ces étoiles ne sont pas toutes visibles la même nuit de l’année. Elles sont réunies ici pour que vous puissiez les apprendre.","This game is a simplified version of their art.":"Ce jeu est une version simplifiée de leur art.","This strip goes under.":"Cette bande passe dessous.","Three waterfalls":"Trois cascades","Three waterfalls, done":"Trois cascades, terminé","Three waves ridden in the pocket at Teahupoʻo.":"Trois vagues surfées dans le creux à Teahupoʻo.","Tiare":"Tiare","Tiare band (uses {#1})":"Couronne de tiare (utilise {#1})","Tie the hei":"Nouer le hei","Tied on!":"Noué !","To Bora Bora: about {#1} minutes by plane from Faʻaʻā.":"Pour Bora Bora : environ {#1} minutes d’avion depuis Faʻaʻā.","To Bora Bora: by boat or a short flight from Raiatea.":"Pour Bora Bora : en bateau ou par un vol court depuis Raiatea.","To Bora Bora: by plane, usually through Tahiti.":"Pour Bora Bora : en avion, généralement via Tahiti.","To Moʻorea: about {#1}–{#2} minutes by ferry from Papeete.":"Pour Moʻorea : environ {#1} à {#2} minutes de ferry depuis Papeete.","To Moʻorea: boat to Raiatea, then a plane via Tahiti.":"Pour Moʻorea : bateau jusqu’à Raiatea, puis avion via Tahiti.","To Moʻorea: by plane, usually through Tahiti.":"Pour Moʻorea : en avion, généralement via Tahiti.","To Tahaʻa: about {#1} minutes by plane to Raiatea, then a boat across the lagoon.":"Pour Tahaʻa : environ {#1} minutes d’avion jusqu’à Raiatea, puis un bateau pour traverser le lagon.","To Tahaʻa: by boat or a short flight via Raiatea.":"Pour Tahaʻa : en bateau ou par un vol court via Raiatea.","To Tahaʻa: by plane via Tahiti to Raiatea, then a boat.":"Pour Tahaʻa : en avion via Tahiti jusqu’à Raiatea, puis en bateau.","To Tahiti: about {#1} minutes by plane to Faʻaʻā.":"Pour Tahiti : environ {#1} minutes d’avion jusqu’à Faʻaʻā.","To Tahiti: about {#1}–{#2} minutes by ferry to Papeete.":"Pour Tahiti : environ {#1} à {#2} minutes de ferry jusqu’à Papeete.","To Tahiti: boat to Raiatea, then about {#1} minutes by plane.":"Pour Tahiti : bateau jusqu’à Raiatea, puis environ {#1} minutes d’avion.","To escape, Ivi and Faʻuai turned into waterfalls and became part of the valley forever. A third fall burst out of the cliff and swept their pursuers away. Today you can see the three falls: Vaimahuta, Haamaremare Iti and Haamaremare Rahi.":"Pour s’échapper, Ivi et Faʻuai se changèrent en cascades et devinrent pour toujours une partie de la vallée. Une troisième chute jaillit de la falaise et emporta leurs poursuivants. Aujourd’hui, on peut voir les trois cascades : Vaimahuta, Haamaremare Iti et Haamaremare Rahi.","To the press!":"Au pressoir !","Today: about {#1} minutes by plane to Raiatea, then a boat across the lagoon.":"Aujourd’hui : environ {#1} minutes d’avion jusqu’à Raiatea, puis un bateau pour traverser le lagon.","Today: about {#1}–{#2} minutes by ferry from Papeete.":"Aujourd’hui : environ {#1} à {#2} minutes de ferry depuis Papeete.","Today: by plane, usually through Tahiti.":"Aujourd’hui : en avion, généralement via Tahiti.","Together we’ll sail the islands of French Polynesia the way the navigators of old did, by the sun and the stars, and pick up some Reo Māʻohi on the way.":"Ensemble, nous allons naviguer entre les îles de Polynésie française comme les navigateurs d’autrefois, guidés par le soleil et les étoiles, et apprendre un peu de Reo Māʻohi en chemin.","Too early: the swell has not reached you.":"Trop tôt : la houle ne vous a pas encore atteint.","Too far out on the shoulder. Ease off.":"Trop loin sur l’épaule. Relâchez un peu.","Touchdown!":"Atterrissage !","Trail start · car park":"Départ du sentier · parking","Tuamotu":"Tuamotu","Turn sound off":"Couper le son","Turn sound on":"Activer le son","Twill":"Sergé","Two deep bays, Cook’s Bay and Opunohu Bay, frame Mount Rotui.":"Deux baies profondes, la baie de Cook et la baie d’Opunohu, encadrent le mont Rotui.","Tāupoʻo":"Tāupoʻo","Under":"Dessous","Undo":"Annuler","Unwrap in the sun":"Déballer au soleil","Vaimahuta":"Vaimahuta","Vaimahuta, {#1} m, is only a few minutes from the car park. Feel the cool spray.":"Vaimahuta, {#1} m, n’est qu’à quelques minutes du parking. Sentez la fraîcheur des embruns.","Vaimahuta: {#1} m.":"Vaimahuta : {#1} m.","Vanilla flower":"Fleur de vanille","Vanilla is an orchid: a climbing vine grown on supports. A new plant flowers after two to three years. In Polynesia the flowers are pollinated by hand, usually from July to October, with a small stick that lifts the flap between pollen and stigma. The pod ripens nine to ten months later. Vanilla came to Tahiti around {#1}.":"La vanille est une orchidée : une liane grimpante cultivée sur des tuteurs. Une jeune plante fleurit au bout de deux à trois ans. En Polynésie, les fleurs sont pollinisées à la main, généralement de juillet à octobre, avec une petite baguette qui soulève la languette entre le pollen et le stigmate. La gousse mûrit neuf à dix mois plus tard. La vanille est arrivée à Tahiti vers {#1}.","Vaʻa racing is the national sport. Every year the Hawaiki Nui Vaʻa race crosses the open sea from Huahine to Raiatea, Tahaʻa and Porapora, and ends on Matira beach.":"La course de vaʻa est le sport national. Chaque année, la course Hawaiki Nui Vaʻa traverse le large de Huahine à Raiatea, Tahaʻa et Porapora, et se termine sur la plage de Matira.","Violet":"Violet","Visit for real · The big island":"Visiter pour de vrai · La grande île","Visit for real · The lagoon island":"Visiter pour de vrai · L’île du lagon","Visit for real · The sister island":"Visiter pour de vrai · L’île sœur","Visit for real · The vanilla island":"Visiter pour de vrai · L’île de la vanille","Voyage · Bora Bora to Tahaʻa":"Voyage · De Bora Bora à Tahaʻa","Voyage · Bora Bora to Tahiti":"Voyage · De Bora Bora à Tahiti","Voyage · Moʻorea to Bora Bora":"Voyage · De Moʻorea à Bora Bora","Voyage · Moʻorea to Tahiti":"Voyage · De Moʻorea à Tahiti","Voyage · Tahaʻa to Bora Bora":"Voyage · De Tahaʻa à Bora Bora","Voyage · Tahiti to Bora Bora":"Voyage · De Tahiti à Bora Bora","Voyage · Tahiti to Moʻorea":"Voyage · De Tahiti à Moʻorea","Voyage · Tahiti to Tahaʻa":"Voyage · De Tahiti à Tahaʻa","Voyage · about {#1} km":"Voyage · environ {#1} km","Vānira<small>Hand-pollinate vanilla</small>":"Vānira<small>Polliniser la vanille à la main</small>","Wait for it…":"Attendez…","Wait until it reaches you on the belt.":"Attendez qu’il arrive jusqu’à vous sur le tapis.","Walk up the Faarumai valley, in Tiarei on Tahiti’s east coast, to find its three waterfalls. Hold <b>Walk</b>.":"Remontez la vallée de Faarumai, à Tiarei sur la côte est de Tahiti, pour découvrir ses trois cascades. Maintenez <b>Marcher</b>.","Warm water can bleach coral. On Moʻorea, teams such as Coral Gardeners grow fragments at least {#1} cm long on ropes in underwater nurseries, clean them every month (every week in the hot season), and after about two to three years plant them back on the reef. Reef-safe sunscreen and never touching coral both help.":"L’eau chaude peut blanchir le corail. À Moʻorea, des équipes comme Coral Gardeners font pousser des fragments d’au moins {#1} cm sur des cordes dans des pépinières sous-marines, les nettoient chaque mois (chaque semaine en saison chaude), puis, après deux à trois ans environ, les replantent sur le récif. Une crème solaire sans danger pour les récifs et ne jamais toucher le corail, cela aide aussi.","Watch the sea…":"Observez la mer…","Wave {#1} of {#2}":"Vague {#1} sur {#2}","Wear":"Porter","Wearing":"Porté","Wet sacks":"Sacs mouillés","Whale watching, roughly July to November":"Observation des baleines, environ de juillet à novembre","When she came back, the head had become a tall tree with long leaves like hair: the first coconut palm. Look at a coconut: its three dark spots are the eel’s two eyes and mouth. Years later, in a dry season, Hina drank from a coconut, and so she kissed the eel after all.":"À son retour, la tête était devenue un grand arbre aux longues feuilles comme des cheveux : le premier cocotier. Regardez une noix de coco : ses trois taches sombres sont les deux yeux et la bouche de l’anguille. Des années plus tard, pendant une saison sèche, Hina but à une noix de coco, et embrassa ainsi l’anguille malgré tout.","Where does this one go?":"Où va celui-ci ?","Where is Nāmatarua?":"Où est Nāmatarua ?","Where is Pīpiri mā?":"Où est Pīpiri mā ?","Where is Te Vaiora?":"Où est Te Vaiora ?","Where shall we sail?":"Où allons-nous naviguer ?","Whoosh! The cave howls.":"Whoosh ! La grotte hurle.","With respect":"Avec respect","Words":"Mots","Words from this activity":"Mots de cette activité","Woven hat":"Chapeau tressé","Woven hats are sold at Papeete market and at craft fairs. Buying from the weaver supports the craft.":"Les chapeaux tressés se vendent au marché de Papeete et dans les foires artisanales. Acheter directement à la tresseuse soutient cet artisanat.","Wrap and bring in":"Envelopper et rentrer","Yellow façade, red steeple facing Mont Aorai, and maroon arched windows.":"Façade jaune, clocher rouge tourné vers le mont Aorai et fenêtres en arc bordeaux.","Yes! haʻari means coconut.":"Oui ! haʻari veut dire noix de coco.","Yes! meiʻa means banana.":"Oui ! meiʻa veut dire banane.","Yes! tiare means flower; the tiare Tahiti gardenia.":"Oui ! tiare veut dire fleur ; le gardénia tiare Tahiti.","Yes! vī means mango.":"Oui ! vī veut dire mangue.","Yes! ʻiʻa means fish.":"Oui ! ʻiʻa veut dire poisson.","You are here":"Vous êtes ici","You can read four guide stars of the Polynesian sky.":"Vous savez lire quatre étoiles guides du ciel polynésien.","You cleaned the nursery, hung six new fragments and planted four corals back on the reef.":"Vous avez nettoyé la pépinière, suspendu six nouveaux fragments et replanté quatre coraux sur le récif.","You crossed the line at Matira in {#1} s, ahead of the other canoe!":"Vous avez franchi la ligne à Matira en {#1} s, devant l’autre pirogue !","You hand-pollinated {#1} vanilla flowers.":"Vous avez pollinisé à la main {#1} fleurs de vanille.","You know {#1} of {#2} stars. Learn them all to give your manu a cloak of stars.":"Vous connaissez {#1} étoiles sur {#2}. Apprenez-les toutes pour offrir à votre manu une cape d’étoiles.","You met all five lagoon friends, without touching any of them.":"Vous avez rencontré les cinq amis du lagon, sans en toucher aucun.","You played {#1} of {#2} beats.":"Vous avez joué {#1} temps sur {#2}.","You sorted {#1} of {#2} pineapples correctly and filled five bottles of painapo juice.":"Vous avez bien trié {#1} ananas sur {#2} et rempli cinq bouteilles de jus de painapo.","You walked to the three falls of Faarumai: Haamaremare Rahi ({#1} m), Vaimahuta ({#2} m) and Haamaremare Iti ({#3} m).":"Vous avez marché jusqu’aux trois cascades de Faarumai : Haamaremare Rahi ({#1} m), Vaimahuta ({#2} m) et Haamaremare Iti ({#3} m).","You watched a manta from a respectful distance.":"Vous avez observé une raie manta à distance respectueuse.","Your basket":"Votre panier","Your first black pearl, and a pearl line in your faʻaʻapu":"Votre première perle noire, et une ligne perlière dans votre faʻaʻapu","Your manu":"Votre manu","Your manu is wearing it. Change what it wears in <b>My manu</b>.":"Votre manu le porte. Changez sa tenue dans <b>Mon manu</b>.","Your manu loved it. Māuruuru!":"Votre manu a adoré. Māuruuru !","Your manu now wears a hei, a crown of flowers. You can change it in <b>My manu</b>.":"Votre manu porte maintenant un hei, une couronne de fleurs. Vous pouvez le changer dans <b>Mon manu</b>.","Your manu now wears a pāreu. You can change it in <b>My manu</b>.":"Votre manu porte maintenant un pāreu. Vous pouvez le changer dans <b>Mon manu</b>.","Your manu now wears a vanilla flower behind the ear. You can change it in <b>My manu</b>.":"Votre manu porte maintenant une fleur de vanille derrière l’oreille. Vous pouvez la changer dans <b>Mon manu</b>.","Your manu now wears sunglasses for the lagoon light. You can change it in <b>My manu</b>.":"Votre manu porte maintenant des lunettes de soleil pour la lumière du lagon. Vous pouvez les changer dans <b>Mon manu</b>.","Your stamps, words, garden and cr  franchi la ligne à Matira en {A} s{B}","A manta ray in deep blue water":"Une raie manta dans une eau d'un bleu profond","Too fast! The manta glided away. Slow down.":"Trop vite ! La manta s'est éloignée en planant. Ralentissez.","Find":"Trouvez",", “the little eyes”: a tight little cluster of stars.":", « les petits yeux » : un petit amas serré d'étoiles.",", “the three”: three stars in a neat row.":", « les trois » : trois étoiles bien alignées.",": the brightest star of the night.":" : l'étoile la plus brillante de la nuit.",": the red heart of Te Matau a Māui, the fishhook of Māui.":" : le cœur rouge de Te Matau a Māui, l'hameçon de Māui.","Look where the circle glows.":"Regardez là où le cercle brille.","Not that one. Look again.":"Pas celle-là. Regardez encore.",", done":", terminé",", heard":", entendue","Legend: {C}{D}":"Légende : {C}{D}","ʻĀʻai<small>{E}</small>":"ʻĀʻai<small>{E}</small>","{A}, your manu. Tap to hear a word.":"{A}, votre manu. Touchez-le pour entendre un mot.","To {A}: {B}.":"Pour {A} : {B}.","Visit for real · {A}":"À visiter en vrai · {A}","<b>{A}</b>{B}<span>{C}</span><span>say: {D}</span>":"<b>{A}</b>{B}<span>{C}</span><span>dites : {D}</span>","Tap your manu or try an activity to learn your first words.":"Touchez votre manu ou essayez une activité pour apprendre vos premiers mots.","{A} more words to find on your voyage.":"Encore {A} mots à trouver pendant votre voyage.","{A} of {B} words":"{A} mots sur {B}","{B} of {C} activities":"{B} activités sur {C}","best vaʻa lap":"meilleur tour en vaʻa","<b>ʻĀʻai · Legends heard:</b> {H} of {I}. {J}":"<b>ʻĀʻai · Légendes entendues :</b> {H} sur {I}. {J}","A flower behind the ear":"Une fleur derrière l'oreille","Finish Tahiti":"Terminez Tahiti","Finish Moʻorea or print one":"Terminez Moʻorea ou imprimez-en un","Finish Porapora":"Terminez Porapora","Weave it in the garden":"Tressez-le au jardin","String it in the garden":"Enfilez-le au jardin","Sew it in the garden":"Cousez-le au jardin","Learn ev  for its three “eyes”.":"Demandez une noix de coco verte fraîche : l'eau à l'intérieur est fraîche et sucrée. Cherchez ses trois « yeux ».","ʻUru is roasted whole over the fire until the skin is black, or cooked in an earth oven.":"Le ʻuru se grille entier sur le feu jusqu'à ce que la peau soit noire, ou se cuit au four enterré.","red dye fig":"figuier à teinture rouge","for tapa":"pour le tapa","peacock green":"vert paon","silver grey":"gris argent","deep blue":"bleu profond","and a seed":"et une graine","Harvest:":"Récolte :","A shell for a hei ({A}).":"Un coquillage pour un hei ({A}).","pearl!":"perle !",", ready to harvest":", prêt à récolter","Waxing moon":"Lune croissante","Waning moon":"Lune décroissante","Seeds planted now grow faster: growers here replant while the moon is waxing.":"Les graines plantées maintenant poussent plus vite : ici, on replante pendant la lune croissante.","Plants grow at a normal pace until the next new moon.":"Les plantes poussent à un rythme normal jusqu'à la prochaine nouvelle lune.","Matariʻi i niʻa":"Matariʻi i niʻa",", the season of abundance. Fruit gives more.":", la saison de l'abondance. Les fruits donnent davantage.","Matariʻi i raro":"Matariʻi i raro",", the cooler, drier season. The season of abundance returns on 20 November, in {A} days.":", la saison plus fraîche et plus sèche. La saison de l'abondance revient le 20 novembre, dans {A} jours.","In season now: {A}":"De saison en ce moment : {A}","grows twice as fast.":"pousse deux fois plus vite.","· in season":"· de saison","×{D} · {E} min{F}":"×{D} · {E} min{F}","No seeds left. Finish activities and hear legends to win more.":"Plus de graines. Terminez des activités et écoutez des légendes pour en gagner d'autres.","Open the oyster":"Ouvrir l'huître","Open":"Ouvrir","Empty for now. Harvest your plants and pick up shells on the beaches.":"Vide pour l'instant. Récoltez vos plantes et ramassez des coquillages sur les plages.","· heard":"· entendue","{I} pearl{J}":"{I} perle{J}","(planted on a waxing moon)":"(plantée pendant la lune croissante)",": {B} left{C}. {D}":" : il en reste {B}{C}. {D}","Taste it for real":"Goûtez-le en vrai","{#1} vavai and {#2} dye (rēʻa, ʻaute or mati)":"{#1} vavai et {#2} teinture (rēʻa, ʻaute ou mati)","{#1} fara (pandanus)":"{#1} fara (pandanus)","{#1} pearl and {#2} pūpū":"{#1} perle et {#2} pūpū","{#1} vavai and {#2} dye":"{#1} vavai et {#2} teinture","Island shirts have a flat camp collar, short sleeves, a pocket cut so the print runs on, and often coconut buttons. Their all-over prints of flowers and leaves grew out of Polynesian bark-cloth stamping and Japanese printed cotton. In Tahiti people wear them for work, church and every celebration.":"Les chemises des îles ont un col cranté plat, des manches courtes, une poche coupée pour que le motif se poursuive, et souvent des boutons en noix de coco. Leurs motifs de fleurs et de feuilles sur toute la surface sont nés de l'impression polynésienne sur étoffe d'écorce et du coton imprimé japonais. À Tahiti, on les porte au travail, à l'église et à chaque fête.","Look for shirts in Tahitian prints at Papeete market and in local fashion shops, and for the fabric by the metre to have one made.":"Cherchez des chemises à motifs tahitiens au marché de Papeete et dans les boutiques de mode locales, ou du tissu au mètre pour vous en faire coudre une.","{#1} ʻuru bark and {#2} dye (tiʻaʻiri, mati or rēʻa)":"{#1} écorce d'ʻuru et {#2} teinture (tiʻaʻiri, mati ou rēʻa)","Needs":"Il faut","· made":"· fabriqué","Make by hand · {A}":"Fabriquer à la main · {A}","Do you like it?":"Ça vous plaît ?","A length of cotton cloth, freshly dyed":"Un coupon de tissu de coton, fraîchement teint","Tap the cloth to lay a leaf ({A} of 8).":"Touchez le tissu pour poser une feuille ({A} sur 8).","Dyed with":"Teint avec",", printed by the sun.":", imprimé par le soleil.","A pandanus mat being woven":"Une natte de pandanus en cours de tressage","Row {A}:":"Rang {A} :","This strip goes {A}.":"Cette bande passe {A}.","Tiare band":"Bande tiare","ʻAute band":"Bande ʻaute","uses {#1}":"utilise {#1}","none in basket":"aucun dans le panier","A {A} weave of fara, with a {B} band.":"Un tressage {A} de fara, avec une bande {B}.","A cord for the necklace":"Un cordon pour le collier","{A} pearl{B} and {C} shell{D} on a cord.":"{A} perle{B} et {C} coquillage{D} sur un cordon.","Bark on a wooden anvil":"Une écorce sur une enclume en bois","{A} / 24 beats":"{A} / 24 coups","Beaten from ʻuru bark and printed with {A}.":"Battu à partir d'écorce d'ʻuru et imprimé de {A}.","{A} of 10 prints":"{A} impressions sur 10","rēʻa yellow":"jaune rēʻa","ʻaute violet":"violet ʻaute","mati red":"rouge mati","tiʻaʻiri black":"noir tiʻaʻiri","leaf green":"vert feuille","(none in basket)":"(aucun dans le panier)","Not enough in your basket for this design. Try another print colour or motif.":"Pas assez dans votre panier pour ce motif. Essayez une autre couleur ou un autre motif.",", printed with {B}.":", imprimé de {B}.","How the coconut palm was born":"La naissance du cocotier","Long ago, Hina was promised to the Prince of Eels, the ruler of the rivers. She did not want him, and ran to Hiro for help.":"Il y a très longtemps, Hina fut promise au Prince des Anguilles, le maître des rivières. Elle ne voulait pas de lui et courut demander de l'aide à Hiro.","Hiro caught the eel in the river and cut off its head. He wrapped it in leaves and told Hina: “Do not put the basket on the ground until you are home.” But the day was hot. Hina set the basket down by the river and went to bathe.":"Hiro attrapa l'anguille dans la rivière et lui coupa la tête. Il l'enveloppa dans des feuilles et dit à Hina : « Ne pose pas le panier par terre avant d'être rentrée. » Mais il faisait chaud. Hina posa le panier au bord de la rivière et alla se baigner.","A Tahitian telling recorded in Arue (USC Digital Folklore Archives). Many versions are told across Polynesia.":"Un récit tahitien recueilli à Arue (USC Digital Folklore Archives). De nombreuses versions se racontent à travers la Polynésie.","Why Mouaputa has a hole":"Pourquoi Mouaputa a un trou","A god on Mount Pahia":"Un dieu sur le mont Pahia","ʻĀʻai · Legend{A}":"ʻĀʻai · Légende{A}","{D} of {E}":"{D} sur {E}","Back to":"Retour à","{D} of {E} legends heard.":"{D} légendes entendues sur {E}.","the Milky Way":"la Voie lactée","teh vah-ee-OH-rah":"té va-i-O-ra","Betelgeuse":"Bételgeuse","AH-nah VAH-roo":"A-na VA-rou","PEE-pee-ree MAH":"PI-pi-ri MA","Scorpius, the fishhook of Māui":"le Scorpion, l'hameçon de Māui","teh MAH-tow ah MAH-oo-ee":"té MA-taou a MA-ou-i","the Southern Cross":"la Croix du Sud","Alpha and Beta Centauri":"Alpha et Bêta du Centaure","“the water of life”":"« l'eau de la vie »","The great river of light across the whole sky. Tauhā and Te Matau a Māui both sit on it.":"Le grand fleuve de lumière qui traverse tout le ciel. Tauhā et Te Matau a Māui s'y trouvent tous les deux.","“the little eyes”":"« les petits yeux »","A tight little group of stars. When it rises at dusk, around {#1} November, the season of abundance begins; when it sets, around {#2} May, the land rests.":"Un petit groupe d'étoiles serrées. Quand il se lève au crépuscule, vers le {#1} novembre, la saison d'abondance commence ; quand il se couche, vers le {#2} mai, la terre se repose.","“the three”":"« les trois »","Three stars in a neat row, easy to find. They rise almost exactly in the east and set in the west.":"Trois étoiles bien alignées, faciles à trouver. Elles se lèvent presque exactement à l'est et se couchent à l'ouest.","one of the ten pillars of the sky":"l'un des dix piliers du ciel","A big orange star above Tautoru. The ancients counted ten ʻana, pillar stars that hold up the sky.":"Une grosse étoile orange au-dessus de Tautoru. Les anciens comptaient dix ʻana, des étoiles-piliers qui soutiennent le ciel.","the great guide star":"la grande étoile guide","The brightest star of the night. It passes right over Tahiti: it is the island’s ʻaveiʻa, the star that shows navigators where the island is.":"L'étoile la plus brillante de la nuit. Elle passe juste au-dessus de Tahiti : c'est l'ʻaveiʻa de l'île, l'étoile qui montre aux navigateurs où se trouve l'île.","Pīpiri and his sister Rehua":"Pīpiri et sa sœur Rehua","Two stars side by side. The legend tells of two children, Pīpiri and Rehua, who went to live in the sky; you see them together in the cool season.":"Deux étoiles côte à côte. La légende parle de deux enfants, Pīpiri et Rehua, partis vivre dans le ciel ; on les voit ensemble pendant la saison fraîche.","Scorpius":"Scorpion","“the fishhook of Māui”":"« l'hameçon de Māui »","A great hook of stars. The story goes that Māui used it to fish the islands up from the bottom of the ocean.":"Un grand hameçon d'étoiles. On raconte que Māui s'en servit pour pêcher les îles au fond de l'océan.","“the pillar of the entrance”":"« le pilier de l'entrée »","The red heart of Māui’s fishhook, and the first of the ten pillars of the sky.":"Le cœur rouge de l'hameçon de Māui, et le premier des dix piliers du ciel.","“the group of four”":"« le groupe de quatre »","Four stars in a cross. Its long arm points south: the compass of Polynesian navigators.":"Quatre étoiles en croix. Son grand bras pointe vers le sud : la boussole des navigateurs polynésiens.","“the two eyes”":"« les deux yeux »","Two very bright stars looking at Tauhā. Follow their gaze and they lead you to the cross.":"Deux étoiles très brillantes qui regardent Tauhā. Suivez leur regard : il vous mène à la croix.","the Moon":"la Lune","it sets the rhythm of fishing and planting":"elle rythme la pêche et les plantations","Every night of the moon has its own name in Reo Tahiti. Tireo is the first crescent, Hotu and Māraʻi are full-moon nights, and Mutu is the night it disappears.":"Chaque nuit de la lune a son propre nom en Reo Tahiti. Tireo est le premier croissant, Hotu et Māraʻi sont des nuits de pleine lune, et Mutu est la nuit où e
