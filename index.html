esque. Celle-ci, c'est {A} ({B}). Continuez à chercher.","Manu Tere is on your home screen.":"Manu Tere est sur votre écran d'accueil.","Māuruuru!":"Māuruuru!","<b>Installed.</b> You are using Manu Tere from your home screen.":"<b>Installée.</b> Vous utilisez Manu Tere depuis votre écran d'accueil.","To install Manu Tere on your phone, open its own web address (the GitHub version) in your browser. Meanwhile, keep a backup code below.":"Pour installer Manu Tere sur votre téléphone, ouvrez sa propre adresse web (la version GitHub) dans votre navigateur. En attendant, gardez un code de sauvegarde ci-dessous.","<b>iPhone and iPad:</b> in Safari, tap the Share button, then <b>Add to Home Screen</b>. Your voyage is kept with the app.":"<b>iPhone et iPad :</b> dans Safari, touchez le bouton Partager, puis <b>Sur l'écran d'accueil</b>. Votre voyage est conservé avec l'application.","Installed apps keep their progress longer, and work without a connection.":"Les applications installées gardent leur progression plus longtemps et fonctionnent sans connexion.","If no install button shows, use your browser menu:":"Si aucun bouton d'installation n'apparaît, utilisez le menu de votre navigateur :","Install app":"Installer l'application","or":"ou","Add to Home screen":"Ajouter à l'écran d'accueil","Already travelling?":"Déjà en voyage ?","or choose a save file":"ou choisissez un fichier de sauvegarde","This replaces the voyage on this phone.":"Cela remplace le voyage enregistré sur ce téléphone.","Paste a backup code{E}. {F}":"Collez un code de sauvegarde{E}. {F}","Copied. Keep it somewhere safe.":"Copié. Gardez-le en lieu sûr.","Select the code and copy it.":"Sélectionnez le code et copiez-le.","Saved to your downloads.":"Enregistré dans vos téléchargements.","Your browser could not save a file. Copy the code instead.":"Votre navigateur n'a pas pu enregistrer de fichier. Copiez plutôt le code.","Welcome back,":"Bon retour,","! {B} island{C}, {D} words.":" ! {B} île{C}, {D} mots.","Keep your voyage safe:":"Protégez votre voyage :","My manu › Save and restore":"Mon manu › Sauvegarder et restaurer","VAH-ee":"VA-i","MEE-tee":"MI-ti","AH-nah-PAH-peh":"A-na-PA-pé","young plant":"jeune plant","green fruit":"fruit vert","turning: ready":"en train de jaunir : prêt","fully yellow":"entièrement jaune","Pineapple plant, {B}":"Plant d'ananas, {B}","{A} Queen pineapples picked at just the right moment.":"{A} ananas Queen cueillis juste au bon moment.","Only leaves for now: this plant is still growing.":"Seulement des feuilles pour l'instant : ce plant pousse encore.","It is flowering: the little violet flowers will become the fruit.":"Il est en fleur : les petites fleurs violettes deviendront le fruit.","Still green: wait until the bottom quarter turns yellow.":"Encore vert : attendez que le quart du bas devienne jaune.","Not yet":"Pas encore","Too yellow: it would be overripe by the time it reaches the market.":"Trop jaune : il serait trop mûr en arrivant au marché.","Overripe: it goes on the compost to feed the soil.":"Trop mûr : il part au compost pour nourrir la terre.","Too late":"Trop tard","An underwater coral nursery on Moʻorea":"Une pépinière de corail sous-marine à Moʻorea","{A} of 4 planted":"{A} sur 4 plantés","{A} of 6 hung":"{A} sur 6 suspendus","{A} of {B} cleaned":"{A} sur {B} nettoyés","{#1}. Plant on the reef.":"{#1}. Plantez sur le récif.","First tap a big coral on the top ropes, then a bare rock.":"Touchez d'abord un grand corail sur les cordes du haut, puis un rocher nu.","blue-green chromis":"chromis bleu-vert","The {A} {B} back!":"Les {A} {B} de retour !","0 of {A} cleaned":"0 sur {A} nettoyés","golden and firm":"doré et ferme","still green":"encore vert","the press":"le pressoir","the grower":"le producteur","the compost":"le compost","That one was {A}: it should go to {B}.":"Celui-ci était {A} : direction {B}.","Not full enough. Try the next bottle.":"Pas assez rempli. Essayez la bouteille suivante.","Overflowing! Try the next bottle.":"Ça déborde ! Essayez la bouteille suivante.","You sorted {A} of 10 pineapples correctly and filled five bottles of painapo juice.":"Vous avez bien trié {A} ananas sur 10 et rempli cinq bouteilles de jus de painapo.","A huge spout!":"Un jet énorme !","Five big spouts at Arahoho, the cave that howls.":"Cinq grands jets à Arahoho, la grotte qui hurle.","Too small: only big swell makes it blow.":"Trop petit : seule une grosse houle la fait souffler.","Missed that big one. Next!":"Vous avez raté ce gros-là. Au suivant !","That leads back down. The falls are the other way.":"Ce chemin redescend. Les cascades sont de l'autre côté.","Not that one. Look at the heights again.":"Pas celle-là. Regardez à nouveau les hauteurs.","The legend of the three falls":"La légende des trois cascades","{#1} tiare seeds, the flowers of the valley":"{#1} graines de tiare, les fleurs de la vallée","Faarumai":"Faarumai","Arahoho":"Arahoho","Rotui":"Rotui","{A} · Landmark":"{A} · Site remarquable","VAH-nee-rah":"VA-ni-ra","mountain plantain":"plantain de montagne","FEH-ee":"FÉ-i","taro root":"racine de taro","TAH-roh":"TA-ro","poʻe":"poʻe","fruit pudding":"dessert aux fruits","Fēʻī, the mountain plantain, grows wild in the high valleys. It is eaten cooked, often from the ahimāʻa, and its flesh turns a deep orange.":"Le fēʻī, le plantain de montagne, pousse à l'état sauvage dans les hautes vallées. On le mange cuit, souvent sorti de l'ahimāʻa, et sa chair prend une couleur orange foncé.","Taro is steamed in the ahimāʻa and eaten with coconut milk. Its young leaves are cooked too.":"Le taro est cuit à l'étouffée dans l'ahimāʻa et se mange avec du lait de coco. Ses jeunes feuilles se cuisinent aussi.","cured vanilla pod":"gousse de vanille préparée","Breadfruit from the oven":"Fruit de l'arbre à pain du four","Whole ʻuru steams in the ahimāʻa until the flesh is soft and sweet. It is the bread of the islands.":"Le ʻuru entier cuit à l'étouffée dans l'ahimāʻa jusqu'à ce que sa chair soit tendre et sucrée. C'est le pain des îles.","Taro with coconut milk":"Taro au lait de coco","Steamed taro is sliced and eaten with fresh coconut milk, squeezed from grated haʻari.":"Le taro cuit à la vapeur est coupé en tranches et mangé avec du lait de coco frais, pressé à partir de haʻari râpé.","Oven plantain":"Plantain au four","Fēʻī comes out of the oven bright orange. It is one of the oldest foods of the islands.":"Le fēʻī sort du four d'un orange éclatant. C'est l'un des plus anciens aliments des îles.","· not enough in your basket":"· pas assez dans votre panier","{A} dish{B}":"{A} plat{B}","Not enough in your basket for all of these together.":"Pas assez dans votre panier pour tout cela à la fois.","Tahaʻa · Earth oven":"Tahaʻa · Four enterré","An earth oven dug in the sand":"Un four enterré creusé dans le sable","Leaves go first, right on the food.":"Les feuilles d'abord, directement sur la nourriture.","Maʻa Tahiti is served: {A}.":"Le maʻa Tahiti est servi : {A}.","<span>Māuruuru!</span> Out of the oven: {A}.":"<span>Māuruuru!</span> Sorti du four : {A}.","About {A} hour{B} to go…":"Encore environ {A} heure{B}…","A vanilla vine on its supports, in a shade house":"Une liane de vanille sur ses tuteurs, dans une ombrière","Wilted flower":"Fleur fanée","Still a bud. Wait for it to open.":"Encore un bouton. Attendez qu'il s'ouvre.","Already pollinated: a pod will grow here.":"Déjà pollinisée : une gousse va pousser ici.","Wilted: the flower closed before anyone reached it.":"Fanée : la fleur s'est refermée avant que quelqu'un n'arrive.",", and {A} closed before you reached them":", et {A} se sont refermées avant votre arrivée","You hand-pollinated {A} vanilla flowers{B}.":"Vous avez pollinisé à la main {A} fleurs de vanille{B}.","Vanilla pods drying on a rack in the sun":"Des gousses de vanille qui sèchent au soleil sur une claie","0 / {B} days":"0 / {B} jours","Day {A} · in the sun…":"Jour {A} · au soleil…","Day {A}: just right. The pods are turning brown.":"Jour {A} : parfait. Les gousses brunissent.","Day {A}: too short, the pods are still damp.":"Jour {A} : trop court, les gousses sont encore humides.","Day {A}: too long, the pods are drying out.":"Jour {A} : trop long, les gousses se dessèchent.","{A} / {B} days":"{A} / {B} jours","{A} of 6 massaged":"{A} sur 6 massées","{A} of {B} days just right. After three to four more months of ageing, you get":"{A} jours parfaits sur {B}. Après encore trois à quatre mois d'affinage, vous obtenez","{C} cured vanilla pod{D}":"{C} gousse{D} de vanille affinée","for your kitchen.":"pour votre cuisine.","The family shares a poʻe with you, and gives you seeds of fēʻī and taro. You can now cook in your own faʻaʻapu.":"La famille partage un poʻe avec vous et vous donne des graines de fēʻī et de taro. Vous pouvez maintenant cuisiner dans votre propre faʻaʻapu.","The vanilla island":"L'île vanille","Vānira":"Vānira","Smell that? The whole island smells of vanilla.":"Vous sentez ? Toute l'île sent la vanille.","We share our lagoon with Raiatea.":"Nous partageons notre lagon avec Raiatea.","Ahimāʻa":"Ahimāʻa","On Sunday, the oven smokes behind the houses.":"Le dimanche, le four fume derrière les maisons.","Te vānira pāpaʻa":"Te vānira pāpaʻa","Te vānira":"Te vānira","a vanilla flower behind the ear":"une fleur de vanille derrière l'oreille","Finish Tahaʻa":"Terminer Tahaʻa","by boat or a short flight via Raiatea":"en bateau ou par un court vol via Raiatea","by boat or a short flight from Raiatea":"en bateau ou par un court vol depuis Raiatea","about {#1} minutes by plane to Raiatea, then a boat across the lagoon":"environ {#1} minutes d'avion jusqu'à Raiatea, puis un bateau à travers le lagon","by plane via Tahiti to Raiatea, then a boat":"en avion via Tahiti jusqu'à Raiatea, puis en bateau","boat to Raiatea, then about {#1} minutes by plane":"bateau jusqu'à Raiatea, puis environ {#1} minutes d'avion","boat to Raiatea, then a plane via Tahiti":"bateau jusqu'à Raiatea, puis avion via Tahiti","Taputapuātea marae on Raiatea is a UNESCO World Heritage site and the heart of Polynesian voyaging. Raiatea shares its lagoon with Tahaʻa.":"Le marae de Taputapuātea, à Raiatea, est inscrit au patrimoine mondial de l'UNESCO et constitue le cœur du voyage polynésien. Raiatea partage son lagon avec Tahaʻa.","PAH-hee":"PA-hi","the tail of Māui’s fishhook":"la queue de l'hameçon de Māui","A star is only useful near the horizon: watch it.":"Une étoile n'est utile que près de l'horizon : surveillez-la.","{H} km to go":"Encore {H} km","has set. A navigator now takes the next star that sets":"vient de se coucher. Un navigateur prend alors l'étoile suivante qui se couche","at the same point":"au même point","on the horizon. Tap it.":"de l'horizon. Touchez-la.","has climbed too high to steer by. Take the next star that rises":"monte désormais trop haut pour guider la route. Prenez l'étoile suivante qui se lève",", {B}, {C} where {D} did. Follow it now. Navigators learned the rising and setting points of more than 200 stars.":", {B}, {C} là où {D} l'a fait. Suivez-la maintenant. Les navigateurs connaissaient les points de lever et de coucher de plus de 200 étoiles.","That star {A} far {B} of our course: we would miss the island. Look for the one at the same point as {C}.":"Cette étoile {A} loin au {B} de notre route : nous manquerions l'île. Cherchez celle qui se trouve au même point que {C}.","Welcome back to":"Bon retour à","New word: <b>{A}</b> · {B}":"Nouveau mot : <b>{A}</b> · {B}","<b>{A}</b>{B}":"<b>{A}</b>{B}","Harvest: <b>{A}</b> {B}":"Récolte : <b>{A}</b> {B}","Harvest: <b>{A}</b>":"Récolte : <b>{A}</b>","say: {A}":"prononcer : {A}"},"ja":{"<b>E aha te huru?</b>How are you?":"<b>E aha te huru?</b>お元気ですか？","<b>Fēʻī</b> · Oven plantain<br><span>{#1} fēʻī · not enough in your basket</span>":"<b>Fēʻī</b> · かまど焼きの料理用バナナ<br><span>{#1} fēʻī · かごの中の数が足りません</span>","<b>Fēʻī</b> · Oven plantain<br><span>{#1} fēʻī</span>":"<b>Fēʻī</b> · かまど焼きの料理用バナナ<br><span>{#1} fēʻī</span>","<b>Haere mai</b>Come here!":"<b>Haere mai</b>こっちにおいで！","<b>How it began:</b> soon after the First World War, the Jamet brothers of Taravao started a service to Papeete with a Dodge truck.":"<b>はじまり：</b>第一次世界大戦の少しあと、TaravaoのJamet兄弟がダッジのトラックでPapeeteへの運行を始めました。","<b>How to say it.</b> Vowels are pure: <i>a</i> as in father, <i>e</i> as in bed, <i>i</i> as in machine, <i>o</i> as in more, <i>u</i> as in moon. The <span>ʻ</span> (ʻeta) is a short catch in the voice, as in “uh-oh”. A line over a vowel (ā) makes it longer.":"<b>発音のしかた。</b>母音は澄んだ音です。<i>a</i>は「ア」、<i>e</i>は「エ」、<i>i</i>は「イ」、<i>o</i>は「オ」、<i>u</i>は「ウ」と読みます。<span>ʻ</span>（ʻeta）は「あっ」と言うときのような、声の短い区切りです。母音の上の横線（ā）は、その音を長くのばします。","<b>Inside:</b> padded benches ran down each side, sometimes with one more in the middle, so passengers sat facing each other. Plexiglass windows slid shut on rainy days, and trucks had {#1}, {#2} or up to {#3} seats.":"<b>車内：</b>両側にクッション付きのベンチが並び、ときには真ん中にもう1列あって、乗客は向かい合って座りました。雨の日はプレキシガラスの窓を閉め、座席数は{#1}、{#2}、多いものでは{#3}席でした。","<b>Maeva</b>Welcome!":"<b>Maeva</b>ようこそ！","<b>Matariʻi i raro</b>, the cooler, drier season. The season of abundance returns on {#1} November, in {#2} days.":"<b>Matariʻi i raro</b>、涼しく乾いた季節です。実りの季節は11月{#1}日、あと{#2}日で戻ってきます。","<b>Matariʻi then Pīpiri mā</b> brought us here. Polynesian navigators crossed thousands of kilometres of ocean this way, reading the stars, the swells, the wind and the birds, with no instruments at all.":"<b>Matariʻi、そしてPīpiri mā</b>が私たちをここへ導きました。ポリネシアの航海者たちは、星、うねり、風、鳥を読み、計器をまったく使わずに、何千キロもの海をこうして渡りました。","<b>Matariʻi</b> has set. A navigator now takes the next star that sets <b>at the same point</b> on the horizon. Tap it.":"<b>Matariʻi</b>が沈みました。航海者は次に、水平線の<b>同じ地点</b>に沈む星を目印にします。その星をタップしましょう。","<b>Moʻorea</b> · {#1}/{#2}":"<b>Moʻorea</b> · {#1}/{#2}","<b>Māuruuru</b>Look at me!":"<b>Māuruuru</b>見て見て！","<b>Māuruuru</b>Thank you!":"<b>Māuruuru</b>ありがとう！","<b>Nana</b>Bye for now!":"<b>Nana</b>またね！","<b>Nine to ten months later…</b> each pollinated flower has become a long green pod. They are picked when they turn from yellow to brown, then dried for weeks.":"<b>9〜10か月後…</b>受粉した花はそれぞれ長い緑のさやになります。黄色から茶色に変わるころに摘み取り、何週間もかけて乾燥させます。","<b>No fixed stops:</b> outside Papeete, you raised your arm at the roadside, and some families left big leaves outside their house to ask for a ride. To get off, you rang a bell to the driver.":"<b>決まった停留所なし：</b>Papeeteの外では道ばたで手を挙げて乗り、家の前に大きな葉を置いて乗せてほしいと合図する家族もいました。降りるときはベルを鳴らして運転手に知らせました。","<b>Painapo</b>Pineapples grow up in the valley.":"<b>Painapo</b>谷の上のほうでパイナップルが育ちます。","<b>Porapora</b> · Bora Bora · {#1}/{#2}":"<b>Porapora</b> · ボラボラ · {#1}/{#2}","<b>Poʻe vānira</b> · Plantain poʻe with Tahaʻa vanilla<br><span>{#1} fēʻī + {#2} haʻari + {#3} vānira · not enough in your basket</span>":"<b>Poʻe vānira</b> · Tahaʻaバニラ入り料理用バナナのpoʻe<br><span>{#1} fēʻī + {#2} haʻari + {#3} vānira · かごの中の数が足りません</span>","<b>Poʻe vānira</b> · Plantain poʻe with Tahaʻa vanilla<br><span>{#1} fēʻī + {#2} haʻari + {#3} vānira</span>":"<b>Poʻe vānira</b> · Tahaʻaバニラ入り料理用バナナのpoʻe<br><span>{#1} fēʻī + {#2} haʻari + {#3} vānira</span>","<b>Pīpiri mā</b>, Castor and Pollux, sets where Matariʻi did. Follow it now. Navigators learned the rising and setting points of more than {#1} stars.":"<b>Pīpiri mā</b>（カストルとポルックス）は、Matariʻiと同じ地点に沈みます。今度はこの星をたどりましょう。航海者たちは{#1}個以上の星について、昇る地点と沈む地点を覚えていました。","<b>Pūpū!</b> A shell for a hei ({#1}).":"<b>Pūpū！</b>hei用の貝殻です（{#1}）。","<b>Ride one:</b> each January, the festive <b>Tere Faʻaʻati</b> tour goes round Tahiti in decorated trucks, with ukuleles and songs. Ask the Papeete tourist office for dates and booking.":"<b>乗ってみよう：</b>毎年1月、お祭りの<b>Tere Faʻaʻati</b>ツアーでは、飾りつけたトラックがウクレレと歌とともにTahitiを一周します。日程と予約はPapeeteの観光案内所でたずねてください。","<b>Sort and massage.</b> When sorting, each pod is massaged between the fingers to spread its seeds and oils evenly. Rub each pod.":"<b>選別とマッサージ。</b>選別のとき、さやを1本ずつ指でもみ、種と油分を均一に行きわたらせます。さやをこすりましょう。","<b>Tahaʻa</b> · {#1}/{#2}":"<b>Tahaʻa</b> · {#1}/{#2}","<b>Tahiti</b> · {#1}/{#2}":"<b>Tahiti</b> · {#1}/{#2}","<b>Taro</b> · Taro with coconut milk<br><span>{#1} taro + {#2} haʻari · not enough in your basket</span>":"<b>Taro</b> · タロイモのココナッツミルク煮<br><span>{#1} taro + {#2} haʻari · かごの中の数が足りません</span>","<b>Taro</b> · Taro with coconut milk<br><span>{#1} taro + {#2} haʻari</span>":"<b>Taro</b> · タロイモのココナッツミルク煮<br><span>{#1} taro + {#2} haʻari</span>","<b>Taste it for real:</b> look for poʻe at Papeete market and at family feasts. Tahaʻa vanilla is sold at the plantations on the island.":"<b>本物を味わおう：</b>poʻeはPapeeteの市場や家族の祝宴で探してみてください。Tahaʻaバニラは島のプランテーションで買えます。","<b>Te mahana</b> brought us here. Polynesian navigators crossed thousands of kilometres of ocean this way, reading the stars, the swells, the wind and the birds, with no instruments at all.":"<b>Te mahana</b>が私たちをここへ導きました。ポリネシアの航海者たちは、星、うねり、風、鳥を読み、計器をまったく使わずに、何千キロもの海をこうして渡りました。","<b>To market:</b> the roof was piled with fruit, taro, fish and chickens for the Papeete market, and even canoes for the July festivals. Music played and people sang on the way.":"<b>市場へ：</b>屋根の上には、Papeeteの市場へ運ぶ果物、タロイモ、魚、ニワトリが山積みにされ、7月の祭りのためのカヌーまで載っていました。道中は音楽が流れ、人々は歌いました。","<b>Today:</b> about {#1} trucks ran in {#2}. Since the late {#3}s they have been replaced on Tahiti by buses, which are safer; the Tere Tahiti network includes some electric buses. Trucks still carry children to school on some outer islands.":"<b>現在：</b>{#2}年にはおよそ{#1}台のトラックが走っていました。{#3}年代後半から、Tahitiではより安全なバスに置き換えられ、Tere Tahitiの路線網には電気バスもあります。一部の離島では、今もトラックが子どもたちを学校へ運んでいます。","<b>Waning moon.</b> Plants grow at a normal pace until the next new moon.":"<b>欠けていく月。</b>次の新月まで、植物はふつうのペースで育ちます。","<b>{#1}. Build the fire.</b> Burning… In real life the stones heat for most of the night, until they glow red.":"<b>{#1}. 火をおこす。</b>燃えています…実際には、石は一晩のほとんどをかけて、赤く光るまで熱せられます。","<b>{#1}. Build the fire.</b> The pit is ready. Fill it with wood and dry coconut husks, then light it. The volcanic stones on top store the heat.":"<b>{#1}. 火をおこす。</b>穴の準備ができました。薪と乾いたココナッツの殻を詰めて、火をつけましょう。上にのせた火山岩が熱をたくわえます。","<b>{#1}. Catch it.</b> A swell is coming. Paddle when it lifts the back of your board: when the hump is just behind your manu.":"<b>{#1}. 波をつかまえる。</b>うねりがやってきます。波がボードの後ろを持ち上げたとき、つまり盛り上がりがあなたのマヌのすぐ後ろに来たらパドルしましょう。","<b>{#1}. Clean the nursery.</b> Algae grow on the ropes and smother young corals. Tap each green clump to brush it off.":"<b>{#1}. 育成場をそうじする。</b>ロープに藻が生えると、若いサンゴをおおってしまいます。緑のかたまりを1つずつタップして、はらい落としましょう。","<b>{#1}. Close the oven</b> in the right order: banana leaves first, then wet copra sacks, then sand on top to keep the heat in.":"<b>{#1}. かまどを閉じる。</b>順番が大切です。まずバナナの葉、次にぬらしたコプラ袋、最後に砂をかぶせて熱を閉じこめます。","<b>{#1}. Fill the bottles.</b> Hold the tap and let go when the juice reaches the red line. Not too little, not over!":"<b>{#1}. ボトルに詰める。</b>注ぎ口を押し続け、ジュースが赤い線に届いたら離しましょう。少なすぎず、あふれさせないように！","<b>{#1}. Hang new fragments.</b> Pieces broken by storms are saved and tied to the bottom rope. Pick a kind, then tap an empty tie.":"<b>{#1}. 新しいかけらを吊るす。</b>嵐で折れたかけらは拾われて、下のロープに結びつけられます。種類を選んで、空いている結び目をタップしましょう。","<b>{#1}. Lay banana leaves</b> on the red-hot stones. They protect the food and make steam.":"<b>{#1}. バナナの葉を敷く。</b>真っ赤に焼けた石の上に敷きます。葉は食べ物を守り、蒸気を生みます。","<b>{#1}. Open the oven.</b> Everyone gathers: this is the big moment.":"<b>{#1}. かまどを開ける。</b>みんなが集まります。いよいよ最高の瞬間です。","<b>{#1}. Plant on the reef.</b> Now tap a bare rock on the reef to fix this coral there.":"<b>{#1}. 礁に植える。</b>礁のむき出しの岩をタップして、このサンゴをそこに固定しましょう。","<b>{#1}. Plant on the reef.</b> Tap a big coral on the top ropes, then a bare rock on the reef.":"<b>{#1}. 礁に植える。</b>上のロープの大きなサンゴをタップしてから、礁のむき出しの岩をタップしましょう。","<b>{#1}. Plant on the reef.</b> These corals have grown for two to three years. Tap a big coral on the top ropes, then a bare rock on the reef.":"<b>{#1}. 礁に植える。</b>このサンゴは2〜3年かけて育ちました。上のロープの大きなサンゴをタップしてから、礁のむき出しの岩をタップしましょう。","<b>{#1}. Put in the food,</b> each parcel wrapped in banana leaves.":"<b>{#1}. 食べ物を入れる。</b>包みはひとつずつバナナの葉でくるみます。","<b>{#1}. Ride the pocket.</b> The wave breaks behind you. Hold <b>Pump</b> to speed up, let go to slow down. Stay in the green, close to the curl but not under it.":"<b>{#1}. ポケットに乗る。</b>波があなたの後ろで崩れます。<b>パンプ</b>を押し続けると加速し、離すと減速します。緑のゾーンにとどまり、カールに近づきつつ、その下には入らないように。","<b>{#1}. Sort the fruit.</b> Only golden, firm pineapples go to the press. Green ones go back to the grower, bruised ones to the compost.":"<b>{#1}. 果物を選別する。</b>搾り機に回すのは、黄金色でかたいパイナップルだけ。青いものは生産者へ戻し、傷んだものは堆肥へ。","<b>{#1}. Wait.</b> The food steams slowly for about four hours. Time to swim, talk and play the ukulele.":"<b>{#1}. 待つ。</b>食べ物は約4時間かけてじっくり蒸されます。泳いだり、おしゃべりしたり、ウクレレを弾いたりして過ごしましょう。","<b>ʻIa ora na, Moʻorea!</b>The sister island":"<b>ʻIa ora na, Moʻorea!</b>姉妹の島","<b>ʻIa ora na, Tahaʻa!</b>The vanilla island":"<b>ʻIa ora na, Tahaʻa!</b>バニラの島","<b>ʻIa ora na, Tahiti!</b>The big island":"<b>ʻIa ora na, Tahiti!</b>大きな島","<b>ʻUru</b> · Breadfruit from the oven<br><span>{#1} ʻuru · not enough in your basket</span>":"<b>ʻUru</b> · かまど焼きのパンノキの実<br><span>{#1} ʻuru · かごの中の数が足りません</span>","<b>ʻUru</b> · Breadfruit from the oven<br><span>{#1} ʻuru</span>":"<b>ʻUru</b> · かまど焼きのパンノキの実<br><span>{#1} ʻuru</span>","<b>ʻĀʻai · Legends heard:</b> {#1} of {#2}. · Hina and the eel · Pai and the pierced mountain · ʻOro and the rainbow · Ruataʻata and the ʻuru · Hina in the moon · Faʻuai and Ivi":"<b>ʻĀʻai · 聞いた伝説：</b>{#2}話中{#1}話。 · Hinaとウナギ · Paiと穴のあいた山 · ʻOroと虹 · Ruataʻataとʻuru · 月のHina · FaʻuaiとIvi","<b>ʻĀʻai · Legends heard:</b> {#1} of {#2}. ✓ Hina and the eel ✓ Pai and the pierced mountain ✓ ʻOro and the rainbow ✓ Ruataʻata and the ʻuru ✓ Hina in the moon · Faʻuai and Ivi":"<b>ʻĀʻai · 聞いた伝説：</b>{#2}話中{#1}話。 ✓ Hinaとウナギ ✓ Paiと穴のあいた山 ✓ ʻOroと虹 ✓ Ruataʻataとʻuru ✓ 月のHina · FaʻuaiとIvi","<span></span>cream":"<span></span>クリーム","<span></span>leaf green":"<span></span>リーフグリーン","<span></span>mati":"<span></span>mati","<span></span>mati red":"<span></span>matiの赤","<span></span>mati · red-brown":"<span></span>mati · 赤茶色","<span></span>rēʻa yellow":"<span></span>rēʻaの黄色","<span></span>rēʻa · yellow":"<span></span>rēʻa · 黄色","<span></span>tiʻaʻiri":"<span></span>tiʻaʻiri","<span></span>tiʻaʻiri black":"<span></span>tiʻaʻiriの黒","<span></span>white":"<span></span>白","<span></span>ʻaute violet":"<span></span>ʻauteの紫","<span></span>ʻaute · violet":"<span></span>ʻaute · 紫","<span>Hei poe</span> · Pearl and shell necklace":"<span>Hei poe</span> · 真珠と貝殻のネックレス","<span>Maeva i Tahiti!</span> Welcome to Tahiti":"<span>Maeva i Tahiti!</span> Tahitiへようこそ","<span>Māuruuru!</span> Well done.":"<span>Māuruuru!</span> よくできました。","<span>Porapora</span> · Bora Bora":"<span>Porapora</span> · ボラボラ","<span>Poʻe vānira</span> · Plantain poʻe with Tahaʻa vanilla":"<span>Poʻe vānira</span> · Tahaʻaバニラ入り料理用バナナのpoʻe","<span>Pāreu</span> · Sun-printed pāreu":"<span>Pāreu</span> · 太陽で染めたpāreu","<span>Tapa</span> · Beaten bark cloth":"<span>Tapa</span> · 樹皮を打って作った布","<span>Tāupoʻo</span> · Woven hat":"<span>Tāupoʻo</span> · 編み帽子","A Tahitian telling recorded in Arue (USC Digital Folklore Archives); guides at Lake Vaihiria tell the legend of Hina and the coconut. Many versions are told across Polynesia.":"Arueで記録されたタヒチの語り（USCデジタル民間伝承アーカイブ）。Vaihiria湖のガイドは、Hinaとココナッツの伝説を語ります。ポリネシア各地でさまざまな版が語られています。","A cloud stays piled up at one point on the horizon while others drift past: clouds gather over high islands. Land is under it.":"ほかの雲が流れていくなか、水平線の一点に雲が積み重なったまま動きません。高い島の上には雲が集まるのです。その下に陸があります。","A diamond weave of fara, with a tiare band.":"faraのダイヤ柄編みに、tiareの帯。","A fork in the trail. Which way to the other two falls?":"道が分かれています。ほかの2つの滝へはどちらでしょう？","A gift from the legend":"伝説からの贈り物","A great famine struck Raiatea. Ruataʻata, his wife Rumauariʻi and their children had nothing left to eat but mountain ferns.":"Raiateaをひどい飢饉が襲いました。Ruataʻataと妻のRumauariʻi、そして子どもたちには、山のシダのほかに食べるものが何も残っていませんでした。","A hei is a garland for the head or neck, made of flowers or shells. A shell necklace is often given to visitors when they leave, as a sign of protection. Tahitian pearls grow in the black-lipped oyster; their dark greens, blues and greys are natural.":"heiは、花や貝殻で作る、頭や首にかける飾りです。貝殻のネックレスは、お守りのしるしとして、旅立つ訪問者によく贈られます。タヒチアンパールはクロチョウガイの中で育ち、その深い緑、青、灰色は天然の色です。","A legend of Raiatea, as retold by Welcome Tahiti.":"Welcome Tahitiが再話した、Raiateaの伝説。","A motu picnic with a traditional oven":"伝統のかまどを使ったmotuでのピクニック","A pale green glow above the horizon: sunlight reflected by a lagoon. Land ho is near!":"水平線の上に淡い緑の光。ラグーンに反射した太陽の光です。陸はもうすぐ！","A pearl farm, to see grafting and harvest":"核入れと収穫を見学できる真珠の養殖場","A pineapple field in the Opunohu valley":"Opunohu谷のパイナップル畑","A pāreu is one length of cloth, tied in dozens of ways. Some painters make sun prints: leaves laid on wet, freshly painted cloth leave a pale shape once the sun has dried it.":"pāreuは一枚の布で、何十通りもの結び方があります。太陽で染める画家もいます。塗りたての湿った布に葉を置くと、太陽が乾かしたあとに淡い形が残るのです。","A shell on the sand":"砂の上の貝殻","A simplified map: the shapes are right, the distances are not, and not all these stars are up on the same night. Names vary between islands and sources.":"簡略化した地図です。形は正しいものの距離は正確ではなく、これらの星がすべて同じ夜に見えるわけではありません。名前は島や資料によって異なります。","A starter basket: cotton, turmeric, pandanus and two shells. Enough for a first pāreu and hat!":"はじめてのかご：綿、ウコン、パンダナス、貝殻2つ。最初のpāreuと帽子にはこれで十分です！","A vanilla plantation tour, with tasting":"試食つきのバニラ農園ツアー","About this island":"この島について","About {#1} hours to go…":"あと約{#1}時間…","Across the channel from Tahiti, about {#1} km away.":"Tahitiから海峡をはさんで約{#1} km。","Add coconut husks":"ココナッツの殻を足す","Add wood":"薪を足す","After Teuira Henry, Ancient Tahiti (Hōkūleʻa archive).":"Teuira Henry『Ancient Tahiti』より（Hōkūleʻaアーカイブ）。","After Teuira Henry, Ancient Tahiti. The pearl is a later addition to the story.":"Teuira Henry『Ancient Tahiti』より。真珠は後の時代に物語に加えられたものです。","After the Service du Tourisme de Polynésie française (Les {#1} Cascades site). Other versions exist.":"フランス領ポリネシア観光局（Les {#1} Cascadesのサイト）より。ほかの版もあります。","Ahimāʻa · the earth oven":"Ahimāʻa · 土のかまど（アヒマア）","Ahimāʻa<small>The earth oven</small>":"Ahimāʻa<small>土のかまど（アヒマア）</small>","Algae on the nursery":"育成場の藻","Antares":"アンタレス","Arahoho, on the coast road between Papenoo and Tiarei, was once called Anahoho, “the cave that howls”. When the swell is strong, the sea rushes into a cave under the basalt and bursts out of the hole with a roar. The old people heard a song in it: “the sea sings in harmony”. The site has been closed at times for cliff safety work, so check before you go, and always stay behind the barrier.":"PapenooとTiareiのあいだの海岸道路沿いにあるArahohoは、かつてAnahoho、「うなる洞窟」と呼ばれていました。うねりが強いと、海水が玄武岩の下の洞窟に流れこみ、ごう音とともに穴から噴き出します。昔の人々はそこに歌を聞きました。「海が調和して歌う」と。崖の安全工事のため閉鎖されることがあるので、出かける前に確認し、必ず柵の内側にいてください。","Arahoho<small>The blowhole</small>":"Arahoho<small>潮吹き穴</small>","As told by Tahiti Tourisme. The mountain’s older name is said to be Mouʻa Tapu, the sacred mountain.":"Tahiti Tourismeによる語り。この山の古い名前はMouʻa Tapu、「聖なる山」だったといわれています。","At the foot of Mount Rotui, near Cook’s Bay, Moʻorea’s fruit-juice factory makes Rotui juices from local fruit, including the Queen pineapple. It works with more than {#1} local growers. Visit in the morning, when production is at its height, then walk through the pineapple fields.":"Rotui山のふもと、クック湾の近くにあるMoʻoreaのフルーツジュース工場では、クイーン種のパイナップルなど地元の果物からRotuiジュースを作っています。{#1}軒を超える地元の生産者と協力しています。生産がいちばん盛んな朝に訪れて、そのあとパイナップル畑を歩いてみましょう。","Atolls of white sand and pink coral. Diving at Fakarava, black pearl farms.":"白い砂とピンクのサンゴの環礁。Fakaravaでのダイビング、黒真珠の養殖場。","Australs":"オーストラル諸島","Back":"戻る","Back down the trail":"道を引き返す","Back to Bora Bora":"ボラボラに戻る","Back to Moʻorea":"Moʻoreaに戻る","Back to Tahaʻa":"Tahaʻaに戻る","Back to Tahiti":"Tahitiに戻る","Back to grower":"生産者へ戻す","Back to the garden":"菜園に戻る","Banana leaves":"バナナの葉","Bare rock on the reef":"礁のむき出しの岩","Basket":"かご","Beat with the ʻiʻe":"ʻiʻeで打つ","Beaten bark cloth":"樹皮を打って作った布","Beaten from ʻuru bark and printed with tiʻaʻiri.":"ʻuruの樹皮を打って作り、tiʻaʻiriで模様をつけたもの。","Birds! At dawn, noddy terns fly out from land to fish, and at dusk they fly home. They rarely go more than about {#1} miles ({#2} km) from land: sail toward where they come from.":"鳥です！クロアジサシは夜明けに陸から漁に飛び立ち、夕暮れに帰ってきます。陸から約{#1}マイル（{#2} km）以上離れることはめったにありません。鳥がやってくる方へ進みましょう。","Black-lipped oysters on a line in the lagoon. A real Tahitian pearl takes about {#1} months to {#2} years; here time runs faster.":"ラグーンのロープにつるされたクロチョウガイ。本物のタヒチアンパールができるまでには約{#1}か月から{#2}年かかりますが、ここでは時間が早く進みます。","Black-sand beaches and waterfalls inland":"黒い砂浜と内陸の滝","Blacktip reef sharks are shy. Stay calm and keep your distance.":"ツマグロは臆病です。落ち着いて、距離をとりましょう。","Blue":"青","Bora Bora":"ボラボラ","Bora Bora stamp":"ボラボラのスタンプ","Bora Bora stamp (not yet)":"ボラボラのスタンプ（未取得）","Bud":"つぼみ","Called “the vanilla island”, it grows some of the most highly prized vanilla in the world, Vanilla tahitensis.":"「バニラの島」と呼ばれ、世界でも特に高く評価されるバニラ、Vanilla tahitensisを育てています。","Calm and slow.":"穏やかでゆっくり。","Cancel":"キャンセル","Car park":"駐車場","Castor and Pollux":"カストルとポルックス","Cauliflower (Pocillopora)":"ハナヤサイサンゴ（Pocillopora）","Chemise":"Chemise","Choose a file":"ファイルを選択","Choose a star":"星を選ぶ","Choose a weave to start.":"編み方を選んで始めましょう。","Choose this one":"これにする","Choose what to cook. Your harvest goes in wrapped in banana leaves.":"料理を選びましょう。収穫物はバナナの葉に包んで入れます。","Choose your language":"言語を選択","Clean!":"きれいになりました！","Cloak of stars":"星のマント","Close":"閉じる","Coming next":"次は","Coming soon":"近日公開","Compost":"堆肥","Copy the code":"コードをコピー","Coral garden":"サンゴの庭","Coral garden, done":"サンゴの庭、完了","Cut at the stalk. The crown is replanted: a new plant fruits in {#1} to {#2} months.":"茎のところで切ります。冠芽は植え直され、新しい株は{#1}〜{#2}か月で実をつけます。","Dance to the drums":"太鼓に合わせて踊る","Dance to the drums, done":"太鼓に合わせて踊る、完了","Day {#1} · in the sun…":"{#1}日目 · 日なたで…","Day {#1} · morning":"{#1}日目 · 朝","Day {#1}: just right. The pods are turning brown.":"{#1}日目：ちょうどいい。さやが茶色くなってきました。","Day {#1}: too short, the pods are still damp.":"{#1}日目：短すぎます。さやがまだ湿っています。","Diamond":"ダイヤ","Did you know?":"知っていますか？","Ding ding! The driver pulls over. Māuruuru, thank you, driver!":"チンチン！運転手さんが車を止めます。Māuruuru、運転手さん、ありがとう！","Done. In nine to ten months, a green pod.":"完了。9〜10か月後には緑のさやになります。","Don’t miss":"見逃せない","Dry and soft. Now decorate it: choose a colour and a motif, then tap the tapa to print.":"乾いてやわらかくなりました。さあ飾りましょう。色と模様を選び、tapaをタップしてプリントします。","Dry the vanilla":"バニラを乾かす","Dry the vanilla, done":"バニラを乾かす、完了","Drying in the shade…":"日陰で乾燥中…","Dyed with <span>rēʻa</span>, printed by the sun.":"<span>rēʻa</span>で染め、太陽でプリント。","E aha te huru?":"E aha te huru?","Each fara strip goes over (O) or under (U) the strip it crosses.":"faraの帯は、交差する帯の上（O）か下（U）を通ります。","Each vanilla flower opens only once, for a few hours. No insect here can pollinate it, so growers do it by hand with a small stick, flower by flower. Tap an open flower.":"バニラの花は一度だけ、数時間しか開きません。ここには受粉できる昆虫がいないため、生産者が小さな棒を使って一つひとつ手で受粉させます。開いている花をタップしましょう。","Empty plot. Plant a seed":"空いている区画。種をまきましょう","Empty spot on the rope":"ロープの空いている場所","Exhausted, Ruataʻata wished to become a tree that could feed his children: his hands would be its leaves, his body the trunk and branches, his head the fruit, and his tongue its heart.":"疲れ果てたRuataʻataは、子どもたちを養える木になりたいと願いました。手は葉に、体は幹と枝に、頭は実に、舌はその芯になるようにと。","Explore Tahaʻa":"Tahaʻaを探検","FAʻAʻĀ · TAHITI":"FAʻAʻĀ · TAHITI","Faarumai<small>Three waterfalls</small>":"Faarumai<small>3つの滝</small>","Faʻaheʻe! {#1} % of the ride in the pocket.":"Faʻaheʻe！ライドの{#1} %をポケットで過ごしました。","Faʻaheʻe<small>Surf Teahupoʻo</small>":"Faʻaheʻe<small>Teahupoʻoでサーフィン</small>","Faʻaʻapu":"Faʻaʻapu","Faʻaʻapu · Kitchen":"Faʻaʻapu · キッチン","Faʻaʻapu · Your garden":"Faʻaʻapu · あなたの菜園","Faʻuai and Ivi":"FaʻuaiとIvi","Feather colour":"羽の色","Feathers":"羽","Fenua":"Fenua","Find <b>Matariʻi</b>, “the little eyes”: a tight little cluster of stars.":"<b>Matariʻi</b>（「小さな目」）を探しましょう。小さくまとまった星の集まりです。","Find <b>Tautoru</b>, “the three”: three stars in a neat row.":"<b>Tautoru</b>（「3つ」）を探しましょう。きれいに一列に並んだ3つの星です。","Find <b>Taʻurua-faupapa</b>: the brightest star of the night.":"<b>Taʻurua-faupapa</b>を探しましょう。夜空でいちばん明るい星です。","Find <b>ʻAna-mua</b>: the red heart of Te Matau a Māui, the fishhook of Māui.":"<b>ʻAna-mua</b>を探しましょう。Māuiの釣り針、Te Matau a Māuiの赤い心臓です。","Finish the tapa":"tapaを仕上げる","Five lagoon friends are swimming around. Tap each one to learn its name.":"ラグーンの5匹の仲間が泳いでいます。1匹ずつタップして名前を覚えましょう。","Flap lifted. Press the pollen onto the stigma with your thumb.":"弁を持ち上げました。親指で花粉を柱頭に押しつけましょう。","Flower motifs use a fresh flower from your basket as the model.":"花の模様は、かごの中の新鮮な花をお手本にします。","Fly to Tahiti":"Tahitiへ飛ぶ","Follow the row: over or under?":"列をたどって：上？下？","For an ahimāʻa, a pit is dug and filled with coconut husks and wood, with volcanic stones on top. The fire burns most of the night until the stones glow. Food wrapped in banana leaves goes on the stones, the oven is closed with leaves, wet sacks and sand, and everything steams for about four hours. Today it is cooked for birthdays, weddings and big celebrations.":"ahimāʻaでは、穴を掘ってココナッツの殻と薪を詰め、その上に火山岩をのせます。火は一晩のほとんど燃え続け、石が赤く光るまで熱せられます。バナナの葉で包んだ食べ物を石の上に置き、葉、ぬらした袋、砂でかまどを閉じて、約4時間すべてを蒸し焼きにします。今では誕生日や結婚式、大きなお祝いのときに作られます。","For most of the {#1}th century, <b>le truck</b> was how Tahiti got around. Its Reo name is <b>pereʻoʻo mataʻeinaʻa</b>, “the district car”. It was a bare lorry chassis with a long wooden cabin built on the back, painted in bright colours, and often given a name.":"{#1}世紀の大半、Tahitiの移動手段は<b>トラック（ル・トラック）</b>でした。Reoでの名前は<b>pereʻoʻo mataʻeinaʻa</b>、「地区の車」。むき出しのトラックの車台の後ろに長い木製の客室を取りつけ、明るい色に塗ったもので、名前がつけられることもよくありました。","For your faʻaʻapu":"あなたのfaʻaʻapuに","Found":"見つけた","Four or five times wider!":"4〜5倍の広さ！","From about July to November, humpback whales (tohorā) come to Polynesian waters to give birth. Boats must keep their distance, and so must swimmers.":"7月ごろから11月ごろまで、ザトウクジラ（tohorā）が出産のためにポリネシアの海にやってきます。船も泳ぐ人も、距離をとらなければなりません。","Fāfā piti! It glides right over you.":"Fāfā piti！マンタがあなたのすぐ上をすべるように泳いでいきます。","Fāfā piti<small>Swim with a manta</small>":"Fāfā piti<small>マンタと泳ぐ</small>","Gambier":"ガンビエ諸島","Garden":"菜園","Garden and crafts":"菜園と手仕事","Gently…":"そっと…","Get ready…":"準備して…","Getting around":"移動手段","Give me a name":"名前をつけてください","Give turtles space. Never touch or ride them.":"ウミガメには距離をとりましょう。絶対に触ったり乗ったりしないでください。","Go ashore":"上陸する","Go!":"スタート！","Gold":"金","Good":"いいね","Green":"緑","Greet people with ʻIa ora na and a smile. Ask before you photograph someone. Leave the beach as you found it.":"ʻIa ora naと笑顔であいさつしましょう。人を撮影する前にはひと声かけましょう。ビーチは来たときのままにして帰りましょう。","Greetings":"あいさつ","Grown coral":"育ったサンゴ","Guides here tell the legend of Hina and the coconut.":"ここのガイドは、Hinaとココナッツの伝説を語ります。","Haamaremare":"Haamaremare","Haamaremare Iti":"Haamaremare Iti","Haamaremare Iti, {#1} m: “the little one”. Iti means small.":"Haamaremare Iti、{#1} m：「小さいほう」。Itiは「小さい」という意味です。","Haamaremare Iti: {#1} m.":"Haamaremare Iti：{#1} m。","Haamaremare Rahi":"Haamaremare Rahi","Haamaremare Rahi, {#1} m: the biggest. Rahi means big.":"Haamaremare Rahi、{#1} m：いちばん大きな滝。Rahiは「大きい」という意味です。","Haamaremare Rahi: {#1} m.":"Haamaremare Rahi：{#1} m。","Haamaremare ▶":"Haamaremare ▶","Haere mai":"Haere mai","Hand-pollinate vanilla":"バニラを手で受粉させる","Hand-pollinate vanilla, done":"バニラを手で受粉させる、完了","Harvest: <b>{#1} rēʻa</b>":"収穫：<b>{#1} rēʻa</b>","Harvest: <b>{#1} tiare</b>":"収穫：<b>{#1} tiare</b>","Harvest: <b>{#1} tiare</b> and a seed":"収穫：<b>{#1} tiare</b>と種1つ","Harvest: <b>{#1} vavai</b> and a seed":"収穫：<b>{#1} vavai</b>と種1つ","Hats are woven from pandanus leaves (fara, paeʻore), coconut leaflets (nīʻau) and other fibres, strip over strip. The Austral Islands are famous for their weaving, and each island has its own patterns.":"帽子は、パンダナスの葉（fara、paeʻore）、ココナッツの小葉（nīʻau）などの繊維を、帯を重ねて編んで作ります。オーストラル諸島は編み物で有名で、島ごとに独自の模様があります。","Hear it roar!":"ごう音を聞こう！","Hear the legend of the falls":"滝の伝説を聞く","Hei":"Hei","Hei poe":"Hei poe","Heiva":"Heiva","Here comes the first one…":"最初のひとつが来ます…","High in the mountains of Tahiti lies Lake Vaihiria, the island’s only natural lake. Guides there tell this story. Long ago, Hina was promised to the Prince of Eels, ruler of the fresh waters. She did not want him, and ran to Hiro for help.":"Tahitiの山の高いところに、島で唯一の天然湖、Vaihiria湖があります。そこのガイドたちが語る物語です。昔、Hinaは淡水を治めるウナギの王子と婚約させられていました。彼と結婚したくなかったHinaは、Hiroのもとへ助けを求めて走りました。","Hina and the eel":"Hinaとウナギ","Hina in the moon":"月のHina","Hina loved to discover. She sailed with her brother Ru to find the islands, keeping watch from the bow for land.":"Hinaは発見することが大好きでした。兄弟のRuといっしょに島々を探す航海に出て、船首から陸を見張りました。","Hint: Alpha and Beta Centauri, “the two eyes”.":"ヒント：ケンタウルス座のアルファ星とベータ星、「2つの目」。","Hint: Castor and Pollux, Pīpiri and his sister Rehua.":"ヒント：カストルとポルックス、Pīpiriとその妹Rehua。","Hint: the Milky Way, “the water of life”.":"ヒント：天の川、「命の水」。","Hiro caught the great eel and cut off its head. He wrapped it in leaves in a woven basket and told Hina: “Do not put the basket on the ground until you are home.” But the day was hot. Hina set the basket down by the water and went to bathe.":"Hiroは大ウナギをつかまえ、その頭を切り落としました。頭を葉で包んで編みかごに入れ、Hinaに言いました。「家に着くまで、かごを地面に置いてはいけない」。けれどもその日は暑い日でした。Hinaは水辺にかごを置いて、水浴びに行ってしまいました。","His sisters saw Vairaumati bathing in a pool at Vaitape. Every morning ʻOro came down the rainbow to meet her, and every evening he went back up to Pahia. His brothers brought red feathers as wedding gifts.":"彼の姉妹たちは、Vaitapeの池で水浴びをしているVairaumatiを見かけました。毎朝ʻOroは虹をつたって彼女に会いに降り、毎晩Pahiaへ帰っていきました。兄弟たちは結婚の贈り物として赤い羽根を持ってきました。","Hoe vaʻa<small>Outrigger race</small>":"Hoe vaʻa<small>アウトリガーカヌーレース</small>","Hoe! Dance!":"Hoe！踊って！","Hoe! Hoe!":"Hoe！Hoe！","Hold <b>Swim gently</b> to move closer. Too fast and the <span>fāfā piti</span> will leave. Stop at the dotted ring and stay still.":"<b>やさしく泳ぐ</b>を長押しして近づきましょう。速すぎると<span>fāfā piti</span>は去ってしまいます。点線の輪で止まって、じっとしていてください。","Hold to fill":"長押しで満たす","Hold to pump":"長押しでポンプ","Hold to walk":"長押しで歩く","Huahine":"Huahine","Huahine, coming soon":"Huahine（近日公開）","Humpback whales off Rurutu, and fine pandanus weaving.":"Rurutu沖のザトウクジラと、見事なパンダナス編み。","If no install button shows, use your browser menu: <b>Install app</b> or <b>Add to Home screen</b>.":"インストールボタンが表示されない場合は、ブラウザのメニューから<b>アプリをインストール</b>または<b>ホーム画面に追加</b>を選んでください。","In the Faarumai valley lived Faʻuai, daughter of the chief Maruraʻi. She lived apart from the world, under a tapu: she was forbidden to speak to any man.":"Faarumaiの谷に、首長Maruraʻiの娘Faʻuaiが住んでいました。彼女は世間から離れ、tapu（禁忌）のもとで暮らしていました。どんな男性とも話すことを禁じられていたのです。","In the morning, his wife found a breadfruit tree full of ripe fruit beside the house. The family was saved. That is why the ʻuru is called a tree of life.":"朝になると、妻は家のそばに熟した実がたくさんなったパンノキを見つけました。家族は救われたのです。だからʻuruは命の木と呼ばれています。","In the pocket!":"ポケットに乗った！","Inside Papeete market: fish, fruit and flowers downstairs, crafts upstairs":"Papeete市場の中：1階は魚、果物、花、2階は工芸品","Inside the fruit-juice factory":"フルーツジュース工場の中","Inside, Polynesia and Europe meet: a carved wooden Madonna and Child from the Marquesas, and Stations of the Cross showing Polynesian people.":"中ではポリネシアとヨーロッパが出会います。マルキーズ諸島の木彫りの聖母子像や、ポリネシアの人々を描いた十字架の道行きがあります。","Install on my phone":"スマホにインストール","Install or restore a voyage":"インストール、または航海を復元","International flights land at Faʻaʻā, next to Papeete.":"国際線はPapeeteの隣、Faʻaʻāに到着します。","Into the crate!":"木箱へ！","Island shirt":"アイランドシャツ","Islands":"島々","It is a place of worship: visit quietly, dress modestly, and avoid service times.":"ここは礼拝の場です。静かに見学し、控えめな服装で、礼拝の時間は避けてください。","Its highest peak, Mont Orohena, rises to {#1} m.":"最高峰のMont Orohenaは標高{#1} mです。","I’ll steer myself":"自分で舵を取ります","I’m your <span>manu tere</span>, your voyaging bird.":"わたしはあなたの<span>manu tere</span>、航海する鳥です。","Juice factory":"ジュース工場","Juice factory, done":"ジュース工場（完了）","Kaoha! Tiki, tattoo and high cliffs. A UNESCO World Heritage site since {#1}.":"Kaoha! ティキ、タトゥー、そして高い断崖。{#1}年からユネスコ世界遺産です。","Keep walking":"歩き続ける","Keep your voyage":"航海を保存","Keep your voyage safe: <b>My manu › Save and restore</b>":"航海を守りましょう：<b>わたしのマヌ › 保存と復元</b>","LAKE VAIHIRIA · TAHITI":"VAIHIRIA湖 · TAHITI","Lagoon":"ラグーン","Lagoon friends":"ラグーンの仲間たち","Lagoon friends, done":"ラグーンの仲間たち（完了）","Lake Vaihiria":"Vaihiria湖","Lake Vaihiria, in the mountains of Tahiti":"Tahitiの山あいにあるVaihiria湖","Land ho!":"陸が見えたぞ！","Language":"言語","Large print":"大きい柄","Last step: a band for your tāupoʻo":"最後の仕上げ：tāupoʻoにバンドを","Last step: tap the falls from the tallest to the smallest.":"最後の仕上げ：滝を高い順にタップしてください。","Lay banana leaves":"バナナの葉を敷く","Le truck":"トラック（ル・トラック）","Le truck, tap for its story":"トラック（ル・トラック）、タップで物語を見る","Learn to build an ahimāʻa with a family on Tahaʻa, the vanilla island. Then you can cook your own harvest here.":"バニラの島Tahaʻaで、家族と一緒にahimāʻaの作り方を学びましょう。そうすれば、ここで自分の収穫物を料理できます。","Leaves on.":"葉をかぶせました。","Left · Hoe!":"左 · Hoe!","Legend: Hina and the eel":"伝説：Hinaとウナギ","Legend: Hina and the eel, heard":"伝説：Hinaとウナギ（聞きました）","Legend: Pai and the pierced mountain":"伝説：Paiと穴のあいた山","Legend: ʻOro and the rainbow":"伝説：ʻOroと虹","Legends of the garden":"菜園の伝説","Let the manu steer":"マヌに舵を任せる","Light the fire":"火をおこす","Light the oven":"かまどに火を入れる","Lip":"リップ","Locked · Finish Moʻorea or print one":"ロック中 · Moʻoreaをクリアするか、プリントして作りましょう","Locked · Finish Porapora":"ロック中 · Poraporaをクリア","Locked · Finish Tahaʻa":"ロック中 · Tahaʻaをクリア","Locked · Finish Tahiti":"ロック中 · Tahitiをクリア","Locked · Learn every star in Te raʻi":"ロック中 · Te raʻiの星をすべて覚える","Locked · Sew it in the garden":"ロック中 · 菜園で縫いましょう","Locked · String it in the garden":"ロック中 · 菜園で糸に通しましょう","Locked · Weave it in the garden":"ロック中 · 菜園で編みましょう","Look for hand-painted pāreu at Papeete market and in craft shops on every island.":"手描きのpāreuは、Papeete市場や各島の工芸品店で探してみてください。","Look, don’t touch: keep your distance from rays, sharks, turtles and dolphins, and never feed them. Use reef-safe sunscreen and never stand on coral.":"見るだけ、触らないで：エイ、サメ、ウミガメ、イルカからは距離をとり、決してエサを与えないでください。サンゴに優しい日焼け止めを使い、サンゴの上には絶対に立たないでください。","MAEVA":"MAEVA","MANU TERE":"MANU TERE","MOʻOREA":"MOʻOREA","Made by hand":"手作り","Maeva":"Maeva","Maeva · Welcome":"Maeva · ようこそ","Main":"メイン","Make by hand":"手作りする","Make by hand · Beaten bark cloth":"手作りする · たたいた樹皮布","Make by hand · Island shirt":"手作りする · アイランドシャツ","Make by hand · Pearl and shell necklace":"手作りする · 真珠と貝のネックレス","Make by hand · Sun-printed pāreu":"手作りする · 太陽で染めるpāreu","Make by hand · Woven hat":"手作りする · 編み帽子","Manta rays visit cleaning stations in the lagoon, where small fish tidy their skin. Swim slowly, stay a few metres away, and never touch or chase them.":"マンタはラグーンのクリーニングステーションにやって来て、小さな魚に体をきれいにしてもらいます。ゆっくり泳ぎ、数メートル離れて、決して触ったり追いかけたりしないでください。","Mantas and coral are fragile. Swim slowly, stay a few metres from wildlife, never touch or chase, and never stand on coral.":"マンタもサンゴも繊細です。ゆっくり泳ぎ、野生生物からは数メートル離れ、決して触ったり追いかけたりせず、サンゴの上には絶対に立たないでください。","Manu":"Manu","Manu Tere":"Manu Tere","Manu Tere is a prototype. Travel times are approximate, and the Reo Māʻohi words and their pronunciation still need checking by native speakers.":"Manu Tereは試作版です。移動時間はおおよその目安で、Reo Māʻohiの単語と発音はネイティブスピーカーによる確認がまだ必要です。","Map of the Society Islands":"ソシエテ諸島の地図","Map of the night sky":"夜空の地図","Marama":"Marama","Marama · the moon tonight":"Marama · 今夜の月","Marquesas":"マルキーズ諸島","Massage with a tap instead":"代わりにタップでマッサージ","Matariʻi":"Matariʻi","Matariʻi · the Pleiades":"Matariʻi · プレアデス星団（すばる）","Matira beach at sunset":"夕暮れのMatiraビーチ","Matira is a public white-sand beach. The Hawaiki Nui Vaʻa canoe race ends here.":"Matiraは白砂のパブリックビーチです。Hawaiki Nui Vaʻaカヌーレースのゴールはここです。","Matira · finish":"Matira · ゴール","Maupiti":"Maupiti","Maupiti, coming soon":"Maupiti（近日公開）","Maʻa Tahiti is served: <b>ʻUru</b>, <b>Taro</b>, <b>Fēʻī</b>, <b>Poʻe vānira</b>. The family shares a poʻe with you, and gives you seeds of fēʻī and taro. You can now cook in your own faʻaʻapu.":"Maʻa Tahitiの出来上がり：<b>ʻUru</b>、<b>Taro</b>、<b>Fēʻī</b>、<b>Poʻe vānira</b>。家族があなたとpoʻeを分け合い、fēʻīとtaroの種をくれました。これで自分のfaʻaʻapuで料理ができます。","Maʻa Tahiti · Served":"Maʻa Tahiti · 出来上がり","More islands will open in later versions, each greeting you in its own language.":"今後のバージョンで、さらに多くの島が開きます。どの島もそれぞれの言葉であなたを迎えてくれます。","Mount Otemanu ({#1} m) rises from the middle of a wide lagoon ringed by motu.":"Otemanu山（{#1} m）は、motuに囲まれた広いラグーンの真ん中にそびえています。","Mount Rotui":"Rotui山","Moʻorea":"Moʻorea","Moʻorea complete":"Moʻorea クリア","Moʻorea grows the Queen Tahiti pineapple, small and very sweet, in the Opunohu valley below the Belvédère lookout. A plant takes {#1} to {#2} months to give one fruit. Growers pick it at the “turning” stage, when the bottom quarter turns yellow, cut the stalk with secateurs, and replant the shoots and crowns.":"Moʻoreaでは、Belvédère展望台の下のOpunohu渓谷で、小さくてとても甘いクイーン・タヒチ・パイナップルが育ちます。1つの実がなるまでに{#1}〜{#2}か月かかります。生産者は下の4分の1が黄色くなる「色づき」の段階で収穫し、剪定ばさみで茎を切り、芽と冠芽を植え直します。","Moʻorea lies west of Tahiti. Keep the setting sun just above the mast.":"MoʻoreaはTahitiの西にあります。沈む夕日をマストのすぐ上に保ちましょう。","Moʻorea stamp":"Moʻoreaのスタンプ","Moʻorea stamp (not yet)":"Moʻoreaのスタンプ（未取得）","Moʻorea · Coral garden":"Moʻorea · サンゴの庭","Moʻorea · Juice factory":"Moʻorea · ジュース工場","Moʻorea · Lagoon friends":"Moʻorea · ラグーンの仲間たち","Moʻorea · Pineapple harvest":"Moʻorea · パイナップルの収穫","Moʻorea, you are here":"Moʻorea（現在地）","My manu":"わたしのマヌ","MĀTETE · MAPURU A PARAITA":"MĀTETE · MAPURU A PARAITA","MĀTETE · MARCHÉ DE PAPEETE":"MĀTETE · PAPEETE市場","Māuruuru":"Māuruuru","NOT YET":"まだ","Name":"名前","Nana":"Nana","Navigators followed star paths. Each island has its <b>ʻaveiʻa</b>, a star that passes right over it: for Tahiti, Taʻurua-faupapa. Try it yourself on a voyage between the islands.":"航海者たちは星の道をたどりました。どの島にも、その真上を通る星<b>ʻaveiʻa</b>があります。Tahitiの場合はTaʻurua-faupapaです。島から島への航海で、自分で試してみましょう。","Navigators knew where many stars rise and set on the horizon, and used them as a compass. Taʻurua-faupapa (Sirius) passes right over Tahiti: it is the island’s ʻaveiʻa, its marker star.":"航海者たちは、多くの星が地平線のどこから昇りどこに沈むかを知っていて、それを羅針盤として使いました。Taʻurua-faupapa（シリウス）はTahitiの真上を通ります。それがこの島のʻaveiʻa、目印の星です。","Navigators of old would steer by <b>Matariʻi</b>, the Pleiades, setting. A night voyage.":"昔の航海者たちは、沈んでいく<b>Matariʻi</b>、つまりプレアデス星団（すばる）を目印に舵を取りました。夜の航海です。","Navigators of old would steer by <b>Te mahana</b>, the setting sun. A short day crossing: you can see the island from the shore.":"昔の航海者たちは、<b>Te mahana</b>、つまり沈む夕日を目印に舵を取りました。短い昼の横断です。岸から島が見えます。","Needs {#1} pearl and {#2} pūpū":"真珠{#1}個とpūpū{#2}個が必要","Needs {#1} pearl and {#2} pūpū · made":"真珠{#1}個とpūpū{#2}個が必要 · 完成","Needs {#1} vavai and {#2} dye":"vavai{#1}個と染料{#2}個が必要","Needs {#1} ʻuru bark and {#2} dye (tiʻaʻiri, mati or rēʻa)":"ʻuruの樹皮{#1}枚と染料{#2}個（tiʻaʻiri、mati、またはrēʻa）が必要","New word: <b>E aha te huru?</b> · how are you?":"新しい言葉：<b>E aha te huru?</b> · お元気ですか？","New word: <b>Haere mai</b> · come here":"新しい言葉：<b>Haere mai</b> · こちらへおいで","New word: <b>Māuruuru</b> · thank you":"新しい言葉：<b>Māuruuru</b> · ありがとう","New word: <b>Nana</b> · bye":"新しい言葉：<b>Nana</b> · さようなら","New word: <b>pereʻoʻo</b> · car, vehicle":"新しい言葉：<b>pereʻoʻo</b> · 車、乗り物","Next":"次へ","Next set coming…":"次のセットを準備中…","Night":"夜","Night {#1} of the moon: <b>Roʻo nui</b>":"月の{#1}夜目：<b>Roʻo nui</b>","No wave at the rocks yet. Wait for it.":"まだ岩に波が来ていません。待ちましょう。","Not yet! Opening lets the steam escape, and the cooking slows down.":"まだです！開けると蒸気が逃げて、火の通りが遅くなります。","Notre-Dame Cathedral":"ノートルダム大聖堂","Now lift the little flap that covers the stigma.":"次に、柱頭を覆っている小さなふたを持ち上げてください。","Now!":"今だ！","Nāmatarua":"Nāmatarua","On Fatu Hiva, in the Marquesas, tapa is still made by hand.":"マルキーズ諸島のFatu Hivaでは、今もタパが手作りされています。","On a motu of Tahaʻa, a family is preparing an ahimāʻa for a celebration, and invites you to help.":"Tahaʻaのmotuで、ある家族がお祝いのためにahimāʻaを準備していて、あなたを手伝いに招いてくれます。","On approach to <b>Faʻaʻā, Tahiti</b>":"<b>Faʻaʻā, Tahiti</b>に着陸態勢です","On course":"針路どおり","On towards Haamaremare…":"Haamaremareへ進みます…","One day a young stranger, Tua, came to pick flowers in the valley. Faʻuai called out to stop him, and in doing so she broke the tapu. The chief’s guards seized Tua. Then Faʻuai met Ivi, a mysterious being, the spirit of the valley. They fell in love and fled together, with the guards close behind.":"ある日、Tuaという見知らぬ若者が谷へ花を摘みにやって来ました。Faʻuaiは彼を止めようと呼びかけ、そのせいでtapuを破ってしまいました。首長の衛兵たちはTuaを捕らえました。その後、Faʻuaiは谷の精霊である不思議な存在Iviと出会います。二人は恋に落ち、衛兵たちに追われながら一緒に逃げました。","One full-moon evening she set off in her canoe to visit the moon. She stepped onto it, and her canoe drifted away, never to be seen again. She stayed: the woman in the moon, who watches over travellers and beats tapa.":"ある満月の夕方、彼女は月を訪ねようとカヌーで出かけました。月に降り立つと、カヌーは流されて二度と見つかりませんでした。彼女はそこにとどまり、旅人を見守りながらタパをたたく「月の女性」になったのです。","One night, Hiro and his companions sailed from Raiatea to steal Mount Rotui, the sacred mountain of Moʻorea. They tied long vines around its peak and began to pull.":"ある夜、Hiroと仲間たちは、Moʻoreaの聖なる山Rotuiを盗もうとRaiateaから船を出しました。山頂に長いつるを巻きつけて、引っ張り始めました。","Open flower":"開いた花","Open the ahimāʻa":"ahimāʻaを開ける","Orion’s Belt":"オリオン座の三つ星","Otemanu":"Otemanu","Outrigger race":"アウトリガーカヌーレース","Outrigger race, done":"アウトリガーカヌーレース（完了）","Over":"上","Oyster growing a pearl":"真珠を育てる貝","PAINAPO":"PAINAPO","PAPEETE":"PAPEETE","PORAPORA":"PORAPORA","PRESS":"搾汁機","Paddle! · Hoe!":"こいで！ · Hoe!","Paddling a vaʻa in the lagoon":"ラグーンでvaʻaをこぐ","Pai and the pierced mountain":"Paiと穴のあいた山","Painapo! That one will travel well.":"Painapo! これなら長旅にも耐えます。","Painapo<small>Pineapple harvest</small>":"Painapo<small>パイナップルの収穫</small>","Papeete Market":"Papeete市場","Papeete Market, done":"Papeete市場（完了）","Papeete market, early in the morning":"早朝のPapeete市場","Papeete’s market, Mapuru a Paraita, is a two-storey hall in the heart of town. Downstairs: fruit, vegetables, fish and flowers, with tiare garlands. Upstairs: baskets, hats, carvings, pāreu and pearls, and snack bars serving poisson cru and fresh juice. It opens from {#1}:{#2} on weekdays and is busiest on Sunday from {#3}:{#4}, when families shop for the maʻa Tahiti, the traditional Sunday meal.":"Papeeteの市場Mapuru a Paraitaは、町の中心にある2階建ての建物です。1階には果物、野菜、魚、花が並び、tiareの花輪もあります。2階にはかご、帽子、彫刻、pāreu、真珠があり、ポワソン・クリュ（poisson cru）や生ジュースを出す軽食スタンドもあります。平日は{#1}:{#2}から開き、いちばんにぎわうのは日曜日の{#3}:{#4}からです。家族が伝統的な日曜日の食事、maʻa Tahitiの買い物をするのです。","Parau":"Parau","Parau · Words":"Parau · 言葉","Parrotfish crunch dead coral, and what comes out is fine white sand.":"ブダイは死んだサンゴをかじり、出てきたものが細かい白い砂になります。","Part of the mountain broke away: the legend says this is how Moʻorea’s two bays were made. Across the water on Tahiti, the warrior Pai woke up, climbed a hill and threw his spear of hibiscus wood.":"山の一部が崩れ落ちました。伝説によれば、こうしてMoʻoreaの2つの湾ができたのです。海の向こうTahitiでは、戦士Paiが目を覚まし、丘に登ってハイビスカスの木の槍を投げました。","Passport":"パスポート","Paste a backup code or choose a save file. This replaces the voyage on this phone.":"バックアップコードを貼り付けるか、保存ファイルを選んでください。このスマホの航海は置き換えられます。","Pearl":"真珠","Pearl and shell necklace":"真珠と貝のネックレス","Pearl farms in the lagoons of the Tuamotu and Gambier islands welcome visitors.":"Tuamotu諸島とGambier諸島のラグーンにある真珠養殖場では、観光客を歓迎しています。","Pearl farms, a famous coral garden for drift snorkelling, and motu ringed with white sand surround it.":"真珠養殖場、ドリフトシュノーケリングで有名なサンゴの庭、そして白砂に縁どられたmotuが、まわりを囲んでいます。","Pearl line":"真珠のライン","Peek inside":"中をのぞく","Perfect distance. Let go and stay still…":"ちょうどいい距離です。手を離して、じっとして…","Perfect fill!":"完璧に満たせました！","Perfect!":"完璧！","Perfect, on to the next flower.":"完璧、次の花へ。","Perfect: turning, sweet and firm.":"完璧：色づきかけで、甘くてしっかりしています。","Pick a pineapple at the <b>turning</b> stage: the bottom quarter has turned yellow. Too green and it is sour; fully yellow or brown and it will spoil before it reaches the market.":"<b>色づき</b>の段階のパイナップルを選びましょう。下の4分の1が黄色くなった頃です。青すぎると酸っぱく、すっかり黄色や茶色だと市場に届く前に傷んでしまいます。","Pineapple fields of Opunohu":"Opunohuのパイナップル畑","Pineapple harvest":"パイナップルの収穫","Pineapple harvest, done":"パイナップルの収穫（完了）","Pineapple plant, flowering":"パイナップルの株、開花中","Pineapple plant, fully yellow":"パイナップルの株、すっかり黄色","Pineapple plant, green fruit":"パイナップルの株、青い実","Pineapple plant, overripe":"パイナップルの株、熟しすぎ","Pineapple plant, turning: ready":"パイナップルの株、色づき：収穫どき","Pineapple plant, young plant":"パイナップルの株、若い株","Plain":"無地","Plant":"植える","Plant in this plot":"この区画に植える","Plant, harvest, make":"植えて、収穫して、作る","Plantain poʻe with Tahaʻa vanilla":"Tahaʻaバニラ入りの料理用バナナのpoʻe","Plantations are family land: visit with a guide or by invitation, and buy vanilla directly from the growers.":"農園は家族の土地です。ガイドと一緒か招待を受けて訪れ、バニラは生産者から直接買いましょう。","Planted!":"植えました！","Play again":"もう一度遊ぶ","Play: find the star":"遊ぶ：星を探そう","Pocket":"ポケット","Pollinated flower":"受粉した花","Pollinated! A pod will grow here.":"受粉しました！ここにさやが育ちます。","Porapora":"Porapora","Porapora complete":"Porapora クリア","Porapora is the island’s name in Reo Tahiti; Bora Bora is how visitors came to say it.":"PoraporaはReo Tahitiでの島の名前です。ボラボラは、訪れた人々の呼び方として広まったものです。","Porapora lies west of Tahaʻa: you can see it on the horizon. Keep the setting sun just above the mast.":"PoraporaはTahaʻaの西にあり、水平線に見えます。沈む夕日をマストのすぐ上に保ちましょう。","Porapora lies west-northwest, close to where Matariʻi sets. Keep it just above the mast. A star is only useful near the horizon: watch it.":"Poraporaは西北西、Matariʻiが沈む位置の近くにあります。それをマストのすぐ上に保ちましょう。星が役に立つのは地平線の近くにあるときだけです。よく見ていてください。","Porapora · Bora Bora":"Porapora · ボラボラ","Porapora · Outrigger race":"Porapora · アウトリガーカヌーレース","Porapora · Stars over Matira":"Porapora · Matiraの星空","Porapora · Swim with a manta":"Porapora · マンタと泳ぐ","Poʻe is a sweet pudding of fruit mixed with starch, cooked in the oven and served with coconut milk. A split vanilla pod from Tahaʻa scents the fruit as it cooks.":"Poʻeは、果物にでんぷんを混ぜてかまどで焼き、ココナッツミルクを添えて出す甘いプディングです。Tahaʻa産のバニラのさやを割って入れると、焼いている間に果物に香りが移ります。","Poʻe vānira":"Poʻe vānira","Press":"搾汁機","Pāreu":"Pāreu","Pīpiri mā":"Pīpiri mā","Question {#1} of {#2} · {#3} found first time":"{#2}問中{#1}問目 · 一度で正解{#3}問","Raiatea":"Raiatea","Raiatea, coming soon":"Raiatea（近日公開）","Rays glide over the sand. Watch them, don’t feed them.":"エイが砂の上をすべるように泳ぎます。見るだけにして、エサは与えないでください。","Ready":"準備完了","Ready to eat":"食べごろ","Ready to make":"作れます","Ready to make · made":"作れます · 完成","Ready!":"準備完了！","Ready… {#1}":"よーい… {#1}","Receive a gift":"贈り物を受け取る","Red band":"赤いバンド","Restore":"復元","Right · Hoe!":"右 · Hoe!","Right ▶":"右 ▶","Right: bruised fruit feeds the soil.":"正解：傷んだ実は土の栄養になります。","Right: still green, it needs more time.":"正解：まだ青いので、もう少し時間が必要です。","Ring the bell 🔔":"ベルを鳴らす 🔔","Rotui<small>Juice factory</small>":"Rotui<small>ジュース工場</small>","Row done!":"1列完了！","Row {#1}:":"{#1}列目：","Ruataʻata and the ʻuru":"Ruataʻataとʻuru","SOCIETY ISLANDS":"ソシエテ諸島","Sacks on: wet, so they hold the steam.":"袋をかぶせました：蒸気を閉じ込めるよう、湿らせてあります。","Sail by":"航海の目印：","Sail to <span>Moʻorea</span>":"<span>Moʻorea</span>へ航海する","Sail to <span>Porapora</span> (Bora Bora)":"<span>Porapora</span>（ボラボラ）へ航海する","Sail to <span>Tahaʻa</span>":"<span>Tahaʻa</span>へ航海する","Sail to Porapora, or hear the legend of ʻOro there, to start your own pearl line.":"Poraporaへ航海するか、そこでʻOroの伝説を聞いて、自分の真珠のラインを始めましょう。","Sand":"砂","Sand last, or it falls into the food.":"砂は最後に。でないと食べ物に入ってしまいます。","Sand on. Now we wait.":"砂をかぶせました。あとは待つだけです。","Save and restore":"保存と復元","Save as a file":"ファイルとして保存","See it for real":"本物を見に行こう","Seeds come from activities, legends and harvests. Progress is saved on this phone only.":"種はアクティビティ、伝説、収穫から手に入ります。進行状況はこのスマホにのみ保存されます。","Serve":"出す","Set sail":"出航する","Sew the shirt":"シャツを縫う","Sharp green ridges and little waterfalls surround it; it is one of the wettest places on the island.":"鋭い緑の尾根と小さな滝に囲まれた、島でも特に雨の多い場所のひとつです。","Shell":"貝殻","Shoulder":"ショルダー","Show my manu":"マヌを見る","Sirius":"シリウス","Skip":"スキップ","Sky and sea":"空と海","Small print":"小さい柄","Snip!":"チョキン！","Snorkelling in the lagoon":"ラグーンでシュノーケリング","Snorkelling with a local guide":"地元ガイドとシュノーケリング","Soak the <span>ʻuru</span> bark, then beat it with the <span>ʻiʻe</span> to make it wider and thinner.":"<span>ʻuru</span>の樹皮を水に浸し、<span>ʻiʻe</span>でたたいて広く薄くのばします。","Some say ʻOro also gave her a black pearl as a token of his love. Pearls are farmed in Polynesia’s lagoons to this day.":"ʻOroは愛のしるしとして彼女に黒真珠も贈ったと言われています。真珠は今もポリネシアのラグーンで養殖されています。","Sound off. Tap to turn on":"サウンドオフ。タップでオン","Sound on":"サウンドオン","Sound on. Tap to mute":"サウンドオン。タップでミュート","Spinner dolphins play outside the reef. Boats slow down and keep away.":"ハシナガイルカが礁の外で遊んでいます。ボートは速度を落として距離を保ちます。","Staghorn (Acropora)":"ミドリイシ（エダサンゴ）","Stamp: <b>Moʻorea</b>":"スタンプ：<b>Moʻorea</b>","Stamp: <b>Porapora</b> · Bora Bora":"スタンプ：<b>Porapora</b>・ボラボラ","Stamp: <b>Tahaʻa</b>":"スタンプ：<b>Tahaʻa</b>","Stamp: <b>Tahiti</b>. Tap the pins to explore, or tap your manu.":"スタンプ：<b>Tahiti</b>。ピンをタップして探検するか、あなたのマヌをタップしましょう。","Stamps":"スタンプ","Stars over Matira":"Matiraの星空","Stars over Matira, done":"Matiraの星空、完了","Start over":"最初からやり直す","Stay behind the barrier":"柵の内側にいましょう","Stay still… let it come to you.":"じっとして…向こうから来るのを待ちましょう。","Steer left":"左へ","Steer right":"右へ","Steer right ▶":"右へ ▶","Steering by the stars":"星で舵をとる","Still to visit":"まだ訪れていない場所","Stop the game":"ゲームを終了","Sun-printed pāreu":"天日染めのpāreu","Sunglasses":"サングラス","Surf Teahupoʻo":"Teahupoʻoでサーフィン","Surf Teahupoʻo, done":"Teahupoʻoでサーフィン、完了","Swim gently":"そっと泳ぐ","Swim with a manta":"マンタと泳ぐ","Swim with a manta, done":"マンタと泳ぐ、完了","TAHAʻA":"TAHAʻA","TAHITI":"TAHITI","Table branch (Acropora)":"テーブルサンゴ（ミドリイシ）","Tahaʻa":"Tahaʻa","Tahaʻa complete":"Tahaʻaクリア","Tahaʻa lies east of Porapora. Keep the rising sun just above the mast.":"Tahaʻaは Poraporaの東にあります。昇る太陽をマストのすぐ上に保ちましょう。","Tahaʻa shares one lagoon with its big sister Raiatea. It has no airport: boats cross from Raiatea in {#1} to {#2} minutes.":"Tahaʻaは姉のような大きな島Raiateaとひとつのラグーンを共有しています。空港はなく、Raiateaからボートで{#1}〜{#2}分で渡ります。","Tahaʻa stamp":"Tahaʻaのスタンプ","Tahaʻa stamp (not yet)":"Tahaʻaのスタンプ（未取得）","Tahaʻa · Dry the vanilla":"Tahaʻa・バニラを乾かす","Tahaʻa · Hand-pollinate vanilla":"Tahaʻa・バニラの手作業受粉","Tahaʻa · The earth oven":"Tahaʻa・土のかまど（アヒマア）","Tahaʻa, you are here":"Tahaʻa、現在地","Tahiti":"Tahiti","Tahiti and Moʻorea lie east-southeast, close to where ʻAna-mua rises. Keep it just above the mast. A star is only useful near the horizon: watch it.":"TahitiとMoʻoreaは東南東、ʻAna-muaが昇るあたりにあります。その星をマストのすぐ上に保ちましょう。星が役に立つのは水平線の近くにあるときだけです。よく見ていてください。","Tahiti complete":"Tahitiクリア","Tahiti lies east of Moʻorea. Keep the rising sun just above the mast.":"TahitiはMoʻoreaの東にあります。昇る太陽をマストのすぐ上に保ちましょう。","Tahiti stamp":"Tahitiのスタンプ","Tahiti · Dance to the drums":"Tahiti・太鼓に合わせて踊る","Tahiti · Landmark":"Tahiti・名所","Tahiti · Papeete Market":"Tahiti・Papeete市場","Tahiti · Pereʻoʻo mataʻeinaʻa":"Tahiti・Pereʻoʻo mataʻeinaʻa","Tahiti · Surf Teahupoʻo":"Tahiti・Teahupoʻoでサーフィン","Tahiti · The blowhole":"Tahiti・潮吹き穴","Tahiti · Three waterfalls":"Tahiti・三つの滝","Tahiti, you are here":"Tahiti、現在地","Tahitian vanilla pods are rinsed, wrapped in cotton cloths and set in the sun for a few hours a day, about thirty times, roughly a month of good weather. Then they are sorted, massaged one by one, and left to age for three to four months. From flower to finished pod takes more than a year.":"タヒチ産のバニラのさやは、洗ってから綿の布に包み、1日数時間ずつ日に当てます。これを約30回、天気のよい日でおよそ1か月続けます。その後、選別して1本ずつもみほぐし、3〜4か月熟成させます。花から完成したさやになるまで1年以上かかります。","Tahiti’s only natural lake lies deep in the mountains of the south coast (Teva i Uta). Long ago part of the island collapsed, and blocks of volcanic rock dammed the valley over about {#1} m.":"Tahiti唯一の天然湖は、南海岸（Teva i Uta）の山奥にあります。昔、島の一部が崩れ、火山岩の塊が約{#1} mにわたって谷をせき止めました。","Tap a pearl or a shell to thread it ({#1} in all, at least one pearl)":"真珠か貝殻をタップして糸に通しましょう（全部で{#1}個、真珠を1つ以上）","Tap a plant to look closely.":"植物をタップしてよく見てみましょう。","Tap a star or a group of stars to learn its name in Reo Tahiti and its story.":"星や星のグループをタップすると、Reo Tahitiでの名前とその物語がわかります。","Tap the big button each time a beat reaches the circle. The pahu drum keeps time, you play the <span>tōʻere</span>.":"ビートが円に届くたびに大きなボタンをタップしましょう。pahu太鼓がリズムを刻み、あなたは<span>tōʻere</span>を演奏します。","Tap the cloth to lay a leaf ({#1} of {#2}).":"布をタップして葉を置きましょう（{#1}/{#2}）。","Tap the right one.":"正しいものをタップしましょう。","Tap the tōʻere":"tōʻereをタップ","Tap to wear":"タップして身につける","Tapa":"タパ","Tapa is cloth made of beaten bark: ʻuru, banyan (ʻōrā) or paper mulberry. Women beat it with a grooved beater, the ʻiʻe, on a wooden anvil until it is four or five times wider. Plants give the colours: rēʻa for yellow, mati and tou for red-brown, tiʻaʻiri for black.":"タパは樹皮をたたいて作る布です。材料はʻuru、ガジュマル（ʻōrā）、カジノキです。女性たちは溝のついた木槌ʻiʻeで木の台の上でたたき、4〜5倍の幅になるまでのばします。色は植物から作ります。黄色はrēʻa、赤茶色はmatiとtou、黒はtiʻaʻiriです。","Taro":"タロイモ","Taste":"味見する","Tauhā":"Tauhā","Tautoru":"Tautoru","Tautoru · Orion’s Belt":"Tautoru・オリオン座の三つ星","Taʻurua-faupapa":"Taʻurua-faupapa","Taʻurua-faupapa · Sirius":"Taʻurua-faupapa・シリウス","Te Fenua Māʻohi":"Te Fenua Māʻohi","Te Matau a Māui":"Te Matau a Māui","Te Vaiora":"Te Vaiora","Te fenua · The islands":"Te fenua・島々","Te mahana":"Te mahana","Te mau fetiʻa<small>Stars over Matira</small>":"Te mau fetiʻa<small>Matiraの星空</small>","Te mātete<small>Papeete Market</small>":"Te mātete<small>Papeete市場</small>","Te raʻi":"Te raʻi","Te raʻi, the night sky":"Te raʻi、夜空","Te tairoto<small>Lagoon friends</small>":"Te tairoto<small>ラグーンの仲間たち</small>","Te toʻa<small>Coral garden</small>":"Te toʻa<small>サンゴの庭</small>","Te vānira<small>Dry the vanilla</small>":"Te vānira<small>バニラを乾かす</small>","Teahupoʻo, at the end of the road on Tahiti Iti, hosted the surfing events of the Paris {#1} Olympic Games. The wave breaks over a shallow reef and is for experts only: watch it from a boat. Beginners learn on gentler spots with a local surf school.":"Tahiti Iti の道の終わりにあるTeahupoʻoは、{#1}年パリオリンピックのサーフィン会場になりました。波は浅い礁の上で砕けるので上級者専用です。ボートから見学しましょう。初心者は地元のサーフスクールで穏やかな場所から始めます。","Tere":"Tere","Tere, your manu. Tap to hear a word.":"Tere、あなたのマヌです。タップすると言葉が聞けます。","That one is haʻari (coconut). Look again.":"それはhaʻari（ココナッツ）です。もう一度見てみましょう。","That one is meiʻa (banana). Look again.":"それはmeiʻa（バナナ）です。もう一度見てみましょう。","That one is tiare (flower; the tiare Tahiti gardenia). Look again.":"それはtiare（花。ティアレ・タヒチというクチナシ）です。もう一度見てみましょう。","That one is vī (mango). Look again.":"それはvī（マンゴー）です。もう一度見てみましょう。","That one is ʻiʻa (fish). Look again.":"それはʻiʻa（魚）です。もう一度見てみましょう。","That one is ʻuru (breadfruit). Look again.":"それはʻuru（パンノキの実）です。もう一度見てみましょう。","That one was bruised: it should go to the compost.":"それは傷んでいました。堆肥行きです。","That star sets far north of our course: we would miss the island. Look for the one at the same point as Matariʻi.":"その星は針路よりずっと北に沈みます。これでは島に着けません。Matariʻiと同じ方角の星を探しましょう。","The Arahoho blowhole on Tahiti's east coast":"Tahiti東海岸のArahoho潮吹き穴","The Belvédère lookout":"ベルヴェデール展望台","The Belvédère lookout looks down on both bays and the pineapple fields of the Opunohu valley.":"ベルヴェデール展望台からは、2つの湾とOpunohu谷のパイナップル畑を見下ろせます。","The Cathedral of Notre-Dame de l’Immaculée Conception stands near the waterfront in the middle of Papeete, on rue du Général de Gaulle. Finished in {#1}, it is one of the last examples of the town’s early colonial architecture.":"無原罪の御宿りのノートルダム大聖堂は、Papeete中心部の海沿い近く、ジェネラル・ド・ゴール通りに建っています。{#1}年に完成し、町の初期植民地建築を伝える数少ない建物のひとつです。","The Faarumai valley in Tiarei, on Tahiti’s east coast, hides three waterfalls: Vaimahuta ({#1} m), a few minutes from the car park, then Haamaremare Iti ({#2} m) and Haamaremare Rahi ({#3} m), {#4} to {#5} minutes further on. The site is open every day. After heavy rain the streams rise fast, so check the weather before you walk.":"Tahiti東海岸TiareiのFaarumai谷には3つの滝があります。駐車場から数分のVaimahuta（{#1} m）、さらに{#4}〜{#5}分先のHaamaremare Iti（{#2} m）とHaamaremare Rahi（{#3} m）です。毎日開放されています。大雨のあとは川がすぐに増水するので、歩く前に天気を確認しましょう。","The Heiva i Tahiti in July":"7月のヘイヴァ・イ・タヒチ（Heiva i Tahiti）","The Reo Māʻohi words stay in Reo Māʻohi.":"Reo Māʻohiの言葉はReo Māʻohiのままです。","The anthias are back!":"ハナダイが戻ってきました！","The blowhole":"潮吹き穴","The blowhole, done":"潮吹き穴、完了","The blue-green chromis are back!":"デバスズメダイが戻ってきました！","The butterflyfish are back!":"チョウチョウウオが戻ってきました！","The coral garden drift snorkel":"サンゴの庭のドリフトシュノーケリング","The earth oven":"土のかまど（アヒマア）","The earth oven, done":"土のかまど（アヒマア）、完了","The lagoon of Mangareva and its pearls.":"Mangarevaのラグーンと真珠。","The lagoon of Porapora seen from above":"上空から見たPoraporaのラグーン","The largest island of French Polynesia: two volcanoes, Tahiti Nui and Tahiti Iti, joined at the isthmus of Taravao.":"フランス領ポリネシア最大の島。Tahiti NuiとTahiti Itiの2つの火山が、Taravao地峡でつながっています。","The lookout over Teahupoʻo, at the end of the road":"道の終わり、Teahupoʻoを望む展望台","The night sky over Matira beach":"Matiraビーチの夜空","The parrotfish is back!":"ブダイが戻ってきました！","The picked pods are rinsed, wrapped in cotton cloths and put out in the sun, a few hours each day, for weeks. Too little sun and they stay damp and can go mouldy; too much and they dry out and crack.":"摘み取ったさやは洗ってから綿の布に包み、毎日数時間ずつ、何週間も日に当てます。日差しが足りないと湿ったままでカビが生えることがあり、多すぎると乾きすぎて割れてしまいます。","The shadows on the moon are a banyan tree, the ʻōrā. One of its branches fell to ʻŌpoa, on Raiatea, and became the first banyan on earth. Its bark, like the ʻuru’s, can be beaten into tapa.":"月の影はガジュマルの木、ʻōrāです。その枝の1本がRaiateaのʻŌpoaに落ち、地上で最初のガジュマルになりました。その樹皮はʻuruと同じように、たたいてタパにできます。","The sky of the fenua":"fenuaの空","The spear went straight through a mountain and left a hole: Mouaputa, the pierced mountain. The blow woke the roosters, and they crowed. Thinking dawn had come, the thieves ran away. You can still see the hole in Mouaputa today.":"槍は山をまっすぐ貫き、穴をあけました。これが穴のあいた山、Mouaputaです。その衝撃でニワトリが目を覚まして鳴きました。夜が明けたと思った泥棒たちは逃げ出しました。Mouaputaの穴は今でも見ることができます。","The stall-keeper asks for":"お店の人が欲しがっているのは","The stall-keeper says <span>Māuruuru!</span> Your basket is full.":"お店の人が<span>Māuruuru!</span>と言っています。かごがいっぱいになりました。","The sun is printing…":"太陽が染めています…","The swell rolls into a cave under the rocks and shoots out of the hole with a howl. Only <b>big</b> waves make it blow. Tap <b>Now!</b> when a big wave reaches the rocks.":"うねりが岩の下の洞窟に入り込み、うなり声とともに穴から噴き出します。噴き上がるのは<b>大きな</b>波のときだけ。大きな波が岩に届いたら<b>今だ！</b>をタップしましょう。","The track is best done with a guided {#1}×{#2} or quad tour. Clouds often gather in the afternoon, so go early.":"この道はガイド付きの{#1}×{#2}かバギーのツアーで回るのがおすすめです。午後は雲が出やすいので、早めに出かけましょう。","The trail climbs through ferns and ʻape leaves… about {#1} to {#2} minutes to the next falls.":"シダやʻapeの葉の間を道が登っていきます…次の滝までは約{#1}〜{#2}分です。","The trail through the Faarumai valley":"Faarumai谷を通る遊歩道","The tree that saved a family":"家族を救った木","The vanilla island · {#1} of {#2} activities done":"バニラの島・アクティビティ{#1}/{#2}完了","The view of Otemanu from the motu":"モツから見たOtemanu","The woman who beats tapa":"タパをたたく女性","These stars are not all up on the same night of the year. They are gathered here so you can learn them.":"これらの星は、1年のうち同じ夜にすべて見えるわけではありません。覚えやすいようにここに集めています。","This game is a simplified version of their art.":"このゲームは彼らの技を簡単にしたものです。","This strip goes under.":"この帯は下を通ります。","Three waterfalls":"三つの滝","Three waterfalls, done":"三つの滝、完了","Three waves ridden in the pocket at Teahupoʻo.":"Teahupoʻoのチューブで3本の波に乗りました。","Tiare":"Tiare","Tiare band (uses {#1})":"ティアレの髪飾り（{#1}を使用）","Tie the hei":"heiを結ぶ","Tied on!":"結べました！","To Bora Bora: about {#1} minutes by plane from Faʻaʻā.":"ボラボラへ：Faʻaʻāから飛行機で約{#1}分。","To Bora Bora: by boat or a short flight from Raiatea.":"ボラボラへ：Raiateaからボートか短いフライトで。","To Bora Bora: by plane, usually through Tahiti.":"ボラボラへ：飛行機で、通常はTahiti経由。","To Moʻorea: about {#1}–{#2} minutes by ferry from Papeete.":"Moʻoreaへ：Papeeteからフェリーで約{#1}〜{#2}分。","To Moʻorea: boat to Raiatea, then a plane via Tahiti.":"Moʻoreaへ：ボートでRaiateaへ行き、Tahiti経由の飛行機で。","To Moʻorea: by plane, usually through Tahiti.":"Moʻoreaへ：飛行機で、通常はTahiti経由。","To Tahaʻa: about {#1} minutes by plane to Raiatea, then a boat across the lagoon.":"Tahaʻaへ：飛行機でRaiateaまで約{#1}分、そこからボートでラグーンを渡ります。","To Tahaʻa: by boat or a short flight via Raiatea.":"Tahaʻaへ：ボートか、Raiatea経由の短いフライトで。","To Tahaʻa: by plane via Tahiti to Raiatea, then a boat.":"Tahaʻaへ：飛行機でTahiti経由Raiateaへ行き、そこからボートで。","To Tahiti: about {#1} minutes by plane to Faʻaʻā.":"Tahitiへ：Faʻaʻāまで飛行機で約{#1}分。","To Tahiti: about {#1}–{#2} minutes by ferry to Papeete.":"Tahitiへ：Papeeteまでフェリーで約{#1}〜{#2}分。","To Tahiti: boat to Raiatea, then about {#1} minutes by plane.":"Tahitiへ：ボートでRaiateaへ行き、そこから飛行機で約{#1}分。","To escape, Ivi and Faʻuai turned into waterfalls and became part of the valley forever. A third fall burst out of the cliff and swept their pursuers away. Today you can see the three falls: Vaimahuta, Haamaremare Iti and Haamaremare Rahi.":"逃げるため、IviとFaʻuaiは滝に姿を変え、永遠に谷の一部となりました。3つ目の滝が崖から噴き出し、追っ手を押し流しました。今も3つの滝、Vaimahuta、Haamaremare Iti、Haamaremare Rahiを見ることができます。","To the press!":"圧搾機へ！","Today: about {#1} minutes by plane to Raiatea, then a boat across the lagoon.":"現在：飛行機でRaiateaまで約{#1}分、そこからボートでラグーンを渡ります。","Today: about {#1}–{#2} minutes by ferry from Papeete.":"現在：Papeeteからフェリーで約{#1}〜{#2}分。","Today: by plane, usually through Tahiti.":"現在：飛行機で、通常はTahiti経由。","Together we’ll sail the islands of French Polynesia the way the navigators of old did, by the sun and the stars, and pick up some Reo Māʻohi on the way.":"いっしょに、昔の航海者たちのように太陽と星をたよりにフランス領ポリネシアの島々を航海しましょう。途中でReo Māʻohiも少し覚えていきましょう。","Too early: the swell has not reached you.":"早すぎます。うねりがまだ届いていません。","Too far out on the shoulder. Ease off.":"ショルダーに出すぎです。少しゆるめて。","Touchdown!":"着陸！","Trail start · car park":"遊歩道入口・駐車場","Tuamotu":"Tuamotu","Turn sound off":"サウンドをオフにする","Turn sound on":"サウンドをオンにする","Twill":"綾織り","Two deep bays, Cook’s Bay and Opunohu Bay, frame Mount Rotui.":"クック湾とOpunohu湾の2つの深い湾が、Rotui山を囲んでいます。","Tāupoʻo":"Tāupoʻo","Under":"下","Undo":"元に戻す","Unwrap in the sun":"日なたで包みを開く","Vaimahuta":"Vaimahuta","Vaimahuta, {#1} m, is only a few minutes from the car park. Feel the cool spray.":"Vaimahutaは{#1} m、駐車場から数分です。ひんやりしたしぶきを感じてください。","Vaimahuta: {#1} m.":"Vaimahuta：{#1} m。","Vanilla flower":"バニラの花","Vanilla is an orchid: a climbing vine grown on supports. A new plant flowers after two to three years. In Polynesia the flowers are pollinated by hand, usually from July to October, with a small stick that lifts the flap between pollen and stigma. The pod ripens nine to ten months later. Vanilla came to Tahiti around {#1}.":"バニラはラン科の植物で、支柱に絡ませて育てるつる植物です。新しい株は2〜3年で花をつけます。ポリネシアでは、花は手作業で受粉させます。時期はふつう7月から10月で、小さな棒で花粉と柱頭の間の膜を持ち上げます。さやは9〜10か月後に熟します。バニラがTahitiに伝わったのは{#1}年ごろです。","Vaʻa racing is the national sport. Every year the Hawaiki Nui Vaʻa race crosses the open sea from Huahine to Raiatea, Tahaʻa and Porapora, and ends on Matira beach.":"vaʻaレースは国民的スポーツです。毎年ハワイキ・ヌイ・ヴァア（Hawaiki Nui Vaʻa）レースが外洋を渡り、HuahineからRaiatea、Tahaʻa、Poraporaへと進み、Matiraビーチでゴールします。","Violet":"紫","Visit for real · The big island":"実際に訪れる・大きな島","Visit for real · The lagoon island":"実際に訪れる・ラグーンの島","Visit for real · The sister island":"実際に訪れる・姉妹の島","Visit for real · The vanilla island":"実際に訪れる・バニラの島","Voyage · Bora Bora to Tahaʻa":"航海・ボラボラからTahaʻaへ","Voyage · Bora Bora to Tahiti":"航海・ボラボラからTahitiへ","Voyage · Moʻorea to Bora Bora":"航海・Moʻoreaからボラボラへ","Voyage · Moʻorea to Tahiti":"航海・MoʻoreaからTahitiへ","Voyage · Tahaʻa to Bora Bora":"航海・Tahaʻaからボラボラへ","Voyage · Tahiti to Bora Bora":"航海・Tahitiからボラボラへ","Voyage · Tahiti to Moʻorea":"航海・TahitiからMoʻoreaへ","Voyage · Tahiti to Tahaʻa":"航海・TahitiからTahaʻaへ","Voyage · about {#1} km":"航海・約{#1} km","Vānira<small>Hand-pollinate vanilla</small>":"Vānira<small>バニラの手作業受粉</small>","Wait for it…":"待って…","Wait until it reaches you on the belt.":"ベルトの上で手元に来るまで待ちましょう。","Walk up the Faarumai valley, in Tiarei on Tahiti’s east coast, to find its three waterfalls. Hold <b>Walk</b>.":"Tahiti東海岸TiareiのFaarumai谷を登り、3つの滝を見つけましょう。<b>歩く</b>を長押ししてください。","Warm water can bleach coral. On Moʻorea, teams such as Coral Gardeners grow fragments at least {#1} cm long on ropes in underwater nurseries, clean them every month (every week in the hot season), and after about two to three years plant them back on the reef. Reef-safe sunscreen and never touching coral both help.":"海水温が上がるとサンゴは白化することがあります。Moʻoreaでは、コーラル・ガーデナーズなどのチームが、{#1} cm以上のサンゴの断片を海中のナーサリーでロープにつけて育てています。毎月（暑い季節は毎週）掃除し、約2〜3年後に礁へ植え戻します。サンゴにやさしい日焼け止めを使い、サンゴに決して触れないことも助けになります。","Watch the sea…":"海を見ていて…","Wave {#1} of {#2}":"波 {#1}/{#2}","Wear":"身につける","Wearing":"着用中","Wet sacks":"湿った袋","Whale watching, roughly July to November":"ホエールウォッチング（7月〜11月ごろ）","When she came back, the head had become a tall tree with long leaves like hair: the first coconut palm. Look at a coconut: its three dark spots are the eel’s two eyes and mouth. Years later, in a dry season, Hina drank from a coconut, and so she kissed the eel after all.":"彼女が戻ると、頭は髪のような長い葉をもつ高い木になっていました。最初のココヤシです。ココナッツを見てみましょう。3つの黒い点はウナギの2つの目と口です。何年もたった乾季のある日、Hinaはココナッツから水を飲み、結局ウナギにキスをしたのでした。","Where does this one go?":"これはどこに入るかな？","Where is Nāmatarua?":"Nāmataruaはどこ？","Where is Pīpiri mā?":"Pīpiri māはどこ？","Where is Te Vaiora?":"Te Vaioraはどこ？","Where shall we sail?":"どこへ航海しましょうか？","Whoosh! The cave howls.":"シュワーッ！洞窟がうなります。","With respect":"敬意をもって","Words":"言葉","Words from this activity":"このアクティビティの言葉","Woven hat":"編み帽子","Woven hats are sold at Papeete market and at craft fairs. Buying from the weaver supports the craft.":"編み帽子はPapeete市場やクラフトフェアで売られています。編み手から直接買うと、伝統工芸の支えになります。","Wrap and bring in":"包んで取り込む","Yellow façade, red steeple facing Mont Aorai, and maroon arched windows.":"黄色の正面、Aorai山を向いた赤い尖塔、えび茶色のアーチ窓。","Yes! haʻari means coconut.":"正解！haʻariはココナッツという意味です。","Yes! meiʻa means banana.":"正解！meiʻaはバナナという意味です。","Yes! tiare means flower; the tiare Tahiti gardenia.":"正解！tiareは花という意味です。ティアレ・タヒチというクチナシのことです。","Yes! vī means mango.":"正解！vīはマンゴーという意味です。","Yes! ʻiʻa means fish.":"正解！ʻiʻaは魚という意味です。","You are here":"現在地","You can read four guide stars of the Polynesian sky.":"ポリネシアの空の導きの星を4つ読めるようになりました。","You cleaned the nursery, hung six new fragments and planted four corals back on the reef.":"ナーサリーを掃除し、新しい断片を6つ吊るし、サンゴを4つ礁に植え戻しました。","You crossed the line at Matira in {#1} s, ahead of the other canoe!":"Matiraで{#1}秒でゴールし、相手のカヌーに勝ちました！","You hand-pollinated {#1} vanilla flowers.":"バニラの花を{#1}個、手作業で受粉させました。","You know {#1} of {#2} stars. Learn them all to give your manu a cloak of stars.":"{#2}個の星のうち{#1}個を知っています。全部覚えると、あなたのマヌに星のマントをあげられます。","You met all five lagoon friends, without touching any of them.":"ラグーンの仲間5匹すべてに、触れずに出会えました。","You played {#1} of {#2} beats.":"{#2}ビート中{#1}ビートを演奏しました。","You sorted {#1} of {#2} pineapples correctly and filled five bottles of painapo juice.":"パイナップル{#2}個中{#1}個を正しく仕分け、painapoジュースを5本満たしました。","You walked to the three falls of Faarumai: Haamaremare Rahi ({#1} m), Vaimahuta ({#2} m) and Haamaremare Iti ({#3} m).":"Faarumaiの3つの滝まで歩きました：Haamaremare Rahi（{#1} m）、Vaimahuta（{#2} m）、Haamaremare Iti（{#3} m）。","You watched a manta from a respectful distance.":"敬意ある距離からマンタを観察しました。","Your basket":"あなたのかご","Your first black pearl, and a pearl line in your faʻaʻapu":"初めての黒真珠と、faʻaʻapuに真珠の糸","Your manu":"あなたのマヌ","Your manu is wearing it. Change what it wears in <b>My manu</b>.":"あなたのマヌが身につけています。身につけるものは<b>マイ・マヌ</b>で変えられます。","Your manu loved it. Māuruuru!":"あなたのマヌは大喜び。Māuruuru!","Your manu now wears a hei, a crown of flowers. You can change it in <b>My manu</b>.":"あなたのマヌは花の冠、heiを身につけました。<b>マイ・マヌ</b>で変えられます。","Your manu now wears a pāreu. You can change it in <b>My manu</b>.":"あなたのマヌはpāreuを身につけました。<b>マイ・マヌ</b>で変えられます。","Your manu now wears a vanilla flower behind the ear. You can change it in <b>My manu</b>.":"あなたのマヌは耳の後ろにバニラの花を飾りました。<b>マイ・マヌ</b>で変えられます。","Your manu now wears sunglasses for the lagoon light. You can change it in <b>My manu</b>.":"あなたのマヌはラグーンのまぶしさ対策にサングラスをかけました。<b>マイ・マヌ</b>で変えられます。","Your stamps, words, garden and crafts live on this phone. Copy this code somewhere safe (notes, an email to yourself). With it you can get everything back, even on a new phone.":"スタンプ、言葉、菜園、作品はこのスマホに保存されています。このコードを安全な場所（メモや自分宛てのメール）にコピーしてください。これがあれば、新しいスマホでもすべて復元できます。","Your tapa hangs in your Passport.":"あなたのタパはパスポートに飾られています。","activities":"アクティビティ","ahimāʻa":"ahimāʻa","banana":"バナナ","bird":"鳥","breadfruit":"パンノキの実","breadfruit ×{#1}":"パンノキの実 ×{#1}","bye":"さようなら","candlenut ×{#1}":"ククイの実 ×{#1}","car, vehicle":"車、乗り物","coconut":"ココナッツ","coconut ×{#1}":"ココナッツ ×{#1}","come here":"こっちに来て","coral":"サンゴ","cotton ×{#1}":"綿 ×{#1}","cured vanilla pod ×{#1}":"熟成バニラのさや ×{#1}","district":"地区","dolphin":"イルカ","earth oven":"土のかまど（アヒマア）","fai":"fai","fara":"fara" nt one":"Moʻoreaをクリアするか、1枚印刷","Finish Porapora":"Poraporaをクリア","Weave it in the garden":"菜園で編みましょう","String it in the garden":"菜園で糸に通しましょう","Sew it in the garden":"菜園で縫いましょう","Learn every star in Te raʻi":"Te raʻiのすべての星を覚えましょう","Locked ·":"ロック中 ·","This erases your stamps, words and manu on this phone.":"このスマートフォンのスタンプ、言葉、マヌがすべて消去されます。","Erase and start over":"消去して最初から","Keep my voyage":"航海を続ける","Welcome to Tahiti":"Tahitiへようこそ",". Tap the pins to explore, or tap your manu.":"。ピンをタップして探検するか、あなたのマヌをタップしましょう。","turmeric (yellow dye)":"ウコン（黄色の染料）","REH-ah":"レア","a fig whose fruit dyes red-brown":"実が赤茶色の染料になるイチジク","MAH-tee":"マティ","FAH-rah":"ファラ","candlenut (black dye)":"ククイノキ（黒の染料）","pāreu":"pāreu","wrap cloth":"巻き布","PAH-reh-oo":"パレウ","tāupoʻo":"tāupoʻo","TAH-oo-poh-oh":"タウポオ","garland, crown or necklace":"花輪、冠、または首飾り","POH-eh":"ポエ","POO-poo":"ププ","cloth of beaten bark":"樹皮をたたいて作った布","TAH-pah":"タパ","grooved tapa beater":"溝のついたタパ用の木槌","EE-eh":"イエ","banyan tree":"ガジュマルの木","OH-rah":"オラ","ʻāʻai":"ʻāʻai","legend, story":"伝説、物語","AH-ah-ee":"アアイ","A flower for a hat band.":"帽子のバンドに飾る花。","Its flowers dye violet, or trim a hat.":"花は紫の染料になり、帽子の飾りにもなります。","Its root dyes yellow.":"根は黄色の染料になります。","Cotton for a pāreu.":"pāreu用の木綿。","Its small figs dye red-brown.":"小さなイチジクは赤茶色の染料になります。","Long leaves to weave a hat.":"帽子を編むための長い葉。","Burnt, its nuts give a black dye.":"実を焼くと黒い染料がとれます。","Moʻorea’s small, sweet pineapples are at their best around January.":"Moʻoreaの小さくて甘いパイナップルは、1月ごろがいちばんおいしい時期です。","Mango season peaks in December, when markets overflow with them.":"マンゴーの旬は12月がピークで、市場はマンゴーであふれます。","Ask for a fresh green coconut: the water inside is cool and sweet. Look for its three “eyes”.":"新鮮な青いココナッツを頼んでみて。中の水は冷たくて甘いです。3つの「目」を探してね。","ʻUru is roasted whole over the fire until the skin is black, or cooked in an earth oven.":"ʻUruは皮が黒くなるまで火で丸ごと焼くか、土のかまど（アヒマア）で調理します。","red dye fig":"赤い染料のイチジク","for tapa":"タパ用","peacock green":"ピーコックグリーン","silver grey":"シルバーグレー","deep blue":"ディープブルー","and a
